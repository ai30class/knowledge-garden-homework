<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 知識小花園 · 作業守護台（台灣注音版 v10）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd54a">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  :root{
    /* 2026-08-25 套用 WorkBuddy 新版色票（ui-tokens.css）：沿用既有變數名稱，只換色值，
       這樣既有規則（var(--accent) 等）全部自動吃到新配色，不用逐一改呼叫端。 */
    --sky1:#eef6ea; --sky2:#dcebd4; --lawn1:#9ccb85; --lawn2:#84ba6c;
    --sun:#f2b83f; --sun-dark:#d99a2b;
    --panel:#fffdf7; --ink:#253a36; --accent:#e98568; --accent-dark:#c96b5b;
    --leaf:#4d9564; --leaf-dark:#2f7049;
    --card:#ffffff; --line:#dde7d8; --muted:#6e7c76;
    --shadow:rgba(37,58,54,.14); --radius:18px; --sticker:#f2b83f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  ::selection{background:var(--sun); color:#5a4500;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:"PingFang TC","Microsoft YaHei","Noto Sans TC","Helvetica Neue",sans-serif;
    color:var(--ink); line-height:1.6;
    background:radial-gradient(circle at 20% -10%, #ffffff 0, transparent 42%),
               linear-gradient(180deg,var(--sky1),var(--sky2));
    background-attachment:fixed; min-height:100vh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; opacity:.92;
    background:repeating-linear-gradient(0deg,var(--lawn1) 0 64px,var(--lawn2) 64px 128px);
    -webkit-mask-image:linear-gradient(180deg,transparent 120px,#000 165px);
            mask-image:linear-gradient(180deg,transparent 120px,#000 165px);
  }
  header{
    background:var(--panel);
    padding:14px 22px; display:flex; align-items:center; gap:14px;
    box-shadow:0 2px 10px var(--shadow); position:sticky; top:0; z-index:20; flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:21px; margin:0; letter-spacing:.5px; font-weight:800; line-height:1.25; color:var(--ink);}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px; font-weight:600;}
  header .byline{font-size:11px; color:var(--muted); margin-top:3px; font-weight:600; letter-spacing:.3px;}
  .sun-box{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background:#fff; padding:7px 16px; border-radius:30px; font-weight:800;
    box-shadow:0 3px 0 var(--sun-dark), inset 0 0 0 2px #ffe39a; font-size:18px; color:#b97700;
  }
  .sun-emoji{font-size:22px; animation:spin 6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  nav.tabs{
    display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px;
    justify-content:center; position:sticky; top:64px; z-index:15;
    background:rgba(255,255,255,.5); backdrop-filter:blur(8px); border-radius:0 0 18px 18px;
  }
  .tab-btn{
    border:none; cursor:pointer; font-size:14.5px; font-weight:700;
    padding:9px 15px; border-radius:14px; background:#fff; color:var(--ink);
    box-shadow:0 3px 0 #d8c79a; transition:transform .1s, box-shadow .1s, background .15s;
  }
  .tab-btn:hover{transform:translateY(-1px); box-shadow:0 4px 0 #d8c79a;}
  .tab-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d8c79a;}
  .tab-btn.active{background:linear-gradient(180deg,var(--leaf),var(--leaf-dark)); color:#fff; box-shadow:0 3px 0 var(--leaf-dark);}

  main{max-width:900px; margin:0 auto; padding:18px 16px 70px;}
  .panel{
    background:var(--panel); border-radius:var(--radius); padding:24px;
    box-shadow:0 10px 30px var(--shadow); margin-bottom:20px;
    border:1px solid #fff; position:relative; animation:fadeUp .35s ease both;
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .panel h2{margin:0 0 4px; font-size:21px; font-weight:800;}
  .panel .hint{color:var(--muted); margin:0 0 16px; font-size:14px;}

  .battle{
    background:repeating-linear-gradient(0deg,#9bdc63 0 50px,#88cf52 50px 100px);
    border-radius:18px; padding:16px; position:relative; overflow:hidden;
    border:4px solid #4e8a2e; min-height:150px; box-shadow:inset 0 0 30px rgba(0,0,0,.08);
  }
  .battle::after{content:"☀️"; position:absolute; top:8px; right:12px; font-size:26px; opacity:.85; animation:spin 8s linear infinite;}
  .zombie{position:absolute; top:40px; font-size:52px; transition:left 1s linear; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
  .plant-def{position:absolute; left:14px; top:40px; font-size:46px; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
  .battle.danger{ background:linear-gradient(160deg,#5a3232,#7a4040) !important; box-shadow:0 0 0 3px #c0392b inset, inset 0 0 30px rgba(0,0,0,.2); animation:pulseRed 1.1s infinite; }
  .battle.danger .plant-def{ filter:drop-shadow(0 0 8px #ffd2d2); }
  .battle.defeated .plant-def{ filter:grayscale(1) brightness(.55); transform:rotate(-12deg); }
  /* —— 真實戰場：草地網格 / 植物防守 / 陽光掉落 —— */
  .lawn-battle{ height:200px; }
  .lawn-battle .house{ position:absolute; left:8px; top:8px; font-size:30px; z-index:2; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .lawn-battle .lane{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 calc(100%/9), transparent calc(100%/9) calc(200%/9)); }
  .lawn-battle .defenders{ position:absolute; left:0; top:0; bottom:0; width:46%; display:flex; align-items:flex-end; justify-content:flex-end; flex-wrap:wrap; align-content:flex-end; gap:2px; padding:12px 4px 8px 44px; z-index:3; transition:width .7s ease; }
  .lawn-battle .frontline{ position:absolute; top:6px; bottom:6px; width:3px; z-index:2; border-radius:2px;
    background:repeating-linear-gradient(180deg,#fff 0 6px,rgba(255,255,255,.15) 6px 12px); opacity:.75; transition:left .7s ease; }
  .lawn-battle .frontline::after{ content:'🚩'; position:absolute; top:-4px; left:-6px; font-size:14px; }
  .lawn-battle .zombie{ top:auto; bottom:14px; z-index:4; transition:left 4.8s linear; animation:zWalk .5s ease-in-out infinite; }
  .lawn-battle .sun-layer{ position:absolute; inset:0; z-index:6; overflow:hidden; }
  /* 勝負 overlay */
  .battle-overlay{ position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(20,32,14,.5); border-radius:inherit; }
  .battle-overlay.show{ display:flex; animation:fadeUp .35s ease; }
  .battle-overlay .bo-card{ background:#fff; border:3px solid #fff; border-radius:22px; padding:22px 26px; text-align:center; max-width:300px; box-shadow:0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay.win .bo-card{ box-shadow:0 0 0 4px #aee27a, 0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay.lose .bo-card{ box-shadow:0 0 0 4px #e6a3a3, 0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay .bo-emoji{ font-size:48px; line-height:1; }
  .battle-overlay .bo-card h2{ margin:8px 0 6px; }
  .battle-overlay .bo-card p{ margin:0 0 12px; color:#7a6a45; }
  #eyeLockOverlay{ position:fixed; inset:0; z-index:99999; display:none; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,#16352a,#2e5d43); color:#eafff0; text-align:center; padding:24px; }
  #eyeLockOverlay.show{ display:flex; }
  #eyeLockOverlay .el-emoji{ font-size:72px; line-height:1; }
  #eyeLockOverlay .el-big{ font-size:30px; font-weight:900; margin:12px 0 6px; }
  #eyeLockOverlay .el-sub{ opacity:.85; max-width:440px; margin:0 auto 14px; line-height:1.7; font-size:15px; }
  #eyeLockOverlay .el-count{ font-size:60px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:3px; }
  #eyeLockOverlay .el-parent{ margin-top:20px; }
  .lp{ font-size:30px; line-height:1; cursor:pointer; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); animation:plantBob 2.4s ease-in-out infinite, lpGlow 1.6s ease-in-out infinite; }
  .lp:active{ transform:scale(.86); }
  @keyframes lpGlow{ 0%,100%{ filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); } 50%{ filter:drop-shadow(0 0 10px #ffe06a) drop-shadow(0 2px 2px rgba(0,0,0,.25)); } }
  .lp.shake{ animation:plantShake .22s linear infinite; }
  .lp.dead{ filter:grayscale(1) brightness(.5); transform:rotate(-16deg); opacity:.7; }
  .zombie.eating{ animation:chomp .42s ease-in-out infinite; }
  .zombie.hit{ animation:zHit .18s ease-out; }
  /* —— 立繪角色：拖延怪／週末魔王（PNG 插畫，取代原本手繪 SVG） —— */
  .zombie-wrap{ width:56px; height:56px; position:relative; display:block; }
  .zombie.mega .zombie-wrap{ width:84px; height:84px; }
  .z-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; animation:zBob 1.7s ease-in-out infinite; filter:drop-shadow(0 3px 2px rgba(0,0,0,.22)); }
  .z-img-weekend{ display:none; }
  .zombie.mega .z-img-delay{ display:none; }
  .zombie.mega .z-img-weekend{ display:block; }
  @keyframes zBob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .zombie.eating .z-img{ animation:zChompImg .42s ease-in-out infinite; }
  @keyframes zChompImg{ 0%,100%{transform:scale(1) translateY(0);} 50%{transform:scale(1.08) translateY(-2px);} }
  .zombie.dazed .zombie-wrap{ transform:rotate(-8deg); opacity:.85; }
  .zombie.dazed .z-img{ animation:none; }
  .zombie.sleepy .z-img{ animation:none; }
  /* —— 向量角色：植物 —— */
  .p-svg{ width:46px; height:56px; overflow:visible; display:block; }
  .lp .p-svg{ width:44px; height:54px; }
  .pot .pl .p-svg{ width:46px; height:56px; margin:0 auto; }
  .plant-big .pb-emoji .p-svg{ width:54px; height:64px; margin:0 auto; }
  .p-head{ transform-origin:27px 34px; animation:pSway 2.8s ease-in-out infinite; }
  @keyframes pSway{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  .lp.shake .p-head{ animation:plantShake .22s linear infinite; }
  /* —— 行程時間軸尺（與戰場同一套百分比座標，垂直對齊） —— */
  .timeline{ position:relative; height:62px; margin-top:6px; background:linear-gradient(180deg,#f6efd8,#eee3c2);
    border:2px solid #d8c98f; border-radius:14px; overflow:hidden; }
  .timeline .tl-track{ position:absolute; left:0; right:0; top:38px; height:6px; background:#ddd0a6; }
  .timeline .tl-safe{ position:absolute; top:38px; height:6px; background:linear-gradient(90deg,#4e8a2e,#8fd15b); transition:left .7s ease,width .7s ease; }
  .timeline .tl-mk{ position:absolute; top:5px; transform:translateX(-50%); text-align:center; width:46px; line-height:1.1; }
  .timeline .tl-mk .tl-ic{ font-size:16px; display:block; }
  .timeline .tl-mk .tl-t{ font-size:9px; color:#8a7742; font-weight:800; display:block; margin-top:1px; }
  .timeline .tl-mk .tl-dot{ position:absolute; left:50%; margin-left:-4px; top:33px; width:8px; height:8px; border-radius:50%; background:#c9b57e; border:2px solid #fff; }
  .timeline .tl-mk.todo{ opacity:.5; }
  .timeline .tl-mk.done .tl-dot{ background:#2e7d32; }
  .timeline .tl-mk.checked .tl-dot{ background:#e08e0b; }
  .timeline .tl-mk.overdue{ opacity:1; }
  .timeline .tl-mk.overdue .tl-dot{ background:#c0392b; animation:pulseDot 1s infinite; }
  @keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.6);} 50%{box-shadow:0 0 0 6px rgba(192,57,43,0);} }
  .timeline .tl-now{ position:absolute; top:30px; bottom:0; width:2px; background:#c0392b; transition:left .8s linear; z-index:3; }
  .timeline .tl-now b{ position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:9px; color:#fff; background:#c0392b; padding:1px 5px; border-radius:8px; white-space:nowrap; font-weight:800; }
  .timeline .tl-end{ position:absolute; bottom:3px; font-size:9px; color:#8a7742; font-weight:800; }
  .lead-tag{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:13px; font-weight:800; }
  .lead-tag.good{ background:#e3f4d7; color:#2e7d32; }
  .lead-tag.warn{ background:#fdeccd; color:#b8740a; }
  .lead-tag.bad{ background:#fadbd8; color:#c0392b; }
  .falling-sun{ position:absolute; top:0; font-size:26px; cursor:pointer; z-index:7; filter:drop-shadow(0 0 8px #ffd24d); animation:sunFall 4.6s linear forwards; }
  .falling-sun:hover{ transform:scale(1.18); }
  @keyframes sunFall{ 0%{ transform:translateY(-26px) scale(.5); opacity:0; } 12%{ opacity:1; } 100%{ transform:translateY(150px) scale(1); opacity:.92; } }
  @keyframes plantBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes plantShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-9deg); } 75%{ transform:rotate(9deg); } }
  @keyframes chomp{ 0%,100%{ transform:translateX(0) rotate(0); } 50%{ transform:translateX(-7px) rotate(-7deg); } }
  @keyframes zHit{ 0%{ filter:none; } 40%{ filter:drop-shadow(0 0 12px #fff) brightness(2.2); } 100%{ filter:none; } }
  @keyframes zWalk{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-6px) rotate(4deg); } }
  @keyframes pulseRed{ 0%,100%{box-shadow:0 0 0 3px #c0392b inset;} 50%{box-shadow:0 0 18px 6px #ff5252 inset;} }
  .hp-wrap{display:flex; align-items:center; gap:8px; margin:6px 0; font-weight:800; font-size:13px; color:#3a6b22;}
  .hp-bar{flex:1; height:16px; background:#e3dcc4; border-radius:9px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.18) inset;}
  .hp-bar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#5fd35f,#2e9b32); transition:width .4s, background .4s;}
  .combo-flag{display:inline-block; margin-left:8px; font-weight:900; color:#e08e0b; font-size:14px; animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.6);} to{transform:scale(1);}}
  /* —— 手感回饋 juice —— */
  @keyframes screenShake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,3px);} 40%{transform:translate(7px,-3px);} 60%{transform:translate(-5px,2px);} 80%{transform:translate(5px,-2px);} }
  .shake-screen{ animation:screenShake .35s ease; }
  @keyframes redFlash{ 0%{box-shadow:0 0 0 0 rgba(192,57,43,0);} 30%{box-shadow:0 0 0 7px rgba(192,57,43,.45);} 100%{box-shadow:0 0 0 0 rgba(192,57,43,0);} }
  .flash-red{ animation:redFlash .42s ease; }
  @keyframes sunBurst{ 0%{transform:translateY(0) scale(.4); opacity:0;} 20%{opacity:1;} 100%{transform:translateY(-64px) scale(1.15); opacity:0;} }
  .burst-sun{ position:fixed; font-size:22px; pointer-events:none; z-index:9999; animation:sunBurst .85s ease-out forwards; }
  @keyframes defeatPop{ 0%{transform:scale(1);} 50%{transform:scale(1.06) rotate(-1deg);} 100%{transform:scale(1);} }
  .panel.pop{ animation:defeatPop .4s ease; }
  .threat-label{font-weight:800; margin:6px 0;}

  .q-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:14px 0;}
  .q-hint{font-size:15px; color:#2e7d32; background:#eafbe7; border:1px dashed #9ccc65; border-radius:10px; padding:6px 12px; margin:8px 0; font-weight:700;}
  .q-explain{font-size:14px; color:#7a6a45; background:#fff8e6; border:1px dashed #e0c98a; border-radius:10px; padding:6px 12px; margin-top:6px; font-weight:600;}
  /* 資料與不確定性題型：表格／長條圖／圓形圖 */
  .d-table{border-collapse:collapse; margin:8px auto; font-size:15px;}
  .d-table th,.d-table td{border:2px solid #cfe3b0; padding:6px 14px; text-align:center;}
  .d-table th{background:#eafbe7; color:#2e7d32;}
  .bar-chart{margin:10px auto; max-width:280px; text-align:left;}
  .bar-row{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .bar-label{width:56px; font-weight:800; font-size:14px; flex-shrink:0;}
  .bar-fill{background:linear-gradient(90deg,#66bb6a,#43a047); color:#fff; font-weight:800; font-size:13px; padding:3px 8px; border-radius:6px; min-width:24px; white-space:nowrap;}
  .pie-wrap{text-align:center; margin:8px auto;}
  .pie-legend{font-size:14px; margin-top:6px; color:#7a6a45;}
  .q-text{font-size:26px; font-weight:800; cursor:pointer; transition:color .15s;}
  .q-text:hover{color:var(--accent);}
  .q-text .spk{font-size:18px; opacity:.55;}
  .choices{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  /* ===== 多題型 UI：限時條 / 填空 / 是非 / 排序 / 圖像數數 / 小考 ===== */
  .q-grade-wrap{margin:2px 0 0;}
  .q-grade{display:inline-block;background:#eef6ff;border:1px solid #bcd4f5;color:#1f5fb0;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;margin:0 0 8px;}
  .q-timer{position:relative;height:15px;background:#e9e2c8;border-radius:9px;margin:10px 0 14px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12);}
  .q-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7dc855,#4ea63b);transition:width 1s linear;}
  .q-timer b{position:absolute;right:8px;top:0;font-size:11px;color:#4a3d17;font-weight:900;line-height:15px;text-shadow:0 1px 0 rgba(255,255,255,.7);}
  .q-timer.warn i{background:linear-gradient(90deg,#f4a63a,#e0741b);}
  .q-timer.crit i{background:linear-gradient(90deg,#ef6f5c,#c0392b);}
  .fill-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;}
  .fill-in{flex:1;min-width:120px;font-size:26px;font-weight:900;text-align:center;padding:12px 10px;border-radius:14px;border:3px solid #cfe3b0;background:#fffdf3;color:#3f3418;letter-spacing:1px;}
  .fill-in:focus{outline:none;border-color:#7dc855;box-shadow:0 0 0 4px #d9f2c8;}
  .fill-in.ok{border-color:#4ea63b;background:#eafbe7;}
  .fill-in.ng{border-color:#c0392b;background:#fdecea;}
  .fill-unit{font-size:18px;font-weight:800;color:#7a6a45;}
  .fill-go{padding:12px 20px;border-radius:14px;border:none;background:#5aa832;color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #3f7a22;}
  .fill-go:active{transform:translateY(2px);box-shadow:0 2px 0 #3f7a22;}
  .fill-go:disabled{background:#b9c3ad;box-shadow:0 4px 0 #97a08d;cursor:default;}
  .tf-row{display:flex;gap:14px;margin:14px 0;}
  .tf-btn{flex:1;padding:20px 8px;border-radius:18px;border:3px solid #cfe3b0;background:#fffdf3;font-size:34px;cursor:pointer;box-shadow:0 5px 0 #d9cfa8;transition:transform .1s;}
  .tf-btn small{display:block;font-size:14px;font-weight:900;color:#5a4a22;margin-top:4px;}
  .tf-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9cfa8;}
  .tf-btn.correct{border-color:#4ea63b;background:#eafbe7;}
  .tf-btn.wrong{border-color:#c0392b;background:#fdecea;}
  .tf-btn:disabled{cursor:default;opacity:.8;}
  .ord-slots{display:flex;gap:8px;flex-wrap:wrap;min-height:58px;align-items:center;padding:10px;border-radius:14px;border:3px dashed #cfe3b0;background:#fbfaf0;margin:10px 0;}
  .ord-hintline{color:#a99b70;font-size:13px;font-weight:700;}
  .ord-pool{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .ord-chip{padding:12px 16px;border-radius:12px;border:3px solid #cfe3b0;background:#fffdf3;font-size:19px;font-weight:900;color:#3f3418;cursor:pointer;box-shadow:0 4px 0 #d9cfa8;}
  .ord-chip:active{transform:translateY(2px);box-shadow:0 2px 0 #d9cfa8;}
  .ord-chip.picked{opacity:.25;pointer-events:none;}
  .ord-slots .ord-chip{box-shadow:0 3px 0 #b9d497;border-color:#9ecb74;background:#eefbe4;}
  .ord-slots.ok .ord-chip{border-color:#4ea63b;background:#dff7d4;}
  .ord-slots.ng .ord-chip{border-color:#c0392b;background:#fdecea;}
  .count-stage{font-size:36px;line-height:1.55;letter-spacing:5px;text-align:center;padding:16px 10px;background:#fbfaf0;border-radius:16px;border:3px solid #e4dcbe;margin:8px 0 4px;word-break:break-all;}
  .quiz-hero{background:linear-gradient(135deg,#ffe9a8,#ffd166);border-radius:18px;padding:13px 16px;margin:12px 0;box-shadow:0 4px 0 #d9a92e;}
  .quiz-hero h3{margin:0 0 4px;font-size:17px;color:#6b4d09;}
  .quiz-hero p{margin:0;font-size:13px;color:#8a6a1c;font-weight:700;}
  .quiz-prog{font-size:13px;font-weight:900;color:#7a6a45;margin-bottom:6px;}
  .stars{font-size:42px;letter-spacing:6px;line-height:1.2;}
  .score-card{text-align:center;padding:18px;background:#fffdf3;border-radius:18px;border:3px solid #e4dcbe;}
  .score-big{font-size:52px;font-weight:900;color:#4ea63b;line-height:1.1;}

  .subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0;}
  .subj-card{padding:12px 6px;border-radius:14px;border:3px solid #cfe3b0;background:#fffdf3;text-align:center;cursor:pointer;box-shadow:0 4px 0 #d9cfa8;font-weight:800;color:#4a3d17;font-size:13px;}
  .subj-card b{display:block;font-size:26px;margin-bottom:2px;}
  .subj-card:active{transform:translateY(2px);box-shadow:0 2px 0 #d9cfa8;}
  .diff-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px;font-size:13px;}
  .diff-lab{color:var(--muted);margin-right:4px;}
  .diff-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:5px 12px;cursor:pointer;font-size:13px;transition:.15s;}
  .diff-btn:hover{border-color:var(--green,#2f6f4e);}
  .diff-btn.active{background:var(--green,#2f6f4e);border-color:var(--green,#2f6f4e);color:#fff;font-weight:600;}   /* 原本用未定義的 --brand，選中的按鈕變成白字透明底看不見（2026-09-28 修） */
  .cert-detail{font-size:13px;color:var(--muted);margin:2px 0 12px;line-height:1.5;}
  .cert-detail .q-grade{font-size:12px;padding:2px 8px;margin:0 4px;}
  .choice{
    border:none; cursor:pointer; font-size:19px; font-weight:700; padding:13px 20px;
    border-radius:14px; background:#fff; box-shadow:0 3px 0 #d8c79a; min-width:68px;
    transition:transform .08s, box-shadow .08s, background .15s;
  }
  .choice:hover{transform:translateY(-2px); background:#fff8ec;}
  .choice:active{transform:translateY(2px); box-shadow:0 1px 0 #d8c79a;}
  .choice.correct{background:#b6f09a; box-shadow:0 3px 0 var(--leaf-dark); color:#1c5a22;}
  .choice.wrong{background:#ffb3a7; box-shadow:0 3px 0 #c0392b; color:#7a1f15;}
  .feedback{font-size:18px; font-weight:800; min-height:26px; margin-top:10px;}
  .feedback.good{color:#2e8b40;} .feedback.bad{color:#c0392b;}

  .next-btn{
    margin-top:14px; border:none; cursor:pointer; font-size:17px; font-weight:800;
    padding:13px 26px; border-radius:16px; background:linear-gradient(180deg,var(--accent),var(--accent-dark)); color:#fff; box-shadow:0 4px 0 var(--accent-dark);
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .next-btn:hover{filter:brightness(1.05);}
  .next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-dark);}
  .next-btn:disabled{opacity:.5; cursor:not-allowed; filter:none;}

  .story{background:#fff; border-left:6px solid var(--leaf); padding:16px 20px; border-radius:12px; line-height:1.95; font-size:16px; box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .story b{color:var(--leaf-dark);}

  .hw-card{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    border:none; cursor:pointer; background:#fff; padding:15px 18px; border-radius:16px;
    box-shadow:0 3px 0 #d8c79a; margin:8px 0; font-size:17px; font-weight:700; color:var(--ink); text-align:left;
    transition:transform .1s, box-shadow .1s, background .15s;
  }
  .hw-card:hover{transform:translateY(-2px); box-shadow:0 5px 0 #d8c79a;}
  .hw-card.done{background:#eafbe7; box-shadow:0 3px 0 var(--leaf-dark); color:#1c6b2a;}
  .hw-card.pending{background:#fff4e0; box-shadow:0 3px 0 #e08e0b; color:#b8740a;}

  .garden{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:12px; margin-top:8px;}
  .pot{background:linear-gradient(180deg,#cdaa78,#a9824f); border-radius:0 0 16px 16px; padding:12px 6px; text-align:center; box-shadow:0 4px 0 #7c5e34; transition:transform .12s;}
  .pot:hover{transform:translateY(-2px);}
  .pot .pl{font-size:42px; filter:drop-shadow(0 2px 1px rgba(0,0,0,.2));}
  .pot .nm{font-size:12px; color:#fff; font-weight:700; margin-top:2px;}
  .pot.locked{filter:grayscale(1) brightness(.7);}
  .pot.locked .nm{color:#eee;}
  .pot.buyable{cursor:pointer; box-shadow:0 0 0 4px var(--sun), 0 4px 0 #7c5e34; animation:potPulse 1.1s infinite; transform:translateY(-2px);}
  .pot.buyable:hover{transform:translateY(-5px) scale(1.05);}
  .pot.owned{cursor:pointer; box-shadow:0 0 0 3px #8bd17c, 0 4px 0 #7c5e34;}
  .pot.collected{cursor:pointer; box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 4px 0 #7c5e34;}
  .pot.collected:hover{transform:translateY(-4px);}
  .pot .g-tag{font-size:11px; color:#fff8e0; margin-top:3px; font-weight:700;}
  .pot .g-tag.owned{color:#d8ffce;}
  @keyframes potPulse{0%,100%{box-shadow:0 0 0 4px var(--sun),0 4px 0 #7c5e34;}50%{box-shadow:0 0 0 8px var(--sun),0 4px 0 #7c5e34;}}
  .pot.next-routine{box-shadow:0 0 0 4px var(--sun), 0 4px 0 #7c5e34; transform:translateY(-2px);}
  .pot.full{filter:grayscale(.5) brightness(.92); opacity:.8; cursor:not-allowed;}
  .pot .rt-status{font-size:12px; font-weight:800; margin-top:3px; color:#7a6a45;}
  .rt-btn{margin-top:5px; border:none; border-radius:10px; padding:4px 8px; font-size:12px; font-weight:800; cursor:pointer; background:#ffe39a; color:#7a5a12; box-shadow:0 2px 0 #d8b25a; transition:transform .1s;}
  .rt-btn:hover{transform:translateY(-1px);}
  .lawn{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; background:linear-gradient(180deg,#c4f0a6,#8fd97e); border:3px solid #fff; border-radius:22px; padding:16px; box-shadow:0 5px 12px rgba(60,120,40,.18), 0 3px 0 #5fa84e; min-height:104px;}
  .lawn-empty{color:#3a6b2a; font-weight:800; opacity:.85; padding:14px; text-align:center;}
  .plant-big{display:flex; flex-direction:column; align-items:center; background:rgba(255,255,255,.78); border:3px solid #fff; border-radius:18px; padding:8px 14px; box-shadow:0 3px 0 #7cae5e; animation:pop .4s ease;}
  .plant-big .pb-emoji{font-size:48px; line-height:1;}
  .plant-big .pb-nm{font-size:13px; font-weight:800; color:#3a6b2a; margin-top:2px;}
  @keyframes pop{0%{transform:scale(.4); opacity:0;}100%{transform:scale(1); opacity:1;}}

  .reward{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#fff; border-radius:16px; padding:14px 18px; margin:8px 0; box-shadow:0 3px 0 #d8c79a; flex-wrap:wrap;
    transition:transform .1s, box-shadow .1s;
  }
  .reward:hover{transform:translateY(-1px); box-shadow:0 4px 0 #d8c79a;}
  .reward .nm{font-weight:800; font-size:16px;}
  .reward .cost{color:#c77a00; font-weight:800;}

  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(10px); background:rgba(40,32,18,.95); color:#fff; padding:13px 24px; border-radius:30px; font-weight:700; opacity:0; transition:opacity .3s, transform .3s; z-index:50; pointer-events:none; max-width:90%; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .reset-btn{margin-top:8px; background:#fff7ee; border:2px solid var(--accent); color:var(--accent); border-radius:12px; padding:8px 14px; font-weight:700; cursor:pointer; transition:background .15s;}
  .reset-btn:hover{background:#ffe9d6;}
  .stat{display:inline-block; background:#fff; border-radius:12px; padding:7px 13px; margin:4px; font-weight:700; box-shadow:0 2px 0 #e3d3a6;}
  .big-num{font-size:30px; font-weight:800; color:var(--leaf-dark);}
  .bar{height:16px; background:#ece3c6; border-radius:10px; overflow:hidden; margin:6px 0 12px; border:2px solid #4e8a2e;}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,#7ed957,#4caf50);}
  .mod-row{margin:10px 0;}
  input.in,select.in,textarea.in{font-size:16px; padding:11px 13px; border-radius:12px; border:2px solid #d8c79a; max-width:280px; background:#fffdf8; transition:border-color .15s, box-shadow .15s;}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none; border-color:var(--leaf); box-shadow:0 0 0 3px rgba(70,184,90,.2);}
  textarea#export{width:100%; height:140px; border-radius:12px; border:2px solid #d8c79a; padding:10px; font-family:monospace; font-size:13px; background:#fffef8;}
  .name-input{font-size:24px; text-align:center; padding:14px; border-radius:16px; border:3px solid #4e8a2e; width:80%; max-width:320px; transition:box-shadow .15s;}
  .name-input:focus{outline:none; box-shadow:0 0 0 4px rgba(70,184,90,.25);}
  .badge{display:inline-block; text-align:center; margin:4px; width:76px; vertical-align:top; transition:transform .12s;}
  .badge:hover{transform:translateY(-2px);}
  .badge .ic{font-size:34px; line-height:1.1;}
  .badge.locked .ic{filter:grayscale(1); opacity:.4;}
  .badge .bn{font-size:11px; font-weight:700; color:#6a5630;}
  .badge.locked .bn{color:#aaa;}
  .leader{display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 14px; margin:6px 0; box-shadow:0 2px 0 #e3d3a6; transition:transform .1s;}
  .leader:hover{transform:translateX(2px);}
  .profile-sel{font-size:15px; padding:7px 12px; border-radius:10px; border:2px solid #4e8a2e; background:#fff; font-weight:700;}
  .lock-ovl{background:linear-gradient(160deg,#37305a,#241f3d); color:#fff; border-radius:18px; padding:26px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .lock-ovl .big{font-size:50px;}

  @media (max-width:600px){
    header{padding:12px 14px; gap:10px;}
    header h1{font-size:17px;}
    header .sub{font-size:11px;}
    .sun-box{font-size:15px; padding:6px 12px;}
    nav.tabs{gap:6px; padding:10px 8px; top:58px;}
    .tab-btn{font-size:13px; padding:8px 11px;}
    main{padding:14px 10px 60px;}
    .panel{padding:18px 14px; border-radius:16px;}
    .q-text{font-size:22px;}
    .choice{font-size:17px; padding:11px 16px;}
  }

  /* ===== 貼紙風升級：更大圓角 + 白邊 + 繽紛 ===== */
  .panel{
    border-radius:var(--radius);
    border:4px solid #fff;
    box-shadow:0 12px 30px var(--shadow), 0 0 0 4px rgba(255,213,74,.35);
    overflow:hidden;
  }
  .panel h2{
    display:inline-block;
    background:linear-gradient(180deg,#fff3c4,#ffe08a);
    color:#7a5a00; padding:6px 16px; border-radius:16px;
    box-shadow:0 3px 0 #f0c64a, 0 0 0 3px #fff;
    font-size:20px; font-weight:800;
  }
  .panel h2.title-sticker{ font-size:24px; transform:rotate(-1.5deg); }
  .next-btn{ border-radius:22px; }
  .choice{ border-radius:20px; }
  .hw-card{
    border-radius:24px; border:3px solid #fff;
    box-shadow:0 6px 14px rgba(120,90,20,.16), 0 3px 0 #d8c79a;
  }
  .hw-card:hover{ transform:translateY(-3px) rotate(-1.2deg); box-shadow:0 10px 18px rgba(120,90,20,.2), 0 3px 0 #d8c79a; }
  .reward{ border-radius:22px; border:3px solid #fff; box-shadow:0 5px 12px rgba(120,90,20,.14), 0 3px 0 #d8c79a; }
  .reward:hover{ transform:translateY(-2px) rotate(.6deg); }
  .pot{ border-radius:0 0 22px 22px; border:3px solid #fff; border-top:none; }
  .leader{ border-radius:18px; border:2px solid #fff; box-shadow:0 4px 10px rgba(120,90,20,.12); }
  .tab-btn{ border-radius:16px; border:2px solid #fff; }
  .tab-btn.active{ box-shadow:0 4px 0 var(--leaf-dark), 0 0 0 3px rgba(255,255,255,.7); }
  .sun-box{ border-radius:30px; border:3px solid #fff; box-shadow:0 4px 0 var(--sun-dark), inset 0 0 0 2px #ffe39a, 0 0 0 4px rgba(255,213,74,.3); }
  .stat{ border-radius:14px; border:2px solid #fff; box-shadow:0 3px 0 #e3d3a6; }
  .reset-btn{ border-radius:16px; border:3px solid #fff; }
  .battle{ border-radius:22px; }
  .story{ border-radius:18px; }
  .badge .ic{ filter:drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
  .home-sec{ animation:fadeUp .42s ease both; }

  /* 開場動畫 */
  #introOv{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(circle at 50% 35%, #fff9e0, #ffe7a8); animation:introFade 2.6s ease forwards; }
  #introOv .seed{ font-size:96px; animation:grow .9s ease forwards; filter:drop-shadow(0 6px 6px rgba(0,0,0,.15)); }
  #introOv .msg{ margin-top:16px; font-size:23px; font-weight:900; color:#7a5a00; opacity:0; animation:msgIn .5s ease 1.0s forwards; }
  @keyframes introFade{ 0%{opacity:1;} 78%{opacity:1;} 100%{opacity:0; visibility:hidden;} }
  @keyframes grow{ 0%{transform:scale(.1) rotate(-30deg); opacity:0;} 60%{transform:scale(1.15) rotate(8deg);} 100%{transform:scale(1) rotate(0); opacity:1;} }
  @keyframes msgIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  /* 首頁自訂彈窗 */
  .modal-ov{ position:fixed; inset:0; z-index:80; background:rgba(40,32,18,.45); display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeUp .2s ease; overflow-y:auto; }
  .modal{ background:#fffdf8; border-radius:26px; padding:22px; max-width:420px; width:100%; max-height:calc(100vh - 32px); overflow-y:auto; box-shadow:0 16px 40px rgba(0,0,0,.3); border:4px solid #fff; }
  .man-sec{ background:#faf6ea; border:2px solid #ece0c4; border-radius:16px; padding:12px 14px; margin:10px 0; }
  .man-sec h3{ margin:0 0 6px; font-size:15px; color:#3a6b4a; }
  .man-sec p{ margin:4px 0; font-size:14px; line-height:1.55; color:#5a4a2e; }
  .src-tbl{ width:100%; border-collapse:collapse; margin:6px 0; font-size:13px; }
  .src-tbl th, .src-tbl td{ border:1px solid #e3d6b6; padding:6px 8px; text-align:left; vertical-align:top; color:#4a3c22; }
  .src-tbl th{ background:#f0e7cf; color:#3a6b4a; font-weight:700; }
  .src-tbl td:first-child{ font-weight:600; word-break:break-all; }
  .src-note{ font-size:12px; color:#8a7a55; margin-top:6px; }
  .man-sec ol{ padding-left:20px; margin:6px 0; }
  .man-sec li{ font-size:14px; line-height:1.55; color:#5a4a2e; margin:4px 0; }
  .man-warn{ background:#fff3e0; border-color:#ffcc80; }
  .man-warn h3{ color:#c2680c; }
  .modal h3{ margin:0 0 12px; font-size:21px; font-weight:800; color:#7a5a00; text-align:center; }
  .mod-row-toggle{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:2px solid #ffe08a; border-radius:16px; padding:12px 16px; margin:8px 0; font-weight:800; font-size:16px; cursor:pointer; transition:background .15s; }
  .mod-row-toggle:hover{ background:#fff7e0; }
  .mod-row-toggle input{ width:26px; height:26px; accent-color:#46b85a; cursor:pointer; }
  .mod-row-toggle .subj-ic{ display:flex; align-items:center; gap:8px; }
  .mod-row-toggle .emoji-in{ width:42px; height:32px; text-align:center; font-size:19px; border:2px solid #e3d3a3; border-radius:10px; background:#fffdf8; cursor:text; padding:0; }
  .mod-row-toggle .emoji-in:focus{ outline:none; border-color:#46b85a; box-shadow:0 0 0 3px rgba(70,184,90,.25); }
  .mod-row-toggle .name-in{ width:84px; height:32px; text-align:center; font-size:14px; border:2px solid #e3d3a3; border-radius:10px; background:#fffdf8; cursor:text; padding:0 4px; }
  .mod-row-toggle .name-in:focus{ outline:none; border-color:#46b85a; box-shadow:0 0 0 3px rgba(70,184,90,.25); }
  .mod-row-toggle .subj-nm{ min-width:0; flex:1; padding-right:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 今日作息全達成 · 加功獎勵卡 */
  .bonus-card{ margin:12px auto 4px; max-width:560px; background:linear-gradient(135deg,#fff7da,#ffe9c2); border:3px solid #ffd27a; border-radius:18px; padding:14px 16px; box-shadow:0 5px 14px rgba(180,130,30,.18); }
  .bonus-title{ font-weight:900; font-size:16px; color:#a8641a; text-align:center; }
  .bonus-sub{ text-align:center; color:#8a6a35; font-size:13px; margin:4px 0 10px; }
  .bonus-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .bonus-btn{ flex:1 1 150px; min-width:140px; border:none; border-radius:14px; padding:11px 10px; font-weight:800; font-size:14px; cursor:pointer; background:#ffb43d; color:#5a3a05; box-shadow:0 3px 0 #d98e1f; transition:transform .08s; }
  .bonus-btn:hover{ transform:translateY(-1px); }
  .bonus-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #d98e1f; }
  .bonus-btn:disabled{ background:#e6dcc2; color:#9a8a66; box-shadow:0 3px 0 #cfc4a8; cursor:default; }
  @keyframes sunFly{0%{opacity:0; transform:scale(.5);}15%{opacity:1; transform:scale(1.1);}100%{opacity:0; transform:scale(.4);}}
  @keyframes numPop{0%{transform:scale(1);}40%{transform:scale(1.35);color:#e25e2b;}100%{transform:scale(1);}}
  .sunCount{display:inline-block;}
  .sunCount.pop{animation:numPop .3s ease;}
  .monster-track{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .mt-mon{font-size:21px;line-height:1;transition:transform .35s ease,opacity .35s,filter .35s;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2));}
  .mt-mon.down{transform:rotate(95deg) translate(3px,6px) scale(.85);opacity:.3;filter:grayscale(1);}
  @keyframes monHit{0%{transform:scale(1.4) rotate(0);}100%{transform:rotate(95deg) translate(3px,6px) scale(.85);}}
  .mt-mon.just-down{animation:monHit .4s ease forwards;opacity:.3;filter:grayscale(1);}
  /* 練習場 / 收藏入口卡片 */
  .practice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .practice-card{border:2px solid var(--line); border-radius:16px; padding:16px 8px; background:var(--card); cursor:pointer; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .1s, box-shadow .1s; box-shadow:0 3px 0 #e2d6b8;}
  .practice-card:hover{transform:translateY(-2px); box-shadow:0 5px 0 #e2d6b8;}
  .practice-card:active{transform:translateY(2px); box-shadow:0 1px 0 #e2d6b8;}
  .practice-card .pc-ic{font-size:30px;}
  .practice-card .pc-nm{font-size:14px; color:var(--ink);}
  .practice-card .pc-tag{font-size:11px; color:var(--muted); font-weight:600;}
  .collect-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .collect-card{border:2px solid var(--line); border-radius:18px; padding:18px 10px; background:var(--card); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .1s, box-shadow .1s; box-shadow:0 3px 0 #e2d6b8;}
  .collect-card:hover{transform:translateY(-2px); box-shadow:0 5px 0 #e2d6b8;}
  .collect-card:active{transform:translateY(2px); box-shadow:0 1px 0 #e2d6b8;}
  .collect-card .cc-icon{font-size:34px;}
  .collect-card .cc-title{font-size:15px; font-weight:800; color:var(--ink);}
  .collect-card .cc-sub{font-size:11px; color:var(--muted); font-weight:600;}
  /* 首頁卡片模組（Phase 3 版面）*/
  .home-module{padding:16px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(255,253,247,.95); box-shadow:0 8px 20px var(--shadow); margin:10px 0;}
  .module-heading{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:4px;}
  .module-heading h2{margin:0;}
  .home-module-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:10px;}
  .home-module-grid .home-module{margin:0;}
  @media (max-width:700px){ .home-module-grid{grid-template-columns:1fr;} }
  .holiday-banner{display:flex; align-items:center; gap:10px; background:#fff8e5; border:2px solid #ecd99d; border-radius:14px; padding:10px 14px; margin:10px 0;}
  .holiday-mark{width:32px; height:32px; flex:0 0 auto; display:grid; place-items:center; border-radius:10px; background:#f2d277; color:#805c19; font-weight:900;}
  .holiday-banner strong{display:block; color:#7a5a00;}
  .holiday-banner span{color:#8e7a4a; font-size:12px;}
  .progress-card-row{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:14px; align-items:stretch; margin:12px 0;}
  @media (max-width:700px){ .progress-card-row{grid-template-columns:1fr;} }
  .progress-resources{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .resource-stat{display:flex; align-items:center; gap:8px; padding:8px; border-radius:11px; background:#f7faf4;}
  .resource-icon{width:28px; height:28px; display:grid; place-items:center; border-radius:9px; font-weight:900; font-size:12px; flex:0 0 auto;}
  .streak-icon{background:#fff3d3; color:#916615;}
  .shield-icon{background:#e5eef8; color:#426b91;}
  .resource-stat strong{display:block; font-size:13px;}
  .resource-stat small{display:block; margin-top:2px; color:var(--muted); font-size:10px;}
  .battle-card{padding:16px;}
  .battle-condition-row{display:flex; gap:8px; flex-wrap:wrap;}
  .shield-badge,.holiday-badge-sm{display:inline-block; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:800; white-space:nowrap;}
  .shield-badge{background:#e5eef8; color:#426b91;}
  .holiday-badge-sm{background:#fff0c5; color:#916615;}
  .monster-state-panel{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);}
  .monster-state-list{display:grid; gap:8px; margin-top:8px;}
  .monster-state-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:#f7faf4; opacity:.6;}
  .monster-state-item.active{opacity:1; background:#eafbe7; box-shadow:0 0 0 2px #cfe8c4;}
  .monster-state-item img{width:34px; height:34px; object-fit:contain; flex:0 0 auto;}
  .monster-state-item strong{display:block; font-size:13px;}
  .monster-state-item span{display:block; font-size:11px; color:var(--muted);}
  .monster-state-item b{font-size:11px; color:#916615; white-space:nowrap;}
  .section-flash{animation:sectionFlash 1.5s ease;}
  @keyframes sectionFlash{ 0%{box-shadow:0 0 0 4px var(--sun);} 100%{box-shadow:0 8px 20px var(--shadow);} }
  .bonus-group{background:#fffaf0; border-color:#ecd99d;}

  /* ===== 計畫工作台 ===== */
  .plan-toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 6px;}
  .plan-tabs{display:flex; gap:6px;}
  .plan-tab{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:7px 14px; font-weight:800; font-size:14px; cursor:pointer; transition:background .15s,color .15s;}
  .plan-tab.on{background:var(--leaf); border-color:var(--leaf); color:#fff;}
  .plan-empty{text-align:center; padding:26px 14px; border:2px dashed var(--line); border-radius:var(--radius); background:#fbfdfa;}
  .plan-split{display:grid; grid-template-columns:240px minmax(0,1fr); gap:14px; align-items:start;}
  .plan-sublist{display:grid; gap:8px;}
  .plan-sub{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:14px; padding:10px 12px; transition:border-color .15s, box-shadow .15s;}
  .plan-sub:hover{border-color:var(--leaf);}
  .plan-sub.on{border-color:var(--leaf); box-shadow:0 0 0 2px rgba(77,149,100,.25); background:#f3f9ef;}
  .plan-sub .ps-ic{font-size:24px; flex:0 0 auto;}
  .plan-sub .ps-main{flex:1; min-width:0; display:block;}
  .plan-sub .ps-nm{display:block; font-weight:800; font-size:15px; color:var(--ink);}
  .plan-sub .ps-sub{display:block; font-size:11px; color:var(--muted); margin-top:2px;}
  .plan-sub .ps-bar{display:block; height:5px; border-radius:99px; background:#e8efe4; margin-top:6px; overflow:hidden;}
  .plan-sub .ps-bar > i{display:block; height:100%; background:linear-gradient(90deg,#7dc855,#4ea63b);}
  .plan-sub .ps-go{color:var(--muted); font-size:20px; flex:0 0 auto;}
  .plan-detail{border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:14px; min-height:120px;}
  .plan-detail-head{margin-bottom:10px;}
  .plan-add{width:100%; border:2px dashed var(--line); background:#fbfdfa; color:var(--leaf-dark); border-radius:14px; padding:12px; font-weight:800; font-size:14px; cursor:pointer; transition:border-color .15s,background .15s;}
  .plan-add:hover{border-color:var(--leaf); background:#f1f8ed;}
  .plan-crumb{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .plan-crumb .crumb-now{font-weight:800; color:var(--ink);}
  .row-del{border:none; background:none; color:var(--muted); font-size:15px; cursor:pointer; padding:2px 6px; border-radius:8px; flex:0 0 auto;}
  .row-del:hover{background:#fdecea; color:#c0392b;}
  .row-ins{border:none; background:none; color:var(--leaf-dark); font-size:16px; font-weight:900; cursor:pointer; padding:2px 6px; border-radius:8px; flex:0 0 auto;}
  .row-ins:hover{background:#e5f1df;}
  .row-btns{display:flex; gap:2px; align-items:center; flex:0 0 auto;}
  .row-mv{border:none; background:none; color:var(--muted); font-size:14px; cursor:pointer; padding:2px 5px; border-radius:8px;}
  .row-mv:hover:not(:disabled){background:#e5f1df; color:var(--leaf-dark);}
  .row-mv:disabled{opacity:.25; cursor:default;}
  .plan-row.extra{background:#fff8e5; box-shadow:inset 0 0 0 1px #ecd99d;}
  .plan-row.extra .pr-label{color:#916615;}
  .ins-kind{display:grid; gap:8px; margin-top:6px;}
  .ins-opt{display:flex; align-items:flex-start; gap:9px; padding:10px; border:1px solid var(--line); border-radius:12px; cursor:pointer; background:#fff;}
  .ins-opt.on{border-color:var(--leaf); background:#f3f9ef;}
  .ins-opt input{margin-top:3px; accent-color:var(--leaf);}
  .ins-opt b{display:block; font-size:14px;}
  .ins-opt small{display:block; color:var(--muted); font-size:11px; margin-top:2px; line-height:1.5;}
  .row-word{border:none; background:none; color:var(--muted); font-size:13px; font-weight:800; cursor:pointer; padding:2px 6px; border-radius:8px; flex:0 0 auto;}
  .row-word:hover{background:#e5eef8; color:#426b91;}
  .row-word.has{color:#426b91; background:#eef4fb;}
  .word-card{max-width:420px; margin:16px auto 0; padding:20px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; text-align:center;}
  .word-card .wd-zh{font-size:28px; font-weight:900; color:var(--ink);}
  .word-card .wd-hint{margin-top:8px; font-size:20px; letter-spacing:3px; color:var(--muted); font-family:ui-monospace,Menlo,monospace;}
  .wd-input{width:100%; max-width:none; margin-top:14px; font-size:22px; text-align:center; letter-spacing:1px;}
  .wd-input.ok{border-color:var(--leaf); background:#f1f8ed;}
  .wd-input.ng{border-color:#c0392b; background:#fdecea;}
  .wd-review{max-width:420px; margin:14px auto 0; padding:14px; border:1px solid var(--line); border-radius:14px; background:#fbfdfa; text-align:left;}
  .wd-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:15px;}
  .wd-row:last-child{border-bottom:none;}
  .wd-row b{color:#426b91;}
  .exam-zone{border:1px solid var(--line); border-radius:var(--radius); background:rgba(255,253,247,.95); padding:14px; margin:10px 0;}
  .exam-card{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 12px; border-radius:12px; background:#f8faf6; margin-top:8px;}
  .exam-card.past{opacity:.55;}
  .exam-card .ex-main{flex:1; min-width:150px;}
  .exam-card .ex-name{font-weight:800; font-size:15px; color:var(--ink);}
  .exam-card .ex-meta{font-size:11px; color:var(--muted); margin-top:2px;}
  .exam-card .ex-count{font-weight:900; font-size:14px; color:var(--leaf-dark); white-space:nowrap;}
  .exam-card .ex-count.urgent{color:#c0392b;}
  .exam-card .ex-btns{display:flex; gap:6px;}
  .exam-card .ex-pace{flex-basis:100%; display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .exam-card .ex-pace span{font-size:11px; font-weight:700; color:var(--leaf-dark); background:#eaf3e5; border-radius:99px; padding:3px 9px; white-space:nowrap;}
  .exam-card .ex-late{flex-basis:100%; margin-top:8px; padding:8px 10px; border-radius:10px; background:#fdecea; color:#b03a2b; font-size:12px; line-height:1.6; font-weight:700;}
  .exam-card .ex-days{background:#e5eef8 !important; color:#426b91 !important;}
  .day-presets{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
  .day-presets .reset-btn{padding:6px 12px; font-size:13px;}
  .day-pick{display:flex; gap:5px; flex-wrap:wrap;}
  .day-chip{position:relative; cursor:pointer;}
  .day-chip input{position:absolute; opacity:0; width:0; height:0;}
  .day-chip span{display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--line);
    border-radius:12px; background:#fff; font-weight:800; color:var(--muted); transition:background .15s,color .15s;}
  .day-chip.on span{background:var(--leaf); border-color:var(--leaf); color:#fff;}
  .mode-pick{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0;}
  .mode-chip{position:relative; cursor:pointer;}
  .mode-chip input{position:absolute; opacity:0; width:0; height:0;}
  .mode-chip span{display:block; padding:8px 14px; border:1px solid var(--line); border-radius:12px;
    background:#fff; font-weight:800; color:var(--muted); font-size:14px; transition:background .15s,color .15s;}
  .mode-chip.on span{background:var(--leaf); border-color:var(--leaf); color:#fff;}
  .overdue-banner{display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    border:2px solid #f0b8ae; background:#fdecea; border-radius:14px; padding:11px 14px; margin:10px 0;}
  .overdue-banner b{color:#b03a2b; font-size:15px;}
  .overdue-banner span{display:block; font-size:12px; color:#8c5045; margin-top:2px;}
  .overdue-banner .ob-go{margin-left:auto; color:#b03a2b; font-weight:900;}
  /* 自訂扣分項：名稱可能很長（例：「太晚還沒去睡覺」），手機上讓按鈕自己換到下一行，
     不要把文字擠成兩三個字一行 */
  .pn-row{border:2px solid var(--line); background:#fff; border-radius:14px; padding:10px 12px; margin-top:8px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .pn-row .pn-info{flex:1 1 190px; min-width:0;}
  .pn-row .pn-nm{font-weight:800; color:var(--ink); font-size:15px;}
  .pn-row .pn-amt{font-size:13px; color:#b03a2b; font-weight:800; margin-top:2px;}
  .pn-row .pn-btns{display:flex; gap:6px; margin-left:auto;}
  .pn-row .pn-btns .reset-btn{padding:6px 12px; font-size:14px;}
  .pn-row.done{opacity:.5;}
  .scope-box{max-height:230px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:6px; background:#fbfdfa;}
  .scope-sub{margin-bottom:10px;}
  .scope-nm{font-weight:800; font-size:14px; margin-bottom:4px;}
  .scope-row{display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:14px; cursor:pointer;}
  .scope-row input{width:18px; height:18px; accent-color:var(--leaf);}
  .tb-pick{margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#f7faf4;}
  .tb-pick select.in{font-size:14px; padding:7px 9px;}
  .plan-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; background:#f8faf6; margin-bottom:6px; cursor:pointer; transition:background .15s;}
  .plan-row:hover{background:#eef5ea;}
  .plan-row input{width:20px; height:20px; accent-color:var(--leaf); flex:0 0 auto; cursor:pointer;}
  .plan-row .pr-main{min-width:0; flex:1;}
  .plan-row .pr-label{display:block; font-weight:700; font-size:14px; color:var(--ink);}
  .plan-row .pr-due{display:block; font-size:11px; color:var(--muted); margin-top:2px;}
  .plan-row.done{opacity:.55;}
  .plan-row.done .pr-label{text-decoration:line-through;}
  .plan-row.overdue{background:#fdecea;}
  .plan-row.overdue .pr-due{color:#c0392b; font-weight:800;}
  .plan-row.today{background:#fff8e5; box-shadow:inset 0 0 0 1px #ecd99d;}
  .plan-weeknav{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .plan-day{border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px; background:#fff;}
  .plan-day.today{border-color:var(--sun); box-shadow:0 0 0 2px rgba(242,184,63,.3);}
  .plan-day.holiday{background:#f7faf4;}
  .plan-day .pd-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .plan-day .pd-name{font-weight:800; font-size:14px; color:var(--ink);}
  .plan-day .pd-date{font-size:11px; color:var(--muted); flex:1;}
  .plan-day .pd-count{font-size:11px; font-weight:800; color:var(--muted);}
  .plan-day .pd-items{margin-top:8px;}
  @media (max-width:700px){ .plan-split{grid-template-columns:1fr;} }

  /* 首頁「今日複習」區塊 */
  .today-study{margin-top:10px;}
  .today-study .ts-empty{font-size:13px; color:var(--muted);}
  .cta-hero{display:block; width:100%; max-width:340px; margin:14px auto 4px; border:none; border-radius:24px; padding:16px; font-size:19px; font-weight:900; color:#fff; background:linear-gradient(180deg,var(--accent),var(--accent-dark)); box-shadow:0 5px 0 var(--accent-dark), 0 8px 18px rgba(201,107,91,.3); cursor:pointer; transition:transform .1s; letter-spacing:1px;}
  .cta-hero:hover{transform:translateY(-1px);}
  .cta-hero:active{transform:translateY(3px); box-shadow:0 2px 0 var(--accent-dark);}
  .sched-kind{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;}
  .kind-routine{background:#e3f2fd;color:#1565c0;}
  .kind-hw{background:#fff3e0;color:#e65100;}
  .kind-custom{background:#f3e5f5;color:#7b1fa2;}

  /* ===== 2026-09-28 UI 改版「花園守護基地」：設計規格見 Obsidian《知識小花園作業守護台》§UI 改版 ===== */
  :root{
    --bg:#fffdf7; --surface:#ffffff; --ink:#253a36; --muted:#5f6f69;
    --green:#2f6f4e; --green-pressed:#20533a; --green-soft:#eaf3eb;
    --peach:#e98568; --peach-soft:#ffe6de; --honey:#f2b83f; --honey-soft:#fff3ca;
    --line:#c7d5cd; --disabled-bg:#d8dfd8; --disabled-text:#65716b; --danger:#b94f3b;
  }
  body{ background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; }
  body::before{ display:none; }
  .ico{ display:inline-block; width:24px; height:24px; vertical-align:middle; flex:none; }
  .ico svg, [data-icon] > svg{ display:block; width:100%; height:100%; }

  header.basebar{
    height:56px; padding:0 8px 0 16px; padding-top:env(safe-area-inset-top);
    box-sizing:content-box; display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
    background:var(--surface); box-shadow:none; border-bottom:1px solid var(--line);
  }
  .bb-brand{ display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; color:var(--ink); min-width:0; }
  .bb-logo{ width:28px; height:28px; color:var(--green); flex:none; }
  .bb-name{ white-space:nowrap; }
  header.basebar .sun-box{
    margin-left:auto; min-height:40px; padding:4px 14px 4px 6px; gap:6px;
    background:var(--honey-soft); border:1.5px solid var(--honey); border-radius:999px; box-shadow:none;
    color:var(--ink); font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .sun-token{ width:30px; height:30px; flex:none; }
  .bb-gear{ width:44px; height:44px; border:none; background:none; border-radius:14px; color:var(--ink); padding:10px; cursor:pointer; flex:none; }
  .bb-gear:active{ background:var(--green-soft); }

  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:30;
    display:grid; grid-template-columns:repeat(4,1fr); gap:0; min-height:64px;
    padding:4px max(8px, calc(50% - 320px)) calc(4px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line); border-radius:0;
    backdrop-filter:none; box-shadow:0 -2px 12px rgba(37,58,54,.08);
  }
  nav.tabs .tab-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    min-height:56px; padding:4px 2px; position:relative;
    background:none; border:none; border-radius:14px; box-shadow:none; transform:none;
    color:var(--muted); font-size:13px; font-weight:500;
  }
  nav.tabs .tab-btn:hover, nav.tabs .tab-btn:active{ transform:none; box-shadow:none; }
  nav.tabs .tab-btn:active{ background:var(--green-soft); }
  nav.tabs .tab-btn .ti{ width:24px; height:24px; }
  nav.tabs .tab-btn.active{ background:none; color:var(--green); font-weight:700; box-shadow:none; }
  nav.tabs .tab-btn.active::after{ content:""; position:absolute; bottom:3px; width:22px; height:3px; border-radius:999px; background:var(--green); }
  main{ padding-bottom:calc(96px + env(safe-area-inset-bottom)); }

  /* ---- 按鈕 ---- */
  .btn-primary, .btn-secondary, .btn-danger{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:52px; padding:0 18px; border-radius:14px; font:inherit; font-size:16px; font-weight:700; cursor:pointer;
  }
  .btn-primary{ background:var(--green); color:#fff; border:none; box-shadow:0 3px 0 var(--green-pressed); }
  .btn-primary:active{ background:var(--green-pressed); transform:translateY(1px); box-shadow:none; }
  .btn-secondary{ min-height:44px; background:var(--surface); color:var(--green); border:1.5px solid var(--green); }
  .btn-secondary:active{ background:var(--green-soft); color:var(--green-pressed); border-color:var(--green-pressed); }
  .btn-danger{ min-height:44px; background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
  .btn-primary:disabled, .btn-secondary:disabled{ background:var(--disabled-bg); color:var(--disabled-text); border-color:transparent; box-shadow:none; transform:none; cursor:default; }

  /* ---- 首頁 ---- */
  .home2{ display:flex; flex-direction:column; gap:16px; }
  .home2 .greet h1{ font-size:24px; font-weight:700; margin:0; color:var(--ink); line-height:1.3; }
  .home2 .greet p{ font-size:15px; color:var(--muted); margin:4px 0 0; }
  .card2{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .quest{ background:var(--green-soft); border:none; border-radius:20px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .card-head h2{ all:unset; font-size:18px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .pill{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:600; background:var(--surface); color:var(--ink); white-space:nowrap; }
  .pill .ico{ width:16px; height:16px; }
  .qbar{ height:12px; border-radius:999px; background:#fff; overflow:hidden; border:1px solid var(--line); }
  .qbar > i{ display:block; height:100%; background:var(--honey); border-radius:999px; transition:width .5s; }
  .hw-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; padding:0; list-style:none; }
  .hw-chip{ display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:4px 12px 4px 8px; border-radius:999px;
    background:var(--surface); border:1.5px solid var(--line); font-size:15px; color:var(--ink); cursor:pointer; font:inherit; }
  .hw-chip .ico{ width:20px; height:20px; }
  .hw-chip.done{ border-color:var(--green); color:var(--green); cursor:default; }
  .hw-chip.pending{ border-color:var(--honey); background:var(--honey-soft); }
  .hw-chip small{ font-size:13px; color:var(--muted); }
  .next-step{ font-size:15px; color:var(--ink); margin:0 0 12px; display:flex; gap:6px; align-items:flex-start; }
  .next-step b{ font-weight:700; }

<script>
/* ---------- 2026-09-28 UI 改版：功能圖示（24px、2px 線寬、圓角線條，顏色跟著文字）＋陽光代幣 ----------
   功能性的地方（底部導覽、設定、狀態）不用 emoji，不同手機才會長得一樣。內容裡的 emoji 暫時保留。 */
const _L=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICONS={
  flower:_L('<path d="M12 21v-8"/><path d="M12 13c-3.3 0-5-2.4-5-6l2.5 1.6L12 5l2.5 3.6L17 7c0 3.6-1.7 6-5 6z"/><path d="M12 17.5c-1.6-1.7-3.6-2.2-5.5-1.8M12 19c1.5-1.5 3.3-1.9 5-1.5"/>'),
  calendar:_L('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>'),

  trophy:_L('<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5a1.5 1.5 0 0 0 0 3.2c.5 1.8 1.5 2.8 2.9 3M16 6h2.5a1.5 1.5 0 0 1 0 3.2c-.5 1.8-1.5 2.8-2.9 3"/><path d="M12 13v4M8.5 20h7M9.5 17h5"/>'),
  gear:_L('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  checkCircle:_L('<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.2 9.5"/>'),
  clock:_L('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  circle:_L('<circle cx="12" cy="12" r="9"/>'),

  user:_L('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.6 3.5-5.8 7-5.8s6.3 2.2 7 5.8"/>'),
  users:_L('<circle cx="9" cy="8" r="3.5"/><path d="M3 20c.6-3.4 3-5.5 6-5.5s5.4 2.1 6 5.5"/><path d="M16 4.6a3.2 3.2 0 0 1 0 6.3M18 14.8c1.8.7 3 2.5 3.4 5.2"/>'),
  layout:_L('<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 10h17M10 10v10"/>'),
  help:_L('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/>'),
  info:_L('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>'),
  sliders:_L('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  music:_L('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'),
  speaker:_L('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
  refresh:_L('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  chevron:_L('<path d="M9 6l6 6-6 6"/>'),
  book:_L('<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>'),
  sprout:_L('<path d="M12 20v-8"/><path d="M12 12c0-4 2.5-6.5 7-6.5 0 4-2.5 6.5-7 6.5zM12 14c0-3.2-2-5.2-6-5.2 0 3.2 2 5.2 6 5.2z"/><path d="M8 20h8"/>'),
  alert:_L('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>'),

  shield:_L('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>'),
  flame:_L('<path d="M12 21c-3.6 0-6-2.5-6-5.8 0-3.4 2.6-5 3.4-8.2 2 1.3 2.7 3 2.7 4.6 1-.7 1.7-1.9 1.9-3.4 2 1.7 4 4.2 4 7 0 3.3-2.4 5.8-6 5.8z"/>'),

};
function ico(name, cls){ return '<span class="ico'+(cls?' '+cls:'')+'">'+(ICONS[name]||'')+'</span>'; }
function paintIcons(root){ (root||document).querySelectorAll('[data-icon]').forEach(el=>{ if(!el.querySelector('svg')) el.innerHTML=ICONS[el.dataset.icon]||''; }); }

/* 設定選單（底部抽屜）：頂列齒輪打開。家長相關只放入口，按了還是要輸入密碼 */
function openSettings(){
  document.querySelectorAll('.sheet-ov').forEach(o=>o.remove());
  const kids=state.children.map(ch=>{ const cur=ch.id===state.activeChildId;
    return `<button class="srow${cur?' cur':''}" data-kid="${escapeHtml(ch.id)}">${ico(cur?'checkCircle':'user')}<span>${escapeHtml(ch.name||'孩子')}</span><span class="sval">${cur?'目前':''}</span></button>`; }).join('');
  const ov=document.createElement('div'); ov.className='sheet-ov';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="設定"><div class="grip"></div><h3>設定</h3>
    <div class="grp">切換孩子</div>${kids}
    <div class="grp">顯示與聲音</div>
    <button class="srow" data-act="custom">${ico('layout')}<span>自訂首頁</span>${ico('chevron','chev')}</button>
    <button class="srow" data-act="diff">${ico('sliders')}<span>功課難易度</span><span class="sval">${escapeHtml(diff().name)}</span>${ico('chevron','chev')}</button>
    <button class="srow" data-act="bgm">${ico('music')}<span>背景音樂</span><span class="sval" id="svBgm">${state.bgm?'開':'關'}</span></button>
    <button class="srow" data-act="tts">${ico('speaker')}<span>點讀</span><span class="sval" id="svTts">${state.tts?'開':'關'}</span></button>
    <div class="grp">說明</div>
    <button class="srow" data-act="manual">${ico('help')}<span>怎麼玩</span>${ico('chevron','chev')}</button>
    <button class="srow" data-act="about">${ico('info')}<span>關於</span>${ico('chevron','chev')}</button>
    <div class="grp">家長（需要密碼）</div>
    <button class="srow parent" data-act="parent">${ico('key')}<span>進入家長後台</span>${ico('chevron','chev')}</button>
    <button class="srow parent" data-act="parent">${ico('users')}<span>更改密碼與孩子資料</span>${ico('chevron','chev')}</button>
    <div class="grp">其他</div>
    <button class="srow" data-act="newday">${ico('refresh')}<span>開始新的一天（重設今天功課）</span></button>
    <div style="margin-top:16px;"><button class="btn-secondary" data-act="close">關閉</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',esc); };
  const esc=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',esc);
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{
    close(); if(b.dataset.kid===state.activeChildId) return;
    state.activeChildId=b.dataset.kid; dailyResetIfNeeded(); save();
    showTab(currentTab==='parent'?'home':currentTab);
  });
  ov.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='bgm'){ toggleBgm(); const v=$('#svBgm'); if(v) v.textContent=state.bgm?'開':'關'; return; }
    if(a==='tts'){ state.tts=!state.tts; save(); const v=$('#svTts'); if(v) v.textContent=state.tts?'開':'關'; if(currentTab==='home') renderHome(); return; }
    close();
    if(a==='custom') openHomeCustom();
    else if(a==='diff') openDiffModal();
    else if(a==='manual') openManual();
    else if(a==='about') openAbout();
    else if(a==='parent') showTab('parent');
    else if(a==='newday') newDayReset();
  });
}
/* 原本在首頁底部的「新的一天（重設功課）」，改版後收進設定選單 */
/* 要家長密碼：會把已簽名的功課重設成沒寫，孩子可以再申請一次，家長沒注意就再簽一次 +30（2026-10-04 稽核 E6） */
function newDayReset(){
  askInput({ title:'🔐 家長密碼', hint:'開始新的一天會把今天的功課重設成沒寫，要家長密碼。', okLabel:'下一步',
    fields:[{id:'pin', label:'家長密碼', type:'password', inputmode:'numeric', maxlength:6}]
  }, v=>{ const err=checkPIN(v.pin); if(err) return err; newDayResetConfirm(); });
}
function newDayResetConfirm(){
  const c=C();

let actx;
/* 統一建立並解鎖 AudioContext：瀏覽器自動播放政策下，context 常處於 suspended，
   必須在 user gesture 內 resume()；這裡無論音效或背景音都走同一入口，避免靜音。 */
function ensureAudio(){
  try{
    if(!actx){ actx = audioCtx(); }
    if(actx && actx.state==='suspended'){ const pr=actx.resume(); if(pr&&pr.catch) pr.catch(()=>{}); }
  }catch(e){}
  return actx;
}
function beep(freq=600, dur=.12, type='sine'){
  const ctx=ensureAudio(); if(!ctx) return;
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}

function normNums(s){
  const fixes=[]; const now=Date.now();
  /* obj[key] 不是數字、超出 lo～hi、或該是整數卻有小數 → 修正；undefined 不管（其他地方會補預設值） */
  const fix=(obj, key, lo, hi, def, label, isInt)=>{

/* ---------- IndexedDB 主存層（localStorage 兜底） ---------- */
const IDB_NAME='bloom_garden_db_v1', IDB_STORE='kv', IDB_KEY=SAVE_KEY;
function idbOpen(){return new Promise((res,rej)=>{
  if(typeof indexedDB==='undefined') return rej(new Error('no-idb'));
  let r; try{ r=indexedDB.open(IDB_NAME,1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
});}
function idbGet(){return new Promise((res,rej)=>{
  idbOpen().then(db=>{ const tx=db.transaction(IDB_STORE,'readonly'); const rq=tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }).catch(rej);
});}
function idbSet(val){return new Promise((res,rej)=>{
  idbOpen().then(db=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(val,IDB_KEY);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }).catch(rej);
});}

/* ---------- 年齡 / 難易度：五檔分級（3-15 歲，依認知發展階段切） ----------

   L2 低年級(6-8) 具體運算初期：注音、20 以內加減、認字起步
   L3 中年級(9-10) 具體運算：乘除、分數入門、段落閱讀，開始限時
   L4 高年級(11-12) 抽象萌芽：比例、幾何、推論閱讀、成語，不給提示

const DIFF_MAP = {

       types:['choice','tf','order','listen'],            sunMul:1.1},
  L3: {key:'L3', name:'中年級', short:'9-10歲',  quiz:8,  hint:true,  mathMax:100,  engCount:20, timed:25, read:'basic',
       types:['choice','tf','fill','order'],              sunMul:1.25},
  L4: {key:'L4', name:'高年級', short:'11-12歲', quiz:10, hint:false, mathMax:1000, engCount:28, timed:20, read:'advanced',
       types:['choice','tf','fill','order'],              sunMul:1.4},
  L5: {key:'L5', name:'國中',   short:'13-15歲', quiz:12, hint:false, mathMax:9999, engCount:38, timed:18, read:'jr',

const LEVEL_ORDER=['L1','L2','L3','L4','L5'];

const LEGACY_LEVEL={ toddler:'L1', basic:'L2', advanced:'L4' };
/* 開機讀檔（let state = load()）比 DIFF_MAP／LEGACY_LEVEL 的宣告早，這裡不能用那兩個常數，
   否則有設難易度的存檔一律讀檔失敗、被換成空白新檔（2026-09-28 稽核 A1） */
function normLevel(k){ if(!k) return ''; if(/^L[1-5]$/.test(k)) return k; return ({toddler:'L1', basic:'L2', advanced:'L4'})[k]||''; }
function ageToLevel(age){
  age=Number(age)||0;
  if(age<=5) return 'L1';
  if(age<=8) return 'L2';
  if(age<=10) return 'L3';
  if(age<=12) return 'L4';
  return 'L5';        // 13 歲以上
}
function childLevel(c){
  c=c||C();
  const ov=normLevel(c.levelOverride);
  if(ov) return ov;
  return ageToLevel(c.age);
}
/* 等級序號（0~4），給題目生成器判斷「多難」用 */
function levelIdx(lvl){ const i=LEVEL_ORDER.indexOf(lvl||childLevel()); return i<0?1:i; }

  {k:'yle-s',   t:'劍橋 YLE Starters', idx:0, cefr:'CEFR A1 入門', desc:'基礎認字、看圖說詞'},
  {k:'yle-m',   t:'劍橋 YLE Movers',   idx:1, cefr:'CEFR A1',     desc:'看圖說詞、簡單拼字'},
  {k:'yle-f',   t:'劍橋 YLE Flyers',   idx:2, cefr:'CEFR A2',     desc:'基礎文法、簡短閱讀'},
  {k:'gept-e',  t:'全民英檢 初級',     idx:2, cefr:'CEFR A2',     desc:'基礎會話與閱讀'},

  {k:'gept-hi', t:'全民英檢 中高級',   idx:4, cefr:'CEFR B2',     desc:'閱讀推論、較長篇章'},
];
const EN_CERT_IDX={'yle-s':0,'yle-m':1,'yle-f':2,'gept-e':2,'gept-i':3,'gept-hi':4};
function enCertIdx(key){
  if(!key) return null;
  if(key in EN_CERT_IDX) return EN_CERT_IDX[key];
  if(typeof LEVEL_ORDER!=='undefined' && LEVEL_ORDER.indexOf(key)>=0) return LEVEL_ORDER.indexOf(key); // 舊檔 L1~L5 相容

/* 某科目可獨立於年齡手動調整難度（subjectDiff[subject]；英文存檢定 key，其他存 L1~L5；空字串=跟隨年齡） */
function subjectIdx(subject, c){

    else if(LEVEL_ORDER.indexOf(ov)>=0) return LEVEL_ORDER.indexOf(ov);
  }
  return levelIdx(childLevel(c));
}

/* 錯題間隔重複（spaced repetition）：答對就拉長下次複習間隔，答錯重置 */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
/* 使用者輸入的文字一律把 < > 換成全形 ＜ ＞：從網路貼的題庫、單字表、備份檔就算夾帶網頁程式碼也組不起來。
   讀檔、存檔、解析貼上內容時都會跑一次；顯示端另外用 escapeHtml（2026-09-28 稽核 A3） */
function cleanText(v){ return typeof v==='string' ? v.replace(/</g,'＜').replace(/>/g,'＞') : v; }
function deepClean(o){
  if(!o||typeof o!=='object') return o;
  const keys=Array.isArray(o)? o.keys() : Object.keys(o);
  for(const k of keys){ const v=o[k]; if(typeof v==='string'){ if(/[<>]/.test(v)) o[k]=cleanText(v); } else if(v&&typeof v==='object') deepClean(v); }
  return o;
}
function shuffleOpts(opts, correct){ const arr=(opts&&opts.length?opts.slice():[correct]).slice(); if(!arr.includes(correct)) arr.push(correct); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
/* 2026-09-28 稽核 D1：原本沒有到期的錯題時會把「全部」錯題丟回來，間隔等於沒作用；錯題也永遠不會畢業。
   改成：剛答錯的題目馬上可以複習；複習答對一次，隔 1 天再考，再對隔 3 天，連對 3 次就畢業（從錯題本移除）。
   複習時答錯就從頭算、明天再考。日期照「起床前 3 小時」當一天開頭算，晚上做的複習隔天放學就會到期 */
const REVIEW_GAP_DAYS=[1,3];   /* 第 1、2 次答對後隔幾天 */
const REVIEW_GRAD=3;           /* 連對幾次畢業 */
const REVIEW_BATCH=10;         /* 一次複習最多幾題 */
function dueReviews(){ const now=Date.now(); return (C().wrongQuestions||[]).filter(w=>(w.due||0)<=now); }
function reviewDueAt(days){
  const d=new Date(); const fs=dayFrameStart();
  const base=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(d.getHours()*60+d.getMinutes() < fs) base.setDate(base.getDate()-1);   /* 半夜還算前一天 */
  base.setDate(base.getDate()+days);
  return base.getTime()+fs*60000;
}
/* 回傳 'grad'（畢業）、'next'（排下一次）、'reset'（答錯重來） */
function scheduleReview(w, ok){
  const c=C(); const list=c.wrongQuestions||[]; const item=list.find(x=>x.q===w.q && x.module===w.module); if(!item) return '';
  if(ok){
    item.streak=(item.streak||0)+1;
    if(item.streak>=REVIEW_GRAD){ c.wrongQuestions=list.filter(x=>x!==item); c.wrongGraduated=(c.wrongGraduated||0)+1; save(); return 'grad'; }
    item.due=reviewDueAt(REVIEW_GAP_DAYS[Math.min(item.streak, REVIEW_GAP_DAYS.length)-1]);
    save(); return 'next';
  }
  radarMiss(item.module, item.q);
  item.streak=0; item.due=reviewDueAt(1); save(); return 'reset';
}
/* 錯題要能原樣重考：題型、圖表、文章、解說一起存（原本只存題目文字，
   有圖表／文章的題目複習時看不到圖，填空、排序題只剩一顆按鈕） */
function wrongCtx(cfg){
  const q=cfg.qObj||{}; const x={}; if(cfg.statKey) x.sm=cfg.statKey;
  const type=q.type||cfg.qType||'choice';
  if(type!=='choice') x.type=type;
  if(q.stage) x.stage=String(q.stage);
  const p=cfg.passage||q.p; if(p) x.p=String(p).slice(0,4000);
  const ex=cfg.explain||q.why||q.explain; if(ex) x.ex=String(ex);
  if(type==='fill'){ if(q.numeric||cfg.numeric) x.numeric=true; if(q.unit||cfg.unit) x.unit=q.unit||cfg.unit; const acc=q.accept||cfg.accept; if(acc) x.accept=acc.map(String); }
  if(type==='order' && (q.order||cfg.order)) x.order=(q.order||cfg.order).map(String);
  if(type==='tf') x.tf=(q.ans===true||q.ans==='⭕'||cfg.correct===true);
  return x;
}
/* 錯題存的圖表（數數、表格、長條圖、圓形圖）存檔時 < > 會被轉成全形；顯示前轉回來，
   只放行這幾種標籤、class 和不含網址的 style，備份檔就算被改過也組不出會執行的程式碼 */
const STAGE_TAGS=new Set(['TABLE','TBODY','THEAD','TR','TH','TD','DIV','SPAN','B','BR']);
function safeStageHtml(src){
  const html=String(src||'').replace(/＜/g,'<').replace(/＞/g,'>');
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const root=doc.body.firstElementChild; if(!root) return '';
  const walk=el=>{ [...el.children].forEach(ch=>{
    if(!STAGE_TAGS.has(ch.tagName)){ ch.replaceWith(doc.createTextNode(ch.textContent||'')); return; }
    [...ch.attributes].forEach(a=>{ const n=a.name.toLowerCase(), v=a.value;
      const okAttr = (n==='class' && /^[\w\s-]*$/.test(v)) || (n==='style' && /^[\w\s:;%#.,()-]*$/.test(v) && !/url|expression|import/i.test(v));
      if(!okAttr) ch.removeAttribute(a.name); });
    walk(ch); }); };
  walk(root); return root.innerHTML;
}
/* 共用選項渲染器：六類練習（注音/算術/英文/測驗/自訂）的「出題→作答→對錯→計分→錯題本→回合結算」統一由這裡處理，消除重複邏輯。
   cfg = { box, opts, correct, moduleKey, sun, fb, qText, rightMsg, wrongPrefix, compare, onRight, onWrong }
   - box：選項容器元素；opts：選項陣列（會自動洗牌）；correct：正確答案（比對前轉字串）
   - compare(o)：自訂比對（如算術用 +o===ans）；預設嚴格相等
   - fb：回饋元素；rightMsg/wrongPrefix：客製訊息；onRight/onWrong：額外回呼（如解鎖徽章） */
function renderChoices(cfg){
  const box=cfg.box; if(!box) return;
  const arr=shuffleOpts(cfg.opts, cfg.correct);
  const correctVal=String(cfg.correct);
  const compare=cfg.compare || ((o)=> o===correctVal);
  const fb=cfg.fb||null;
  box.innerHTML='';
  arr.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o;
    b.onclick=()=>{
      $$('.choice',box).forEach(x=>x.disabled=true);
      const ok=compare(o);
      if(ok){
        b.classList.add('correct'); const ps=practiceSun(cfg.sun, cfg.moduleKey); goodSound(); addSun(ps); onCorrect(ps); record(cfg.moduleKey,true, cfg.statKey, cfg.statLi);
        if(cfg.onRight) cfg.onRight();
        if(fb) fb.textContent = cfg.rightMsg || '🎉 答對了！';
      } else {
        b.classList.add('wrong'); badSound(); record(cfg.moduleKey,false, cfg.statKey, cfg.statLi);
        if(!cfg.noLog) logWrong(cfg.moduleKey, cfg.qText!=null?cfg.qText:String(o), String(o), correctVal, arr, wrongCtx(cfg));
        if(cfg.onWrong) cfg.onWrong();
        $$('.choice',box).forEach(x=>{ if(compare(x.textContent)) x.classList.add('correct'); });
        if(fb) fb.innerHTML = escapeHtml((cfg.wrongPrefix||'💡 正確是：') + correctVal) + (cfg.explain? `<div class="q-explain">📖 ${escapeHtml(cfg.explain)}</div>` : '');
      }
      clearQTimer();
      if(cfg.onDone) cfg.onDone(ok);
      else if(!quizCount(ok)) renderQuizDone(quizSess);
    };
    box.appendChild(b);
  });
  if(cfg.timed!==false) startQTimer(()=>{
    $$('.choice',box).forEach(x=>{ x.disabled=true; if(compare(x.textContent)) x.classList.add('correct'); });

function startQTimer(onTimeout, mul){
  clearQTimer();
  const total=Math.round((liveDiff().timed||0)*(mul||1)); if(!total) return;   /* mul：應用題、代數要讀題，時間放寬（2026-09-28 稽核 D6） */

function reviewQObj(w){

/* ---------- 讀書計劃打勾 → 練 5 題（2026-09-28 稽核 D4） ----------
   只對「數學」科目的課名做關鍵字對應：題庫裡其他科每個主題只有 1～2 題，撐不起一回合。
   題目從現有題庫（數感心算）依主題篩出來，加減乘除另外依程度隨機出；湊不到 3 種不同的題目就不顯示 */
function arithQ(op, li){
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  let a,b,ans,q,ex;
  if(op==='+'||op==='-'){
    const hi = li<=1?20 : li===2?100 : 1000;
    a=R(Math.ceil(hi*0.2),hi-1); b=R(1, op==='-'?a-1:hi-a);
    ans= op==='+'?a+b:a-b; q=a+(op==='+'?' ＋ ':' － ')+b+' ＝ ?'; ex=a+(op==='+'?' ＋ ':' － ')+b+' ＝ '+ans;
  } else if(op==='×'){
    if(li<=2){ a=R(2,9); b=R(2,9); } else if(li===3){ a=R(11,99); b=R(2,9); } else { a=R(11,99); b=R(11,99); }
    ans=a*b; q=a+' × '+b+' ＝ ?'; ex=a+' × '+b+' ＝ '+ans;
  } else {
    b = li<=2? R(2,9) : R(2,19); ans = li<=2? R(2,9) : R(2,49); a=ans*b;
    q=a+' ÷ '+b+' ＝ ?'; ex=ans+' × '+b+' ＝ '+a+'，所以 '+a+' ÷ '+b+' ＝ '+ans;
  }
  return {type:'choice', q, opts:kOpts(ans,[ans+1,ans-1,ans+2,Math.max(0,ans-2),ans+10,Math.max(0,ans-10)],4), ans:String(ans), explain:ex};
}

function topicQuestions(t, n){

const EXAM_MOD_MAP=[
  [/數學/, ['math','num','exam']], [/國語|國文|注音/, ['zhuyin','chinese','readtest']],
  [/自然/, ['science','nature','facts']], [/社會/, ['social','life','facts']], [/英文|英語/, ['english','enword','engrammar','enreading']]

function examCramInfo(c){
  const ex=examsOf(c.id).filter(e=>{ const d=examCountdown(e); return d>=1 && d<=3; }).sort((a,b)=>examCountdown(a)-examCountdown(b))[0];
  if(!ex) return null;
  let mods=null;
  (ex.scopes||[]).forEach(sc=>{ const sub=studySubjectById(sc.subjectId); const m=EXAM_MOD_MAP.find(([re])=>re.test(sub?sub.name:'')); if(m){ mods=mods||new Set(); m[1].forEach(x=>mods.add(x)); } });
  const pool=(c.wrongQuestions||[]).filter(w=>!mods || mods.has((w.x&&w.x.sm)||w.module));
  return pool.length ? {exam:ex, days:examCountdown(ex), pool} : null;
}
function renderExamCram(){

function practiceSun(base, key){

function addSun(n, silent){

function record(module, correct, statModule, statLi){

function dailyResetIfNeeded(){
  const c=C();

}
function textbookLessons(pub, grade, subject, sem){
