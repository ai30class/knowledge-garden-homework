<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 知識小花園 · 作業守護台（台灣注音版 v10）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd54a">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  :root{
    --sky1:#dff3ff; --sky2:#bfe7ff; --lawn1:#8fd95e; --lawn2:#74c347;
    --sun:#ffd54a; --sun-dark:#f0a500;
    --panel:#fffdf8; --ink:#3a3120; --accent:#ff7a45; --accent-dark:#e25e2b;
    --leaf:#46b85a; --leaf-dark:#2e8b40;
    --card:#ffffff; --line:#ece0c4; --muted:#8a7a55;
    --shadow:rgba(70,50,15,.16); --radius:28px; --sticker:#ffd54a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  ::selection{background:var(--sun); color:#5a4500;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:"PingFang TC","Microsoft YaHei","Noto Sans TC","Helvetica Neue",sans-serif;
    color:var(--ink); line-height:1.6;
    background:radial-gradient(circle at 20% -10%, #ffffff 0, transparent 42%),
               linear-gradient(180deg,var(--sky1),var(--sky2));
    background-attachment:fixed; min-height:100vh;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; opacity:.92;
    background:repeating-linear-gradient(0deg,var(--lawn1) 0 64px,var(--lawn2) 64px 128px);
    -webkit-mask-image:linear-gradient(180deg,transparent 120px,#000 165px);
            mask-image:linear-gradient(180deg,transparent 120px,#000 165px);
  }
  header{
    background:linear-gradient(180deg,#ffe27a,#ffb02e);
    padding:14px 22px; display:flex; align-items:center; gap:14px;
    box-shadow:0 6px 18px var(--shadow); position:sticky; top:0; z-index:20; flex-wrap:wrap;
    border-bottom:3px solid #ff9d00;
  }
  header h1{font-size:21px; margin:0; text-shadow:1px 2px 0 #fff7d6; letter-spacing:.5px; font-weight:800; line-height:1.25;}
  header .sub{font-size:12px; color:#7a5a00; margin-top:2px; font-weight:600;}
  .sun-box{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background:#fff; padding:7px 16px; border-radius:30px; font-weight:800;
    box-shadow:0 3px 0 var(--sun-dark), inset 0 0 0 2px #ffe39a; font-size:18px; color:#b97700;
  }
  .sun-emoji{font-size:22px; animation:spin 6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  nav.tabs{
    display:flex; flex-wrap:wrap; gap:8px; padding:12px 14px;
    justify-content:center; position:sticky; top:64px; z-index:15;
    background:rgba(255,255,255,.5); backdrop-filter:blur(8px); border-radius:0 0 18px 18px;
  }
  .tab-btn{
    border:none; cursor:pointer; font-size:14.5px; font-weight:700;
    padding:9px 15px; border-radius:14px; background:#fff; color:var(--ink);
    box-shadow:0 3px 0 #d8c79a; transition:transform .1s, box-shadow .1s, background .15s;
  }
  .tab-btn:hover{transform:translateY(-1px); box-shadow:0 4px 0 #d8c79a;}
  .tab-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d8c79a;}
  .tab-btn.active{background:linear-gradient(180deg,var(--leaf),var(--leaf-dark)); color:#fff; box-shadow:0 3px 0 var(--leaf-dark);}

  main{max-width:900px; margin:0 auto; padding:18px 16px 70px;}
  .panel{
    background:var(--panel); border-radius:var(--radius); padding:24px;
    box-shadow:0 10px 30px var(--shadow); margin-bottom:20px;
    border:1px solid #fff; position:relative; animation:fadeUp .35s ease both;
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .panel h2{margin:0 0 4px; font-size:21px; font-weight:800;}
  .panel .hint{color:var(--muted); margin:0 0 16px; font-size:14px;}

  .battle{
    background:repeating-linear-gradient(0deg,#9bdc63 0 50px,#88cf52 50px 100px);
    border-radius:18px; padding:16px; position:relative; overflow:hidden;
    border:4px solid #4e8a2e; min-height:150px; box-shadow:inset 0 0 30px rgba(0,0,0,.08);
  }
  .battle::after{content:"☀️"; position:absolute; top:8px; right:12px; font-size:26px; opacity:.85; animation:spin 8s linear infinite;}
  .zombie{position:absolute; top:40px; font-size:52px; transition:left 1s linear; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
  .plant-def{position:absolute; left:14px; top:40px; font-size:46px; filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
  .battle.danger{ background:linear-gradient(160deg,#5a3232,#7a4040) !important; box-shadow:0 0 0 3px #c0392b inset, inset 0 0 30px rgba(0,0,0,.2); animation:pulseRed 1.1s infinite; }
  .battle.danger .plant-def{ filter:drop-shadow(0 0 8px #ffd2d2); }
  .battle.defeated .plant-def{ filter:grayscale(1) brightness(.55); transform:rotate(-12deg); }
  /* —— 真實戰場：草地網格 / 植物防守 / 陽光掉落 —— */
  .lawn-battle{ height:200px; }
  .lawn-battle .house{ position:absolute; left:8px; top:8px; font-size:30px; z-index:2; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .lawn-battle .lane{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 calc(100%/9), transparent calc(100%/9) calc(200%/9)); }
  .lawn-battle .defenders{ position:absolute; left:0; top:0; bottom:0; width:46%; display:flex; align-items:flex-end; justify-content:flex-end; flex-wrap:wrap; align-content:flex-end; gap:2px; padding:12px 4px 8px 44px; z-index:3; transition:width .7s ease; }
  .lawn-battle .frontline{ position:absolute; top:6px; bottom:6px; width:3px; z-index:2; border-radius:2px;
    background:repeating-linear-gradient(180deg,#fff 0 6px,rgba(255,255,255,.15) 6px 12px); opacity:.75; transition:left .7s ease; }
  .lawn-battle .frontline::after{ content:'🚩'; position:absolute; top:-4px; left:-6px; font-size:14px; }
  .lawn-battle .zombie{ top:auto; bottom:14px; z-index:4; transition:left 4.8s linear; animation:zWalk .5s ease-in-out infinite; }
  .lawn-battle .sun-layer{ position:absolute; inset:0; z-index:6; overflow:hidden; }
  /* 勝負 overlay */
  .battle-overlay{ position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(20,32,14,.5); border-radius:inherit; }
  .battle-overlay.show{ display:flex; animation:fadeUp .35s ease; }
  .battle-overlay .bo-card{ background:#fff; border:3px solid #fff; border-radius:22px; padding:22px 26px; text-align:center; max-width:300px; box-shadow:0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay.win .bo-card{ box-shadow:0 0 0 4px #aee27a, 0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay.lose .bo-card{ box-shadow:0 0 0 4px #e6a3a3, 0 12px 30px rgba(0,0,0,.32); }
  .battle-overlay .bo-emoji{ font-size:48px; line-height:1; }
  .battle-overlay .bo-card h2{ margin:8px 0 6px; }
  .battle-overlay .bo-card p{ margin:0 0 12px; color:#7a6a45; }
  #eyeLockOverlay{ position:fixed; inset:0; z-index:99999; display:none; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,#16352a,#2e5d43); color:#eafff0; text-align:center; padding:24px; }
  #eyeLockOverlay.show{ display:flex; }
  #eyeLockOverlay .el-emoji{ font-size:72px; line-height:1; }
  #eyeLockOverlay .el-big{ font-size:30px; font-weight:900; margin:12px 0 6px; }
  #eyeLockOverlay .el-sub{ opacity:.85; max-width:440px; margin:0 auto 14px; line-height:1.7; font-size:15px; }
  #eyeLockOverlay .el-count{ font-size:60px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:3px; }
  #eyeLockOverlay .el-parent{ margin-top:20px; }
  .lp{ font-size:30px; line-height:1; cursor:pointer; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); animation:plantBob 2.4s ease-in-out infinite, lpGlow 1.6s ease-in-out infinite; }
  .lp:active{ transform:scale(.86); }
  @keyframes lpGlow{ 0%,100%{ filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); } 50%{ filter:drop-shadow(0 0 10px #ffe06a) drop-shadow(0 2px 2px rgba(0,0,0,.25)); } }
  .lp.shake{ animation:plantShake .22s linear infinite; }
  .lp.dead{ filter:grayscale(1) brightness(.5); transform:rotate(-16deg); opacity:.7; }
  .zombie.eating{ animation:chomp .42s ease-in-out infinite; }
  .zombie.hit{ animation:zHit .18s ease-out; }
  /* —— 向量角色：瞌睡怪 —— */
  .z-svg{ width:56px; height:84px; overflow:visible; display:block; }
  .zombie.mega .z-svg{ width:76px; height:114px; }
  .z-leg{ transform-origin:31px 57px; }
  .z-leg-f{ animation:zLegF .62s ease-in-out infinite; }
  .z-leg-b{ animation:zLegB .62s ease-in-out infinite; }
  @keyframes zLegF{ 0%,100%{transform:rotate(15deg);} 50%{transform:rotate(-15deg);} }
  @keyframes zLegB{ 0%,100%{transform:rotate(-15deg);} 50%{transform:rotate(15deg);} }
  .z-arm{ transform-origin:30px 40px; }
  .z-arm-a{ animation:zArmA 1.5s ease-in-out infinite; }
  .z-arm-b{ animation:zArmA 1.5s ease-in-out infinite reverse; }
  .z-arm path:first-child{ filter:drop-shadow(0 1px 0 rgba(0,0,0,.15)); }
  @keyframes zArmA{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(5deg);} }
  .z-head{ transform-origin:30px 34px; animation:zHead 1.24s ease-in-out infinite; }
  @keyframes zHead{ 0%,100%{transform:rotate(-4deg) translateY(0);} 50%{transform:rotate(4deg) translateY(-1.5px);} }
  .z-mouth{ transform-origin:30px 31px; }
  .zombie.eating .z-mouth{ animation:zChew .3s ease-in-out infinite; }
  @keyframes zChew{ 0%,100%{transform:scaleY(.6);} 50%{transform:scaleY(2.1);} }
  .zombie.mega .z-eye{ fill:#ff2222; }
  .zombie.mega .z-skin{ fill:#8fae66; }
  .zombie.dazed .z-svg{ transform:rotate(-8deg); opacity:.85; }
  .zombie.dazed .z-leg-f,.zombie.dazed .z-leg-b,.zombie.dazed .z-head{ animation:none; }
  .zombie.sleepy .z-leg-f,.zombie.sleepy .z-leg-b,.zombie.sleepy .z-arm{ animation:none; }
  /* —— 向量角色：植物 —— */
  .p-svg{ width:46px; height:56px; overflow:visible; display:block; }
  .lp .p-svg{ width:44px; height:54px; }
  .pot .pl .p-svg{ width:46px; height:56px; margin:0 auto; }
  .plant-big .pb-emoji .p-svg{ width:54px; height:64px; margin:0 auto; }
  .p-head{ transform-origin:27px 34px; animation:pSway 2.8s ease-in-out infinite; }
  @keyframes pSway{ 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
  .lp.shake .p-head{ animation:plantShake .22s linear infinite; }
  /* —— 行程時間軸尺（與戰場同一套百分比座標，垂直對齊） —— */
  .timeline{ position:relative; height:62px; margin-top:6px; background:linear-gradient(180deg,#f6efd8,#eee3c2);
    border:2px solid #d8c98f; border-radius:14px; overflow:hidden; }
  .timeline .tl-track{ position:absolute; left:0; right:0; top:38px; height:6px; background:#ddd0a6; }
  .timeline .tl-safe{ position:absolute; top:38px; height:6px; background:linear-gradient(90deg,#4e8a2e,#8fd15b); transition:left .7s ease,width .7s ease; }
  .timeline .tl-mk{ position:absolute; top:5px; transform:translateX(-50%); text-align:center; width:46px; line-height:1.1; }
  .timeline .tl-mk .tl-ic{ font-size:16px; display:block; }
  .timeline .tl-mk .tl-t{ font-size:9px; color:#8a7742; font-weight:800; display:block; margin-top:1px; }
  .timeline .tl-mk .tl-dot{ position:absolute; left:50%; margin-left:-4px; top:33px; width:8px; height:8px; border-radius:50%; background:#c9b57e; border:2px solid #fff; }
  .timeline .tl-mk.todo{ opacity:.5; }
  .timeline .tl-mk.done .tl-dot{ background:#2e7d32; }
  .timeline .tl-mk.checked .tl-dot{ background:#e08e0b; }
  .timeline .tl-mk.overdue{ opacity:1; }
  .timeline .tl-mk.overdue .tl-dot{ background:#c0392b; animation:pulseDot 1s infinite; }
  @keyframes pulseDot{ 0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.6);} 50%{box-shadow:0 0 0 6px rgba(192,57,43,0);} }
  .timeline .tl-now{ position:absolute; top:30px; bottom:0; width:2px; background:#c0392b; transition:left .8s linear; z-index:3; }
  .timeline .tl-now b{ position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:9px; color:#fff; background:#c0392b; padding:1px 5px; border-radius:8px; white-space:nowrap; font-weight:800; }
  .timeline .tl-end{ position:absolute; bottom:3px; font-size:9px; color:#8a7742; font-weight:800; }
  .lead-tag{ display:inline-block; padding:3px 10px; border-radius:12px; font-size:13px; font-weight:800; }
  .lead-tag.good{ background:#e3f4d7; color:#2e7d32; }
  .lead-tag.warn{ background:#fdeccd; color:#b8740a; }
  .lead-tag.bad{ background:#fadbd8; color:#c0392b; }
  .falling-sun{ position:absolute; top:0; font-size:26px; cursor:pointer; z-index:7; filter:drop-shadow(0 0 8px #ffd24d); animation:sunFall 4.6s linear forwards; }
  .falling-sun:hover{ transform:scale(1.18); }
  @keyframes sunFall{ 0%{ transform:translateY(-26px) scale(.5); opacity:0; } 12%{ opacity:1; } 100%{ transform:translateY(150px) scale(1); opacity:.92; } }
  @keyframes plantBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  @keyframes plantShake{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-9deg); } 75%{ transform:rotate(9deg); } }
  @keyframes chomp{ 0%,100%{ transform:translateX(0) rotate(0); } 50%{ transform:translateX(-7px) rotate(-7deg); } }
  @keyframes zHit{ 0%{ filter:none; } 40%{ filter:drop-shadow(0 0 12px #fff) brightness(2.2); } 100%{ filter:none; } }
  @keyframes zWalk{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-6px) rotate(4deg); } }
  @keyframes pulseRed{ 0%,100%{box-shadow:0 0 0 3px #c0392b inset;} 50%{box-shadow:0 0 18px 6px #ff5252 inset;} }
  .hp-wrap{display:flex; align-items:center; gap:8px; margin:6px 0; font-weight:800; font-size:13px; color:#3a6b22;}
  .hp-bar{flex:1; height:16px; background:#e3dcc4; border-radius:9px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.18) inset;}
  .hp-bar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#5fd35f,#2e9b32); transition:width .4s, background .4s;}
  .combo-flag{display:inline-block; margin-left:8px; font-weight:900; color:#e08e0b; font-size:14px; animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.6);} to{transform:scale(1);}}
  /* —— 手感回饋 juice —— */
  @keyframes screenShake{ 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,3px);} 40%{transform:translate(7px,-3px);} 60%{transform:translate(-5px,2px);} 80%{transform:translate(5px,-2px);} }
  .shake-screen{ animation:screenShake .35s ease; }
  @keyframes redFlash{ 0%{box-shadow:0 0 0 0 rgba(192,57,43,0);} 30%{box-shadow:0 0 0 7px rgba(192,57,43,.45);} 100%{box-shadow:0 0 0 0 rgba(192,57,43,0);} }
  .flash-red{ animation:redFlash .42s ease; }
  @keyframes sunBurst{ 0%{transform:translateY(0) scale(.4); opacity:0;} 20%{opacity:1;} 100%{transform:translateY(-64px) scale(1.15); opacity:0;} }
  .burst-sun{ position:fixed; font-size:22px; pointer-events:none; z-index:9999; animation:sunBurst .85s ease-out forwards; }
  @keyframes defeatPop{ 0%{transform:scale(1);} 50%{transform:scale(1.06) rotate(-1deg);} 100%{transform:scale(1);} }
  .panel.pop{ animation:defeatPop .4s ease; }
  .threat-label{font-weight:800; margin:6px 0;}

  .q-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:14px 0;}
  .q-hint{font-size:15px; color:#2e7d32; background:#eafbe7; border:1px dashed #9ccc65; border-radius:10px; padding:6px 12px; margin:8px 0; font-weight:700;}
  .q-text{font-size:26px; font-weight:800; cursor:pointer; transition:color .15s;}
  .q-text:hover{color:var(--accent);}
  .q-text .spk{font-size:18px; opacity:.55;}
  .choices{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  /* ===== 多題型 UI：限時條 / 填空 / 是非 / 排序 / 圖像數數 / 小考 ===== */
  .q-grade-wrap{margin:2px 0 0;}
  .q-grade{display:inline-block;background:#eef6ff;border:1px solid #bcd4f5;color:#1f5fb0;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;margin:0 0 8px;}
  .q-timer{position:relative;height:15px;background:#e9e2c8;border-radius:9px;margin:10px 0 14px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12);}
  .q-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7dc855,#4ea63b);transition:width 1s linear;}
  .q-timer b{position:absolute;right:8px;top:0;font-size:11px;color:#4a3d17;font-weight:900;line-height:15px;text-shadow:0 1px 0 rgba(255,255,255,.7);}
  .q-timer.warn i{background:linear-gradient(90deg,#f4a63a,#e0741b);}
  .q-timer.crit i{background:linear-gradient(90deg,#ef6f5c,#c0392b);}
  .fill-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;}
  .fill-in{flex:1;min-width:120px;font-size:26px;font-weight:900;text-align:center;padding:12px 10px;border-radius:14px;border:3px solid #cfe3b0;background:#fffdf3;color:#3f3418;letter-spacing:1px;}
  .fill-in:focus{outline:none;border-color:#7dc855;box-shadow:0 0 0 4px #d9f2c8;}
  .fill-in.ok{border-color:#4ea63b;background:#eafbe7;}
  .fill-in.ng{border-color:#c0392b;background:#fdecea;}
  .fill-unit{font-size:18px;font-weight:800;color:#7a6a45;}
  .fill-go{padding:12px 20px;border-radius:14px;border:none;background:#5aa832;color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #3f7a22;}
  .fill-go:active{transform:translateY(2px);box-shadow:0 2px 0 #3f7a22;}
  .fill-go:disabled{background:#b9c3ad;box-shadow:0 4px 0 #97a08d;cursor:default;}
  .tf-row{display:flex;gap:14px;margin:14px 0;}
  .tf-btn{flex:1;padding:20px 8px;border-radius:18px;border:3px solid #cfe3b0;background:#fffdf3;font-size:34px;cursor:pointer;box-shadow:0 5px 0 #d9cfa8;transition:transform .1s;}
  .tf-btn small{display:block;font-size:14px;font-weight:900;color:#5a4a22;margin-top:4px;}
  .tf-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9cfa8;}
  .tf-btn.correct{border-color:#4ea63b;background:#eafbe7;}
  .tf-btn.wrong{border-color:#c0392b;background:#fdecea;}
  .tf-btn:disabled{cursor:default;opacity:.8;}
  .ord-slots{display:flex;gap:8px;flex-wrap:wrap;min-height:58px;align-items:center;padding:10px;border-radius:14px;border:3px dashed #cfe3b0;background:#fbfaf0;margin:10px 0;}
  .ord-hintline{color:#a99b70;font-size:13px;font-weight:700;}
  .ord-pool{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .ord-chip{padding:12px 16px;border-radius:12px;border:3px solid #cfe3b0;background:#fffdf3;font-size:19px;font-weight:900;color:#3f3418;cursor:pointer;box-shadow:0 4px 0 #d9cfa8;}
  .ord-chip:active{transform:translateY(2px);box-shadow:0 2px 0 #d9cfa8;}
  .ord-chip.picked{opacity:.25;pointer-events:none;}
  .ord-slots .ord-chip{box-shadow:0 3px 0 #b9d497;border-color:#9ecb74;background:#eefbe4;}
  .ord-slots.ok .ord-chip{border-color:#4ea63b;background:#dff7d4;}
  .ord-slots.ng .ord-chip{border-color:#c0392b;background:#fdecea;}
  .count-stage{font-size:36px;line-height:1.55;letter-spacing:5px;text-align:center;padding:16px 10px;background:#fbfaf0;border-radius:16px;border:3px solid #e4dcbe;margin:8px 0 4px;word-break:break-all;}
  .quiz-hero{background:linear-gradient(135deg,#ffe9a8,#ffd166);border-radius:18px;padding:13px 16px;margin:12px 0;box-shadow:0 4px 0 #d9a92e;}
  .quiz-hero h3{margin:0 0 4px;font-size:17px;color:#6b4d09;}
  .quiz-hero p{margin:0;font-size:13px;color:#8a6a1c;font-weight:700;}
  .quiz-prog{font-size:13px;font-weight:900;color:#7a6a45;margin-bottom:6px;}
  .stars{font-size:42px;letter-spacing:6px;line-height:1.2;}
  .score-card{text-align:center;padding:18px;background:#fffdf3;border-radius:18px;border:3px solid #e4dcbe;}
  .score-big{font-size:52px;font-weight:900;color:#4ea63b;line-height:1.1;}
  .score-big.mid{color:#e08e0b;} .score-big.low{color:#c0392b;}

const $ = (s,r=document)=>r.querySelector(s);

const audioCtx = ()=> new (window.AudioContext||window.webkitAudioContext)();
let actx;
/* 統一建立並解鎖 AudioContext：瀏覽器自動播放政策下，context 常處於 suspended，
   必須在 user gesture 內 resume()；這裡無論音效或背景音都走同一入口，避免靜音。 */
function ensureAudio(){
  try{
    if(!actx){ actx = audioCtx(); }
    if(actx && actx.state==='suspended'){ const pr=actx.resume(); if(pr&&pr.catch) pr.catch(()=>{}); }
  }catch(e){}
  return actx;
}
function beep(freq=600, dur=.12, type='sine'){
  const ctx=ensureAudio(); if(!ctx) return;
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function goodSound(){ beep(660,.1); setTimeout(()=>beep(880,.12),90); setTimeout(()=>beep(1100,.14),190); }

const SAVE_KEY='bloom_homework_v10';

/* ---------- IndexedDB 主存層（localStorage 兜底） ---------- */
const IDB_NAME='bloom_garden_db_v1', IDB_STORE='kv', IDB_KEY=SAVE_KEY;
function idbOpen(){return new Promise((res,rej)=>{
  if(typeof indexedDB==='undefined') return rej(new Error('no-idb'));
  let r; try{ r=indexedDB.open(IDB_NAME,1); }catch(e){ return rej(e); }
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} };
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
});}
function idbGet(){return new Promise((res,rej)=>{
  idbOpen().then(db=>{ const tx=db.transaction(IDB_STORE,'readonly'); const rq=tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }).catch(rej);
});}
function idbSet(val){return new Promise((res,rej)=>{
  idbOpen().then(db=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(val,IDB_KEY);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  }).catch(rej);
});}

/* 啟動時以 IndexedDB 為優先，並把舊 localStorage 資料遷移進 IDB */
function hydrateFromIDB(){
  idbGet().then(raw=>{
    if(raw){
      try{
        const s=JSON.parse(raw);
        if(s && typeof s==='object'){ state=s; if(typeof renderHome==='function') renderHome(); setTimeout(()=>{ if(typeof renderHome==='function') renderHome(); },80); }
      }catch(e){}
    } else {
      try{ idbSet(localStorage.getItem(SAVE_KEY)||JSON.stringify(state)); }catch(e){}
    }
  }).catch(()=>{});
}

const EN_CERT_IDX={'yle-s':0,'yle-m':1,'yle-f':2,'gept-e':2,'gept-i':3,'gept-hi':4};
function enCertIdx(key){

function subjectIdx(subject, c){

/* 錯題間隔重複（spaced repetition）：答對就拉長下次複習間隔，答錯重置 */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function shuffleOpts(opts, correct){ const arr=(opts&&opts.length?opts.slice():[correct]).slice(); if(!arr.includes(correct)) arr.push(correct); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function dueReviews(){
  const c=C(); const list=c.wrongQuestions||[]; const now=Date.now();
  const due=list.filter(w=> (w.due||0) <= now);
  return due.length ? due : list.slice();
}
function scheduleReview(w, ok){
  const c=C(); const list=c.wrongQuestions||[]; const item=list.find(x=>x.q===w.q && x.module===w.module); if(!item) return;
  const intervals=[0,1,3,7,14,30];
  if(ok){ item.reps=(item.reps||0)+1; const d=intervals[Math.min(item.reps, intervals.length-1)]; item.due=Date.now()+d*86400000; }
  else { item.reps=0; item.due=0; }
  save();
}
/* 共用選項渲染器：六類練習（注音/算術/英文/測驗/自訂）的「出題→作答→對錯→計分→錯題本→回合結算」統一由這裡處理，消除重複邏輯。
   cfg = { box, opts, correct, moduleKey, sun, fb, qText, rightMsg, wrongPrefix, compare, onRight, onWrong }
   - box：選項容器元素；opts：選項陣列（會自動洗牌）；correct：正確答案（比對前轉字串）
   - compare(o)：自訂比對（如算術用 +o===ans）；預設嚴格相等
   - fb：回饋元素；rightMsg/wrongPrefix：客製訊息；onRight/onWrong：額外回呼（如解鎖徽章） */
function renderChoices(cfg){
  const box=cfg.box; if(!box) return;
  const arr=shuffleOpts(cfg.opts, cfg.correct);
  const correctVal=String(cfg.correct);
  const compare=cfg.compare || ((o)=> o===correctVal);
  const fb=cfg.fb||null;
  box.innerHTML='';
  arr.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o;
    b.onclick=()=>{
      $$('.choice',box).forEach(x=>x.disabled=true);
      const ok=compare(o);
      if(ok){
        b.classList.add('correct'); const ps=practiceSun(cfg.sun, cfg.moduleKey); goodSound(); addSun(ps); onCorrect(ps); record(cfg.moduleKey,true);
        if(cfg.onRight) cfg.onRight();
        if(fb) fb.textContent = cfg.rightMsg || '🎉 答對了！';
      } else {
        b.classList.add('wrong'); badSound(); record(cfg.moduleKey,false);
        logWrong(cfg.moduleKey, cfg.qText!=null?cfg.qText:String(o), String(o), correctVal, arr);
        if(cfg.onWrong) cfg.onWrong();
        $$('.choice',box).forEach(x=>{ if(compare(x.textContent)) x.classList.add('correct'); });
        if(fb) fb.textContent = (cfg.wrongPrefix||'💡 正確是：') + correctVal;
      }
      clearQTimer();
      if(cfg.onDone) cfg.onDone(ok);
      else if(!quizCount(ok)) renderQuizDone(quizSess);
    };
    box.appendChild(b);
  });
  if(cfg.timed!==false) startQTimer(()=>{
    $$('.choice',box).forEach(x=>{ x.disabled=true; if(compare(x.textContent)) x.classList.add('correct'); });
    timeoutMiss(cfg, correctVal, arr);
  });
}
/* ========================================================================

let _qTimer=null;

function timerHTML(){ const t=liveDiff().timed; if(!t) return ''; return `<div class="q-timer" id="qTimerWrap"><i id="qTimerBar"></i><b id="qTimerNum">${t}s</b></div>`; }
function startQTimer(onTimeout){
  clearQTimer();
  const total=liveDiff().timed; if(!total) return;
  const wrap=document.getElementById('qTimerWrap'); const bar=document.getElementById('qTimerBar'); const num=document.getElementById('qTimerNum');
  if(!wrap||!bar) return;
  wrap.className='q-timer'; bar.style.width='100%'; let left=total;
  _qTimer=setInterval(()=>{
    left--;
    if(bar) bar.style.width=Math.max(0,left/total*100)+'%';
    if(num) num.textContent=Math.max(0,left)+'s';
    if(left<=Math.ceil(total*0.2)) wrap.className='q-timer crit';
    else if(left<=Math.ceil(total*0.45)) wrap.className='q-timer warn';
    if(left<=0){ clearQTimer(); badSound(); if(typeof flashRed==='function') flashRed(); if(onTimeout) onTimeout(); }
  },1000);

/* 超時＝當作答錯：記錄、進錯題本、走同一條結算流程 */
function timeoutMiss(cfg, correctVal, opts){
  record(cfg.moduleKey,false);
  logWrong(cfg.moduleKey, cfg.qText!=null?cfg.qText:'', '（超時未作答）', correctVal, opts||[]);
  if(cfg.fb){ cfg.fb.textContent='⏰ 時間到！正確是：'+correctVal; }

/* 答案正規化：去空白、全形轉半形、英文小寫，讓「 12 」「１２」「12」都算對 */
function normAns(v){
  return String(v==null?'':v).trim().toLowerCase()
    .replace(/[\uff01-\uff5e]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0xfee0))
    .replace(/\s+/g,'').replace(/[。，、．,]/g,'');
}

/* ---- 統一分派：把一個題目物件畫到指定容器 ---- */
function renderQ(q, cfg){

  if(stage) stage.innerHTML = q.stage ? `<div class="count-stage">${q.stage}</div>` : '';
  const hintEl=document.getElementById(cfg.hintId||'');
  if(hintEl) hintEl.innerHTML = q.hint ? hintLine(q.hint) : '';
  const gradeEl=document.getElementById(cfg.gradeId||'');
  if(gradeEl) gradeEl.innerHTML = q.grade ? `<span class="q-grade">📘 ${q.grade}</span>` : '';
  if(q.type==='fill')  return renderFill(Object.assign(base,{numeric:!!q.numeric, unit:q.unit, accept:q.accept}));
  if(q.type==='tf')    return renderTF(Object.assign(base,{correct:q.ans===true||q.ans==='⭕', why:q.why}));

const SUN_DAILY_CAP = 250;   /* 每日陽光獲取上限：防刷題通膨，合法每日事件極少觸頂 */
/* 跨日重置：每日上限計數與「重刷舊題」計數都按日期歸零 */
function ensureSunDay(c){
  const t=dateKey();
  if(c.lastSunDate!==t){ c.lastSunDate=t; c.dailySunEarned=0; c.answeredToday={}; }
}
/* 重刷舊題收益衰減：同一練習模組當日答對次數越多，獎勵越少（防無限刷題賺陽光） */
function practiceSun(base, key){
  const c=C(); ensureSunDay(c);
  const m = c.answeredToday || (c.answeredToday={});
  const n = m[key]||0;
  const factor = n===0 ? 1 : n===1 ? 0.5 : 0.25;
  const reward = Math.max(0, Math.round(base*factor));
  m[key] = n+1;
  return reward;
}
/* 加陽光：n>0 受每日上限約束；silent=true 時達上限不跳提示（用於孩子點擊發射等頻繁動作） */
function addSun(n, silent){
  const c=C();
  if(n>0){
    ensureSunDay(c);
    const remaining = SUN_DAILY_CAP - (c.dailySunEarned||0);
    if(remaining<=0){
      if(!silent) toast('☀️ 今天陽光能領的已達上限（'+SUN_DAILY_CAP+'），明天再來！');
      return;
    }
    const give = Math.min(n, remaining);
    c.sun += give;
    c.dailySunEarned = (c.dailySunEarned||0) + give;
  } else {
    c.sun += n;
  }
  if(c.sun<0) c.sun=0;
  save(); $$('.sunCount').forEach(e=>e.textContent=c.sun);
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000);
}
function record(module, correct){
  const c=C();
  c.answers[ correct?'right':'wrong' ]++;
  const m = c.byModule[module] || (c.byModule[module]={right:0,wrong:0});
  m[ correct?'right':'wrong' ]++;
  // 自適應難度：保留最近 20 次作答的滾動答對率
  c.accWin = c.accWin || [];
  c.accWin.push(!!correct);
  if(c.accWin.length>20) c.accWin.shift();
  save();
}
/* 自適應難度：在「年齡基準難度」上，依最近答對率做溫和微調（表現好→加難，表現弱→變簡單）。
   只有累積 >=5 次作答才啟動，避免一兩題失誤就劇烈波動。顯示用的 diff()/diffLabel() 仍回傳年齡基準。 */
function liveDiff(){
  const base=diff();
  const c=C();
  const w=c.accWin||[];
  const d=Object.assign({}, base);
  if(w.length>=5){
    const acc=w.filter(Boolean).length/w.length;
    if(acc>=0.85){                       // 最近表現很好 → 微調加難（但不會低於年齡基準太多）
      d.mathMax=Math.round(base.mathMax*1.4);
      d.quiz=Math.min(14, base.quiz+2);
      d.engCount=Math.min(ENGLISH.length, base.engCount+4);
      if(levelIdx(base.key)>=3) d.hint=false;   // 高年級以上就不給提示
    } else if(acc<0.6){                    // 最近有點卡 → 微調變簡單（保證有提示）
      d.mathMax=Math.max(5, Math.round(base.mathMax*0.6));
      d.quiz=Math.max(3, base.quiz-2);
      d.engCount=Math.max(4, base.engCount-3);
      d.hint=true;
    }
  }
  return d;
}
function liveDiffNote(){
  const c=C(); const w=c.accWin||[]; if(w.length<5) return '';
  const acc=w.filter(Boolean).length/w.length;
  if(acc>=0.85) return ' <span style="color:#e08e0b;font-weight:800;">⚡自適應：最近表現很好，題目已微調加難</span>';
  if(acc<0.6) return ' <span style="color:#2e7d32;font-weight:800;">💡自適應：最近有點卡，題目已微調變簡單</span>';
  return '';
}

function plantById(id){ return GARDEN_PLANTS.find(p=>p.id===id); }
/* 陣容（deck）：已解鎖的植物中，最多挑 MAX_PLANTS 盆「上場」，可隨時更換 */
function deckIds(c){
  const d = Array.isArray(c.deck) ? c.deck : [];
  return d.filter(id => c.garden[id] && plantById(id)).slice(0, MAX_PLANTS);
}
function deckPlants(c){ return deckIds(c).map(plantById); }
function inDeck(c,id){ return deckIds(c).indexOf(id) >= 0; }
function toggleDeck(id){
  const c=C();
  if(!c.garden[id]){ toast('這盆植物還沒解鎖喔'); return; }
  if(!Array.isArray(c.deck)) c.deck=[];
  const p=plantById(id);
  if(inDeck(c,id)){
    c.deck = deckIds(c).filter(x=>x!==id);
    toast('🪴 '+p.nm+' 收回溫室休息（隨時可以再上場）');
  } else {
    if(deckIds(c).length >= MAX_PLANTS){ badSound(); toast('🌱 陣容滿了（'+MAX_PLANTS+' 盆），先點一盆上場中的植物把它收回'); return; }
    c.deck = deckIds(c).concat([id]);
    toast('🌿 '+p.nm+' 上場守護花園！');
  }
  goodSound(); save(); renderHome();
}

/* 繞圈花瓣產生器 */
function petalRing(cx,cy,r,n,rx,ry,fill,stroke){
  let s='';
  for(let i=0;i<n;i++){
    s+=`<ellipse cx="${cx}" cy="${cy-r}" rx="${rx}" ry="${ry}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="1"`:''} transform="rotate(${i*360/n} ${cx} ${cy})"/>`;
  }
  return s;
}

  { title:'我的小魚', text:'我們家客廳的櫃子上，放著一個圓圓的玻璃魚缸。裡面養了一隻橘色的小魚，名字叫做小橙。小橙的尾巴大大的，像一件飄動的裙子，每次遊起來都左搖右擺，看起來很快樂。每天早上，我會餵牠吃飯，魚食是一顆顆小小圓圓的黃色飼料，小橙一看到就游過來，嘴巴一張一合把食物吃光。吃完以後，牠會停在缸壁的石頭旁邊休息，石頭是灰色的，上面還長著幾株綠綠的水草。有一次換水的時候，我不小心把魚缸碰歪了，水灑出來一點，小橙嚇得一直繞圈圈，我趕快扶好，還輕輕拍拍缸壁安慰牠。傍晚，我會把客廳的燈關小一點，因為魚兒也要睡覺。看著小橙安安靜靜地停在角落，我覺得牠就像家裡的一個小寶貝，雖然不會說話，卻讓我們的家多了一點生氣和溫柔。',
    q:[
    {q:'我們家的小魚叫什麼名字？',a:['小橙','小黑','小白'],c:0},
    {q:'小魚的飼料是什麼顏色？',a:['黃色','紅色','藍色'],c:0},
    {q:'魚缸裡的石頭是什麼顏色？',a:['灰色','彩色','黑色'],c:0},
    ] },
  { title:'幫媽媽買醬油', text:'星期天下午，媽媽正在廚房煮湯，忽然發現醬油用完了。她給我一張紅色的零錢袋，說拜託你去樓下的小商店買一瓶醬油回來。我穿上鞋子，拿著袋子出門，心裡有點緊張，因為這是我第一次自己下樓買東西。商店的阿伯看到我，笑著問小客人要買什麼。我指著架子上的醬油說我要這個。阿伯拿下來，跟我說這一瓶二十元，我從袋子裡拿出錢給他，他還找我五元硬幣，涼涼的握在手心裡。回家的路上，我小心地抱著醬油瓶子，怕摔破，一步一步慢慢走。到家以後，媽媽打開門，看見我真的把醬油買回來了，開心地摸摸我的頭說你長大了。那天晚上，喝到有醬油香味的湯，我覺得特別好喝，因為那裡面也有我的一點點功勞。從此以後，我常幫媽媽跑腿，每次都覺得自己像個小幫手，心裡好驕傲。',
    q:[
    {q:'媽媽叫我去買什麼？',a:['醬油','鹽巴','糖'],c:0},
    {q:'商店的阿伯找我多少錢？',a:['五元','十元','不用找'],c:0},
    {q:'我覺得自己像什麼？',a:['小幫手','大老闆','老師'],c:0},
    ] },
  { title:'學騎腳踏車', text:'爸爸說，等我長高一點，就可以學騎兩輪的腳踏車。生日那天，他真的把車子推出來，車身是紅色的，鈴鐺叮叮響。一開始我好怕，坐上去腳還夠不到踏板，爸爸就先在後面扶著椅墊，要我眼睛看前方，不要低頭。第一次踩下去，車子歪歪的，我嚇得大叫，爸爸說沒關係再試一次。練了整整一個下午，摔了兩次，膝蓋擦破一點皮，但我沒有哭。後來爸爸偷偷放開手，我竟然自己騎了十幾公尺才發現，回頭一看，爸爸在遠遠笑著揮手。那種風從耳邊吹過的感覺，好像自己會飛一樣。現在每天傍晚，我都騎車繞社區一圈，還教妹妹怎麼按鈴鐺。媽媽說，看我從怕得發抖到騎得開心，才知道勇氣是練出來的。我覺得學會一件難的事，比收到禮物還開心，因為那是自己掙來的。',
    q:[
    {q:'爸爸推出的腳踏車是什麼顏色？',a:['紅色','藍色','綠色'],c:0},
    {q:'練車時誰在後面扶著我？',a:['爸爸','媽媽','妹妹'],c:0},
    {q:'我後來自己騎了多遠才發現？',a:['十幾公尺','一步','一公里'],c:0},
    ] },
  { title:'冬天的早餐', text:'冬天的早晨，窗外冷冷的，玻璃上還冒著一層白白的水氣。我縮在被窩裡不想起來，媽媽卻在廚房忙著，鍋子裡傳出咕嚕咕嚕的聲音。起床以後，餐桌上擺著一碗熱呼呼的稀飯，上面撒了少許青蔥，旁邊還有一顆水煮蛋和一片烤得香香的吐司。媽媽說，天氣冷要多吃熱的才不會感冒。我吹了吹稀飯，嚐一口，軟軟暖暖的，從嘴巴一直暖到肚子裡。吃完以後，媽媽幫我圍上紅色圍巾，又幫我戴上毛茸茸的帽子和手套，整個人包得像一顆元宵。走出門口，風雖然冷，但我一點都不怕，因為肚子裡有熱食，身上有媽媽的溫暖。上學的路上，我看見路邊的樹葉都掉光了，只有幾隻小鳥在枝頭跳來跳去，好像也在找暖和的地方。我想，能夠在冷冷的冬天，吃到媽媽煮的早餐，是一件多麼幸福的事。',
    q:[
    {q:'冬天的早餐媽媽煮了什麼？',a:['熱稀飯','冰淇淋','冷麵'],c:0},
    {q:'媽媽幫我圍上什麼顏色的圍巾？',a:['紅色','藍色','黑色'],c:0},
    {q:'吃完早餐出門，我覺得怎樣？',a:['不冷很溫暖','非常害怕','想睡覺'],c:0},
    ] }],
  mid: [
  { title:'第一次上台', text:'小華是個很害羞的男孩，最怕在大家面前說話，只要在人群裡被盯著看，手心就會冒汗。有一天，老師竟然選他參加學校的朗讀比賽。小華很緊張，回家以後每天都很認真練習，把文章讀了一遍又一遍，聲音也變得越來越大，連家裡的狗都聽熟了那一段。比賽那天，他站在台上，心裡一直想著老師說的話：只要有勇氣，就不怕挑戰。讀到一半，他不小心念錯了一個字，臉一下子紅了起來，腦袋一片空白。他停下來深呼吸，對自己說沒關係，再試一次就好，就像在家練習時那樣。台下的同學沒有笑他，反而安靜地聽他繼續讀，還有人輕輕點頭鼓勵。讀完的時候，全班都為他鼓掌，連老師都對他點點頭，眼裡帶著笑意。小華走下台，發現自己的手還在微微發抖，可是心裡卻覺得很有成就感，比以前任何一次都踏實。他終於明白，勇氣不是不害怕，而是害怕的時候，仍然願意踏出那一步。從那天起，他不再躲著人群，反而開始期待下一次可以站在台上，把準備好的故事說給大家聽。我想，每個人心裡都藏著一點勇氣，只是有時候需要一個機會，把它輕輕叫出來，它就會越來越勇敢。後來學校又辦了說故事比賽，小華這次主動報名，還幫大家寫了提詞卡。他站在台上不再發抖，反而笑著把故事講完，台下響起熱烈的掌聲。連以前笑過他的同學都說，小華真的變了，變得比以前更有自信，也更願意幫助害怕上台的人。老師把他的改變寫在聯絡本上，媽媽看了好感動，說勇氣真的會傳染。',
    q:[

    {q:'文章中「勇氣」最接近的意思是？',a:['害怕時仍願意嘗試','永遠不害怕','大聲說話'],c:0},
    {q:'你覺得小華以後會怎麼做？',a:['更敢上台表現','再也不上台','討厭朗讀'],c:0}
    ] },
  { title:'社區的流浪貓', text:'我們的社區裡，曾經有一隻瘦瘦的流浪貓，總是躲在垃圾桶後面找食物，身上的毛亂亂的，看起來好幾天沒吃飽。冬天的時候，牠冷得發抖，縮在牆角，卻沒有人敢靠近，怕被抓傷。班上的小玲看了很心疼，就發起一個照顧貓咪的計畫，先問媽媽能不能幫忙。她請媽媽幫忙買貓食，放學後和同學輪流去餵牠，還幫牠準備了乾淨的碗。漸漸地，貓咪不再躲著人，甚至會主動走過來蹭大家的褲子，發出滿足的呼嚕聲。鄰居們也被這份溫暖打動，有人送來舊毛巾，有人幫忙釘了一個小木屋，就放在社區的花圃旁。幾個月後，貓咪變得圓潤又乾淨，還在木屋裡生下了兩隻小貓，一隻橘的一隻白的，像兩顆會動的棉花糖。社區的公告欄貼出貓咪的照片，大家都搶著認養，連從不說話的隔壁伯伯都來登記。原來，一點點的關心，可以讓一個冰冷的角落到處都是溫暖。小玲說，她最開心的不是貓咪變胖，而是看見大家因為這件事變得更親近，會主動打招呼了。我想，這就是善良帶來的連鎖反應，一個小小的善意，會慢慢傳給更多人，最後連整個社區的空氣都變甜了。後來社區辦了認養說明會，小玲站在台上分享照顧貓咪的過程，台下好多鄰居都拿出手機拍照。那兩隻小貓很快就被一對兄妹認養，他們承諾會好好照顧，還答應定期回來看小橘。隔年春天，社區甚至在花圃旁立了一塊小小告示牌，上面寫著「謝謝你們的溫柔」。從此以後，大家經過那裡都會放慢腳步，彷彿在跟這段溫暖打聲招呼。',
    q:[
    {q:'誰發起了照顧貓咪的計畫？',a:['小玲','老師','媽媽'],c:0},
    {q:'文中「溫暖」指的是什麼？',a:['人與人之間的關心','天氣很熱','貓的體溫'],c:0},
    {q:'你覺得這群小貓長大後會怎樣？',a:['被好心人認養','繼續流浪','被送走'],c:0}
    ] },
  { title:'珍惜每滴水', text:'老師在課堂上告訴我們，世界上有一些地方長期缺少乾淨的水，連喝水都要走很遠的路，有的孩子一天得提著沉重的水桶走好幾個小時。聽了以後，我們班決定發起節水計畫，從自己做起。洗手的時候，我們把水龍頭關小一點；洗菜用過的水，拿去澆花；洗澡也不再拖太久，改成像比賽一樣快速。一開始，有些同學覺得很麻煩，常常忘記，洗著洗著水又開大了。班長就想了一個辦法，在每個水龍頭旁貼一張小提醒卡，上面畫著一滴笑臉的水，旁邊寫著省水三字訣。漸漸地，大家養成了習慣，還比賽誰省下的水最多，下課就跑去比誰的水桶輕。一個月下來，我們竟然比上個月少了三大桶水，老師把數字畫成圖表貼在牆上，全班都驚訝自己這麼厲害。老師說，珍惜不是小氣，而是知道水來得不容易，是許多人的努力才送到家裡。看著水龍頭滴下來的每一滴，我都會想起那些要走很遠才能取到水的人。我終於懂得，珍惜這兩個字，藏在每天的小動作裡，積少成多就能幫助很多人。如果每個人都省下一點點水，累積起來，就能讓缺水的土地多出一口活命的水。學期末，我們班把省下來的水資源換算成捐款，透過公益團體送到偏遠地區。校長在朝會上表揚我們，說這不是一件小事，而是一群孩子學會對世界負責的開始。回家以後，我也教弟弟洗手關小水龍頭，他一開始覺得好玩，後來竟主動提醒媽媽別讓水一直流。媽媽笑著說，家裡多了一個小小節水員。我忽然明白，改變真的不需要很大，只要從自己手邊開始，就能讓更多人跟上來。',
    q:[
    {q:'我們班發起了什麼計畫？',a:['節水計畫','跑步計畫','讀書會'],c:0},
    {q:'文中「珍惜」的意思最接近？',a:['愛惜不浪費','害怕水','討厭水'],c:0},
    {q:'如果繼續這樣做，一個月後會？',a:['省下更多水','水更不夠','沒有改變'],c:0}
    ] },
  { title:'天氣變化多', text:'臺灣的天氣變化很多，常常讓人猜不透，出門前不看天色往往會吃虧。早上出太陽的時候，媽媽會提醒我帶遮陽的帽子；到了中午，忽然下起午後雷陣雨，我又得趕快撐傘，鞋子還是常被濺濕。夏天有時還會來颱風，那時風又大、雨又急，我們全家都待在安全的屋子裡，不敢靠近窗戶，還提前把盆栽搬進屋內。奶奶說，以前沒有氣象預報，人們看雲的顏色、感覺風的方向，就能猜出要不要下雨，那是生活裡練出來的本事。現在我們有手機可以看天氣，但奶奶還是教我一些老方法。比如，傍晚的天空如果紅紅的，有時是颱風要來的前兆，要趕快做好防颱準備；螞蟻搬家，常常預告要下大雨；燕子飛得很低，也表示空氣很濕快要下雨。我覺得，不管是看手機還是看自然，重點都是先做好準備。只要出門前多看一眼天色，帶對衣服和雨具，不管天氣怎麼變，我們都能安心過每一天。準備得好，意外就傷不了我們，也能在變化中找到從容。天氣雖然捉摸不定，但只要我們用心觀察，它其實也有自己的規律可尋。上個月，我看見傍晚紅紅的天色，趕緊提醒全家收好曬在外面的衣服、檢查門窗，隔天果然颱風就來了；因為早一步準備，我們一點都沒慌。同學們聽了都說神奇，紛紛跑來問我怎麼看天氣。我把自己學到的老方法寫成一張小卡片，貼在教室後面的布告欄，上面畫著雲、螞蟻和燕子，標註它們代表的天氣。老師看見以後，還借這張卡片幫我們上了一堂生活課，教大家怎麼把觀察變成準備。我發現，原來奶奶口中的老智慧，到現在還是很有用。',
    q:[
    {q:'夏天有時會來什麼？',a:['颱風','地震','下雪'],c:0},
    {q:'文中「準備」指的是？',a:['出門前看天色帶對物品','買新手機','睡懶覺'],c:0},
    {q:'如果傍晚天空紅紅的，可能會怎樣？',a:['是晴天','下大雨','颳颱風'],c:2}
    ] },
  { title:'小樹苗長大', text:'春天來的時候，我和爸爸在院子裡種下一棵小樹苗。那時候它只有我的手掌那麼高，葉子也寥寥可數，風一吹就搖來搖去，好像隨時會倒。爸爸說，樹就像人一樣，需要時間慢慢長大，不能急，也不能天天把它拔出來看長高了沒。每天放學，我都會去澆一點水，也會除掉旁邊的小草，怕它們搶走樹苗的養分。有幾個禮拜，因為出遠門沒人照顧，樹苗的葉子竟然枯黃了，我急得差點哭出來，以為它要死了。回來以後，我和爸爸趕緊補水、鬆土，還搭了小小的遮陽網，過了幾天它才又冒出新芽，綠綠的讓人好安心。夏天的一場大風，把樹苗吹得歪歪的，我們趕快立了一根小木棍撐住它，用軟繩輕輕綁好。看著它一次次挺過困難，我學會了耐心這件事。耐心不是什麼都不做，而是每天穩穩地照顧，相信時間會給答案，就像農夫等待收成。現在，那棵樹已經比我還高，夏天還會開出白色的小花，引來蜜蜂和蝴蝶。我常想，當初那一點點的堅持，換來了多大的改變，連院子裡的風景都因為它而不一樣了。去年夏天，那棵樹第一次結出果實，雖然只有寥寥幾顆，我和爸爸卻開心得像撿到寶。我們把它摘下來分給鄰居，大家都說這是吃過最甜的味道，因為裡面藏著我們兩年的耐心。爸爸說，看著樹長大，就像看著我慢慢懂事，每一步都要穩穩的，急不得。現在每當我遇到功課卡住或比賽失利，就會去院子裡看看那棵樹，想起它也曾經歪歪斜斜，卻一次次挺了過來。樹教會我的事，比課本還清楚。',
    q:[
    {q:'我和誰一起種樹苗？',a:['爸爸','媽媽','老師'],c:0},
    {q:'文中「耐心」的意思是？',a:['穩定照顧不急躁','快速做完','不管它'],c:0},
    {q:'這棵樹以後可能會？',a:['越長越高開花','枯死','不再長'],c:0}
    ] },
  { title:'夜晚的小偵探', text:'晚上寫完功課，我最喜歡和家人玩一個遊戲，叫做安靜聽一聽。我們關掉電視，坐在窗邊，比誰先聽到最多的聲音，贏的人可以選明天的早餐。一開始，屋子裡安安靜靜的，連針掉在地上都聽得見，大家都不敢出聲。慢慢地，我聽到時鐘滴答滴答，像在數著時間；聽到冰箱偶爾嗡的一聲，像在打呼；還聽到窗外蟋蟀輕輕地叫，一下一下很有節奏。弟弟說他聽到媽媽在廚房洗碗的聲音，原來那是最大的發現，我們都笑說弟弟耳朵最靈。我們把聽到的聲音一筆一筆記下來，像小偵探在辦案，還畫了圖標註聲音從哪裡來。媽媽說，安靜不是什麼都沒有，而是讓我們聽見平常被忽略的細微聲音，那些聲音其實都在說家裡很安全、很溫暖。那個晚上，我發現原來家裡有這麼多溫柔的聲音在陪著我，時鐘是時間，冰箱是肚子餓，蟋蟀是夏夜。從此以後，我不再討厭安靜，反而期待每天這段屬於耳朵的探險，因為安靜裡藏著的，都是愛的聲音。你今晚，也試著安靜聽一聽吧，說不定會聽見意想不到的溫柔。上週的雨夜，停電了，家裡一片漆黑，弟弟害怕得想哭。我拉著他的手，輕聲說我們來玩安靜聽一聽。於是兩個人坐在棉被裡，聽雨打在窗戶上的聲音，聽風從縫隙鑽進來的呼呼聲，還有爸爸在客廳裡走動找蠟燭的腳步。弟弟漸漸不哭了，甚至小聲說，原來黑暗裡也有聲音陪著我們。那晚我們靠著聽聲音撐過停電，還比平常更早睡著。我忽然懂了，安靜不是無聊，而是一種能讓心定下來的神奇遊戲，隨時隨地都能玩。',
    q:[
    {q:'我們玩的遊戲叫做什麼？',a:['安靜聽一聽','捉迷藏','大聲喊'],c:0},
    {q:'文中「安靜」讓我們能？',a:['聽見細微的聲音','什麼都聽不到','睡著'],c:0},
    {q:'弟弟可能還會聽到什麼？',a:['更多家裡的聲音','外星人','沒聲音'],c:0}
    ] },
  { title:'搬新家', text:'這個月，我們家要搬到城市的另一頭。聽到消息時，我的心裡又期待又緊張，期待的是新家有一間屬於自己的房間，緊張的是要離開住了十年的老社區。打包的那幾天，我看著書桌、玩具和窗簾一件件被裝進紙箱，忽然發現，原來這些舊東西裡，藏著好多回憶。紙箱上寫著房間的名字，媽媽說這是給新家最好的地圖。搬家當天，搬家公司的叔叔搬得滿頭大汗，爸爸在旁邊指路，還一直說輕一點、慢一點。到了新家，我發現房間比我想像的還大，窗戶外面能看到遠遠的山，傍晚的時候，山會被夕陽染成橘紅色，像一幅會變色的畫。雖然還不認識新鄰居，也不熟悉附近的路，但我已經在書桌上貼了最喜歡的海報，把舊棉被鋪好，房間慢慢有了熟悉的味道。我想，家不是房子本身，而是我們把回憶和愛放進去的地方；只要一家人在一起，不管搬到哪裡，都會慢慢變成溫暖的家。說不定過幾天，我就會在樓下遇見跟我一樣愛踢球的新朋友，一起把新社區的每個角落都走一遍。媽媽還在新的廚房烤了第一盤餅乾，香味飄滿客廳，我們一邊吃一邊在日曆上圈出開學的日子。我發現，其實離開舊家沒有我想的那麼可怕，因為真正重要的東西，我們都帶在身邊了。晚上我和新鄰居的小孩在樓下踢球，他笑著說以後我們就是好朋友了，那一刻，老社區的回憶忽然有了接棒的人，未來的故事才正要開始。',
    q:[
    {q:'搬家時我的心情主要是？',a:['期待又緊張','只有開心','非常生氣'],c:0},
    {q:'文中「回憶」指的是什麼？',a:['舊東西裡藏的故事','金錢','食物'],c:0},
    {q:'你覺得我搬到新家以後，會發生什麼？',a:['認識新朋友','一直孤單','馬上搬走'],c:0},
    ] },
  { title:'校園的老樹', text:'我們學校操場旁邊，有一棵很老很老的榕樹，聽說比校長的年紀還大。它的樹幹粗粗的，要好幾個小朋友手拉手才抱得完，綠色的葉子一年四季都不掉，像撐開的一把大傘。下課的時候，我們最喜歡跑到樹下乘涼，有的看書，有的玩棋子，還有人把秘密寫在小紙條上，偷偷塞進樹洞裡。有一次，颱風把一根大樹枝吹斷了，掉在跑道上，大家以為老樹要撐不住了。沒想到幾個星期後，斷掉的地方竟然冒出嫩嫩的新芽，綠得讓人眼睛一亮。自然老師說，榕樹的生命力很強，只要根還在土裡，它就會一直長。後來我們班發起認養老樹的活動，輪流幫它澆水、撿落葉，還在樹幹上掛了一塊小木牌，寫著我們對它的祝福。我看著那塊木牌在風裡輕輕晃動，忽然覺得，這棵樹不只是植物，更像一位安靜的老人，看著一批批學生長大又離開。我想，等我畢業以後，老樹還會站在那裡，繼續守護下一個在樹下許願的小孩，把大家的秘密和笑聲，一年一年收藏起來。春天來的時候，老樹落下細細的種子，被風吹到操場另一頭，竟也冒出了小苗。我們小心地把小苗移到花圃邊，像照顧弟弟妹妹一樣看著它長大。老樹看著新一代的生命從自己身邊展開，彷彿在笑著說，沒關係，我已經把故事交給你們了。下課時我們依舊跑到樹下，只是現在多了一群一年級的小鬼頭，跟我們當年一樣，把願望藏進同一個樹洞裡，讓老樹繼續聽著一茬又一茬孩子的秘密。',
    q:[
    {q:'這棵老樹是什麼樹？',a:['榕樹','松樹','櫻花樹'],c:0},
    {q:'文中「生命力」指的是？',a:['斷枝後仍長出新芽','樹長很高','葉子很多'],c:0},
    {q:'你覺得這棵老樹未來會怎樣？',a:['繼續守護學生','很快枯死','被砍掉'],c:0},
    ] },
  { title:'第一次煮晚餐', text:'週六晚上，爸媽臨時有事出門，留我一人在家。我看冰箱裡有雞蛋、青菜和麵條，就鼓起勇氣，決定自己煮一餐簡單的晚餐。我先洗好青菜，水龍頭沖在葉子上，把泥巴一點點沖掉，綠油油的看起來很新鮮。接著我學媽媽的樣子，在鍋裡加水煮開，把麵條放下去，再用另一個鍋煎蛋。第一次拿鍋鏟，手有點抖，蛋黃差點破掉，我趕快把火關小，總算煎出一個圓圓的太陽蛋。最難的是調味道，我怕太鹹又怕沒味，試著加一點醬油，再嚐一口，來回加了三次才覺得剛好。端上桌的時候，雖然賣相沒有媽媽煮的好看，麵條也有點黏在一起，但我吃得很滿足，因為這是第一次靠自己做出來的飯。吃完我還把碗盤洗乾淨，擺回原位，想像媽媽回來驚訝的表情。那晚我學到一件事：嘗試不一定完美，但每一次動手，都會讓自己更獨立一點。下次爸媽再不在，我想挑戰煎魚，雖然可能會手忙腳亂，但至少我已經不怕走進廚房了。那晚爸媽回來，看見洗乾淨的碗盤和桌上的空碗，驚訝得合不攏嘴，還拍照傳給阿公看。阿公回傳語音說，會煮飯的孩子，走到哪裡都不會餓著，這比考一百分還讓他放心。聽完我才懂，原來走進廚房不只是做飯，也是在學習怎麼照顧自己和在乎的人。現在每週六我都主動進廚房幫忙，媽媽說我切菜的樣子，已經有點大廚傅的架勢了，聽得我心裡甜滋滋的，也更懂了家人之間互相照顧的滋味。',
    q:[
    {q:'我第一次煮晚餐做了什麼麵？',a:['雞蛋青菜麵','牛肉麵','義大利麵'],c:0},
    {q:'文中「嘗試」的意思是？',a:['自己動手試做','放棄不做','等別人做'],c:0},
    {q:'下次我想挑戰什麼？',a:['煎魚','煮飯糰','烤蛋糕'],c:0},
    ] },
  { title:'圖書館的午後', text:'放學後，我常去家裡附近的圖書館。那裡很安靜，只有翻書的沙沙聲和偶爾的腳步聲，走進去就會不自覺放輕腳步。二樓的兒童區，書架排得像一座座小迷宮，我總是先跑到科普那排，抽出一本關於星星的書，找個靠窗的位置坐下。窗戶外面是學校的操場，我邊讀邊看陽光在書頁上跳動，好像連知識也變得暖暖的。圖書館的阿姨很溫柔，有一次我找不到恐龍的書，她帶我繞了半圈，還教我怎麼看分類號，說只要記住數字，下次就能自己找到。後來我辦了一張借書證，每週都借兩本回家，床頭堆起小書堆，睡前讀幾頁，夢裡都會出現書裡的畫面。我發現，圖書館像一個不用錢的魔法屋，只要願意翻開書，就能去任何地方旅行，當太空人、當探險家、當古代的小書僮。安靜的午後，因為有書，變得既充實又自由。我想，等我識字更多，一定會把整排科普書都讀完，再走向更厚的故事書，讓心裡的世界一天比一天大。上週圖書館辦了說故事比賽，我鼓起勇氣報名，把那本星星的書講給低年級的同學聽。看著他們睜大眼睛的樣子，我忽然懂了借書證不只是借書，還能把喜歡的東西分享出去。回家的路上，書包裡多了一本新借的恐龍百科，我想，明天的午後，又會是一場新的旅行。圖書館的燈，把每個午後都照得溫溫的，而我也在那一頁頁書裡，慢慢長出了一雙能飛向遠方的翅膀，知道世界比想像中更大、也更值得去讀。',
    q:[
    {q:'我常去圖書館的哪裡看書？',a:['兒童區靠窗','廚房','操場'],c:0},
    {q:'文中「魔法屋」比喻的是？',a:['圖書館能帶人去各處','真正的城堡','遊樂場'],c:0},
    {q:'我以後想讀什麼書？',a:['更厚的故事書','漫畫','課本'],c:0},
    ] }],
  high: [
  { title:'端午節的由來', text:'每年端午節，家家戶戶吃著粽子、看著河面上的龍舟競賽，空氣裡飄著粽葉的香味，孩子們手上繫著五彩的絲線，笑聲傳遍河岸。這項古老的傳統，背後藏著一段動人的故事。很久以前，有一位名叫屈原的愛國詩人，眼看國家將要被敵人打敗，心裡非常悲痛，最後抱著石頭投入汨羅江中，結束了自己的生命。百姓聽到消息，非常難過，紛紛划著船去江裡尋找他，還把米糰丟進河裡，希望魚兒吃米、不要去咬傷詩人的身體，讓他能夠安息。後來，這個舉動慢慢演變成包粽子的習俗，划船找人也變成了熱鬧的龍舟比賽，一年一年傳了下來。直到今天，這些活動仍讓我們記得祖先的智慧與情感，也把家人團聚的溫暖一代代傳下去。除了吃粽子、看龍舟，有些地方還會在門口掛艾草、佩香包，用各種方式祈求平安，驅走不好的運氣。節慶不只是放假，更提醒我們從哪裡來、哪些價值值得珍惜。那天的分享會上，阿公說起小時候端午要去河邊看龍舟，奶奶會在門口掛菖蒲驅邪，還會煮一鍋香香的草藥水給孩子洗澡。聽著聽著，我發現節日不只是吃喝，更是一代一代把祝福傳下去的方式，是長輩把記憶交給孩子的儀式。而我們這一代，也有責任把這份記憶繼續說給下一代聽，不然再熱鬧的習俗也會慢慢被忘記。原來一條龍舟劃過的不只是水，還是大家齊心協力的精神；守護這些傳統，就是守護我們自己的根，也守護下一代的記憶。當我們包粽子的時候，包的也不只是糯米和肉，而是把思念和感謝一層一層捲進葉子裡，再用繩子綁得緊緊的。我想，這就是端午節留給我們最珍貴的功課：記得來時路，也把愛傳下去。不同地方還有不同口味的粽子，北部粽和南部粽做法不一樣，甜的鹹的各有擁護者，卻都承載著同樣的祝福。傳統從來不是僵硬的規矩，而是活著的故事，只要我們還願意動手包、開口講，它就不會消失。今年端午，我第一次跟著奶奶學包粽子。糯米要先泡一個晚上，粽葉得一張張洗乾淨、煮軟，才不會在綁的時候破掉。奶奶的手很巧，三兩下就包出一個尖尖的三角粽，我卻怎麼都學不會，米一直從縫裡漏出來，惹得全家哈哈大笑。包好以後，我們把粽子放進大鍋裡煮，整間屋子都飄著葉子的清香，那味道讓人想起小時候的過節。奶奶一邊煮一邊說，以前物資少，粽子是難得的美味，孩子們總盼著過節能多吃一個；現在雖然隨時買得到，但自己包的才有團圓的味道。我終於明白，傳統不是博物館裡的舊東西，而是可以走進廚房、走進生活、走進我們手裡的溫度。當我們把這些手藝一代代傳下去，節日就有了靈魂，而不只是日曆上的一個紅字。或許將來我也會像奶奶一樣，教我的孩子包粽子、說屈原的故事，讓這份記憶在他們心裡發芽。那時候我會告訴他們，端午真正的意義，是記得我們從哪裡來，也願意把溫暖送給下一代。',
    q:[
    {q:'端午節包粽子、划龍舟，是為了紀念誰？',a:['愛國詩人屈原','一位將軍','一個漁夫'],c:0},
    {q:'這篇文章主要在說什麼？',a:['端午節的由來與傳承的意義','怎麼做粽子最好吃','龍舟比賽的規則'],c:0},
    {q:'從文中可以推論，掛艾草、佩香包的目的是？',a:['祈求平安、驅邪','裝飾好看','賣錢'],c:0},
    {q:'作者認為守護傳統等於什麼？',a:['守護自己的根與下一代記憶','只是放假休息','沒什麼意義'],c:0}
    ] },
  { title:'失敗的價值', text:'許多人害怕失敗，遇到挫折就想放棄，但其實失敗往往是學習的最好機會，是我們偷偷進步的時候。發明家愛迪生為了做出耐用的燈泡，前後嘗試了幾千種材料，屢屢碰壁，實驗室裡堆滿了失敗的樣品。有人笑他浪費時間，他卻回答：我沒有失敗，只是找到幾千種行不通的方法。正是這份堅持，讓他最後成功，把光亮帶進了千家萬戶。當我們遇到困難，與其馬上放棄，不如先靜下來思考哪裡出錯，調整方法再試一次，常常會發現上次的差錯正好是這次的地圖。每一次跌倒，其實都是靠近成功的一步；重點不是不摔跤，而是摔了之後願意再站起來，拍掉灰塵繼續走。失敗像一面鏡子，照出我們還沒練好的地方，也教我們更謙虛地看待自己的能力，不再以為自己什麼都會。後來我在自然課做實驗，第一次點燃酒精燈手還發抖，失敗了好幾次才成功；體育課學騎單車，也是摔了幾次才終於平衡。我想起愛迪生的話，便不再慌張，原來課本上那句失敗為成功之母，不是口號，而是真的要一次次練習，才會把手變穩、把心變定。把每一次不順利都當成練習的機會，時間久了，原本覺得困難的事，也會慢慢變得容易。真正厲害的人，不是從不失敗，而是失敗以後，比昨天多懂一點點，比上次更有方法。我們班的合唱團第一次比賽名次墊底，大家很難過，卻沒有解散，反而更認真練聲音和默契，第二年就拿了獎。失敗沒有擊倒他們，反而讓他們更團結。所以當你下次考砸、做錯、被退回的時候，別急著討厭自己，先問問這次學到了什麼。失敗不是終點，而是一張寫滿筆記的練習紙，等你把上面的功課都學會，成功就會在下一個轉角等你。這學期我參加演講比賽，初賽就被刷下來，站在台下看著別人領獎，心裡酸酸的。回家以後，我把稿子重新寫了三遍，還錄下自己的聲音反覆聽，找出哪裡卡頓、哪裡太急。媽媽陪我練到喉嚨沙啞，卻從來沒說放棄。下學期再比，我居然進了決賽，雖然沒拿第一，但評審說我的進步最明顯。那一刻我懂了，真正的獎勵不是名次，而是那幾個禮拜裡，我把怕的事練成了熟的事。後來我把這段經驗寫進週記，老師給我批了一句：跌倒的地方，往往長出最結實的肌肉。我把這句話抄在書桌前，每次想偷懶就抬頭看看。失敗不再是我躲著走的影子，而成了我願意面對的老朋友，因為我知道，它每次出現，都是在提醒我：你還可以更好，只是需要再多試一次。我們班的黑板旁，後來多了一欄叫做「今天我失敗了什麼」的小格子，每個人輪流寫下自己這週搞砸的事，以及從中學到的東西。一開始大家都不好意思寫，後來發現，原來每個人都在跌跤，寫出來反而覺得輕鬆，也更敢去挑戰沒做過的事。期末時，那欄貼得滿滿的，老師說這才是我們班真正的成績單——不是從不失誤，而是每一次失誤都變成了往前走的墊腳石。我想，這就是失敗留給我們最珍貴的禮物：它教會我們，人生不是直線通往成功，而是一圈一圈，在錯誤裡慢慢磨出更好的自己。',

    {q:'愛迪生為了燈泡嘗試了多少次？',a:['幾千次','一次','兩次'],c:0},
    {q:'這篇文章想告訴我們什麼？',a:['失敗是學習的機會','失敗很丟臉不要提','不要嘗試'],c:0},
    {q:'從文中可以推論，面對困難最好的做法是？',a:['思考再試一次','馬上放棄','不管它'],c:0},

    ] },
  { title:'網路安全小學堂', text:'現在許多同學用手機或電腦上網路，方便又好玩，手指點一點就能查資料、看影片、和朋友聊天。媽媽卻提醒我：網路雖好，也要小心，因為螢幕後面的世界不全是友善的。首先，不要把個人的照片或住址隨便給陌生人，哪怕對方說自己是同年紀的朋友，也要先和朋友或大人確認；其次，看到免費領禮物、抽大獎之類太誘人的訊息，千萬別輕易相信，那很可能是詐騙，目的是騙走你的帳號或金錢。遇到奇怪的內容，或者有人傳奇怪的連結給你，一定要告訴信任的大人，不要自己偷偷點開。學會保護自己，網路才會是陪伴我們學習、探索的好工具，而不是藏著危險的陷阱。記住：方便不代表安全，多一分警覺，就少一分危險。真正的自由，是建立在懂得保護自己之上的；當我們知道怎麼安全地使用網路，世界才會為我們打開更多學習的大門。例如，設定不容易猜到的密碼、不在公共電腦留下帳號，都是守護自己的小小習慣。媽媽還說，遇到不舒服的內容要馬上關掉並告訴大人，而不是自己憋著，因為憋著只會讓害怕變大。網路像一座大圖書館，裡面有寶藏也有陷阱，會保護自己的人，才能安心地在裡面找知識。懂得保護自己，網路才會是幫我們長知識的好朋友。除了防詐騙，我們也要注意網路禮貌，不在留言區霸凌別人，也不隨便轉傳沒有根據的謠言，因為一句話在網上傳得比在教室裡快太多了。還有，滑手機的時間要懂得停下來，保護眼睛也保護睡眠，才不會變成低頭族。網路是工具，不是主人，我們要當它的主人。這份警覺與分寸，會陪著我們平安長大，也讓科技真正成為幫助我們的好幫手，而不是綁住我們的繩子。前陣子，班上的小美差點受騙。有人在遊戲裡私訊她，說只要填寫家長的信用卡號，就能免費升級裝備。小美覺得可疑，先來問我，我們一起去告訴老師，老師立刻請家長封鎖那個帳號。事後小美說，還好當時多問了一句，不然家裡可能損失一大筆錢。這件事讓全班都警覺起來，我們甚至辦了一場小型的網路安全分享，把常見的詐騙手法一條條列出來，貼在教室牆上提醒大家。我也學會了一個好習慣：任何要我輸入密碼或個資的頁面，都先停下來想一想，必要時找大人確認。網路世界變化很快，新的陷阱層出不窮，但我們手裡有一把最穩的傘，那就是冷靜與懷疑。願意多想一下、多問一句，就能把危險擋在門外，讓網路真正成為幫我們長知識的好朋友，而不是偷走我們安全的黑手。放學後，我和幾個同學組了一個小小宣導隊，每週輪流在班級群組分享一則辨識詐騙的小知識，例如假投資、假中獎、假冒親友借錢這些常見套路。一開始只有幾個人看，後來大家發現真的有用，連家長都轉發給親戚。媽媽說，你們這群孩子比廣告還有效，因為你們講的是同齡人聽得懂的話。我也從中學到，保護自己不只要會躲，還要把知道的教給別人，讓更多人都撐起同一把傘。網路會一直變，但我們學會的判斷力不會過期；只要願意保持清醒、互相提醒，再新的陷阱也騙不倒一顆有準備的心。',
    q:[
    {q:'文中說不要把什麼給陌生人？',a:['個人照片和住址','玩具','課本'],c:0},
    {q:'這篇文章主要在提醒什麼？',a:['上網要保護自己、提高警覺','網路都不安全不要用','密碼越簡單越好'],c:0},
    {q:'看到免費領禮物這類訊息，應該？',a:['提高警覺可能是詐騙','立刻相信','轉給所有人'],c:0},
    {q:'作者認為真正的自由建立在什麼上？',a:['懂得保護自己','不管別人','隨便分享'],c:0}
    ] },
  { title:'教室裡的多元文化', text:'我們的班上有來自不同背景的同學：有人和家人過聖誕節，有人在除夕夜圍爐吃年夜飯，還有人慶祝開齋節，整整一個月晚上都不吃東西直到太陽下山。剛開始，大家對彼此的習慣感到好奇又有點陌生，有人甚至誤會對方的食物奇怪。老師說，這就是多元文化：雖然我們的語言、食物和節日不同，但都生活在同樣的城市、讀同一所學校，擁有同樣的夢想。只要彼此尊重、互相了解，差異不但不可怕，反而讓我們的班級更豐富，像一盒有各種顏色的蠟筆。學會接納不同，我們才能在多元的社會中和諧相處，將來長大也才不會因為不了解而害怕陌生人。當我們願意聽懂別人的故事，世界就會從和我一樣變成和我不同但都珍貴。那天的分享會上，我們嚐了彼此帶來的點心，才發現原來不一樣的滋味，拼起來竟是一桌最熱鬧的風景，有人帶聖誕薑餅，有人帶湯圓，有人帶開齋節的甜點。下課後，我和過開齋節的同學學了句祝福的話，他也跟我學寫春聯，我們還約好明年交換節日的小禮物。當我們願意跨出一步認識彼此，教室就不再是單一顏色，而成了繽紛的調色盤，每個人都找到自己的一格。接納不同，世界才會更大、更溫柔；而我們的教室，也因為每個人不一樣，才變得格外精彩、豐富、溫暖又熱鬧。多元不是混亂，而是讓每個人都能被看見、被尊重。後來學校辦國際文化日，我們班負責介紹三個節慶，每個人輪流上台，本來害羞的同學也因為講自己家的傳統而眼睛發亮。我終於懂了，認識不同不是要誰改變誰，而是讓我們在看見別人的同時，也更珍惜自己的根。當許多不同的故事並排放在一起，我們讀到的不是衝突，而是一首更豐富的合唱。畢業前的同樂會，我們班做了一本「我們的故事」小書，每個人寫下自己家最特別的節日與食物，還畫上插圖。翻開那本書，就像走進一座小小的世界村：有人寫除夕夜的圍爐，有人寫開齋節的星空早餐，有人寫聖誕節交換禮物的驚喜。老師把我們的小書送給下一屆學弟妹，希望他們也能早點看見班級的多彩。我自己也因為這學期的相處，學會了用不同的眼睛看人：不再先問他哪裡不一樣，而是先想他帶來了什麼。家裡的餐桌也變熱鬧了，媽媽跟著同學媽媽學做異國料理，我們一邊吃一邊聽故事，笑聲比平常多了一倍。我越來越相信，世界很大，差異很多，但溫柔和尊重是大家都能聽懂的語言。當我們願意張開雙手接住不同，世界就會回送我們一座更寬廣的花園，裡面的每一朵，都因為不一樣而更美。畢業那天，我們把教室佈置成一條小小的世界街，每個角落代表一種文化，大家穿著代表性的服飾、擺出家常點心，連一向安靜的圖書館阿姨都來逛了一圈，說從沒見過教室這麼熱鬧又溫柔。我忽然覺得，多元不是課本裡的名詞，而是我們親手搭起的一座橋，讓不一樣的人，能從橋的兩頭走到中間相遇。長大以後，不管我走到哪裡，都會記得這間教室教我的事：看見不同時，先微笑，再傾聽，最後珍惜。因為正是這些不同，把原本平淡的日子，釀成了值得一輩子回味的風景。',
    q:[
    {q:'班上同學來自哪裡？',a:['不同家庭與背景','同一個家庭','外太空'],c:0},
    {q:'這篇文章的主旨是？',a:['尊重差異、和諧相處','排斥外來','只信自己'],c:0},
    {q:'文中「多元文化」指的是？',a:['大家習慣不同但共同生活','大家都一樣','只有一種文化'],c:0},
    {q:'從文中可以推論，願意認識彼此會帶來？',a:['更豐富溫暖的班級','吵架變多','大家不說話'],c:0}
    ] },
  { title:'螢火蟲回家的路', text:'山裡的夏夜，曾經到處閃著小小的綠光，那是螢火蟲提著燈籠在飛。小凡的阿公說，小時候整條溪邊都是螢火蟲，像天上的星星掉下來散步。可是後來，村子蓋了更多房子，路燈和招牌的亮光蓋過了螢火蟲微弱的光，水泥也鋪滿了溪岸，水邊的草叢越來越少。不只如此，農田用的藥劑順著雨水流進溪裡，讓水裡的小蟲變少，螢火蟲找不到食物，數量一年比一年稀少，最後幾乎看不到了。小凡讀到這段故事，心裡很難過，便和同學組了一個護螢小隊。他們先請村長把溪邊的路燈改成感應式，晚上沒人經過就自動變暗；再和農友商量，在溪岸留一條不噴藥的緩衝帶，讓草和昆蟲回來。每隔一段時間，他們就熬夜去數螢火蟲，把數字畫成曲線圖貼在活動中心。第一年只看到三隻，第二年十一隻，第三年已經三十幾隻，綠光慢慢回到了溪邊。村裡的大人也跟著動起來，有人把自家庭院的燈調暗，有人自願巡守不讓人電魚。小凡在心得裡寫：螢火蟲不是消失了，只是我們曾經忘了怎麼替牠們留一條回家的路；當我們願意關掉一點光、多留一點草，那小小的燈火就會一盞一盞重新亮起。這件事讓我明白，環境保護不是口號，而是具體的選擇，藏在每一盞燈、每一條水溝、每一次不忍心破壞的瞬間裡。去年夏天，村裡辦了第一場賞螢活動，小凡站在路口當小小解說員，告訴遊客為什麼不能開手電筒直照。看著孩子們屏住呼吸、看綠光在草叢裡飄動的眼神，他忽然懂了阿公當年的感動。或許我們這一代能做的有限，但只要每個人都願意從身邊小事開始，那些曾經離開的光，總有一天會沿著我們重鋪的路，安安靜靜地飛回來。保護自然，說到底，就是在保護我們自己童年的那片星空。有研究說，一隻螢火蟲的生命只有短短幾週，卻用盡全力發光，彷彿想在被看見的時間裡，把世界點亮一次。我想，我們對環境做的每一件小事，也像那樣微弱卻認真的光。或許一個村子、一條溪的改變很小，算不上一百分的成績，但當三十幾隻綠光重新連成一片，那種希望是騙不了人的。願每個孩子長大後，都還記得山裡曾有螢火蟲，並願意為後面的孩子，留一盞燈、一條路、一片可以呼吸的草叢。小凡現在讀高中了，每逢暑假仍會回到山裡，帶著更小的孩子認識螢火蟲。他說，守護不是一次性的熱情，而是年年夏天都不缺席的約定。當年那三隻微弱的綠光，如今已經變成整條溪的星光，證明只要有人願意開始，自然的傷口是可以被溫柔癒合的。我們每一代人，都該為下一代留一點可以仰望的黑暗，好讓光有地方落脚。',
    q:[
    {q:'螢火蟲後來為什麼越來越少？',a:['光害、水泥與農藥破壞棲地','被鳥吃光','天氣太熱'],c:0},
    {q:'這篇文章主要在說什麼？',a:['人為改變環境讓螢火蟲減少，也能靠行動找回','怎麼抓螢火蟲','螢火蟲的種類'],c:0},
    {q:'從文中可推論，護螢小隊成功的原因是？',a:['具體改變光與棲地','只寫文章','等牠自己回來'],c:0},

  { title:'一封遲到的信', text:'國中開學那天，導師發下一疊舊信件，說是以前畢業生寄錯地址、被退回來堆在櫃子裡的。其中一封，收件人是「給十年後的自己」，寄件人寫著阿哲，日期是十年前。阿哲現在已經是個大人，收到這封遲到的信，又驚又笑。信裡寫著：那年的他，因為一場誤會和最好的朋友吵架，兩人賭氣互不說話，後來對方轉學，從此斷了聯絡。少年阿哲在信裡寫，如果十年後的自己還記得這件事，請一定要主動說聲對不起，不要把遺憾留一輩子。讀著讀著，成年的阿哲紅了眼眶，原來那個結他一直沒解開。他想起那個朋友小宇，小時候總把午餐的布丁分他一半，吵架只是因為一張被弄髒的畫，如今想起竟覺得幼稚又可笑。阿哲開始四處打聽小宇的下落，透過國中同學群組、社群網站，花了將近一個月，才終於聯絡上遠在外地的小宇。兩人在語音通話裡，先尷尬地笑，然後同時說出當年的對不起，彷彿十年的冰一下子融化。他們約好下個假期見面，要把那張弄髒的畫重新畫一張。阿哲把這段經過寫在回信裡，寄給十年前的自己，雖然永遠寄不到，卻讓他徹底放下。我從這個故事想到，人與人之間的傷口，往往不是大仇大恨，而是小小誤會被時間放大；而修補它，也不需要什麼大本事，只要一句主動的對不起，和一份不計較的心。可惜的是，很多人像當年的阿哲，總等著對方先開口，結果把最好的朋友，等成了通訊錄裡一個不敢點開的名字。所以若心裡還惦記誰，別讓面子擋住了真心，早一點說，就少一點遺憾。真正的長大，也許不是學會贏，而是學會在該低頭的時候，溫柔地彎下腰。那封遲到的信提醒我們：原諒別人，其實也是在放過自己，讓心裡那個少年，終於能夠安心長大。後來小宇把那張重新畫好的畫送給阿哲，畫裡兩個小男孩并肩坐在校門口，旁邊寫著「和好」兩個字。阿哲把它框起來，放在辦公桌上，每次和同事有意見不合，就抬頭看一眼，提醒自己先聽再說。他常對年輕同事說，職場或生活裡的誤會，往往撐不過一句真心的對不起；拖得越久，心裡的結就綁得越緊。那封十年前的信，像一顆遲到的種子，終於在成年後的土壤裡，長成了一棵會體諒的樹。這件事後來被阿哲寫成一篇短文，刊登在公司的內部刊物上，許多同事看了都默默想起自己生命裡那個還沒說對不起的人。他收到好多私訊，說謝謝你提醒我，我今晚就要打那通拖延已久的電話。原來一封遲到的信，不只修補了他自己的遺憾，還像一顆小石子，在別人心裡也漾開了勇氣的漣漪。原諒，果然是會傳染的。',
    q:[
    {q:'阿哲當年和誰吵架？',a:['最好的朋友小宇','老師','陌生人'],c:0},
    {q:'這篇文章的主旨是？',a:['主動道歉能化解多年遺憾','不要交朋友','轉學比較好'],c:0},
    {q:'從文中可推論，阿哲花多久才聯絡上小宇？',a:['將近一個月','一天','十年'],c:0},
    {q:'作者認為真正的長大是什麼？',a:['學會在該低頭時彎腰','永遠不認錯','贏過別人'],c:0},
    ] },
  { title:'山上的郵差', text:'在偏遠的山區，有一條郵路要翻過三座山頭，冬天還會積雪結冰。老郵差林伯在這條路上走了三十年，風雨不改，連除夕夜都曾踩著雪送信。他背著沉甸甸的郵包，手裡拿著一根木棍當柺杖，一步一步往山上的部落走。部落裡多是老人家，孩子大多到平地讀書或工作，家書和藥品幾乎都靠林伯帶上去。有一次，一位阿嬤高燒不退，家裡又沒人，是林伯發現異常，趕緊幫她聯絡山下的醫生，還在路滑的夜裡陪著撐到救援到來。阿嬤後來常說，林伯送來的不只是信，還有命。年紀大了以後，林伯的腳力不如從前，單位想把他調到平地的輕鬆崗位，他卻搖頭，說山上的老人等信等到望眼欲穿，換了生面孔他們會不安。他帶了一個年輕徒弟小鄭，一邊走一邊教，怎麼認路、怎麼和長輩說話、哪戶人家行動不便要多停留。小鄭起初抱怨路遠又無聊，直到看見一位失明阿公聽到林伯腳步聲，就笑著喊「信來囉」，那種被等待的溫度，讓他忽然懂了這份工作的重量。幾年後，林伯退休，小鄭正式接下郵包，繼續翻山越嶺。有村民問，現在都有手機和網路，還需要郵差嗎。林伯笑著說，螢幕裡的訊息很快，但手寫的信有手溫，老人家摸著信封，知道有人惦記，那種安心，是訊息取代不了的。我從林伯身上看見，所謂的責任，不是轟轟烈烈的大事，而是把一件平凡的事，日復一日認真做好；所謂的傳承，也不是把工作丟給別人，而是把心裡的那份溫柔，也一併交了出去。山還在，路還長，那個揹著郵包的背影，會一代一代，走進更多等待的心裡。有回下大雨，山路塌方，小鄭揹著郵包繞了兩小時的遠路，只為了把一位阿公的藥準時送到。阿公握著他的手直說傻孩子，小鄭卻說，當年林伯也是這樣走過來的。村裡的孩子現在看到郵差，不再只想到信件，而會想到那個風雨裡撐傘的身影。我想，所謂的榜樣，不是站在台上說教，而是把責任默默走成一段路，讓後來的人，自然而然跟著踩上同一個腳印。責任的重量，原來就藏在這樣一步一步的腳印裡。林伯偶爾會回山上看一眼，看見小鄭熟門熟路地揹著郵包，和長輩們說笑的模樣，簡直就像當年的自己。他悄悄退出人群，沒打擾，只是嘴角帶著笑。他明白，真正的傳承從來不需要隆重的交接，而是在日常的一步一腳印裡，自然完成了。那條翻過三座山的郵路，因為有了一代又一代不願鬆手的人，會一直亮著燈，安靜地等著每一個期盼信件的人回家。而這，或許就是林伯走了一輩子，最想留下的風景。那燈光，會一直亮在每一個等待的人的心裡，成為山裡最溫柔的坐标。',
    q:[
    {q:'林伯在山上送信送了多少年？',a:['三十年','三年','一年'],c:0},
    {q:'這篇文章主要在表現什麼？',a:['平凡堅持中的責任與溫柔','郵差很好賺','網路比較快'],c:0},
    {q:'從文中可推論，年輕徒弟小鄭後來？',a:['接下郵包繼續送信','辭職離開','討厭山區'],c:0},
    {q:'林伯認為手寫信比訊息珍貴的原因是？',a:['有手溫、讓老人安心','比較便宜','比較快'],c:0},
    ] },
  { title:'會說話的垃圾桶', text:'學校的走廊角落，擺著一個特別的垃圾桶，桶身貼著一張笑臉貼紙，旁邊還立了個小牌子寫著：丟對垃圾，我會跟你說謝謝。這是五年級的姿姿和幾個同學做的環保企劃。他們發現，午餐後的走廊總是散落紙巾、果皮和塑膠袋，大家隨手亂丟，清潔阿姨要彎腰撿很久。於是他們先用紙板做了一個會發聲的裝置，只要有人把資源垃圾丟進正確的格子，感應器就會播出錄好的童聲：謝謝你，地球更健康囉。一開始，同學們覺得好玩，都搶著分類丟，走廊明顯乾淨了。但幾天後新鮮感過去，又有人開始亂丟。姿姿沒有放棄，她們把牌子換成漫畫，畫出垃圾進錯桶會讓小魚誤食塑膠；又辦了一場分類闖關遊戲，答對的人可以幫笑臉貼紙塗顏色。漸漸地，正確丟垃圾變成一種默契，連一年級的小弟弟都會指著桶子說這是給寶特瓶的。學期末，清潔阿姨說她的工作輕鬆了一半，還送給她們一張手寫卡片。姿姿在報告裡寫：改變一個習慣，靠的不是罵人，而是讓人看見自己的行動有意義；當感謝被說出口，更多人就願意把手舉起來做對的事。我從這件事體會到，許多看起來難解的問題，未必需要龐大的力量，有時只是一個小裝置、一句溫柔的提醒，就能把冷漠的角落點亮。更重要的是，姿姿沒有等別人來解決，而是自己成為那個開始改變的人。環境也好，生活也好，與其抱怨亂糟糟，不如動手做一個會說謝謝的垃圾桶，把善意具體地擺在別人面前。當越多人因為被感謝而微笑，那個原本不起眼的角落，就會慢慢長出一群願意守護的人，而改變，也就從這裡悄悄發生了。學期末的分享會上，姿姿把那張清潔阿姨寫的卡片投影出來，上面畫著一個笑瞇瞇的垃圾桶。台下的同學這才發現，自己隨手的一個動作，真的能減輕別人的辛苦。後來別的班級也開始做類似的小裝置，有人做了會提醒關燈的貼紙，有人做了分類海報。改變像一圈水波，從一個角落散開，慢慢碰到了更多人。我想，這就是姿姿想說的：你不需等到長大才有力量，現在動手做一個小小的善意，就足以讓世界溫柔一點點。如今那個會說謝謝的垃圾桶，被學校留作永久展示，旁邊多了好幾個由不同班級認養的「環保小幫手」。姿姿升上六年級後，把企劃交給了學妹，就像當年清潔阿姨把溫暖傳給她一樣。她說，改變最動人的地方，不在於一開始有多熱鬧，而在於有沒有人願意接手，讓善意不要斷電。當感謝成了校園的習慣，那個不起眼的角落，也就真的成了所有人一起守護的家。而家，原本就是從一個被看見的善意開始的。',
    q:[
    {q:'會說話的垃圾桶是誰做的？',a:['姿姿和同學','清潔阿姨','老師'],c:0},
    {q:'這篇文章主要在說什麼？',a:['用小巧思和感謝帶動習慣改變','怎麼罵人','垃圾桶會走路'],c:0},
    {q:'從文中可推論，為什麼後來大家願意正確丟垃圾？',a:['看見行動有意義、被感謝','被處罰','怕扣分'],c:0},
    {q:'作者認為改變習慣靠的是什麼？',a:['讓人看見意義的溫柔提醒','大聲責罵','等別人解決'],c:0},
    ] }
  ],
  jr: [
  { title:'「被看見」的焦慮', text:'「這張照片發出去，會不會沒人按讚？」小雅盯著手機螢幕，反覆刪掉又重寫那句話，已經超過半個小時。她不是不知道自己寫了什麼，而是害怕發出之後，得到的不是關心，而是一片安靜。在社群媒體發達的今天，許多青少年像小雅一樣，把被看見、被喜歡，當成衡量自己值不值得被肯定的證明。每當貼文得到的回應少，就會悄悄懷疑自己是不是不夠好；每當滑到別人精緻的生活照，又忍不住拿來和自己的日常比較，結果愈比愈焦慮，甚至不敢再發任何東西。然而，心理學家提醒我們，社群媒體上呈現的，多半是別人精心挑選過的片段，不是完整真實的人生。別人曬出的旅行、禮物和新衣服，背後同樣有疲憊、爭吵和煩惱，只是很少人會把這些放上網。也就是說，我們拿自己的全部，去比別人的高光時刻，本來就不公平。更值得思考的是：按讚的數字，真的能代表一個人的價值嗎？如果一則溫柔鼓勵的留言只有兩個人看見，而一張炫目的自拍有一千個讚，前者就一定比較沒有價值嗎？當我們習慣用數字衡量自己，就容易忘了真實的友誼，往往藏在那些不被看見的陪伴裡：考不好時陪你走路回家的人、生病時幫你抄筆記的人。研究也發現，過度依賴社群回饋的人，情緒更容易隨著讚數起伏；而那些把社群當成聯絡工具、而不是成績單的人，反而過得比較輕鬆。這不是要我們完全不用社群媒體，而是提醒自己：它是工具，不該變成評價自己的尺。我的同學小傑曾經為了拍一張看起來很認真讀書的照片，花了半小時排書、調燈光，卻一個字也沒讀進去；後來他關掉按讚數的顯示，反而第一次靜下心把作業寫完。他的經驗說明，當我們不再盯著那個數字，注意力才會回到事情本身。還有一種常見的循環是：滑得愈久，愈怕錯過別人在做的事，這種錯失恐懼讓人更離不開手機，卻也愈覺得空虛。我的朋友阿芸曾經消失在社群一整個月，去參加山上的營隊，回來後她說，少了每天刷動態，她反而記住了營火的味道、記住了和朋友聊到半夜的話，那些真實的片段比任何貼文都清晰。這讓她明白，快樂不一定需要被看見才成立。說到底，一個人的價值，藏在他怎麼對待他人、怎麼面對困難，而不是藏在一個會跳動的數字裡。社群媒體可以幫我們記錄生活，卻不該替我們定義生活。下一次，當你為了一張照片反覆猶豫，不妨把手機放下三分鐘，問問自己：如果這則動態永遠沒人按讚，它對我來說還有意義嗎？如果答案依然是肯定的，那就發出去——為自己，而不是為那顆愛心。長期下來，試著關閉按讚數的顯示、把焦點放回真實相處，會發現少了那個數字，生活並沒有變差，反而多了一點自在。其實，社群媒體本身沒有善惡，它像一面鏡子，照出我們有多在意別人的眼光。與其責怪平台，不如練習當自己的主人：該看的時候看，該關掉的時候關掉。當我們能把價值的尺拿回自己手裡，那些愛心圖案就只是點綴，而不再是秤鍊。心理學上把這種現象稱為社會比較，本來是人之常情，但無限滑動的動態牆把它放大成每天都要面對的壓力。承認自己會在意，並不可恥；重要的是，在意之後，仍然選擇相信真實的自己比那個數字更豐富。如果你願意，今晚就試一次：發一張照片，然後立刻把手機放進書包，去做一件你喜歡的事。一小時後再打開，你會發現，世界沒有因為少了幾個讚而改變，而你已經多讀了幾頁書、多走了幾步路。最後，別忘了感謝那些不會出現在動態牆上的人——他們的陪伴，比一千個讚都真實。社群媒體是時代的禮物，懂得使用它的人，會讓禮物為自己加分，而不是被禮物牽著走；從今天起，做自己螢幕的主人。', q:[
    {q:'根據本文，許多青少年把「被看見、被喜歡」當成什麼？',a:['自己值不值得被肯定的證明','成績單的分數','父母的期望'],c:0},
    {q:'作者認為拿自己的全部去比別人社群媒體上的高光時刻，有什麼問題？',a:['不公平，因為那只是別人挑選過的片段','很準確，能反映誰比較成功','沒有問題，比較才會進步'],c:0},
    {q:'文中提到，情緒較不受讚數影響的人，通常怎麼對待社群媒體？',a:['當成聯絡工具，而非成績單','完全不使用','只發受歡迎的內容'],c:0},
    {q:'根據本文，面對社群媒體較健康的做法是？',a:['提醒自己是工具，並反思發文動機','完全刪除帳號','只發受歡迎的內容'],c:0}

  { title:'把作業交給 AI，我們學到什麼？', text:'「作業交給 AI 寫，算是學會了嗎？」這個問題，最近在許多學校裡被認真討論。人工智慧可以在幾秒鐘內寫出一篇流利的作文、解出一道數學難題，甚至幫你翻譯一整本外文小說。對學生來說，它像一個永遠不累的家庭教師，隨叫隨到，難怪愈來愈多人碰到作業就先打開它。然而，便利的另一面，是一個不容易回答的問題：當我們把作業交給人工智慧，我們倒底學到了什麼？支持使用的人認為，AI 能示範好的寫作結構，幫我們快速查資料，讓學習更有效率；就像計算機發明以後，我們不再花時間練繁複的筆算，而是把力氣用在理解觀念上。反對的人則擔心，如果連思考的過程都交給機器，大腦就會慢慢退化——就像一直坐電梯的人，腿會愈來愈沒力，有一天要爬樓梯就會喊累。其實，關鍵不在用不用 AI，而在怎麼用。我們班的美玲和志明給了兩種對比：志明直接把題目貼進去、複製答案交差，考試時同樣的題型他卻一題也答不出來；美玲則先自己寫完，再請 AI 幫她找出論證鬆動的地方，最後親手改寫。期末時，美玲的表達明顯進步，志明卻停留在原地。有老師做過一個實驗：一組學生直接抄 AI 的答案，另一組學生先寫再請 AI 批改。一週後測驗，後者的成績明顯更好，因為他們的大腦真正經歷了犯錯、修正、理解的過程。這告訴我們，學習真正的收穫，往往不在那份交出去的作業，而在你為它絞盡腦汁的那段時間。工具會愈來愈聰明，但願意自己想清楚的能力，是任何機器都替不了的。未來的世界需要的，不是會按按鈕的人，而是知道該問什麼問題、能判斷答案對錯的人。更重要的是，當答案來得太容易，我們可能失去提出好問題的習慣——而會問問題，往往比會背答案更重要。懂得把 AI 當助手而不是當替身，才是這一代孩子最該練起來的本事：用它來列大綱、查資料、改錯字都很好，但親手把句子寫好、把論點想透，才是真正長在身上的能力；否則考卷上沒有 AI 的那一天，我們會發現自己什麼也沒帶走。學校其實不必全面禁止 AI，反而可以教學生怎麼負責任地使用它：在作業上註明哪些地方參考了 AI、哪些是自己想的，讓誠實變成習慣。當我們能清楚區分我的想法和工具的建議，AI 才真正成了幫手，而不是遮住雙眼的布。回到一開始的問題：作業交給 AI 寫，算不算學會？答案很清楚——交出去的是作業，學到的卻是空洞。真正的學習，永遠發生在你願意動腦、願意犯錯、也願意從錯誤裡站起來的那段路上。有些同學擔心：別人都用 AI，我不用會吃虧。但真正的吃虧，是讓機器替你思考，結果考場上、生活上要自己面對時，腦子裡空空蕩蕩。短期看，抄答案最省力；長期看，自己想最保值。所以，別把 AI 當成作弊的捷徑，而把它當成會提問的同伴。它給你一百個答案，你負責選出對的那一個，並說得出為什麼——這份判斷力，才是誰也搶不走的本事。老師也提醒，AI 偶爾會給出錯誤或編造的資料，如果連查證都不做就抄，反而比不用的風險更大；這更說明了，會用工具的人，首先要會懷疑工具。從小練習這樣的判斷，長大以後面對假新聞、面對廣告話術，你才不會輕易被帶著走。所以，下次打開 AI 之前，先問自己：這一次，我要它幫我動手，還是幫我動腦？想清楚這一點，工具才真正為你所用。真正的聰明，不是會用最厲害的工具，而是知道工具該停在哪裡；把思考留給自己，把繁瑣交給機器，這才是人與 AI 最好的距離。', q:[

  { title:'一條捷運線，與一棵三百年的老樹', text:'為了讓通勤更方便，市政府計畫在老社區旁興建一條新的捷運線，預計能讓十萬名居民每天少花四十分鐘通勤。消息一出，多數人拍手叫好，畢竟塞車和長時間通勤，是這座城市長久以來的痛，能準時回家吃飯、陪孩子寫功課，對許多家庭都很重要。然而，工程圖公佈後，卻引發另一場爭論：路線必須經過社區公園，而公園裡有一棵被列為珍貴老樹、樹齡超過三百年的榕樹。支持開發的居民說，捷運能改善大家的日常生活，創造的效益是多數人的利益，為了少數一棵樹犧牲大眾便利，並不划算；而且政府承諾會在別處補植更多樹苗，彌補綠地的損失。反對的人則認為，三百年的老樹不是種下去就有的，它見證了這塊土地幾代人的記憶，是無法用數量衡量的文化資產；今天能為捷運砍老樹，明天就可能為停車場砍下一棵，界線一旦退讓就很難收回。這場爭論沒有簡單的對錯。發展帶來效率，保存守護記憶，兩者都是城市需要的價值。有些城市確實做到了兩全：在規劃捷運時保留百年老樹，讓車站與綠地融為一體，既方便通勤，也留下乘涼的樹蔭，證明開發與保存未必只能二選一。真正該問的，不是選哪一邊，而是有沒有第三種可能：能不能微調路線、把車站移到離老樹更遠的位置？能不能把車站蓋在地下、地面留給樹和行人？當我們習慣把問題看成二選一的對立，往往就失去了尋找更好解方的機會。一個成熟的社會，不是誰聲音大誰就贏，而是懂得在效率與記憶、多數與少數之間，反覆衡量、小心取捨，為下一代留下既能前進、也有根的城市。這堂課不只發生在捷運與老樹之間，也發生在我們日常的每一個選擇裡：能不能慢一點下結論，先聽聽不一樣的聲音。課堂上，當同學意見不同，我們也可以練習不急著分輸贏，而是問自己：有沒有兩全其美的方法？能這樣思考的人，長大以後更能面對複雜的真實世界，而不是只會要麼全有、要麼全無。有人說，一棵樹哪有十萬人的通勤重要。但城市的美，常常就在那些說不出價格的事物裡：夏天的樹蔭、老人家乘涼的板凳、孩子認識自然的窗口。把這些都算成沒用，城市就只剩速度和水泥。反過來，也有人擔心，什麼都要保留，是不是就什麼都不能蓋。關鍵在於：我們是不是認真想過每一個替代方案，而不是還沒討論就急著動工，或還沒權衡就斷然拒絕。老樹不會說話，但它用年輪記錄了這座城市的四季；捷運也不會說話，但它用速度承載了人們的日常。兩者都需要被看見、被珍惜，而不是只能留下一個、犧牲另一個。下次遇到意見不同的事，不妨先別急著選邊站。多問幾個如果：如果路線再彎一點呢？如果樹留著、車站蓋地下呢？往往多問幾個如果，答案就從黑白變成彩色。這座城市是我們的家，它的樣子，是無數個像這樣的選擇疊出來的；今天我們怎麼對待一棵老樹，明天孩子就怎麼對待這座城市——守護，從願意多想一種可能開始。有人怕麻煩，覺得繞路、蓋地下站太花錢。但有些花費，買的是幾十年後還在的綠蔭與記憶，算長遠一點，未必真的貴。說到底，城市不是為了贏得某一場開發競賽，而是要讓住在裡面的人，既走得快，也走得安心。一座城市的文明，往往不在它蓋了多少高樓，而在它願不願意為一棵老樹、為一種聲音，多留一點空間；願我們都能成為那種，既會向前走、也會回頭看的人——因為根還在，路才走得遠。守護老樹，守護的其實是我們自己對這座城市的愛與記憶，這筆帳，怎麼算都不虧。', q:[
    {q:'反對砍老樹的人，最主要的理由是什麼？',a:['老樹是無法用數量衡量的記憶與文化資產','老樹能賣錢','老樹擋住資金'],c:0},

  ] }

        q:[ {q:'社區附近有什麼？',a:['公園郵局圖書館醫院','沙漠','火山'],c:0}, {q:'媽媽去哪買菜？',a:['市場','郵局','醫院'],c:0}, {q:'大家怎麼讓社區溫暖？',a:['互相幫忙','吵架','不理會'],c:0} ] },
      { title:'臺灣這塊土地', text:'臺灣是一個美麗的<b>島嶼</b>，四周被<b>海</b>包圍。正中央有一道高高的<b>山脈</b>，其中<b>玉山</b>海拔將近四千公尺，是全臺最高的山。西部有大片的<b>平原</b>，農夫在田裡種植<b>稻米</b>，秋天時一片金黃。許多<b>河流</b>從山上流下來，不但灌溉田地，也給我們乾淨的<b>飲水</b>。多樣的地形，讓臺灣擁有豐富的自然風景。',
        q:[ {q:'臺灣四面環什麼？',a:['海','沙漠','草原'],c:0}, {q:'最高的山？',a:['玉山','富士山','阿爾卑斯'],c:0}, {q:'河流給我們什麼？',a:['飲水','石油','黃金'],c:0} ] },
      { title:'學校的一天', text:'早上八點，<b>校門</b>一打開，同學們就蹦蹦跳跳走進<b>教室</b>。第一節是<b>國語</b>課，老師教我們練習寫生字，大家握筆寫得認真。下課鐘聲一響，所有人衝到<b>操場</b>跑步、玩球，笑聲傳遍校園。中午的<b>午餐</b>時間，營養師準備了均衡的便當，我們邊吃邊聊天。放學前，老師總會提醒我們：回家的功課要記得寫，才不會拖到太晚。',
        q:[ {q:'第一節是什麼課？',a:['國語','體育','音樂'],c:0}, {q:'下課時同學在哪玩？',a:['操場','圖書館','廚房'],c:0}, {q:'中午吃什麼？',a:['營養便當','零食','泡麵'],c:0} ] }
    ],
    nature: [
      { title:'天氣的變化', text:'<b>天氣</b>每天都會改變。出太陽時是<b>晴天</b>，很適合到<b>戶外</b>散步或運動；下雨時是<b>雨天</b>，出門要記得帶<b>雨傘</b>。到了夏天，有時候會出現強烈的<b>颱風</b>，那時風又大、雨又急，我們要乖乖待在<b>安全</b>的屋子裡，不可以靠近窗戶或出門亂跑。不同的天氣，提醒我們要穿對衣服、做好準備，才能舒服又平安地過每一天。',
        q:[ {q:'出太陽是什麼天氣？',a:['晴天','雨天','雪天'],c:0}, {q:'颱風來時要怎樣？',a:['待在安全屋子','去海邊','爬山'],c:0}, {q:'下雨要帶什麼？',a:['雨傘','帽子','鞋子'],c:0} ] },
      { title:'植物的生長', text:'想要種出一株健康的植物，要先在<b>土</b>裡埋下<b>種子</b>，然後每天澆<b>水</b>、讓它曬<b>陽光</b>。過幾天，種子會先長出<b>根</b>，像小管子一樣抓住泥土、吸收水分；接著冒出<b>莖</b>和綠綠的<b>葉子</b>。葉子利用陽光，把水和空氣變成植物需要的<b>養分</b>。最後，植物會長出花苞，綻放美麗的<b>花</b>。原來，植物的長大需要耐心照顧，就像我們長大一樣。',
        q:[ {q:'種子需要什麼才長大？',a:['水和陽光','只有石頭','只有風'],c:0}, {q:'先長出什麼抓土？',a:['根','葉子','花'],c:0}, {q:'葉子用什麼做養分？',a:['陽光','沙子','鹽'],c:0} ] },
      { title:'夜裡的動物', text:'太陽下山、夜幕降臨後，有些動物才慢慢醒來開始活動。<b>貓頭鷹</b>睜開大眼睛，安靜地停在樹枝上，尋找地上的<b>老鼠</b>；<b>蝙蝠</b>則展開翅膀，在空中靈活地捉<b>蚊子</b>。牠們都喜歡<b>黑夜</b>，因為晚上比較安靜，也更容易躲開白天活動的敵人。這些夜行動物，讓夜晚的世界同樣熱鬧又有趣。',
        q:[ {q:'貓頭鷹找什麼吃？',a:['老鼠','魚','草'],c:0}, {q:'蝙蝠在空中捉什麼？',a:['蚊子','蝴蝶','蜜蜂'],c:0}, {q:'這些動物喜歡什麼時候活動？',a:['黑夜','白天','中午'],c:0} ] }
    ]

  advanced: {
    chinese: [
      { title:'我們的環境', text:'六年級的同學們開完班會後，決定一起行動，保護學校旁那條曾被忽略的小溪。那個星期天，大家帶著手套和垃圾袋來到河邊，彎下腰把瓶罐、塑膠袋一一撿起，還在空地上種下幾棵小樹苗。班導師說：「每個人都有責任，讓文化與自然在這塊土地上好好共存。」有人紀錄、有人拍照，所有人用合作和溝通完成這件有意義的事。看著乾淨的河岸，每個人湧起榮譽感，也對未來充滿希望。後來我們把過程做成海報，在全校朝會分享，希望更多班級加入。這次行動讓我們明白：環境不是別人的事，而是每天生活的一部分；從撿起腳邊的垃圾開始，每個人都能成為改變的起點。兩個月後，水面的垃圾不見了，甚至有小朋友看見小魚在水草間穿梭。我們終於相信，哪怕是年紀還小的學生，也能用雙手為這塊土地帶來真實的改變；而這份改變，會像種下的樹苗一樣，一年比一年更茂盛。看著溪水變清，連路過的蜻蜓都來點水，我們才真正體會，守護環境不是口號，而是每天彎腰撿起的那一個垃圾。',
        q:[ {q:'同學們去哪裡清理環境？',a:['河邊','山頂','海邊'],c:0}, {q:'這篇文章認為環境是誰的事？',a:['只有政府','每個人每天生活的一部分','外太空'],c:1}, {q:'他們種下什麼來美化河岸？',a:['石頭','旗子','小樹苗'],c:2}, {q:'「共存」最接近的意思是？',a:['人與自然一起好好生活','人征服自然','不用理自然'],c:0} ] },
      { title:'端午節的由來', text:'每年端午節，家家戶戶吃著粽子、看著河面上的龍舟競賽。這項古老的傳統，背後藏著一段動人的故事：很久以前，一位愛國詩人眼看國家將要危亡，悲痛之下投入江中。百姓為了紀念他，把米糰丟進河裡，希望魚兒吃米、不要傷害詩人；後來這個舉動慢慢演變成包粽子的習俗。直到今天，這些文化活動仍讓我們記得祖先的智慧與情感，也把家人團聚的溫暖一代代傳下去。除了吃粽子、看龍舟，有些地方還會掛艾草、佩香包，用各種方式祈求平安。節慶不只是放假，更提醒我們從哪裡來、哪些價值值得珍惜。那天的分享會上，阿公說起小時候端午要去河邊看龍舟，奶奶會在門口掛菖蒲驅邪。聽著聽著，我發現節日不只是吃喝，更是一代一代把祝福傳下去的方式；而我們這一代，也有責任把這份記憶繼續說給下一代聽。原來一條龍舟劃過的不只是水，還是大家齊心協力的精神。守護這些傳統，就是守護我們自己的根，也守護下一代的記憶。',
        q:[ {q:'端午節吃什麼？',a:['月餅','粽子','湯圓'],c:1}, {q:'百姓把米糰丟進河裡是為了什麼？',a:['餵魚','慶祝生日','紀念愛國詩人'],c:2}, {q:'掛艾草、佩香包的目的是？',a:['祈求平安','驅趕蚊蟲賣錢','裝飾好看'],c:0}, {q:'這篇文章認為傳統節日的用處是？',a:['只是放假浪費時間','連結文化與記憶','沒有用途'],c:1} ] },
      { title:'失敗的價值', text:'許多人害怕失敗，遇到挫折就想放棄，但其實失敗往往是學習的最好機會。發明家愛迪生為了做出耐用的燈泡，前後嘗試了幾千種材料，屢屢碰壁。有人笑他浪費時間，他卻回答：「我沒有失敗，只是找到幾千種行不通的方法。」正是這份堅持，讓他最後成功。當我們遇到困難，與其馬上放棄，不如先靜下來思考哪裡出錯，調整方法再試一次。每一次跌倒，其實都是靠近成功的一步；重點不是不摔跤，而是摔了之後願意再站起來。失敗像一面鏡子，照出我們還沒練好的地方，也教我們更謙虛地看待自己的能力。後來我在自然課做實驗，第一次點燃酒精燈手還發抖，失敗了好幾次才成功。我想起愛迪生的話，便不再慌張，原來課本上那句「失敗為成功之母」，不是口號，而是真的要一次次練習，才會把手變穩、把心變定。把每一次不順利都當成練習的機會，時間久了，原本覺得困難的事，也會慢慢變得容易。',
        q:[ {q:'愛迪生發明了什麼？',a:['電腦','電話','燈泡'],c:2}, {q:'他嘗試幾次才成功？',a:['幾千次','一次','兩次'],c:0}, {q:'遇到困難，文章建議我們怎樣？',a:['馬上放棄','思考再試一次','不管它'],c:1}, {q:'這篇文章想告訴我們什麼？',a:['失敗很丟臉不要提','不要嘗試','失敗是學習的機會'],c:2} ] },
      { title:'網路小提醒', text:'現在許多同學用手機或電腦上網路，方便又好玩。媽媽卻提醒我：網路雖好，也要小心。首先，不要把個人的照片或住址隨便給陌生人；其次，看到「免費領禮物」之類太誘人的訊息，千萬別輕易相信，那很可能是詐騙。遇到奇怪的內容，一定要告訴信任的大人。學會保護自己，網路才會是陪伴我們學習、探索的好工具。記住：方便不代表安全，多一分警覺，就少一分危險。真正的自由，是建立在懂得保護自己之上的；當我們知道怎麼安全地使用網路，世界才會為我們打開更多學習的大門。例如，設定不容易猜到的密碼、不在公共電腦留下帳號，都是守護自己的小小習慣。媽媽還說，遇到不舒服的內容要馬上關掉並告訴大人，而不是自己憋著。網路像一座大圖書館，裡面有寶藏也有陷阱，會保護自己的人，才能安心地在裡面找知識。懂得保護自己，網路才會是幫我們長知識的好朋友，而不是藏著危險的陷阱；這份警覺，會陪著我們平安長大。',
        q:[ {q:'不要隨便把什麼給陌生人？',a:['照片','玩具','書'],c:0}, {q:'「免費領禮物」的訊息很可能是什麼？',a:['朋友留言','詐騙','天氣預報'],c:1}, {q:'遇到奇怪內容要告訴誰？',a:['陌生人','同學','信任的大人'],c:2}, {q:'文章認為真正的自由建立在什麼上？',a:['懂得保護自己','不管別人','隨便分享'],c:0} ] }
    ],
    social: [
      { title:'重要的選舉', text:'這週，班上舉辦了一場班長選舉。每個人都有資格投票，選出自己信任的同學。想當候選人的同學，要上台發表自己的想法和計畫，說明如果當選要做什麼。聽完之後，大家慎重考慮，再投下神聖的一票。這整個過程，就是民主的縮影：每個人的意見都重要，即使是少數人的聲音，也應該被尊重。透過這場小小的選舉，我們學會了：表達、傾聽與負責任，都是公民不可缺少的能力。當我們長大，這樣的經驗會幫助我們在更大的社會裡，做出更成熟的選擇。投票前，我們先了解每位候選人的主張，而不是只看誰和我最好，這才是對自己那一票真正的負責。事後，當選的同學也把承諾一一列出，定期向我們報告進度。這讓我明白，投票不是結束，而是監督與參與的開始。投票不只是選人，更是練習負責任；當每個人都認真對待自己的一票，班級和社會就會朝更好的方向前進，而我們現在學的，正是未來當好公民的第一步。',
        q:[ {q:'班長怎麼產生？',a:['老師指定','投票選舉','抽籤'],c:1}, {q:'民主的意思是？',a:['只有老師說了算','不用選','每個人意見都重要'],c:2}, {q:'候選人要做什麼？',a:['發表想法','睡覺','直接離開'],c:0}, {q:'這篇文章認為投票的意義是？',a:['浪費時間','讓大家決定','沒用'],c:1} ] },
      { title:'認識貨幣', text:'媽媽送我一個可愛的撲滿，鼓勵我存零用錢。於是每天省下一點點，撲滿一天比一天重。某個假日，我打開撲滿，拿著存到的錢去商店，買了一本嚮往已久的筆記本。那一刻我懂了：金錢要珍惜，不能亂花，更要為想要的東西提前計畫。存錢不是不花，而是把錢花在真正需要、真正喜歡的地方。學會管理自己的零用錢，是長大後很重要的本事。當我們能夠延遲滿足、先規劃再消費，就不容易被一時的慾望牽著走。後來我還學著把錢分成「花用」「儲蓄」「捐給需要的人」三份，才發現原來金錢也能用來傳遞關心。看著撲滿裡的錢一點點變多，我不再急著買零食，反而更期待存夠了去完成那個真正想做的事。金錢的價值，不在數字，而在怎麼運用。學會和金錢做朋友，不亂花、懂得存，長大後才不會被一時的慾望牽著走；也才能在重要時刻，大方地幫助需要的人，讓有限的花費發揮更大的價值與意義，讓有限的生命也更有厚度。',
        q:[ {q:'媽媽叫我用什麼存錢？',a:['書包','鞋盒','撲滿'],c:2}, {q:'金錢要怎麼對待？',a:['珍惜不亂花','隨便花','不管'],c:0}, {q:'我用存到的錢買了什麼？',a:['玩具車','筆記本','球'],c:1}, {q:'這篇文章教我們什麼？',a:['隨便花','不存錢','提前計畫與珍惜'],c:2} ] },
      { title:'志工的精神', text:'週末早晨，我和家人來到老人院擔任志工。我們陪爺爺奶奶聊天、唱歌，還幫忙摺疊衣服、整理環境。院長告訴我，比起送禮物，長輩們更渴望的是有人陪伴、有人聽他們說話。看著他們露出滿足的笑容，我心裡也暖暖的。原來，付出不一定只為了別人——在幫助別人的同時，我們自己也得到了快樂與滿足。那一天，我比平常更懂了「施比受更有福」這句話的意思。志工服務讓我看見，一句問候、一點時間，往往比昂貴的禮物更能溫暖人心。回家的路上，我默默答應自己，以後要常常回來，因為這裡的笑容，已經成了我每週最期待的風景。院長送我們到門口時說，你們今天來，比任何禮物都珍貴。那句話我一直記著，也終於懂了，被需要的感覺，會讓給的人比收的人更快樂。付出不一定求回報，但溫暖總會回到自己身上；這堂關於愛的課，比任何課本都更讓人難忘，也讓我看見自己也能成為別人的光與力量。',
        q:[ {q:'我們去哪裡當志工？',a:['老人院','醫院','學校'],c:0}, {q:'院長說什麼更重要？',a:['送禮物','陪伴','吃飯'],c:1}, {q:'看到爺爺奶奶的笑容「我」感覺如何？',a:['好累','無聊','心裡暖暖的'],c:2}, {q:'這篇文章想表達什麼？',a:['付出讓自己也快樂','付出很辛苦不要做','不要當志工'],c:0} ] },
      { title:'多元文化', text:'我們的班上有來自不同背景的同學：有人和家人過聖誕節，有人過傳統的過年，還有人慶祝開齋節。剛開始，大家對彼此的習慣感到好奇又有點陌生。老師說，這就是多元文化：雖然我們的語言、食物和節日不同，但都生活在同樣的城市、讀同一所學校。只要彼此尊重、互相了解，差異不但不可怕，反而讓我們的班級更豐富。學會接納不同，我們才能在多元的社會中和諧相處。當我們願意聽懂別人的故事，世界就會從「和我一樣」變成「和我不同但都珍貴」。那天的分享會上，我們嚐了彼此帶來的點心，才發現原來不一樣的滋味，拼起來竟是一桌最熱鬧的風景。下課後，我和過開齋節的同學學了句祝福的話，他也跟我學寫春聯。當我們願意跨出一步認識彼此，教室就不再是單一顏色，而成了繽紛的調色盤。接納不同，世界才會更大、更溫柔；而我們的教室，也因為每個人不一樣，才變得格外精彩、豐富、溫暖又熱鬧。',

    nature: [
      { title:'四季的變化', text:'春天來臨，百花競相綻放，燕子從南方飛回，在屋簷下築起溫暖的巢；夏天氣溫升高，我們跳進泳池游泳消暑，知了在樹上叫個不停；秋天涼風吹起，葉子由綠轉黃、轉紅，是農人豐收的季節，稻田裡一片金黃；冬天寒流報到，大家穿上厚厚外套，圍著火爐說故事。四季輪流上演，每一季都有獨特的景色與活動，讓大自然充滿變化與驚喜。觀察身邊的季節，會發現世界比想像中更精彩。正因為有四季的輪替，動物才能按時遷徙、植物才能按時萌芽，整個生態才得以維持平衡。農夫跟著季節播種與收成，候鳥循著冷暖南來北往，就連我們的衣服與心情，也悄悄隨著四季換了顏色。如果沒有四季的輪替，世界會變得很單調；正因為有變化，我們才學會等待與珍惜，懂得在對的季節做對的事，生活也跟著有了節奏。順著四季生活，我們學會等待，也學會在對的時間做對的事，讓日常有了自然而優美的節奏與韻律，也讓平凡的日子變得有期待。',

      { title:'夜晚的星空', text:'當夜幕低垂，抬頭仰望天空，會看見數不清的星星，以及一彎溫柔的月亮。那些星星離我們非常遙遠，它們發出的光要旅行好幾年、甚至好幾百年，才抵達地球。偶爾，還能看見一道流星劃過天際，一閃即逝。看著浩瀚的星空，我忍不住覺得宇宙既神秘又壯闊，也對遙遠的未來充滿好奇。人類從未停止探索，因為我們總想弄清楚：在那深邃的黑暗裡，究竟還藏著多少秘密。也許有一天，我們真的能搭上太空船，親自去看看那些星星究竟長什麼樣子。望著星空，我忽然覺得自己很渺小，卻也更珍惜此刻能夠抬頭看見這片光芒的幸運，以及和身邊人一起許願的溫暖。天文老師說，我們看到的星光，可能是星星幾百年前送出的訊息；想到這裡，我更覺得宇宙像一本永遠翻不完的書，每一頁都等著我們去讀。仰望星空，我們學會謙卑，也對這廣闊的世界多了一份溫柔的好奇；那份好奇，會帶我們走得更遠、看得更深、想得更廣。',

      { title:'水的旅行', text:'地球上的水從不停止旅行。海洋裡的水被太陽曬熱，變成看不見的水蒸氣，輕飄飄地升上天空，遇冷後凝結成雲。當雲裡的水滴越積越多、越變越重，便以雨的形式落回地面，匯入河流、滲入土壤，最後又流回海洋。這個不停循環的過程，叫做水循環。多虧了它，地球上的水才能不斷被淨化、重複使用，讓森林、農田與城市都有水可用。水，是生命不可或缺的朋友。如果我們浪費水，等於切斷了這條循環的命脈；珍惜每一滴水，就是在守護自己與未來世代的生存根基。下次洗手時，看著水流走，不妨想想它接下來還要旅行到哪裡，才會再次回到我們的杯裡。人可以好幾天不吃東西，卻不能沒有水；正因為水如此珍貴，我們更要節約每一滴。守護水循環，就是守護所有依賴水活著的生命的未來。珍惜水，就是珍惜所有生命；從今天起，我願意從關緊水龍頭、不浪費一滴水開始，守護這場永不停歇的旅行，也守住我們與下一代的未來。',
        q:[ {q:'水被太陽曬熱後變成什麼？',a:['冰塊','水蒸氣','石頭'],c:1}, {q:'雲太重時變成什麼落下？',a:['雪','冰雹','雨'],c:2}, {q:'這個循環叫什麼名字？',a:['水循環','火循環','風循環'],c:0}, {q:'這篇文章提醒我們什麼？',a:['水不重要','可以隨便浪費','珍惜水守護生存根基'],c:2} ] },
      { title:'地震怎麼辦', text:'臺灣坐落在板塊交界處，地殼活動頻繁，因此常常發生地震。當地震突然來襲，第一時間要冷靜，趕快躲到堅固的桌子底下，雙手保護頭部，遠離窗戶和可能掉落的物品，並且絕對不可以使用電梯。等到搖晃停止，再依照指示有序疏散到空曠的操場或空地。平時家裡準備好防災包，裝著水、手電筒和急救用品，關鍵時刻就能沉著應對。防災，其實是從日常的準備開始。與其慌張，不如平時就練習避難動作，讓身體記住正確的反應。學校每學期辦的防震演習，看似重複，卻能在真正的災難來時，把慌亂化成一連串早已練熟的安全動作。回家後，我也和爸媽一起檢查家裡的逃生路線，把防災包放在容易拿到的地方。準備得越充分，遇到狀況時，我們就越能冷靜地保護自己與家人。平時多一分準備，災難來時就多一分安全；認真防災，是送給家人最好的禮物，也是對自己生命最大的負責、守護與安心，值得我們每個人都認真對待。',
        q:[ {q:'臺灣為什麼常地震？',a:['靠近北極','在海底','位於板塊交界'],c:2}, {q:'地震時要躲到哪裡？',a:['堅固桌子下','窗戶邊','電梯裡'],c:0}, {q:'地震時不能使用什麼？',a:['椅子','電梯','書包'],c:1}, {q:'平時要準備什麼來應對？',a:['玩具','零食','防災包'],c:2} ] }

        "text": "月考成績出來那天，小嵐盯著國文科的分數發呆。她明明背熟了每課的生字，作文卻只拿到一半分。老師在旁邊寫了一句話：『會背，不等於讀懂。』小嵐回家問媽媽：『讀書到底是為了分數，還是為了什麼？』媽媽想了想，說：『分數像體重計，能告訴你今天重不重，卻說不出你健不健康。』這句話讓小嵐愣住。她想起自己讀課外書時，明明考試沒考，卻被某個故事感動了好久；那種感動，分數表上找不到。後來她慢慢明白，讀書有兩種收穫：一種寫在考卷上，一種長在心裡。背生字、練句型，是為了把工具磨利；而讀一本好書、想一個好問題，是為了讓自己成為更有厚度的人。書本像一扇窗，透過它，我們能看見從沒去過的地方、沒經歷過的人生。讀詩，學會把感受說得漂亮；讀歷史，看見同樣的難題在不同時代怎麼被回答；讀科普，知道這世界還有多少未知等著被解開。這些都不是分數能衡量的，卻會悄悄長成我們看世界的眼光。有些同學把讀書和考試畫上等號，還沒翻開書就覺得累。其實，當我們願意為一個故事笑、為一個觀點想很久，那種主動的喜歡，才是讀書真正的起點。分數會過去，但一顆願意思考、願意感受的心，會陪我們走更遠的路。多年後，小嵐可能忘了某個生字怎麼寫，卻會記得曾有一本書，讓她第一次看見：原來世界比課本大得多。讀書的意義，或許就在這裡——它不只用來通過考試，更用來打開我們的眼睛，看見自己與這個世界更多的連結，也更懂得怎麼安放自己的心。當我們把讀書從『任務』變回『探索』，分數會自然跟著變好，因為真正讀懂的人，考什麼都不怕。願你也能在課本之外，為自己留一扇因為好奇而打開的窗，讓讀書成為一輩子的習慣，而不只是應付考試的手段。",

      {
        "title": "語言的溫度",
        "text": "下課後，阿哲滑著手機，看見有人在班級群組裡貼了一張同學的醜照，還寫了難聽的綽號。大家跟著笑了，留言一則比一則尖酸。阿哲本來也想按個笑臉，手指卻停在空中——那個被嘲笑的同學，昨天才因為家裡的事偷偷掉眼淚。一句話，說出口只要一秒，卻可能在別人心上留下好久的痕跡。我們常以為『只是開玩笑』『又沒真的動手』就沒有傷害；但語言的刀子看不見，卻一樣會痛。網路上的留言更如此：按一個讚、轉一句話，都以為自己只是跟風，卻不知道那頭的人正盯著螢幕發抖。後來阿哲把那張圖截下來，私訊告訴張貼的人：『這樣他會很難過，我們刪掉好嗎？』對方想了想，把圖刪了，也跟大家說對不起。沒有人被處罰，但氣氛悄悄變好了。語言可以用來取暖，也可以用來傷人，差別往往只在多想一秒、多站在對方立場一秒。很多校園問題，不是從拳頭開始，而是從一句『開玩笑』開始。當我們願意為一句話負責，願意在鍵盤前多停三秒，那些無形的傷害就會少一點。語言的力量，比我們以為的大：一句適時的鼓勵，能把一個想放棄的人拉回來；一句隨口的評價，也可能把一個人推得更遠。說話是天性，好好說話是修養。我們無法控制別人說什麼，但可以控制自己說出口的每一句；把這份修養帶在身上，走到哪裡，哪裡就多一分溫暖，也多一分讓人安心的力量。下一次，在留言前先想一秒：這句話，是我想被別人對我說的嗎？當愈多人這樣問自己，言語就不再是一把無心的刀，而是一雙溫暖的手。好好說話，是我們送給彼此最樸素、也最珍貴的禮物。",

      {

/* ---------- 每週作息 / 瞌睡怪計時逼近 ---------- */
function todayWeekdayIndex(){ return (new Date().getDay()+6)%7; }
function todayRoutine(){ const wr=state.weekRoutine||defaultWeekRoutine(); return wr[todayWeekdayIndex()]; }
function zombieBounds(){
  const r=todayRoutine();
  const [sh,sm]=r.sleep.split(':').map(Number);
  const [wh,wm]=r.wake.split(':').map(Number);
  return {startMin:wh*60+wm, endMin:sh*60+sm};
}
function zombieProgress(){
  const {startMin,endMin}=zombieBounds();
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  if(endMin<=startMin) return 1;
  let p=(nowMin-startMin)/(endMin-startMin);
  if(p<0)p=0; if(p>1)p=1;
  return p;
}
function fmtRemain(min){
  min = Math.max(0, Math.round(min));
  const h=Math.floor(min/60), m=min%60;
  return h+' 小時 '+(m<10?'0':'')+m+' 分';
}
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+' 分 '+(s<10?'0':'')+s+' 秒'; }

/* ---------- 今日行程（排程系統）：自動產生 + 準時打卡 + 時間內完成獎勵 + 瞌睡怪跟時間軸走 ---------- */
function toMin(t){ const a=(t||'0:0').split(':'); const h=parseInt(a[0])||0, m=parseInt(a[1])||0; return h*60+m; }
function defaultSchedule(){

    {id:'sc_sleep', label:'睡覺', time:r.sleep, dur:0, emoji:'💤', kind:'routine', routineKey:'sleep'}
  ];
  let t=19*60;
  visibleHW().forEach(it=>{
    const hh=String(Math.floor(t/60)).padStart(2,'0'), mm=String(t%60).padStart(2,'0');
    items.push({id:'sc_hw_'+it.id, label:displayHWName(it), time:hh+':'+mm, dur:30, emoji:subjectIcon(it.type), kind:'homework', hwId:it.id});

}
function ensureSchedule(){
  if(state.scheduleDate!==dateKey() || !Array.isArray(state.schedule)){
    state.schedule=defaultSchedule(); state.scheduleDate=dateKey();

function scheduleWindow(){
  const sc=state.schedule; if(!sc||!sc.length) return null;
  let mn=1e9, mx=-1;
  sc.forEach(it=>{ const s=toMin(it.time); if(s<mn)mn=s; const e=s+(it.dur||0); if(e>mx)mx=e; });
  if(mx<=mn) mx=mn+30;
  return {start:mn, end:mx, total:mx-mn};
}
function timePressure(){
  const sw=scheduleWindow();
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  if(sw){ let p=(nowMin-sw.start)/sw.total; if(p<0)p=0; if(p>1)p=1; return p; }
  return zombieProgress();
}
function scheduleOverdue(){
  if(isHolidayToday()) return 0;
  const c=C(); const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let n=0;
  (state.schedule||[]).forEach(it=>{
    const st=(c.sched&&c.sched[it.id])||{};
    if(st.status==='done') return;
    if(nowMin > toMin(it.time)+(it.dur||0)) n++;
  });
  return n;
}
/* ===== 位置模型：時鐘 vs 進度 的賽跑 =====
   瞌睡怪 x = 「現在時間」在作戰窗口中的比例（誠實可讀，走到哪 = 現在該做哪件事）
   防線 x = 「今日完成度」的比例（完成一項，防線就往右推一格，把瞌睡怪實體推退）
   瞌睡怪被防線擋住不會穿過；一旦時間超前於進度（落後），瞌睡怪就抵在防線上啃食扣血。 */
const LANE_R = 92, LANE_L = 6;                       // 戰場左右邊界（%）
function laneX(ratio){ return LANE_R - Math.max(0,Math.min(1,ratio))*(LANE_R-LANE_L); }
/* 作戰窗口：從「第一個還沒完成的行程」到「睡覺」。隨著一天推進自動收窄，瞌睡怪相對移動才看得出來。 */
function activeWindow(){
  const sw=scheduleWindow(); if(!sw) return null;
  const c=C(); const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let first=null;
  (state.schedule||[]).forEach(it=>{
    const st=(c.sched&&c.sched[it.id])||{};
    if(st.status!=='done'){ const m=toMin(it.time); if(first===null||m<first) first=m; }
  });
  let start = (first===null? sw.start : first);
  if(nowMin < start) start = nowMin - 5;             // 還沒開跑：瞌睡怪待在最右邊
  let end = sw.end;
  if(end - start < 45) start = end - 45;             // 窗口至少 45 分，避免比例暴衝
  return {start, end, total:Math.max(1,end-start)};
}
/* 今日完成度：行程項目（已含功課）已完成=1、已打卡=0.45 */
function doneRatio(){
  const c=C(); const sc=state.schedule||[];
  if(!sc.length) return unfinishedCount()===0 ? 1 : 0;
  let d=0;
  sc.forEach(it=>{ const st=(c.sched&&c.sched[it.id])||{};
    if(st.status==='done') d+=1; else if(st.status==='checked') d+=0.45; });
  return Math.max(0, Math.min(1, d/sc.length));
}
/* 一次算出戰場幾何
   threat = 時間進度 − 完成進度：0 = 完全跟上（瞌睡怪被推到最遠），1 = 時間用光卻沒做（瞌睡怪到家門口）
   → 完成一項行程，doneR 跳升，瞌睡怪就「被實體推退」一大段，回饋非常直接。 */
function laneGeom(){
  const c=C(); const aw=activeWindow();
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const timeR = aw ? Math.max(0, Math.min(1,(nowMin-aw.start)/aw.total)) : zombieProgress();
  const push = Math.min(0.25, (c.zombiePush||0)*0.18);           // 答題打退＝額外進度加成
  const overdue = Math.min(0.20, scheduleOverdue()*0.055);       // 逾期未做＝額外威脅
  const doneR = Math.max(0, Math.min(1, doneRatio() + push));
  const threat = Math.max(0, Math.min(1, timeR - doneR + overdue));
  const gapR = doneR - timeR;                                    // >0 領先進度、<0 落後
  const gapMin = Math.round(gapR * (aw ? aw.total : 60));
  const fPct = 30 + doneR*22;                                    // 防線（植物陣線）右緣，完成越多推越外
  const zPct = Math.max(LANE_L, laneX(threat));
  return { timeR, doneR, threat, gapR, gapMin, zPct, fPct, aw, nowMin };
}
/* 時間軸尺專用：把「時刻」換算成尺上的百分比（右＝窗口開始，左＝睡覺） */
function tlX(min){ const aw=activeWindow(); if(!aw) return 50; return laneX((min-aw.start)/aw.total); }
function setSchedDoneNoRender(id, onTime){
  const c=C(); if(!c.sched) c.sched={};
  const it=state.schedule.find(x=>x.id===id); if(!it) return false;
  const wasDone=(c.sched[id]||{}).status==='done';
  c.sched[id]={status:'done', doneAt:Date.now(), onTime:onTime};
  if(it.kind==='routine' && it.routineKey){
    const rs=c.routine||(c.routine={});
    if(!rs[it.routineKey] || rs[it.routineKey].status!=='done') rs[it.routineKey]={status:'done', start:Date.now(), done:Date.now(), dur:1};
  }
  if(!wasDone && onTime){ const b=state.schedOnTime||10; c.bonusSun=(c.bonusSun||0)+b; }
  return !wasDone;
}

let megaUntil=0, heartTimer=null, battleState='playing', battleDismissed=false;
let _lastZombTick=Date.now();
function updateZombie(unfinished){
  const _now=Date.now(); const _dtSec=Math.max(0.1, Math.min(120,(_now-_lastZombTick)/1000)); _lastZombTick=_now;
  const z=$('#homeZombie'); if(!z) return;
  const st=$('#zStatus'); if(!st) return;
  const battle=$('#homeBattle');
  const c=C();
  if(z){ z.classList.remove('eating'); }
  if(battle){ battle.querySelectorAll('.lp').forEach(d=>{ d.classList.remove('shake'); d.classList.remove('dead'); }); }
  const hol=isHolidayToday();
  if(hol){
    z.style.left='94%'; z.style.right=''; z.className='zombie sleepy';
    st.textContent='🎉 今天'+hol+'，瞌睡怪放假去囉！功課可以休息～'; st.style.color='#2e7d32';
    battle.classList.remove('danger','defeated');
    if(heartTimer){ clearTimeout(heartTimer); heartTimer=null; }
    battleState='playing'; battleDismissed=false; clearOverlay();
    renderTimeline();
    return;
  }
  if(c.plantHP<=0){
    z.style.left='16%'; z.style.right=''; z.className='zombie mega';
    st.textContent='💥 防線崩潰！植物被吃掉了…明天再戰！'; st.style.color='#c0392b';
    battle.classList.add('danger','defeated');
    battle.querySelectorAll('.lp').forEach(d=>{ d.classList.remove('shake'); d.classList.add('dead'); });
    if(heartTimer){ clearTimeout(heartTimer); heartTimer=null; }
    if(battleState!=='lost'){ battleState='lost'; battleDismissed=false; }
    if(!battleDismissed) showBattleOverlay('lost');
    renderTimeline();
    return;
  }
  if(unfinished===0){
    z.style.left='94%'; z.style.right=''; z.className='zombie dazed';
    st.textContent='🎉 全部寫完！瞌睡怪被打退，植物安全！'; st.style.color='#2e7d32';
    battle.classList.remove('danger','defeated');
    if(heartTimer){ clearTimeout(heartTimer); heartTimer=null; }
    if(battleState!=='won'){ battleState='won'; battleDismissed=false; }
    if(!battleDismissed) showBattleOverlay('won');
    renderTimeline();
    return;
  }
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const {endMin}=zombieBounds(); const remainMin=endMin-nowMin;
  const overdue=scheduleOverdue();
  const mega=Date.now()<megaUntil;
  const rushing = remainMin<15 || mega || overdue>0;
  const g = laneGeom();
  const pos = g.threat;                        // 0 = 完全跟上進度，1 = 時間用光卻沒做完
  c.zombieDrift = pos;                         // 保留欄位相容（現在由時間軸推導，不再自行累加）
  z.style.left=g.zPct+'%'; z.style.right='';
  z.classList.toggle('mega', mega);
  z.classList.remove('dazed','sleepy');
  // 防線：完成越多，植物陣線往外推得越遠（看得見的物理推進）
  const defs=document.getElementById('homeDefenders'); if(defs) defs.style.width=g.fPct+'%';
  const fl=document.getElementById('homeFront'); if(fl) fl.style.left=g.fPct+'%';
  // 落後才會被啃：threat 超過 0.55 開始扣血，落後越多啃越兇（按真實秒數積分）
  if(pos>0.55){ c.plantHP=Math.max(0, c.plantHP-(pos-0.55)*(rushing?2.6:1.5)*(_dtSec/5)); }
  battle.classList.toggle('danger', pos>0.62);
  battle.classList.toggle('defeated', c.plantHP<=0);
  const eatingNow = g.zPct <= g.fPct+4 && c.plantHP>0;
  z.classList.toggle('eating', eatingNow);
  battle.querySelectorAll('.lp').forEach(d=> d.classList.toggle('shake', eatingNow));
  if(battleState!=='playing'){ battleState='playing'; battleDismissed=false; clearOverlay(); }
  const fill=$('#hpFill');
  if(fill){ fill.style.width=Math.max(0,c.plantHP)+'%'; fill.style.background=c.plantHP>50?'#2e7d32':c.plantHP>20?'#e08e0b':'#c0392b'; }
  renderTimeline(g);
  const r=todayRoutine();
  const hp='（植物 '+Math.round(c.plantHP)+'%）';
  if(overdue>0){ st.innerHTML='⚠️ 有 <b>'+overdue+'</b> 項行程超時還沒完成，瞌睡怪趁機逼近！'+hp; st.style.color='#c0392b'; }
  else if(mega){ st.textContent='👹 巨型瞌睡怪出現！快寫功課發射露珠打退牠！'+hp; st.style.color='#c0392b'; }
  else if(pos>=0.9){ st.textContent='🚨 時間快用完了，瞌睡怪已經咬到植物！快去補完行程把牠推退！'+hp; st.style.color='#c0392b'; }
  else if(pos>=0.62){ st.textContent='⚠️ 進度落後了，瞌睡怪逼近中（'+r.sleep+' 睡覺前還剩 '+fmtRemain(remainMin)+'）'+hp; st.style.color='#e08e0b'; }
  else if(g.gapMin>=5){ st.textContent='😎 進度超前！瞌睡怪被推到好遠，安心慢慢寫～'+hp; st.style.color='#2e7d32'; }
  else { st.textContent='😴 瞌睡怪在時間軸上慢慢走… 距離 '+r.sleep+' 睡覺還有 '+fmtRemain(remainMin)+'，保持進度就安全！'+hp; st.style.color='#7a6a45'; }
  setHeartbeat(pos);
  if(!mega && Math.random()<0.05 && remainMin>5 && pos<0.9){ megaUntil=Date.now()+40000; toast('👹 巨型瞌睡怪出現！'); }
}
/* ---------- 行程時間軸尺（與戰場共用一套右→左的時間座標） ---------- */
function renderTimeline(g){
  const el=document.getElementById('homeTimeline'); if(!el) return;
  g = g || laneGeom();
  const aw=g.aw; if(!aw){ el.innerHTML=''; return; }
  const c=C();
  const hhmm=(m)=>{ m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
  let marks='';
  (state.schedule||[]).forEach(it=>{
    const m=toMin(it.time);
    if(m < aw.start-5 || m > aw.end+5) return;
    const st=(c.sched&&c.sched[it.id])||{};
    const status=st.status||'todo';
    const late = status!=='done' && g.nowMin > m+(it.dur||0);
    const cls = status==='done'?'done':status==='checked'?'checked':(late?'overdue todo':'todo');
    marks += `<div class="tl-mk ${cls}" style="left:${tlX(m)}%;" title="${it.label} ${it.time}">
      <span class="tl-ic">${status==='done'?'✅':(it.emoji||'📌')}</span>
      <span class="tl-t">${it.time}</span><span class="tl-dot"></span></div>`;
  });
  const nowPct=tlX(g.nowMin);
  const frontPct=laneX(g.doneR);
  const safeW = Math.abs(nowPct-frontPct);
  const safeHTML = g.gapR>=0
    ? `<div class="tl-safe" style="left:${frontPct}%;width:${safeW}%;"></div>`
    : `<div class="tl-safe" style="left:${nowPct}%;width:${safeW}%;background:linear-gradient(90deg,#c0392b,#e08e0b);"></div>`;
  el.innerHTML = `<div class="tl-track"></div>
    ${safeHTML}
    ${marks}
    <div class="tl-now" style="left:${nowPct}%;"><b>現在 ${hhmm(g.nowMin)}</b></div>
    <div class="tl-end" style="left:6px;">💤 ${hhmm(aw.end)} 睡覺</div>
    <div class="tl-end" style="right:6px;">▶ ${hhmm(aw.start)}</div>`;
  const tag=document.getElementById('leadTag');
  if(tag){
    if(g.gapMin>=5){ tag.className='lead-tag good'; tag.textContent='😎 進度超前 '+g.gapMin+' 分鐘'; }
    else if(g.gapMin>=-5){ tag.className='lead-tag warn'; tag.textContent='⏱ 剛好跟上進度'; }
    else { tag.className='lead-tag bad'; tag.textContent='⚠️ 落後 '+Math.abs(g.gapMin)+' 分鐘，瞌睡怪逼近中'; }
  }
}

function flySunToHeader(fromEl){
  const target=document.querySelector('.sun-box .sunCount')||document.querySelector('.sun-box');
  if(!target) return;
  const fr=fromEl&&fromEl.getBoundingClientRect?fromEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const tr=target.getBoundingClientRect();
  const sx=fr.left+fr.width/2-14, sy=fr.top+fr.height/2-14;
  const dx=(tr.left+tr.width/2)-(fr.left+fr.width/2), dy=(tr.top+tr.height/2)-(fr.top+fr.height/2);
  const s=document.createElement('div');
  s.textContent='☀️';
  s.style.cssText='position:fixed;z-index:9999;font-size:28px;pointer-events:none;left:'+sx+'px;top:'+sy+'px;transition:transform .26s cubic-bezier(.45,.05,.55,1),opacity .26s;will-change:transform,opacity;';
  document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.transform='translate('+dx+'px,'+dy+'px) scale(.4)'; s.style.opacity='0'; }));
  setTimeout(()=>{ s.remove(); target.classList.add('pop'); setTimeout(()=>target.classList.remove('pop'),300); },270);
}

    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=.9;
    const vs=speechSynthesis.getVoices();

function startRoutine(key){
  const c=C(); if(!c.routine) c.routine={};
  c.routine[key]={status:'doing', start:Date.now()};
  save(); goodSound(); toast('⏱ '+routineLabel(key)+' 開始計時，完成時記得按「完成」喔'); renderHome();
}
function finishRoutine(key){
  const c=C(); if(!c.routine) c.routine={};
  const st=c.routine[key]||{status:'idle'};
  if(st.status!=='doing'){ return; }
  const dur=Math.max(1, Math.round((Date.now()-(st.start||Date.now()))/60000));
  const lim = state.routineLimit && state.routineLimit[key];
  let msg='✅ '+routineLabel(key)+' 完成，用了 '+dur+' 分鐘';
  if(lim && dur>lim){
    const step=state.routineStep||5, pen=state.routinePenalty||5;
    const deduct=Math.max(pen, Math.ceil((dur-lim)/step)*pen);
    addSun(-deduct);
    msg+='，超時 '+(dur-lim)+' 分扣 '+deduct+' 陽光 🌞';
  }
  c.routine[key]={status:'done', start:st.start, done:Date.now(), dur};
  save(); toast(msg); renderHome();
}

function tickEye(){
  const c=C(); const now=Date.now();
  if(c.studyMsDate!==dateKey()){ c.studyMs=0; c.studyMsDate=dateKey(); }
  if(c.eyeRestUntil && c.eyeRestUntil>now){
    if(isEyeTab(currentTab)) showEyeLock(c.eyeRestUntil-now); else hideEyeLock();

  }
