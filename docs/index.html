/* 開場引導：名字 → 4 張世界觀引導卡（含進度點） */
function renderOnboarding(){
  const TOUR=[
    { e:'🌻', t:'這是你的小花園', b:'你種下的食蟲植物，會一起對抗想偷走專注力的「瞌睡怪」。把牠們打退，花園就長得越好！' },
    { e:'✍️', t:'寫功課 → 賺陽光', b:'完成今天的功課並請爸媽簽名，就能獲得陽光；簽名前，也可以點首頁的植物「發射露珠」把瞌睡怪打退！' },
    { e:'🎁', t:'陽光換真獎勵', b:'把陽光存起來，到「獎勵商店」兌換爸媽設定的獎勵。小獎便宜、大獎要存很久——這就是存錢的樂趣！' },
    { e:'🚀', t:'準備出發！', b:'隨時點首頁的「❓ 怎麼玩」都能再看說明書。現在，去種下你的第一朵花吧 🌱' }
  ];
  let step = C().name ? 1 : 0;
  function paint(){
    if(step===0){
      app.innerHTML = `
      <div class="panel" style="text-align:center;">
        <h2>🌻 歡迎來到小花園</h2>
        <p class="hint">先告訴我你的名字，我們一起種下屬於你的小花園吧！</p>
        <div style="margin:20px 0;">
          <input id="nameInput" class="name-input" placeholder="輸入你的名字" maxlength="10">
        </div>
        <button class="next-btn" id="startBtn">🌱 開始種花園</button>
      </div>`;
      $('#startBtn').onclick=()=>{
        const n=$('#nameInput').value.trim();
        if(!n){ badSound(); toast('請先輸入名字喔！'); return; }
        C().name=n; save(); goodSound(); step=1; paint();
      };
      $('#nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#startBtn').click(); });
    } else {
      const i=step-1, t=TOUR[i], isLast=step===TOUR.length;
      const dots=TOUR.map((_,k)=>`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px;background:${k===i?'#7cb342':'#d9d2bf'};"></span>`).join('');
      app.innerHTML=`
      <div class="panel" style="text-align:center;">
        <div style="font-size:66px;line-height:1;margin:6px 0 8px;animation:plantBob 2.2s ease-in-out infinite;">${t.e}</div>
        <h2>${t.t}</h2>
        <p class="hint" style="font-size:15px;line-height:1.75;margin:14px 6px;">${t.b}</p>
        <div style="margin:16px 0 4px;">${dots}</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
          ${step>1?'<button class="reset-btn" id="obPrev">← 上一步</button>':''}
          <button class="next-btn" id="obNext">${isLast?'🚀 開始玩！':'下一步 →'}</button>
        </div>
      </div>`;
      const prev=$('#obPrev'); if(prev) prev.onclick=()=>{ step--; paint(); };
      $('#obNext').onclick=()=>{
        if(isLast){ state.seenTour=true; save(); showTab('home'); playIntro(); }
        else { step++; paint(); }
      };
    }
  }
  paint();
}

      wt.innerHTML=html; wt.style.display='block'; btn.textContent='📅 收起整週作息表';

  const nd=$('#newDay');

    if(confirm('開始新的一天？今日功課會重設為未完成。')){

      c.zombiePush=0; c.zombieDrift=0; c.plantHP=100; c.combo=0; c.routine={}; c.routineDate=dateKey(); save(); renderHome();
    }
  };
}

function mathRound(){
  ensureQuiz('math');
  const li=levelIdx();
  let q, ans;
  if(li<=0){ // 幼幼 3-5：10 以內加減
    const a=1+Math.floor(Math.random()*5), b=1+Math.floor(Math.random()*5);
    if(Math.random()<.5){ ans=a+b; q=''+a+' ＋ '+b+' ＝ ?'; }
    else { const hi=Math.max(a,b), lo=Math.min(a,b); ans=hi-lo; q=''+hi+' － '+lo+' ＝ ?'; }
  } else if(li===1){ // 低年級 6-8：20 以內加減、2~5 乘法
    const r=Math.random();
    if(r<0.4){ const a=1+Math.floor(Math.random()*20), b=1+Math.floor(Math.random()*20); ans=Math.max(a,b)-Math.min(a,b); q=''+Math.max(a,b)+' － '+Math.min(a,b)+' ＝ ?'; }
    else if(r<0.7){ const a=1+Math.floor(Math.random()*20), b=1+Math.floor(Math.random()*20); ans=a+b; q=''+a+' ＋ '+b+' ＝ ?'; }
    else { const a=2+Math.floor(Math.random()*4), b=2+Math.floor(Math.random()*4); ans=a*b; q=''+a+' × '+b+' ＝ ?'; }
  } else if(li===2){ // 中年級 9-10：100 以內加減、九九乘法、簡單除法
    const r=Math.random();
    if(r<0.35){ const a=10+Math.floor(Math.random()*90), b=10+Math.floor(Math.random()*90); ans=Math.max(a,b)-Math.min(a,b); q=''+Math.max(a,b)+' － '+Math.min(a,b)+' ＝ ?'; }
    else if(r<0.65){ const a=10+Math.floor(Math.random()*90), b=10+Math.floor(Math.random()*90); ans=a+b; q=''+a+' ＋ '+b+' ＝ ?'; }
    else if(r<0.85){ const a=2+Math.floor(Math.random()*8), b=2+Math.floor(Math.random()*8); ans=a*b; q=''+a+' × '+b+' ＝ ?'; }
    else { const b=2+Math.floor(Math.random()*8); const ans0=2+Math.floor(Math.random()*8); ans=ans0; q=''+(ans0*b)+' ÷ '+b+' ＝ ?'; }
  } else if(li===3){ // 高年級 11-12：兩位數×兩位數、除法、1000 加減、分數
    const r=Math.random();
    if(r<0.4){ const a=11+Math.floor(Math.random()*89), b=11+Math.floor(Math.random()*89); ans=a*b; q=''+a+' × '+b+' ＝ ?'; }
    else if(r<0.65){ const b=11+Math.floor(Math.random()*89); const ans0=2+Math.floor(Math.random()*9); ans=ans0; q=''+(ans0*b)+' ÷ '+b+' ＝ ?'; }
    else if(r<0.85){ const a=100+Math.floor(Math.random()*900), b=100+Math.floor(Math.random()*900); ans=Math.max(a,b)-Math.min(a,b); q=''+Math.max(a,b)+' － '+Math.min(a,b)+' ＝ ?'; }
    else { const a=100+Math.floor(Math.random()*900), b=100+Math.floor(Math.random()*900); ans=a+b; q=''+a+' ＋ '+b+' ＝ ?'; }
  } else { // 國中 13-15：三位數乘、兩步驟、百分比、小數
    const r=Math.random();
    if(r<0.3){ const a=101+Math.floor(Math.random()*899), b=2+Math.floor(Math.random()*9); ans=a*b; q=''+a+' × '+b+' ＝ ?'; }
    else if(r<0.55){ const b=2+Math.floor(Math.random()*9); const ans0=1+Math.floor(Math.random()*9); ans=ans0*10; q='('+(ans0*b)+' × 10) ÷ '+b+' ＝ ?'; }
    else if(r<0.78){ const pct=kPick([10,20,50]); const base=10+10*Math.floor(Math.random()*20); ans=base*pct/100; q=base+' 的 '+pct+'% 是多少？'; }
    else { const a=1+Math.floor(Math.random()*9), b=1+Math.floor(Math.random()*9), c=10+Math.floor(Math.random()*90); ans=a*b+c; q=''+a+' × '+b+' ＋ '+c+' ＝ ?'; }
  }
  $('#mq').textContent=q;
  const set=new Set([ans]); const span=Math.max(4, Math.round(Math.abs(ans)*0.12)+2);
  let k=1; while(set.size<4){ const cand=ans+(Math.floor(Math.random()*2)?k:-k); if(cand>=0) set.add(cand); if(set.size<4){ const cand2=ans+k*2; if(cand2>=0) set.add(cand2); } k++; }
  const hint=document.getElementById('mHint'); if(hint) hint.innerHTML = hintLine('慢慢算，先乘除後加減～');
  $('#mf').textContent='';
  renderChoices({ box:$('#mc'), opts:[...set], correct:ans, moduleKey:'math', sun:4, fb:$('#mf'),
    qText:q, rightMsg:'🎉 算對了！瞌睡怪被打退！', wrongPrefix:'💡 正確答案是：', compare:(o)=> +o===ans });
}

    <div id="readBox"></div>
    ${completeBtnHTML()}
  </div>`;

function splitStory(text){
  // 依句號/驚嘆/問號切句，再依年齡檔每 N 句併成一段（不標段落編號，純分段落）
  const lvl = readLevelKey();
  const per = lvl==='toddler' ? 2 : (lvl==='advanced' ? 4 : 3);
  const sentences = (text||'').match(/[^。！？!?]*[。！？!?]|[^。！？!?]+$/g) || [text||''];
  const paras=[];
  for(let i=0;i<sentences.length;i+=per){ paras.push(sentences.slice(i,i+per).join('')); }
  return paras.map((p)=>`<p style="margin:10px 0;line-height:1.9;">${p}</p>`).join('');
}
function renderReadInto(boxId,subjectKey,stories){
  const arr = (stories && stories.length) ? stories : READING.basic[subjectKey];
  let idx = readIdx[subjectKey]||0; if(idx>=arr.length) idx=0;
  const s=arr[idx];
  const box=$('#'+boxId);
  const big = readLevelKey()==='toddler' ? ' style="font-size:22px;line-height:2.1;"' : '';
  box.innerHTML=`
    <div class="story"${big}>${splitStory(s.text)}</div>
    <div style="margin:10px 0;"><button class="reset-btn" id="spkStory">🔊 朗讀故事</button></div>
    <div id="rqq"></div>
    <button class="next-btn" id="rn">換一篇故事 ▶</button>`;
  $('#spkStory').onclick=()=>speak(plainText(s.text));
  const qb=$('#rqq');
  s.q.forEach((item,qi)=>{
    const wrap=document.createElement('div'); wrap.style.margin='16px 0';
    wrap.innerHTML=`<div style="font-weight:800;font-size:17px;">Q${qi+1}. ${item.q}</div>`;
    const ch=document.createElement('div'); ch.className='choices';
    // 隨機打散選項順序，避免正解永遠出現在第一個
    const order = item.a.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
    const newCorrect = order.indexOf(item.c);
    order.forEach((origIdx,dispIdx)=>{
      const ans=item.a[origIdx];
      const b=document.createElement('button'); b.className='choice'; b.textContent=ans;
      b.onclick=()=>{
        $$('.choice',ch).forEach(x=>x.disabled=true);
        if(dispIdx===newCorrect){ b.classList.add('correct'); const ps=practiceSun(5, subjectKey); goodSound(); addSun(ps); onCorrect(ps); record(subjectKey,true); }
        else{ b.classList.add('wrong'); badSound(); logWrong(subjectKey,item.q,ans,item.a[item.c],item.a); record(subjectKey,false);
          $$('.choice',ch).forEach(x=>{ if(x.textContent===item.a[item.c]) x.classList.add('correct'); }); }
      };
      ch.appendChild(b);
    });
    wrap.appendChild(ch); qb.appendChild(wrap);
  });
  $('#rn').onclick=()=>{ let n; do{ n=Math.floor(Math.random()*arr.length); }while(arr.length>1 && n===idx); readIdx[subjectKey]=n; renderReadInto(boxId,subjectKey,stories); };
}

function enWordQuestion(li){
  li=li||0;

  const w=kPick(pool);
  if(li<=0 || (li===1 && Math.random()<0.6)){
    const correct=w.zh; const opts=new Set([correct]);
    while(opts.size<4){ const o=kPick(pool).zh; if(o!==correct) opts.add(o); }
    return {type:'choice', q:'英文「'+w.en+'」是什麼意思？', opts:[...opts], ans:correct, hint:'點 🔊 聽聽「'+w.en+'」的發音。', en:w.en};
  }
  const opts=new Set([w.en]);
  while(opts.size<4){ const o=kPick(pool).en; if(o!==w.en) opts.add(o); }
  return {type:'choice', q:'「'+w.zh+'」的英文是？', opts:[...opts], ans:w.en, hint:'想想學過的單字。', en:w.en};
}

function readingQuestion(li, single){
  li = li==null ? levelIdx() : li;

}
function genEnglishQ(li, single){
  li=li==null?levelIdx():li;
  if(enMode==='word') return enWordQuestion(li);
  if(enMode==='grammar') return grammarQuestion();
  if(enMode==='reading') return readingQuestion(li, single);
  if(li<=0) return enWordQuestion(li);
  if(li===1) return Math.random()<0.7 ? enWordQuestion(1) : grammarQuestion();
  if(li===2) return Math.random()<0.4 ? enWordQuestion(2) : (Math.random()<0.6 ? grammarQuestion() : readingQuestion(2, single));
  if(li===3) return Math.random()<0.3 ? grammarQuestion() : readingQuestion(3, single);
  return Math.random()<0.2 ? grammarQuestion() : readingQuestion(4, single);
}

/* 自訂題庫：解析題目文字（支援 | / 逗號CSV / Tab 三種分隔） */
function splitCsvLine(line, delim){
  if(delim===','){ // 處理引號括住的欄位
    const out=[]; let cur='', q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===',') out.push(cur), cur=''; else cur+=ch; }
    }
    out.push(cur); return out.map(s=>s.trim());
  }
  return line.split(delim).map(s=>s.trim());
}
function parseQuestions(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const first=lines[0];
  let delim='|';
  if(first.indexOf('\t')>=0) delim='\t';
  else if(first.indexOf('|')>=0) delim='|';
  else if(first.indexOf(',')>=0) delim=',';
  const qs=[];
  lines.forEach(line=>{
    const parts=splitCsvLine(line, delim);
    if(parts.length<2) return;
    const q=parts[0], a=parts[1];
    const opts=parts.slice(2).filter(Boolean);
    qs.push({q,a,opts});
  });
  return qs;
}

/* 题库去重：按题面（忽略大小写/前后空白）去重，保留首次出现，顺序不变 */
function dedupQuestions(qs){
  if(!Array.isArray(qs)) return [];
  const seen=new Set(), out=[];
  qs.forEach(it=>{ if(!it||it.q==null) return; const k=String(it.q).trim().toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push(it); });
  return out;
}

/* 小型出題輔助 */
function kPick(a){ return a[Math.floor(Math.random()*a.length)]; }
function kShuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* 產生 n 個選項（含正解），其餘從 pool 抽，最後用 ±k 兜底 */
function kOpts(correct, pool, n){
  n=n||4; const set=new Set([String(correct)]);
  const p=(pool||[]).map(String).filter(x=>x!==String(correct));
  while(set.size<n && p.length){ set.add(p.splice(Math.floor(Math.random()*p.length),1)[0]); }
  let k=1; while(set.size<n){ const v=String(Number(correct)+k); if(v!==String(correct)) set.add(v); k++; }
  return kShuf([...set]);
}

function zhuyinL4(){
  const all=IDIOMS.map(x=>x.m);
  const it=kPick(IDIOMS);
  const r=Math.random();
  if(r<0.75){
    const correct=it.m;
    const pool=all.filter(x=>x!==correct);
    return {type:'choice', q:'成語「'+it.c+'」的意思是？', opts:kOpts(correct, pool, 3), ans:correct, hint:'想一想這個成語在說什麼。'};
  }

function genKnowledgeQ(subject, li){
  if(li===undefined||li===null) li=levelIdx();
  const arr=KNOW_GEN[subject]||KNOW_GEN.num;
  const fn=arr[Math.min(li, arr.length-1)];
  const q=fn();
  const g=KNOW_GRADE[subject];
  if(g) q.grade = g.book+' '+g.g[Math.min(li, g.g.length-1)];
  return q;
}

    award('quiz1');
    app.innerHTML=`<div class="panel" style="text-align:center;">
      <h2>🎉 ${subjectName(subject)} 練習完成！</h2>
      <p style="font-size:18px;font-weight:800;">共 ${total} 題，答對 ${right} 題（${pct}%）</p>

      <button class="reset-btn" id="khome2">🌻 回小花園</button>
    </div>`;
    $('#kagain').onclick=()=>renderKnowledge(subject);
    $('#khome2').onclick=renderHome;
  };
  const next=()=>{ idx++; if(idx>=total) return knowDone(); renderOne(); };
  const renderOne=()=>{

function renderKDiffSel(subject){
  const box=document.getElementById('kDiffSel'); if(!box) return;
  const cur=(C().subjectDiff && C().subjectDiff[subject])||'';
  box.innerHTML='<span class="diff-lab">題目難度：</span>'+KNOW_DIFF_OPTS.map(o=>{
    const act=(o.k===cur)?' active':'';
    return '<button class="diff-btn'+act+'" data-k="'+o.k+'">'+o.t+'</button>';
  }).join('');
  const det=document.getElementById('kDiffDetail');
  if(det){
    if(cur){
      const o=KNOW_DIFF_OPTS.find(x=>x.k===cur);
      det.innerHTML = '📚 目前：<b>'+o.t+'</b> <span class="q-grade">'+o.short+'</span> — 題目難度鎖定「'+o.label+'」';
    } else {
      det.innerHTML = '📚 目前：自動（依年齡 '+LEVEL_ORDER[levelIdx()]+'）';

  box.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.k;

      c.subjectDiff[subject]=k; save();

function customRound(bank){
  ensureQuiz('custom');
  const qs=bank.questions; if(!qs.length){ $('#customBox').innerHTML='<p>這份題庫還沒有題目，請家長到後台新增。</p>'; return; }
  const idx = (bank._idx=(bank._idx||0));
  const item=qs[idx%qs.length];
  const q=item.q; const correct=item.a; const opts=(item.opts&&item.opts.length?item.opts.slice():[correct]).slice();
  if(!opts.includes(correct)) opts.push(correct);
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  const box=document.createElement('div');
  box.innerHTML=`<div class="q-row"><span class="q-text">${q}</span></div><div class="choices" id="cust"></div><div class="feedback" id="custF"></div><button class="next-btn" id="custN">下一題 ▶</button>`;
  const target=$('#customBox'); target.innerHTML=''; target.appendChild(box);
  $('#custN').onclick=()=>{ bank._idx=(bank._idx||0)+1; customRound(bank); };
  renderChoices({ box:$('#cust'), opts, correct, moduleKey:'custom', sun:5, fb:$('#custF'),
    qText:q, rightMsg:'🎉 答對了！', wrongPrefix:'💡 正確是：', onRight:()=>{ checkBadges(); award('custom'); } });
}
function renderCustomList(){

/* 錯題本 */
function renderReview(){
  const c=C(); const wrong=c.wrongQuestions||[];
  if(!wrong.length){
    app.innerHTML=`<div class="panel"><h2>📕 錯題本</h2>
      <div class="story" style="border-left-color:#2e7d32;text-align:center;padding:30px;">🎉 目前沒有錯題，你太厲害了！<br>答錯的題目會自動出現這裡，練到答對就能剋服它。</div>
      <div style="text-align:center;margin-top:12px;"><button class="next-btn" onclick="showTab('home')">🌻 回小花園</button></div></div>`;
    return;
  }
  const idx=(c._reviewIdx=(c._reviewIdx||0))%wrong.length;
  const item=wrong[idx];
  const opts=(item.opts&&item.opts.length?item.opts.slice():[item.correct]).slice();
  if(!opts.includes(item.correct)) opts.push(item.correct);
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  app.innerHTML=`
  <div class="panel">
    <h2>📕 錯題本（${wrong.length} 題待練）</h2>
    <p class="hint">把之前的錯題練到答對，就能把它從錯題本刪除，還能解鎖「錯題剋星」徽章！答對 +5 陽光。</p>
    <div class="q-row"><span class="q-text">${item.q}</span></div>
    <div class="choices" id="rv"></div>
    <div class="feedback" id="rvF"></div>
    <button class="next-btn" id="rvN">下一題 ▶（${idx+1}/${wrong.length}）</button>
  </div>`;
  const box=$('#rv');
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o;
    b.onclick=()=>{
      $$('.choice',box).forEach(x=>x.disabled=true);
      if(o===item.correct){
        const ps=practiceSun(5,'review'); b.classList.add('correct'); goodSound(); addSun(ps); onCorrect(ps); record('review',true); award('fixwrong');
        c.wrongQuestions=c.wrongQuestions.filter(w=>w!==item); save();
        $('#rvF').textContent='🎉 答對了！這題已從錯題本移除。';
      } else {
        b.classList.add('wrong'); badSound(); logWrong(item.module,item.q,o,item.correct,opts); record('review',false);
        $$('.choice',box).forEach(x=>{ if(x.textContent===item.correct) x.classList.add('correct'); });
        $('#rvF').textContent='💡 正確是：'+item.correct;
      }
    };
    box.appendChild(b);
  });
  $('#rvN').onclick=()=>{ c._reviewIdx=(c._reviewIdx||0)+1; save(); renderReview(); };
}

function renderShop(){
  const rewards=state.rewards; const c=C();
  let html=`<div class="panel">
    <h2>🎁 獎勵商店</h2>
    <p class="hint">用你賺來的陽光，兌換現實中的獎勵！請找爸媽幫你發放喔。</p>
    <div style="margin-bottom:10px;"><span class="sun-box" style="position:static;display:inline-flex;"><span class="sun-emoji">☀️</span><span class="sunCount">${c.sun}</span> 陽光</span></div>
    <div id="rewardList"></div>`;
  if(rewards.length===0) html+=`<p style="color:#9a7b2e;">還沒有獎勵喔，請家長到「家長後台」新增真實獎勵。</p>`;
  html+=`</div>`;
  app.innerHTML=html;
  const list=$('#rewardList');
  rewards.forEach(r=>{
    const div=document.createElement('div'); div.className='reward';
    const status = r.status || 'none';
    if(status==='approved'){
      div.innerHTML=`<div><div class="nm">🎁 ${r.name}${tierBadge(r.tier||rewardTier(r.cost))}</div><div class="cost" style="color:#2e7d32;">✅ 已發放，去跟爸媽拿獎勵！</div></div>`;
    } else if(status==='pending'){
      div.innerHTML=`<div><div class="nm">🎁 ${r.name}${tierBadge(r.tier||rewardTier(r.cost))}</div><div class="cost" style="color:#e08e0b;">⏳ 申請中，請找爸媽確認發放</div></div>`;
    } else {
      const can = c.sun>=r.cost;
      div.innerHTML=`<div><div class="nm">${r.name}${tierBadge(r.tier||rewardTier(r.cost))}</div><div class="cost">💰 ${r.cost} 陽光</div></div>
        <button class="next-btn" ${can?'':'disabled'}>兌換</button>`;
      const btn=div.querySelector('button');
      if(can) btn.onclick=()=>{
        c.sun-=r.cost; r.status='pending'; save();
        $$('.sunCount').forEach(e=>e.textContent=c.sun);
        goodSound(); toast('📨 申請送出！請找爸媽在後台確認發放'); renderShop();
      };
    }
    list.appendChild(div);
  });
}

    <p class="hint">孩子點兌換後變「申請中」，要由家長「確認發放」才正式給出。</p>
    ${rewardMgmt}

    <h2 style="margin-top:18px;font-size:17px;">🔐 密碼與安全</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="reset-btn" id="chgPin">✏️ 修改密碼</button>
      <button class="reset-btn" id="toggleLock">${state.sleepLock?'🔒 睡覺後鎖定：開':'🔓 睡覺後鎖定：關'}</button>
      <button class="reset-btn" id="notifBtn">🔔 通知提醒：${notifStatus}</button>
    </div>

    <h2 style="margin-top:18px;font-size:17px;">👀 護眼強制休息</h2>
    <p class="hint">孩子連續練習（小考／練習）滿 ${state.quizLimitMin} 分鐘，會自動鎖定螢幕 ${state.restMin} 分鐘，強迫眼睛休息；倒數結束才解鎖（家長可輸入密碼提前解鎖）。</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <button class="reset-btn" id="toggleEye">${state.eyeRestOn?'🔒 護眼鎖定：開':'🔓 護眼鎖定：關'}</button>
      <label>練習時限：<input id="quizLimit" type="number" min="1" max="120" value="${state.quizLimitMin}" style="width:64px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 分</label>
      <label>強制休息：<input id="restMin" type="number" min="1" max="60" value="${state.restMin}" style="width:64px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 分</label>
    </div>

    <div style="margin-top:18px;background:linear-gradient(135deg,#e9f8ef,#e3f1ff);border:2px solid #2e9e5b;border-radius:14px;padding:14px;">
      <div style="font-size:18px;font-weight:800;color:#1b7a40;margin-bottom:3px;">🛡 一鍵備份 / 還原</div>
      <p class="hint" style="margin:0 0 10px;color:#3a6b4a;">每次更新前先備份一次：換手機、清快取、或分享連結變動時，都能從檔案還原。檔案只存在你自己的裝置，不上傳。</p>
      <button id="exportBtn" style="width:100%;font-size:16px;font-weight:800;padding:14px;border:none;border-radius:10px;background:#2e9e5b;color:#fff;cursor:pointer;box-shadow:0 3px 0 #1b7a40;">💾 一鍵備份（下載存檔檔案）</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;">
        <input type="file" id="importFile" accept="application/json" style="display:none;">
        <button class="reset-btn" id="importBtn" style="flex:1;min-width:140px;">⬆️ 從備份檔還原</button>
        <span id="backupTip" style="flex:2;min-width:160px;font-size:12px;color:#6b8a76;"></span>
      </div>
    </div>

    <h2 style="margin-top:18px;font-size:17px;">📅 每週作息設定（星期一到日）</h2>
    <p class="hint">每天各自設定 起床 / 吃飯 / 洗澡 / 睡覺。起床＝瞌睡怪出發、睡覺＝瞌睡怪截止（自動聯動）。</p>
    <div style="overflow-x:auto;">
    <table style="border-collapse:collapse;width:100%;font-size:13px;">
      <tr><th style="padding:4px;text-align:left;">星期</th><th style="padding:4px;">🌞 起床</th><th style="padding:4px;">🍚 吃飯</th><th style="padding:4px;">🛁 洗澡</th><th style="padding:4px;">💤 睡覺</th></tr>
      ${weekRows}
    </table></div>
    <div style="margin-top:10px;"><button class="next-btn" id="saveWeek">💾 儲存整週作息</button></div>

    <h2 style="margin-top:18px;font-size:17px;">⏱ 作息扣分設定</h2>
    <p class="hint">孩子首頁點「開始」再點「完成」某項作息，系統會算花了多少分鐘。超過允許時間就扣陽光（例如吃飯吃太久）。</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <label>🍚 吃飯允許：<input id="limEat" type="number" min="1" value="${state.routineLimit.eat}" style="width:60px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 分</label>
      <label>🛁 洗澡允許：<input id="limBath" type="number" min="1" value="${state.routineLimit.bath}" style="width:60px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 分</label>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;">
      <label>每超過 <input id="rStep" type="number" min="1" value="${state.routineStep}" style="width:50px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 分</label>
      <label>扣 <input id="rPen" type="number" min="1" value="${state.routinePenalty}" style="width:50px;border:2px solid #c9b98a;border-radius:8px;padding:4px;"> 陽光</label>
      <button class="next-btn" id="saveRoutineSet">💾 儲存扣分設定</button>
    </div>
    <h2 style="margin-top:18px;font-size:17px;">🎉 今天放假嗎？</h2>
    <div style="margin-top:8px;">
      <button class="next-btn" id="toggleHol">${isManualToday?'↩ 取消今天放假（改上課）':'✅ 標記今天放假（休息一天）'}</button>
      <span style="margin-left:8px;color:#2e7d32;font-weight:800;">目前：${holNow?holNow:'要上課'}</span>
    </div>

    <h2 style="margin-top:18px;font-size:17px;">📋 匯出紀錄</h2>
    <textarea id="export" readonly>${summary}</textarea>
    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="next-btn" id="copyBtn">📋 複製紀錄</button>
      <button class="reset-btn" id="lockBtn">🔒 鎖定後台</button>
    </div>
  </div>`;

  /* handlers：獎勵 */
  state.rewards.forEach(r=>{
    const d=$('#del'+r.id); if(d) d.onclick=()=>{ state.rewards=state.rewards.filter(x=>x.id!==r.id); save(); renderParent(); };
    const ap=$('#appr'+r.id); if(ap) ap.onclick=()=>{ r.status='approved'; save(); goodSound(); toast('✅ 已確認發放：'+r.name); renderParent(); };
    const j=$('#rej'+r.id); if(j) j.onclick=()=>{ r.status='none'; c.sun+=r.cost; save(); $$('.sunCount').forEach(e=>e.textContent=c.sun); toast('↩ 已退回，陽光已歸還'); renderParent(); };
    const e=$('#edt'+r.id); if(e) e.onclick=()=>{ editingRewardId=r.id; const n=$('#rName'),cc2=$('#rCost'); if(n) n.value=r.name; if(cc2) cc2.value=r.cost; renderParent(); };
  });
  const addPreset=$('#addPreset'); if(addPreset) addPreset.onclick=()=>{
    const have=new Set(state.rewards.map(r=>r.name));
    let added=0;
    PRESET_REWARDS.forEach(p=>{ if(!have.has(p.name)){ state.rewards.push({id:'r'+Date.now()+'_'+added, name:p.name, cost:p.cost, tier:p.tier, status:'none'}); added++; } });
    save(); renderParent();
    toast(added? ('🎁 已加入 '+added+' 個梯度獎勵（小 / 中 / 大獎都有）') : '梯度獎勵都已經在清單裡囉');
  };
  $('#addReward').onclick=()=>{
    const name=$('#rName').value.trim(); const cost=parseInt($('#rCost').value);
    if(!name||!cost||cost<=0){ toast('請填寫獎勵名稱與正確陽光數'); return; }
    if(editingRewardId){ const r=state.rewards.find(x=>x.id===editingRewardId); if(r){ r.name=name; r.cost=cost; r.tier=rewardTier(cost); } editingRewardId=null; toast('✅ 獎勵已更新'); }
    else { state.rewards.push({id:'r'+Date.now(), name, cost, tier:rewardTier(cost), status:'none'}); toast('🎁 已新增獎勵'); }
    save(); renderParent();
  };
  const ce=$('#cancelEdit'); if(ce) ce.onclick=()=>{ editingRewardId=null; renderParent(); };
  const cc=$('#clearClaimed'); if(cc) cc.onclick=()=>{
    state.rewards.forEach(r=>{ if((r.status||'none')==='pending'){ c.sun+=r.cost; } r.status='none'; });
    save(); $$('.sunCount').forEach(e=>e.textContent=c.sun); renderParent();
  };

  /* handlers：功課簽名 */
  pendingHW.forEach(it=>{
    const ok=$('#signOK'+it.id); if(ok) ok.onclick=()=>{ approveHomework(it.id); renderParent(); };
    const no=$('#signNO'+it.id); if(no) no.onclick=()=>{ rejectHomework(it.id); renderParent(); };
  });

  /* handlers：功課清單 */
  state.homeworkList.forEach((it,idx)=>{
    const n=$('#hwN'+it.id); if(n) n.onchange=()=>{ it.name=n.value.trim()||it.name; save(); renderParent(); };
    const t=$('#hwT'+it.id); if(t) t.onchange=()=>{ it.type=t.value; save(); renderParent(); };
    const up=$('#up'+it.id); if(up && idx>0) up.onclick=()=>{ const a=state.homeworkList; [a[idx-1],a[idx]]=[a[idx],a[idx-1]]; save(); renderParent(); };
    const dn=$('#dn'+it.id); if(dn && idx<state.homeworkList.length-1) dn.onclick=()=>{ const a=state.homeworkList; [a[idx+1],a[idx]]=[a[idx],a[idx+1]]; save(); renderParent(); };
    const del=$('#delhw'+it.id); if(del) del.onclick=()=>{
      if(state.homeworkList.length<=1){ toast('至少要保留一項功課喔！'); return; }
      delete c.homework[it.id]; state.homeworkList=state.homeworkList.filter(x=>x.id!==it.id);
      if(currentHWId===it.id) currentHWId=null; save(); renderParent();
    };
  });
  const ah=$('#addHw'); if(ah) ah.onclick=()=>{
    const nm=$('#newHwName').value.trim(); const ty=$('#newHwType').value;
    if(!nm){ toast('請填寫功課名稱'); return; }
    const id='h'+Date.now();
    state.homeworkList.push({id,name:nm,type:ty}); c.homework[id]=false; save(); renderParent();
  };
  if(editingRewardId){ const er=state.rewards.find(x=>x.id===editingRewardId); if(er){ const n=$('#rName'),cc2=$('#rCost'); if(n) n.value=er.name; if(cc2) cc2.value=er.cost; } }

  /* handlers：自訂題庫 */
  state.customBanks.forEach(b=>{
    const d=$('#delbank'+b.id); if(d) d.onclick=()=>{
      state.customBanks=state.customBanks.filter(x=>x.id!==b.id);
      state.homeworkList=state.homeworkList.filter(x=>!(x.type==='custom'&&x.bankId===b.id));
      save(); renderParent();
    };
  });
  const ab=$('#addBank'); if(ab) ab.onclick=()=>{
    const nm=$('#bankName').value.trim(); const txt=$('#bankText').value.trim();
    if(!nm||!txt){ toast('請填寫題庫名稱與題目'); return; }
    const questions=parseQuestions(txt);
    if(!questions.length){ toast('沒有解析到題目，請檢查格式'); return; }
    const qBefore=questions.length, questions2=dedupQuestions(questions), qRemoved=qBefore-questions2.length;
    const bid='b'+Date.now();
    state.customBanks.push({id:bid, name:nm, questions:questions2});
    const hid='hc'+Date.now();
    state.homeworkList.push({id:hid, name:'題庫：'+nm, type:'custom', bankId:bid});
    c.homework[hid]=false; save(); toast('📚 題庫已新增（'+questions2.length+' 題'+(qRemoved? '，已移除 '+qRemoved+' 題重複': '')+'）'); renderParent();
  };
  const ub=$('#upBank'); if(ub) ub.onclick=()=>$('#bankFile').click();
  const bf=$('#bankFile');
  if(bf) bf.onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const nm=prompt('請輸入這份題庫的名稱：', f.name.replace(/\.[^.]+$/,''));
    if(nm===null) return;
    const name=nm.trim()||f.name;
    const rd=new FileReader();
    rd.onload=()=>{
      const text=String(rd.result).replace(/^﻿/,''); // 去 BOM
      const questions=parseQuestions(text);
      if(!questions.length){ toast('沒有解析到題目，請檢查格式（建議另存 CSV UTF-8）'); return; }
      const qBefore=questions.length, questions2=dedupQuestions(questions), qRemoved=qBefore-questions2.length;
      const bid='b'+Date.now();
      state.customBanks.push({id:bid, name, questions:questions2});
      const hid='hc'+Date.now();
      state.homeworkList.push({id:hid, name:'題庫：'+name, type:'custom', bankId:bid});
      c.homework[hid]=false; save(); toast('📚 已上傳題庫：'+name+'（'+questions2.length+' 題'+(qRemoved? '，已移除 '+qRemoved+' 題重複': '')+'）'); renderParent();
    };
    rd.readAsText(f, 'utf-8');
    e.target.value='';
  };

  /* handlers：孩子檔案 */
  state.children.forEach(ch=>{
    const sw=$('#sw'+ch.id); if(sw && ch.id!==state.activeChildId) sw.onclick=()=>{ state.activeChildId=ch.id; dailyResetIfNeeded(); save(); renderParent(); };
    const dc=$('#delch'+ch.id); if(dc && state.children.length>1) dc.onclick=()=>{
      if(!confirm('刪除「'+(ch.name||'孩子')+'」的檔案？此動作無法復原。')) return;
      state.children=state.children.filter(x=>x.id!==ch.id);
      if(state.activeChildId===ch.id) state.activeChildId=state.children[0].id;
      save(); renderParent();
    };
    const ai=$('#age'+ch.id); if(ai) ai.onchange=()=>{ const v=Number(ai.value)||7; ch.age=Math.min(15,Math.max(3,v)); ch.levelOverride=''; save(); renderParent(); toast('🎚 '+ch.name+' 年齡設為 '+ch.age+' 歲（'+DIFF_MAP[childLevel(ch)].name+'）'); };
  });
  const ac=$('#addChild'); if(ac) ac.onclick=()=>{
    const nm=$('#newChild').value.trim(); if(!nm){ toast('請填寫孩子名字'); return; }
    const ch=defaultChild(nm); state.children.push(ch); state.activeChildId=ch.id; save(); toast('👦 已新增孩子：'+nm); renderParent();
  };

  /* handlers：密碼 / 鎖定 / 通知 */
  $('#chgPin').onclick=()=>{
    const old=prompt('請輸入目前密碼：'); if(old!==state.parentPIN){ toast('目前密碼錯誤'); return; }
    const np=prompt('請輸入新密碼（數字，最多 6 位）：'); if(!np||!/^\d{1,6}$/.test(np)){ toast('密碼格式不正確'); return; }
    state.parentPIN=np; save(); toast('🔐 密碼已修改');
  };
  $('#toggleLock').onclick=()=>{ state.sleepLock=!state.sleepLock; save(); renderParent(); };
  $('#toggleEye').onclick=()=>{ state.eyeRestOn=!state.eyeRestOn; save(); renderParent(); };
  const ql=$('#quizLimit'); if(ql) ql.onchange=(e)=>{ const v=Math.max(1,Math.min(120,parseInt(e.target.value)||30)); state.quizLimitMin=v; save(); renderParent(); };
  const rm=$('#restMin'); if(rm) rm.onchange=(e)=>{ const v=Math.max(1,Math.min(60,parseInt(e.target.value)||10)); state.restMin=v; save(); renderParent(); };
  $('#notifBtn').onclick=()=>{
    if(!('Notification' in window)){ toast('此瀏覽器不支援通知'); return; }
    if(Notification.permission==='granted'){ toast('通知已開啟'); }
    else if(Notification.permission==='denied'){ toast('通知被瀏覽器封鎖，請在網址列解除'); }
    else { Notification.requestPermission().then(p=>{ toast(p==='granted'?'🔔 通知已開啟':'通知未開啟'); renderParent(); }); }
  };

  /* handlers：備份 / 還原 */
  $('#exportBtn').onclick=()=>{
    try{
      const data=JSON.stringify(state); const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a');
      const d=new Date(), pad=n=>String(n).padStart(2,'0');
      const stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
      const fname='知識小花園-備份-'+stamp+'.json';
      a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      const tip=$('#backupTip'); if(tip) tip.textContent='✅ 已下載：'+fname+'（請留好在手機/電腦裡）';
      toast('💾 備份檔已下載');
    }catch(e){ toast('⚠️ 備份失敗：'+e.message); }
  };
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(s&&Array.isArray(s.children)){ state=s; parentUnlocked=false; save(); toast('✅ 存檔已還原'); showTab('home'); } else toast('檔案格式不正確'); }catch(err){ toast('讀取失敗'); } };
    rd.readAsText(f);
  };

  /* handlers：每週作息 / 放假 */
  const sw=$('#saveWeek'); if(sw) sw.onclick=()=>{
    const wr=defaultWeekRoutine();
    for(let i=0;i<7;i++){
      const wake=$('#w'+i+'_wake').value, eat=$('#w'+i+'_eat').value, bath=$('#w'+i+'_bath').value, sleep=$('#w'+i+'_sleep').value;
      if(!wake||!eat||!bath||!sleep){ toast('請把星期'+(i+1)+'的四個時間都填好'); return; }
      wr[i]={wake,eat,bath,sleep};
    }
    state.weekRoutine=wr; save(); goodSound(); toast('📅 整週作息已儲存'); renderParent();
  };
  const srs=$('#saveRoutineSet'); if(srs) srs.onclick=()=>{
    const eat=parseInt($('#limEat').value)||40, bath=parseInt($('#limBath').value)||30;
    const step=parseInt($('#rStep').value)||5, pen=parseInt($('#rPen').value)||5;
    state.routineLimit={eat,bath}; state.routineStep=step; state.routinePenalty=pen; save();
    goodSound(); toast('⏱ 作息扣分設定已儲存'); renderParent();
  };
  const th=$('#toggleHol'); if(th) th.onclick=()=>{
    const k=dateKey(); const arr=state.manualHolidays||(state.manualHolidays=[]);
    if(arr.includes(k)){ state.manualHolidays=arr.filter(x=>x!==k); toast('↩ 今天改為要上課'); }
    else { arr.push(k); toast('🎉 今天標記為放假'); }
    save(); renderParent();
  };
  $('#copyBtn').onclick=()=>{ const ta=$('#export'); ta.select(); try{ navigator.clipboard.writeText(ta.value); toast('已複製！'); }catch(e){ document.execCommand('copy'); toast('已複製！'); } };
  $('#lockBtn').onclick=()=>{ parentUnlocked=false; renderParent(); };
}

/* 近 7 天練習時間 SVG 圖表 */
function weekChartSVG(c){
  const days=[]; let max=1;
  for(let i=6;i>=0;i--){ const k=dateKey(-i); const sec=c.timeByDate[k]||0; const min=Math.round(sec/60); days.push({k:k.slice(5),min}); if(min>max) max=min; }
  const w=560, h=160, bw=w/7*0.6, gap=w/7;
  let bars='';
  days.forEach((d,i)=>{
    const bh=Math.max(4, d.min/max*(h-30));
    const x=i*gap+gap/2-bw/2, y=h-20-bh;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="#4caf50"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-4}" font-size="11" text-anchor="middle" fill="#3a2f1b">${d.min}分</text>`;
    bars+=`<text x="${x+bw/2}" y="${h-4}" font-size="11" text-anchor="middle" fill="#7a6a45">${d.k}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:560px;background:#fffaf0;border-radius:10px;padding:6px;">${bars}</svg>`;
}

$$('.tab-btn').forEach(b=> b.onclick=()=>showTab(b.dataset.tab));
applyActiveSubjects();
applySubjectIcons();
if(!C().name){ renderOnboarding(); }
else { showTab('home'); playIntro(); }

  const resumeBgm=()=>{ startBgm(); document.removeEventListener('pointerdown',resumeBgm); };
  document.addEventListener('pointerdown',resumeBgm);
}
