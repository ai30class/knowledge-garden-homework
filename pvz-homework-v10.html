  return s || null;
}

/* ---------- 讀書計劃 ----------
   跟「功課清單」的分工：功課清單＝學校出的作業（每天重設、家長簽名 +30）；
   這裡＝家長排的自修／測驗卷／評量複習進度（不重設、有到期日、孩子自己勾、+10）。
   三層結構：科目（可自訂）→ 教材（自修/測驗卷/評量…）→ 課次（含課名）。
   全部綁 childId，因為兄弟姊妹的學校進度不同。 */
const STUDY_ITEM_SUN = 10;        /* 當天前 STUDY_FULL_COUNT 筆的全額 */
const STUDY_FULL_COUNT = 6;       /* 前 6 筆全額，之後遞減 */
const STUDY_ITEM_SUN_LOW = 3;     /* 第 7 筆起 */
/* 考前衝刺期排程會把大量課次擠在同幾天（實測考前3天可達 17 筆/日），
   若每筆都給全額會撞上 SUN_DAILY_CAP、反而在最需要鼓勵時中斷回饋，
   也會稀釋獎勵梯度。改成沿用練習場那套遞減邏輯。 */
function studyDoneToday(c){
  if(c.studyDoneDate!==dateKey()){ c.studyDoneDate=dateKey(); c.studyDoneCount=0; }
  return c.studyDoneCount||0;
}
function studySunFor(n){ return n < STUDY_FULL_COUNT ? STUDY_ITEM_SUN : STUDY_ITEM_SUN_LOW; }
/* 下一筆完成可以拿多少（給畫面提示用） */
function studyNextSun(){ return studySunFor(studyDoneToday(C())); }
function studyPlan(){
  let sp=state.studyPlan;
  if(!sp || typeof sp!=='object'){ sp=state.studyPlan={}; }
  if(!Array.isArray(sp.subjects)) sp.subjects=[];
  if(!Array.isArray(sp.items)) sp.items=[];
  if(!Array.isArray(sp.exams)) sp.exams=[];
  return sp;
}
function studySubjectsOf(childId){ return studyPlan().subjects.filter(s=>s.childId===childId); }
function studySubjectById(id){ return studyPlan().subjects.find(s=>s.id===id)||null; }
function studyItems(){ return studyPlan().items; }
function studyItemsOf(childId){ return studyItems().filter(it=>it.childId===childId); }
function studyItemsOfSubject(subjectId){ return studyItems().filter(it=>it.subjectId===subjectId); }
/* 某科底下有哪些教材（依建立順序） */
function studyMaterialsOf(subjectId){
  const seen=[];
  studyItemsOfSubject(subjectId).forEach(it=>{ if(!seen.includes(it.material)) seen.push(it.material); });
  return seen;
}
function studyItemsOfMaterial(subjectId, material){
  const list=studyItemsOfSubject(subjectId).filter(it=>it.material===material);
  ensureSeq(list);
  return list.sort((a,b)=> a.seq-b.seq);
}
/* seq＝這本教材裡的排列順序（跟課號分開，才能自由插隊與上下移動）。
   舊資料沒有 seq 時，依原本的 (課號, part) 順序補上。 */
function ensureSeq(list){
  if(list.every(i=>typeof i.seq==='number')) return;
  list.slice().sort((a,b)=> a.lesson-b.lesson || (a.part||1)-(b.part||1))
      .forEach((it,i)=>{ if(typeof it.seq!=='number') it.seq=(i+1)*10; });
}
/* 插入一列。kind='part' → 同一課的第二張（顯示 第3課(2)）
                kind='extra' → 獨立項目（只顯示名稱，例如「複習考」） */
function insertStudyRow(afterItemId, name, kind){
  const it=studyItems().find(x=>x.id===afterItemId); if(!it) return null;
  const list=studyItemsOfMaterial(it.subjectId, it.material);
  const idx=list.findIndex(x=>x.id===afterItemId);
  const nextSeq = idx+1<list.length ? list[idx+1].seq : it.seq+20;
  const seq=(it.seq+nextSeq)/2;                       // 插在兩者中間
  /* 在獨立項目（複習考）上按「第二張」，要做成「複習考 (2)」而不是
     它前面那一課的第二張——獨立項目內部仍帶著前一課的 lesson 編號，
     直接照編號做會變成「第3課 (2)」 */
  const fromExtraSecond = (kind==='part' && it.extra);
  const isExtra = (kind==='extra') || fromExtraSecond;
  const nm = fromExtraSecond ? (it.lessonName||'複習考')
                             : ((name||'').trim() || (isExtra?'複習考':''));
  let part;
  if(isExtra){
    /* 同一課次底下、同名的獨立項目算同一組，第二張才標 (2) */
    const sibs=list.filter(x=>x.extra && x.lesson===it.lesson && (x.lessonName||'')===nm);
    part = sibs.length ? Math.max(...sibs.map(x=>x.part||1))+1 : 1;
  } else {
    const sibs=list.filter(x=>!x.extra && x.lesson===it.lesson);
    part = sibs.length ? Math.max(...sibs.map(x=>x.part||1))+1 : 1;
  }
  const row={ id:'sp_'+Date.now().toString(36)+'_i'+Math.floor(Math.random()*1000),
    childId:it.childId, subjectId:it.subjectId, material:it.material,
    lesson:it.lesson, part, extra:isExtra, seq,
    lessonName:nm, due:'', done:false, doneAt:null };
  studyPlan().items.push(row);
  renumberParts(it.subjectId, it.material);
  save(); return row;
}
/* 插入或搬移之後，同一組的 (1)(2)(3) 要跟著實際顯示順序重新編號，
   否則在中間插一張會變成 (1)(3)(2)。
   分組：一般課次＝同課次；獨立項目＝同課次且同名稱。 */
function renumberParts(subjectId, material){
  const list=studyItemsOfMaterial(subjectId, material);
  const groups={};
  list.forEach(it=>{
    const key=(it.extra?'E|'+(it.lessonName||''):'L')+'|'+it.lesson;
    (groups[key]=groups[key]||[]).push(it);
  });
  Object.values(groups).forEach(g=>{ g.forEach((it,i)=>{ it.part=i+1; }); });
}
/* 同名獨立項目有幾張（>1 才需要顯示 (2)(3)） */
function extraSiblingCount(it){
  return studyItemsOfMaterial(it.subjectId, it.material)
    .filter(x=>x.extra && x.lesson===it.lesson && (x.lessonName||'')===(it.lessonName||'')).length;
}
/* 上下移動一列：跟相鄰的那一列交換 seq */
function moveStudyRow(id, dir){
  const it=studyItems().find(x=>x.id===id); if(!it) return false;
  const list=studyItemsOfMaterial(it.subjectId, it.material);
  const i=list.findIndex(x=>x.id===id);
  const j=i+(dir<0?-1:1);
  if(j<0 || j>=list.length) return false;
  const a=list[i].seq; list[i].seq=list[j].seq; list[j].seq=a;
  renumberParts(it.subjectId, it.material);
  save(); return true;
}
/* 這一課有幾張（>1 才需要顯示 (2)(3)） */
function studySiblingCount(it){
  /* 只算同課次的「張數」，獨立項目（複習考等）不列入，否則會害正常課次被標成 (1) */
  return studyItemsOfMaterial(it.subjectId, it.material)
    .filter(x=>x.lesson===it.lesson && !x.extra).length;
}
function addStudySubject(childId, name, icon){
  const sub={id:'sub_'+Date.now().toString(36)+Math.floor(Math.random()*100), childId, name:name.trim(), icon:icon||'📚'};
  studyPlan().subjects.push(sub); save(); return sub;
}
function deleteStudySubject(subjectId){
  const sp=studyPlan();
  sp.items = sp.items.filter(i=>i.subjectId!==subjectId);
  sp.subjects = sp.subjects.filter(s=>s.id!==subjectId);
  sp.exams.forEach(e=>{ e.scopes=(e.scopes||[]).filter(s=>s.subjectId!==subjectId); });
  save();
}
/* 批次建立課次：lessonNames 是一行一課的字串陣列，沒填名字就只留課號。
   新建的課次 due 先留空（尚未排程），等設定考試或手動排程才填日期。 */
function addStudyLessons(childId, subjectId, material, lessonNames, startNo){
  const base=Math.max(1, parseInt(startNo)||1);
  const exist=new Set(studyItemsOfMaterial(subjectId, material).map(i=>i.lesson));
  const made=[];
  lessonNames.forEach((nm,idx)=>{
    const lesson=base+idx;
    if(exist.has(lesson)) return;
    made.push({
      id:'sp_'+Date.now().toString(36)+'_'+idx+Math.floor(Math.random()*100),
      childId, subjectId, material, lesson, part:1, extra:false, seq:(base+idx)*10,
      lessonName:(nm||'').trim(),
      due:'', done:false, doneAt:null
    });
  });
  studyPlan().items.push(...made); save();
  return made;
}
function studyItemLabel(it){
  const sub=studySubjectById(it.subjectId);
  const base=(sub?sub.name:'')+' '+it.material+' ';
  if(it.extra) return base+(it.lessonName||'複習考')+(extraSiblingCount(it)>1?' ('+(it.part||1)+')':'');
  const nm=it.lessonName? ' '+it.lessonName : '';
  const p=(it.part||1)>1 ? ' ('+it.part+')' : '';
  return base+'第'+it.lesson+'課'+p+nm;
}
/* 某天是不是國定假日（或家長手動標記的放假日）。注意：不含一般的週六日，
   週末要不要排是由 exam.days 決定的 */
function isHolidayOn(key){
  if(TW_HOLIDAYS[key]) return TW_HOLIDAYS[key];
  if((state.manualHolidays||[]).includes(key)) return '手動放假';
  return null;
}
function dateKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(key){ const [y,m,d]=key.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysKey(key, n){ const d=parseKey(key); d.setDate(d.getDate()+n); return dateKeyOf(d); }
function daysBetween(aKey, bKey){ return Math.round((parseKey(bKey)-parseKey(aKey))/86400000); }
/* 依考試往回推：把範圍內未完成的課次鋪在「今天 ~ 考試前一天」 */
/* 教材先後：自修/課本要先寫完，才輪到測驗卷/評量。
   用名稱優先序自動判定，家長不用另外設定；沒對到的（自訂名稱）排最後。 */
const MATERIAL_ORDER=['自修','課本','講義','習作','測驗卷','考卷','評量'];
function materialRank(m){
  const i=MATERIAL_ORDER.findIndex(x=>String(m||'').includes(x));
  return i<0 ? MATERIAL_ORDER.length : i;
}
/* 找出這一課的前置日期：主教材同課次的日期；課次超出主教材範圍時，
   就掛在主教材最後一課之後（例如自修只有 3 課、評量有 8 張） */
function prereqDueFor(item, baseItems){
  if(!baseItems.length) return null;
  const same=baseItems.filter(b=>b.lesson<=item.lesson);
  const pool=same.length?same:baseItems;
  let latest=null;
  pool.forEach(b=>{ if(b.due && (!latest || b.due>latest)) latest=b.due; });
  return latest;
}

/* 整體平衡：各教材各自平均分散後，幾本教材剛好撞在同一天就會堆起來
   （實測 9 本教材時平均有 3 個可寫日全空、同一天最多 4~5 項，
   撞在週末時看起來就像「測驗卷全部堆在假日」）。
   這裡反覆把「最擠那天」的一項搬到「搬過去後仍然比較鬆」的日子，直到搬不動為止。
   搬動時守住三條規則，跟排程其他步驟一致：
   1) 同一本教材的順序不變，且不跟前後項擠同一天
   2) 後段教材（測驗卷/評量）仍排在自修同課之後
   3) 自修往後搬時，不能越過依賴它的測驗卷/評量
   mode='weekend' 時週六日的份量以平日兩倍計，平日就會比較輕。
   範圍外、還沒做的課次也算進當天份量，但不搬動。 */
const SCHED_MODES={ even:'平均分配', weekend:'優先假日' };
function examMode(exam){ return exam && exam.mode==='weekend' ? 'weekend' : 'even'; }
function levelScheduleLoad(scopes, usable, exam){
  if(usable.length<2) return;
  const mode=examMode(exam);
  const weight=k=>{ const w=weekdayOf(k); return (mode==='weekend' && (w===5||w===6)) ? 2 : 1; };
  const idxOf={}; usable.forEach((k,i)=>{ idxOf[k]=i; });
  const moving=[]; scopes.forEach(g=>g.items.forEach(it=>moving.push(it)));
  if(!moving.length) return;
  const movingSet=new Set(moving);
  const load=usable.map(()=>0);
  const cid=exam.childId || (moving[0] && moving[0].childId);
  studyItemsOf(cid).forEach(it=>{
    if(!it.done && !movingSet.has(it) && idxOf[it.due]!=null) load[idxOf[it.due]]++;
  });
  moving.forEach(it=>{ if(idxOf[it.due]!=null) load[idxOf[it.due]]++; });

  const prev=new Map(), next=new Map();
  scopes.forEach(g=>g.items.forEach((it,i)=>{
    if(i>0) prev.set(it, g.items[i-1]);
    if(i<g.items.length-1) next.set(it, g.items[i+1]);
  }));
  const baseOf=new Map(), depsOf=new Map();
  const bySub={};
  scopes.forEach(g=>{ (bySub[g.sc.subjectId]=bySub[g.sc.subjectId]||[]).push(g); });
  Object.values(bySub).forEach(groups=>{
    if(groups.length<2) return;
    groups.sort((a,b)=> materialRank(a.sc.material)-materialRank(b.sc.material));
    const base=groups[0].items;
    const deps=[];
    groups.slice(1).forEach(g=>g.items.forEach(it=>{ baseOf.set(it, base); deps.push(it); }));
    base.forEach(b=>depsOf.set(b, deps));
  });
  const poolOf=(it, base)=>{ const same=base.filter(b=>b.lesson<=it.lesson); return same.length?same:base; };

  const canMove=(it, k)=>{
    const p=prev.get(it), n=next.get(it);
    if(p && !(p.due < k)) return false;
    if(n && !(k < n.due)) return false;
    const base=baseOf.get(it);
    if(base){
      const need=prereqDueFor(it, base);
      if(need && !(k > need)) return false;
    }
    const deps=depsOf.get(it);
    if(deps){
      const base2=baseOf.get(deps[0]);
      for(const d of deps){ if(poolOf(d, base2).includes(it) && !(d.due > k)) return false; }
    }
    return true;
  };

  const score=i=>load[i]/weight(usable[i]);
  const cap=moving.length*usable.length;
  for(let iter=0; iter<cap; iter++){
    const order=usable.map((_,i)=>i).sort((a,b)=>score(b)-score(a));
    let best=null;
    for(const src of order){
      const cur=score(src);
      for(const it of moving){
        if(idxOf[it.due]!==src) continue;
        for(let dst=0; dst<usable.length; dst++){
          if(dst===src) continue;
          const after=(load[dst]+1)/weight(usable[dst]);
          if(!(after < cur)) continue;
          if(!canMove(it, usable[dst])) continue;
          const dist=Math.abs(dst-src);
          if(!best || after<best.after || (after===best.after && dist<best.dist)) best={it, src, dst, after, dist};
        }
      }
      if(best) break;
    }
    if(!best) break;
    best.it.due=usable[best.dst];
    load[best.src]--; load[best.dst]++;
  }
}

/* 依考試往回推。
   關鍵：不是把各科串成一長串依序鋪（那會變成先唸完國語才輪到數學），
   而是「每一科各自平均分散在整個備考期間」，這樣每天自然會有不同科目交錯，
   每科的節奏也各自正確（例如 8 週 6 課 → 約每 9~10 天一課）。
   各科起跑點再錯開一點，避免第一天所有科目擠在一起。 */
function scheduleForExam(exam, skipHolidays=true){
  const scopes=(exam.scopes||[]).map(sc=>({
    sc, items: studyItemsOfMaterial(sc.subjectId, sc.material).filter(it=>!it.done)
  })).filter(x=>x.items.length);
  const total=scopes.reduce((n,x)=>n+x.items.length,0);
  if(!total) return {count:0, perDay:0, tight:false, perSubject:[]};

  const today=dateKey();
  /* 2026-09-28 稽核 B10：考試已經過了就不排，原本會全部排到過去的日子、永遠卡在逾期 */
  if(exam.date < today) return {count:0, perDay:0, tight:false, perSubject:[], past:true};
  const lastDay=addDaysKey(exam.date,-1);
  const startKey = lastDay < today ? exam.date : today;
  const endKey   = lastDay < today ? exam.date : lastDay;

  /* 可用的日子（扣掉國定假日、只留選定的星期） */
  const span=Math.max(0, daysBetween(startKey, endKey));
  const wantDays=examDays(exam);          /* 家長指定的星期，未設定＝每天 */
  const usable=[];
  for(let i=0;i<=span;i++){
    const k=addDaysKey(startKey,i);
    if(skipHolidays && isHolidayOn(k)) continue;
    if(!wantDays.includes(weekdayOf(k))) continue;
    usable.push(k);
  }
  /* 指定的星期在這段期間完全沒出現時，退回不限星期，以免整批排不出去 */
  if(!usable.length){
    for(let i=0;i<=span;i++){
      const k=addDaysKey(startKey,i);
      if(skipHolidays && isHolidayOn(k)) continue;
      usable.push(k);
    }
  }
  if(!usable.length) usable.push(startKey);

  /* 主教材若鋪滿整個期間，最後一課會落在最後一個可用日，後續教材就沒有
     空間排在它之後（只能壓在同一天，違反先後）。所以先幫每一科的主教材
     截掉尾端，預留給後續教材。 */
  const bySubjectPre={};
  scopes.forEach(g=>{ (bySubjectPre[g.sc.subjectId]=bySubjectPre[g.sc.subjectId]||[]).push(g); });
  Object.values(bySubjectPre).forEach(groups=>{
    groups.forEach(g=>{ g.window=usable; });
    if(groups.length<2) return;
    groups.sort((a,b)=> materialRank(a.sc.material)-materialRank(b.sc.material));
    const base=groups[0];
    const baseMax=Math.max(...base.items.map(i=>i.lesson));
    let tail=0;
    groups.slice(1).forEach(g=>{ tail += Math.max(1, g.items.filter(i=>i.lesson>=baseMax).length); });
    const cut=Math.max(1, usable.length - tail);
    base.window = usable.slice(0, cut);
  });

  const K=scopes.length;
  const perSubject=[];
  scopes.forEach((grp,k)=>{
    const c=grp.items.length;
    const win=(grp.window && grp.window.length) ? grp.window : usable;
    /* 相位偏移 (k+0.5)/K：讓各科的第一課不要全部落在同一天 */
    grp.items.forEach((it,n)=>{
      const pos=Math.floor((n + (k+0.5)/K) * win.length / c);
      it.due = win[Math.min(pos, win.length-1)];
    });
    const sub=studySubjectById(grp.sc.subjectId);
    perSubject.push({
      name:(sub?sub.name:'')+' · '+grp.sc.material,
      count:c,
      everyDays: c>1 ? Math.round(usable.length/c) : usable.length
    });
  });
  /* 反混疊：上面用固定間隔取「可用日」的索引，而每週的可用天數也是固定的，
     兩者共振時整批課次會落在同一個星期幾（實測 8 項全擠在週一、週二，
     週三四六日完全空白）。這裡在理想位置附近 ±2 格內找一個「最近幾項還沒用過
     的星期幾」，破壞共振但幾乎不影響間隔平均度。 */
  scopes.forEach(grp=>{
    const recent=[];
    let prevIdx=-1;
    const win=(grp.window && grp.window.length) ? grp.window : usable;
    grp.items.forEach(it=>{
      const ideal=win.indexOf(it.due);
      if(ideal<0) return;
      let pick=ideal;
      for(const off of [0,1,-1,2,-2]){
        const i=ideal+off;
        if(i<0 || i>=win.length || i<=prevIdx) continue;
        if(!recent.includes(weekdayOf(win[i]))){ pick=i; break; }
      }
      if(pick<=prevIdx) pick=Math.min(prevIdx+1, win.length-1);
      it.due=win[pick];
      recent.push(weekdayOf(win[pick]));
      if(recent.length>2) recent.shift();
      prevIdx=pick;
    });
  });

  /* 套用教材先後：同一科裡，後段教材的每一課要排在主教材對應課次之後 */
  const bySubject={};
  scopes.forEach(g=>{ (bySubject[g.sc.subjectId]=bySubject[g.sc.subjectId]||[]).push(g); });
  Object.values(bySubject).forEach(groups=>{
    if(groups.length<2) return;
    groups.sort((a,b)=> materialRank(a.sc.material)-materialRank(b.sc.material));
    const base=groups[0].items;
    groups.slice(1).forEach(g=>{
      /* 用一個只往前走的指標重新指派，確保三件事同時成立：
         1) 不早於自己原本平均分散的位置
         2) 不早於前置課次（自修同課）的隔一個可用日
         3) 不跟同教材前一項擠在同一天——否則被推移的項目會全部疊在
            「自修最後一課的隔天」那一格 */
      let ptr=0;
      g.items.forEach(it=>{
        let idx=usable.indexOf(it.due);
        if(idx<0) idx=0;
        const need=prereqDueFor(it, base);
        if(need){
          const ni=usable.findIndex(d=>d>need);
          idx = ni>=0 ? Math.max(idx, ni) : usable.length-1;
        }
        idx=Math.min(Math.max(idx, ptr), usable.length-1);
        it.due=usable[idx];
        ptr=idx+1;
      });
    });
  });
  levelScheduleLoad(scopes, usable, exam);
  save();

  const byDay={};
  scopes.forEach(g=>g.items.forEach(it=>{ byDay[it.due]=(byDay[it.due]||0)+1; }));
  const days=Object.keys(byDay).length;
  const maxPerDay=Math.max(...Object.values(byDay));
  return {count:total, perDay:maxPerDay, tight: maxPerDay>3, days:usable.length, perSubject};
}
/* 兩個日期之間、扣掉國定假日與未選星期後的可用天數（卡片顯示節奏用） */
/* 某個日期是星期幾（0=一 … 6=日，跟 todayWeekdayIndex 同一套） */
function weekdayOf(key){ return (parseKey(key).getDay()+6)%7; }
const WEEKDAY_NAMES=['一','二','三','四','五','六','日'];
/* 考試沒設定 days 時＝每天都可以寫 */
function examDays(exam){
  const d=exam && exam.days;
  return (Array.isArray(d) && d.length) ? d : [0,1,2,3,4,5,6];
}
function examDaysLabel(exam){
  const d=examDays(exam);
  if(d.length===7) return '每天';
  if(d.length===5 && [0,1,2,3,4].every(x=>d.includes(x))) return '只有平日';
  if(d.length===2 && d.includes(5) && d.includes(6)) return '只有週末';
  return '星期'+d.slice().sort((a,b)=>a-b).map(x=>WEEKDAY_NAMES[x]).join('、');
}
function countUsableDays(startKey, endKey, exam){
  const span=daysBetween(startKey, endKey);
  if(span<0) return 0;
  const days=examDays(exam);
  let n=0;
  for(let i=0;i<=span;i++){
    const k=addDaysKey(startKey,i);
    if(isHolidayOn(k)) continue;
    if(!days.includes(weekdayOf(k))) continue;
    n++;
  }
  return n;
}
function examCountdown(exam){ return daysBetween(dateKey(), exam.date); }
function examsOf(childId){ return studyPlan().exams.filter(e=>e.childId===childId).sort((a,b)=>a.date<b.date?-1:1); }
/* 今日該做的複習：到期日 <= 今天且未完成（用 <= 才抓得到逾期未補的） */
function studyDueToday(childId){
  const t=dateKey();
  return studyItemsOf(childId).filter(it=>!it.done && it.due && it.due<=t)
    .sort((a,b)=> a.due===b.due ? a.lesson-b.lesson : (a.due<b.due?-1:1));
}
function studyOverdue(childId){ const t=dateKey(); return studyItemsOf(childId).filter(it=>!it.done && it.due && it.due<t); }
function studyUnscheduled(childId){ return studyItemsOf(childId).filter(it=>!it.due); }
function toggleStudyItem(id){
  const it=studyItems().find(x=>x.id===id); if(!it) return;
  const c=C();
  if(it.done){
    /* 退回時要退「當初實際給的金額」，不能一律當成全額 */
    const back = (typeof it.sunGot==='number') ? it.sunGot : STUDY_ITEM_SUN;
    it.done=false; it.doneAt=null; it.sunGot=0;
    c.studyDoneCount = Math.max(0, studyDoneToday(c)-1);
    addSun(-back); toast('↩ 取消完成 -'+back+' 陽光');
  } else {
    const n=studyDoneToday(c);
    const gain=studySunFor(n);
    const got=addSun(gain, true);
    it.done=true; it.doneAt=Date.now(); it.sunGot=got;   /* 記實際給的，取消時才不會多扣（2026-09-28 稽核 B9） */
    c.studyDoneCount=n+1;
    goodSound(); pushZombie(0.06);
    toast('📚 完成「'+studyItemLabel(it)+'」'+(got?'+'+got+' 陽光！':'！')
      + (got<gain ? '（今天陽光已到上限 '+SUN_DAILY_CAP+'）' : gain<STUDY_ITEM_SUN ? '（今天已完成 '+(n+1)+' 項，之後每項 '+STUDY_ITEM_SUN_LOW+' 陽光）' : ''));
    setTimeout(()=>offerTopicDrill(it), 0);   /* 2026-09-28 稽核 D4：讀完帶出「練 5 題」 */
  }
  save();
}

function hwListOf(ch){ return Array.isArray(ch.homeworkList) ? ch.homeworkList : state.homeworkList; }
function hwItem(id){ return allHW().find(x=>x.id===id); }

  {id:'nepenthes',nm:'豬籠草',need:1000, emoji:'🪣'},
  {id:'staghorn',nm:'鹿角蕨',need:1400, emoji:'🌿'},
];
const MAX_PLANTS = 5;              // 「上場陣容」上限（解鎖不限，可收藏全部）
function ownedPlantCount(c){ return GARDEN_PLANTS.filter(p=>c.garden[p.id]).length; }
function plantById(id){ return GARDEN_PLANTS.find(p=>p.id===id); }
/* 陣容（deck）：已解鎖的植物中，最多挑 MAX_PLANTS 盆「上場」，可隨時更換 */
function deckIds(c){
  const d = Array.isArray(c.deck) ? c.deck : [];
  return d.filter(id => c.garden[id] && plantById(id)).slice(0, MAX_PLANTS);
}
function deckPlants(c){ return deckIds(c).map(plantById); }
function inDeck(c,id){ return deckIds(c).indexOf(id) >= 0; }
function toggleDeck(id){
  const c=C();
  if(!c.garden[id]){ toast('這盆植物還沒解鎖喔'); return; }
  if(!Array.isArray(c.deck)) c.deck=[];
  const p=plantById(id);
  if(inDeck(c,id)){
    c.deck = deckIds(c).filter(x=>x!==id);
    toast('🪴 '+p.nm+' 收回溫室休息（隨時可以再上場）');
  } else {
    if(deckIds(c).length >= MAX_PLANTS){ badSound(); toast('🌱 陣容滿了（'+MAX_PLANTS+' 盆），先點一盆上場中的植物把它收回'); return; }
    c.deck = deckIds(c).concat([id]);
    toast('🌿 '+p.nm+' 上場守護花園！');
  }
  goodSound(); save(); rerenderGardenView();
}

function petalRing(cx,cy,r,n,rx,ry,fill,stroke){
  let s='';
  for(let i=0;i<n;i++){
    s+=`<ellipse cx="${cx}" cy="${cy-r}" rx="${rx}" ry="${ry}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="1"`:''} transform="rotate(${i*360/n} ${cx} ${cy})"/>`;
  }
  return s;
}

  { title:'小狗阿旺', text:'我們家養了一隻小狗，名字叫做阿旺。阿旺的毛是金黃色的，摸起來軟軟的，很像蓋在身上的一條小毯子。每天早上，阿旺都會第一個跑到門口，用力搖著尾巴等我起床，好像在說快點快點。吃完早餐以後，我會帶阿旺去公園散步。公園裡有許多小鳥，阿旺最喜歡追著小鳥跑，就算跑得氣喘吁吁也不肯停下來。有一次，阿旺在草地上撿到一顆紅色的球，從此以後，牠每天散步都要帶著那顆球，誰都搶不走。傍晚回家的時候，阿旺總是走在我的前面，好像在當我的小保鏢，遇到陌生人還會小聲汪汪叫。阿旺很愛吃飯，每次我拿飼料袋，牠就興奮地跳來跳去，尾巴搖得像電風扇。我也喜歡在週末帶牠去河邊，牠會把前腳伸進水裡啪啪地拍，玩得一身是水也不在乎。我覺得有阿旺陪著我，每一天都過得很快樂，牠不只是寵物，更是家裡最重要的一分子。',

  { title:'下雨的週末', text:'星期六早上，我還在睡夢中，就被窗外滴答滴答的聲音吵醒了。我走到窗邊一看，原來外面下起了雨。雨點打在玻璃上，像在敲小鼓一樣，把整片窗戶都畫滿了水珠。媽媽說，今天不能去公園玩了，我們就在家裡辦一場小小的下雨派對。我們一起做了餅乾，麵粉灑得到處都是，像下了一場白色的雪，還不小心把糖粉蹭到鼻子上。下午，雨變小了，我穿上黃色的雨衣和紅色的雨靴，撐著小傘走到門口。水窪裡映出我的影子，我輕輕踩下去，水花就蹦了起來，涼涼的感覺好有趣。鄰居的小花貓躲在屋簷下，看著雨發呆，一動也不動。我對牠揮揮手，牠喵了一聲好像在說謝謝，又好像在說好冷喔。晚上，雨終於停了，空氣變得涼涼的，還聞得到泥土和青草的味道。我看見天邊出現一道淡淡的彩虹，像誰偷偷畫上去的。我覺得下雨的週末，也有不一樣的快樂，不一定非得到戶外跑跳才行。',

  { title:'媽媽的便當', text:'每天中午，我最期待的事就是打開媽媽幫我準備的便當。便當盒是藍色的，打開蓋子，裡面總是整整齊齊。白白的米飯上，媽媽會用海苔幫我貼出一張可愛的笑臉，旁邊放著煎得金黃的蛋，還有我最愛的玉米和紅蘿蔔。星期三的便當特別不一樣，因為那天有炸雞塊，香噴噴的味道會飄到隔壁同學那裡，大家都偷偷看過來。有一次，我不小心把便當掉在地上，飯粒撒了一地，我急得快哭出來。媽媽知道以後，不但沒有罵我，晚上還陪我一起再做了一個，邊做邊跟我說沒關係下次小心就好。她說，便當裡裝的不只是食物，還有她對我的愛，還有希望我健康長大的心意。從那天起，我每次吃便當都會先說謝謝，再一口一口慢慢吃，也會把最喜歡的玉米留一塊給媽媽。我覺得，自己是世界上最幸福的小孩，因為有人把愛藏進了每天的飯菜裡。',

  { title:'公園的貓咪', text:'我家附近的小公園，住著一隻橘色的流浪貓。牠的耳朵尖尖的，尾巴捲成一個圈，看起來很有精神，眼睛卻總是帶著一點警戒。每天放學，我都會帶一點乾糧去餵牠。牠一看到我，就會喵喵叫著跑過來，用頭蹭我的褲子，好像在說你終於來了。有一天，下雨了，貓咪躲在長椅下面發抖，身子縮成一團。我趕快撐傘把牠抱到騎樓下，還把外套蓋在牠身上，牠舒服地呼嚕呼嚕，眼睛瞇成一條線。後來，我和爸爸在公園角落做了一個小小的木屋，裡面鋪上舊毛巾，讓貓咪有地方躲雨。同學們知道以後，也輪流來照顧牠，有人帶水，有人帶小毛毯。我們幫牠取了名字，叫小橘。有一天，我們發現小橘的腳受傷了，大家湊錢帶牠去看獸醫，包紮好才放心。我發現，原來關心一個小生命，會讓整個公園都變得溫暖，也讓陌生人因為一隻貓變成熟悉的朋友。現在，小橘已經把我們當成家人了。',

  { title:'我的生日', text:'昨天是我七歲的生日，全家幫我辦了一個小小的派對。客廳裡掛滿了彩色的氣球，桌子上擺著一個巧克力蛋糕，上面插著七根蠟燭，周圍還擺了一圈小星星的糖果。下午，好朋友們一個接一個來到家裡，手裡都拿著包好的禮物，有的方方的，有的圓圓的，讓我好想知道裡面是什麼。我們先一起玩捉迷藏，小華躲在衣櫃裡差點睡著，大家都笑翻了，連媽媽都忍不住笑。接著，媽媽點燃蠟燭，大家圍成一圈唱生日快樂歌，燭光映在每個人臉上，暖暖的。我閉上眼睛許了一個願望，希望爺爺奶奶身體健康，也希望明年還能和大家一起過。吹完蠟燭以後，我切蛋糕分給大家，每一塊都多加了一顆草莓。最讓我驚喜的是爸爸送的禮物，是一盒積木，可以蓋出好高好高的城堡。那天晚上，我抱著禮物睡著，夢裡還在蓋城堡，笑得嘴角都是甜的。我覺得，被愛包圍的感覺真好，生日不只是一天，而是一整年的期待。',

  { title:'上學的路上', text:'每天早上，媽媽都會騎著腳踏車載我去上學。我們七點半出門，沿著住家旁的小路慢慢騎，涼涼的風吹在臉上，讓人一下子就醒過來。路邊的早餐店總是飄出蛋餅的香味，老闆娘看到我就笑著說早安，還偶爾多給我一顆小蕃茄。經過公園時，我會看見幾位阿伯在打太極拳，動作慢慢的，像電影裡的俠客，也有人沿著跑道快走，認真得不得了。再往前走，是一排高大的樟樹，葉子在風裡沙沙作響，好像在跟我說加油，陽光從葉縫灑下來，在地上畫出會動的光斑。有一次，我的書包帶子斷了，媽媽趕緊停下來，用膠帶先固定好，還跟我說別擔心上學要緊。到了學校門口，穿著黃色背心的導護媽媽幫我們看車，我跳下車，跟媽媽揮手說再見，然後走進教室。這段上學的路雖然很短，卻有好多溫柔的風景，還有好多關心我的人。我喜歡和媽媽一起騎車的早晨，那是屬於我們兩個人的小旅行，每一天都不一樣。',

  { title:'我的小魚', text:'我們家客廳的櫃子上，放著一個圓圓的玻璃魚缸。裡面養了一隻橘色的小魚，名字叫做小橙。小橙的尾巴大大的，像一件飄動的裙子，每次遊起來都左搖右擺，看起來很快樂。每天早上，我會餵牠吃飯，魚食是一顆顆小小圓圓的黃色飼料，小橙一看到就游過來，嘴巴一張一合把食物吃光。吃完以後，牠會停在缸壁的石頭旁邊休息，石頭是灰色的，上面還長著幾株綠綠的水草。有一次換水的時候，我不小心把魚缸碰歪了，水灑出來一點，小橙嚇得一直繞圈圈，我趕快扶好，還輕輕拍拍缸壁安慰牠。傍晚，我會把客廳的燈關小一點，因為魚兒也要睡覺。看著小橙安安靜靜地停在角落，我覺得牠就像家裡的一個小寶貝，雖然不會說話，卻讓我們的家多了一點生氣和溫柔。',

  { title:'幫媽媽買醬油', text:'星期天下午，媽媽正在廚房煮湯，忽然發現醬油用完了。她給我一個紅色的零錢袋，說拜託你去樓下的小商店買一瓶醬油回來。我穿上鞋子，拿著袋子出門，心裡有點緊張，因為這是我第一次自己下樓買東西。商店的阿伯看到我，笑著問小客人要買什麼。我指著架子上的醬油說我要這個。阿伯拿下來，跟我說這一瓶二十元，我從袋子裡拿出錢給他，他還找我五元硬幣，涼涼的握在手心裡。回家的路上，我小心地抱著醬油瓶子，怕摔破，一步一步慢慢走。到家以後，媽媽打開門，看見我真的把醬油買回來了，開心地摸摸我的頭說你長大了。那天晚上，喝到有醬油香味的湯，我覺得特別好喝，因為那裡面也有我的一點點功勞。從此以後，我常幫媽媽跑腿，每次都覺得自己像個小幫手，心裡好驕傲。',
    q:[
    {q:'媽媽叫我去買什麼？',a:['醬油','鹽巴','糖'],c:0},
    {q:'商店的阿伯找我多少錢？',a:['五元','十元','不用找'],c:0},
    {q:'我覺得自己像什麼？',a:['小幫手','大老闆','老師'],c:0},
    ] },
  { title:'學騎腳踏車', text:'爸爸說，等我長高一點，就可以學騎兩輪的腳踏車。生日那天，他真的把車子推出來，車身是紅色的，鈴鐺叮叮響。一開始我好怕，坐上去腳還夠不到踏板，爸爸就先在後面扶著椅墊，要我眼睛看前方，不要低頭。第一次踩下去，車子歪歪的，我嚇得大叫，爸爸說沒關係再試一次。練了整整一個下午，摔了兩次，膝蓋擦破一點皮，但我沒有哭。後來爸爸偷偷放開手，我竟然自己騎了十幾公尺才發現，回頭一看，爸爸在遠遠笑著揮手。那種風從耳邊吹過的感覺，好像自己會飛一樣。現在每天傍晚，我都騎車繞社區一圈，還教妹妹怎麼按鈴鐺。媽媽說，看我從怕得發抖到騎得開心，才知道勇氣是練出來的。我覺得學會一件難的事，比收到禮物還開心，因為那是自己掙來的。',
    q:[
    {q:'爸爸推出的腳踏車是什麼顏色？',a:['紅色','藍色','綠色'],c:0},
    {q:'練車時誰在後面扶著我？',a:['爸爸','媽媽','妹妹'],c:0},
    {q:'我後來自己騎了多遠才發現？',a:['十幾公尺','一步','一公里'],c:0},
    ] },
  { title:'冬天的早餐', text:'冬天的早晨，窗外冷冷的，玻璃上還冒著一層白白的水氣。我縮在被窩裡不想起來，媽媽卻在廚房忙著，鍋子裡傳出咕嚕咕嚕的聲音。起床以後，餐桌上擺著一碗熱呼呼的稀飯，上面撒了少許青蔥，旁邊還有一顆水煮蛋和一片烤得香香的吐司。媽媽說，天氣冷要多吃熱的才不會感冒。我吹了吹稀飯，嚐一口，軟軟暖暖的，從嘴巴一直暖到肚子裡。吃完以後，媽媽幫我圍上紅色圍巾，又幫我戴上毛茸茸的帽子和手套，整個人包得像一顆元宵。走出門口，風雖然冷，但我一點都不怕，因為肚子裡有熱食，身上有媽媽的溫暖。上學的路上，我看見路邊的樹葉都掉光了，只有幾隻小鳥在枝頭跳來跳去，好像也在找暖和的地方。我想，能夠在冷冷的冬天，吃到媽媽煮的早餐，是一件多麼幸福的事。',
    q:[
    {q:'冬天的早餐媽媽煮了什麼？',a:['熱稀飯','冰淇淋','冷麵'],c:0},
    {q:'媽媽幫我圍上什麼顏色的圍巾？',a:['紅色','藍色','黑色'],c:0},
    {q:'吃完早餐出門，我覺得怎樣？',a:['不冷很溫暖','非常害怕','想睡覺'],c:0},
    ] }],
  mid: [
  { title:'第一次上台', text:'小華是個很害羞的男孩，最怕在大家面前說話，只要在人群裡被盯著看，手心就會冒汗。有一天，老師竟然選他參加學校的朗讀比賽。小華很緊張，回家以後每天都很認真練習，把文章讀了一遍又一遍，聲音也變得越來越大，連家裡的狗都聽熟了那一段。比賽那天，他站在台上，心裡一直想著老師說的話：只要有勇氣，就不怕挑戰。讀到一半，他不小心念錯了一個字，臉一下子紅了起來，腦袋一片空白。他停下來深呼吸，對自己說沒關係，再試一次就好，就像在家練習時那樣。台下的同學沒有笑他，反而安靜地聽他繼續讀，還有人輕輕點頭鼓勵。讀完的時候，全班都為他鼓掌，連老師都對他點點頭，眼裡帶著笑意。小華走下台，發現自己的手還在微微發抖，可是心裡卻覺得很有成就感，比以前任何一次都踏實。他終於明白，勇氣不是不害怕，而是害怕的時候，仍然願意踏出那一步。從那天起，他不再躲著人群，反而開始期待下一次可以站在台上，把準備好的故事說給大家聽。我想，每個人心裡都藏著一點勇氣，只是有時候需要一個機會，把它輕輕叫出來，它就會越來越勇敢。後來學校又辦了說故事比賽，小華這次主動報名，還幫大家寫了提詞卡。他站在台上不再發抖，反而笑著把故事講完，台下響起熱烈的掌聲。連以前笑過他的同學都說，小華真的變了，變得比以前更有自信，也更願意幫助害怕上台的人。老師把他的改變寫在聯絡本上，媽媽看了好感動，說勇氣真的會傳染。',
    q:[
    {q:'小華最怕的是什麼？',a:['在大家面前說話','吃青菜','寫功課'],c:0},
    {q:'文章中「勇氣」最接近的意思是？',a:['害怕時仍願意嘗試','永遠不害怕','大聲說話'],c:0},
    {q:'你覺得小華以後會怎麼做？',a:['更敢上台表現','再也不上台','討厭朗讀'],c:0}
    ] },
  { title:'社區的流浪貓', text:'我們的社區裡，曾經有一隻瘦瘦的流浪貓，總是躲在垃圾桶後面找食物，身上的毛亂亂的，看起來好幾天沒吃飽。冬天的時候，牠冷得發抖，縮在牆角，卻沒有人敢靠近，怕被抓傷。班上的小玲看了很心疼，就發起一個照顧貓咪的計畫，先問媽媽能不能幫忙。她請媽媽幫忙買貓食，放學後和同學輪流去餵牠，還幫牠準備了乾淨的碗。漸漸地，貓咪不再躲著人，甚至會主動走過來蹭大家的褲子，發出滿足的呼嚕聲。鄰居們也被這份溫暖打動，有人送來舊毛巾，有人幫忙釘了一個小木屋，就放在社區的花圃旁。幾個月後，貓咪變得圓潤又乾淨，還在木屋裡生下了兩隻小貓，一隻橘的一隻白的，像兩顆會動的棉花糖。社區的公告欄貼出貓咪的照片，大家都搶著認養，連從不說話的隔壁伯伯都來登記。原來，一點點的關心，可以讓一個冰冷的角落到處都是溫暖。小玲說，她最開心的不是貓咪變胖，而是看見大家因為這件事變得更親近，會主動打招呼了。我想，這就是善良帶來的連鎖反應，一個小小的善意，會慢慢傳給更多人，最後連整個社區的空氣都變甜了。後來社區辦了認養說明會，小玲站在台上分享照顧貓咪的過程，台下好多鄰居都拿出手機拍照。那兩隻小貓很快就被一對兄妹認養，他們承諾會好好照顧，還答應定期回來看貓媽媽。隔年春天，社區甚至在花圃旁立了一塊小小告示牌，上面寫著「謝謝你們的溫柔」。從此以後，大家經過那裡都會放慢腳步，彷彿在跟這段溫暖打聲招呼。',
    q:[
    {q:'誰發起了照顧貓咪的計畫？',a:['小玲','老師','媽媽'],c:0},
    {q:'文中「溫暖」指的是什麼？',a:['人與人之間的關心','天氣很熱','貓的體溫'],c:0},
    {q:'你覺得這群小貓長大後會怎樣？',a:['被好心人認養','繼續流浪','被送走'],c:0}
    ] },
  { title:'珍惜每滴水', text:'老師在課堂上告訴我們，世界上有一些地方長期缺少乾淨的水，連喝水都要走很遠的路，有的孩子一天得提著沉重的水桶走好幾個小時。聽了以後，我們班決定發起節水計畫，從自己做起。洗手的時候，我們把水龍頭關小一點；洗菜用過的水，拿去澆花；洗澡也不再拖太久，改成像比賽一樣快速。一開始，有些同學覺得很麻煩，常常忘記，洗著洗著水又開大了。班長就想了一個辦法，在每個水龍頭旁貼一張小提醒卡，上面畫著一滴笑臉的水，旁邊寫著省水三字訣。漸漸地，大家養成了習慣，還比賽誰省下的水最多，下課就跑去比誰的水桶輕。一個月下來，我們竟然比上個月少了三大桶水，老師把數字畫成圖表貼在牆上，全班都驚訝自己這麼厲害。老師說，珍惜不是小氣，而是知道水來得不容易，是許多人的努力才送到家裡。看著水龍頭滴下來的每一滴，我都會想起那些要走很遠才能取到水的人。我終於懂得，珍惜這兩個字，藏在每天的小動作裡，積少成多就能幫助很多人。如果每個人都省下一點點水，累積起來，就能讓缺水的土地多出一口活命的水。學期末，我們班把省下來的水資源換算成捐款，透過公益團體送到偏遠地區。校長在朝會上表揚我們，說這不是一件小事，而是一群孩子學會對世界負責的開始。回家以後，我也教弟弟洗手關小水龍頭，他一開始覺得好玩，後來竟主動提醒媽媽別讓水一直流。媽媽笑著說，家裡多了一個小小節水員。我忽然明白，改變真的不需要很大，只要從自己手邊開始，就能讓更多人跟上來。',

    {q:'文中「珍惜」的意思最接近？',a:['愛惜不浪費','害怕水','討厭水'],c:0},
    {q:'如果繼續這樣做，一個月後會？',a:['省下更多水','水更不夠','沒有改變'],c:0}
    ] },
  { title:'天氣變化多', text:'臺灣的天氣變化很多，常常讓人猜不透，出門前不看天色往往會吃虧。早上出太陽的時候，媽媽會提醒我帶遮陽的帽子；到了中午，忽然下起午後雷陣雨，我又得趕快撐傘，鞋子還是常被濺濕。夏天有時還會來颱風，那時風又大、雨又急，我們全家都待在安全的屋子裡，不敢靠近窗戶，還提前把盆栽搬進屋內。奶奶說，以前沒有氣象預報，人們看雲的顏色、感覺風的方向，就能猜出要不要下雨，那是生活裡練出來的本事。現在我們有手機可以看天氣，但奶奶還是教我一些老方法。比如，傍晚的天空如果紅紅的，有時是颱風要來的前兆，要趕快做好防颱準備；螞蟻搬家，常常預告要下大雨；燕子飛得很低，也表示空氣很濕快要下雨。我覺得，不管是看手機還是看自然，重點都是先做好準備。只要出門前多看一眼天色，帶對衣服和雨具，不管天氣怎麼變，我們都能安心過每一天。準備得好，意外就傷不了我們，也能在變化中找到從容。天氣雖然捉摸不定，但只要我們用心觀察，它其實也有自己的規律可尋。上個月，我看見傍晚紅紅的天色，趕緊提醒全家收好曬在外面的衣服、檢查門窗，隔天果然颱風就來了；因為早一步準備，我們一點都沒慌。同學們聽了都說神奇，紛紛跑來問我怎麼看天氣。我把自己學到的老方法寫成一張小卡片，貼在教室後面的布告欄，上面畫著雲、螞蟻和燕子，標註它們代表的天氣。老師看見以後，還借這張卡片幫我們上了一堂生活課，教大家怎麼把觀察變成準備。我發現，原來奶奶口中的老智慧，到現在還是很有用。',
    q:[
    {q:'夏天有時會來什麼？',a:['颱風','地震','下雪'],c:0},
    {q:'文中「準備」指的是？',a:['出門前看天色帶對物品','買新手機','睡懶覺'],c:0},
    {q:'如果傍晚天空紅紅的，可能會怎樣？',a:['是晴天','下大雨','颳颱風'],c:2}
    ] },
  { title:'小樹苗長大', text:'春天來的時候，我和爸爸在院子裡種下一棵小樹苗。那時候它只有我的手掌那麼高，葉子也寥寥可數，風一吹就搖來搖去，好像隨時會倒。爸爸說，樹就像人一樣，需要時間慢慢長大，不能急，也不能天天把它拔出來看長高了沒。每天放學，我都會去澆一點水，也會除掉旁邊的小草，怕它們搶走樹苗的養分。有幾個禮拜，因為出遠門沒人照顧，樹苗的葉子竟然枯黃了，我急得差點哭出來，以為它要死了。回來以後，我和爸爸趕緊補水、鬆土，還搭了小小的遮陽網，過了幾天它才又冒出新芽，綠綠的讓人好安心。夏天的一場大風，把樹苗吹得歪歪的，我們趕快立了一根小木棍撐住它，用軟繩輕輕綁好。看著它一次次挺過困難，我學會了耐心這件事。耐心不是什麼都不做，而是每天穩穩地照顧，相信時間會給答案，就像農夫等待收成。現在，那棵樹已經比我還高，夏天還會開出白色的小花，引來蜜蜂和蝴蝶。我常想，當初那一點點的堅持，換來了多大的改變，連院子裡的風景都因為它而不一樣了。去年夏天，那棵樹第一次結出果實，雖然只有寥寥幾顆，我和爸爸卻開心得像撿到寶。我們把它摘下來分給鄰居，大家都說這是吃過最甜的味道，因為裡面藏著我們兩年的耐心。爸爸說，看著樹長大，就像看著我慢慢懂事，每一步都要穩穩的，急不得。現在每當我遇到功課卡住或比賽失利，就會去院子裡看看那棵樹，想起它也曾經歪歪斜斜，卻一次次挺了過來。樹教會我的事，比課本還清楚。',
    q:[
    {q:'我和誰一起種樹苗？',a:['爸爸','媽媽','老師'],c:0},
    {q:'文中「耐心」的意思是？',a:['穩定照顧不急躁','快速做完','不管它'],c:0},
    {q:'這棵樹以後可能會？',a:['越長越高開花','枯死','不再長'],c:0}
    ] },
  { title:'夜晚的小偵探', text:'晚上寫完功課，我最喜歡和家人玩一個遊戲，叫做安靜聽一聽。我們關掉電視，坐在窗邊，比誰先聽到最多的聲音，贏的人可以選明天的早餐。一開始，屋子裡安安靜靜的，連針掉在地上都聽得見，大家都不敢出聲。慢慢地，我聽到時鐘滴答滴答，像在數著時間；聽到冰箱偶爾嗡的一聲，像在打呼；還聽到窗外蟋蟀輕輕地叫，一下一下很有節奏。弟弟說他聽到媽媽在廚房洗碗的聲音，原來那是最大的發現，我們都笑說弟弟耳朵最靈。我們把聽到的聲音一筆一筆記下來，像小偵探在辦案，還畫了圖標註聲音從哪裡來。媽媽說，安靜不是什麼都沒有，而是讓我們聽見平常被忽略的細微聲音，那些聲音其實都在說家裡很安全、很溫暖。那個晚上，我發現原來家裡有這麼多溫柔的聲音在陪著我，時鐘是時間，冰箱是肚子餓，蟋蟀是夏夜。從此以後，我不再討厭安靜，反而期待每天這段屬於耳朵的探險，因為安靜裡藏著的，都是愛的聲音。你今晚，也試著安靜聽一聽吧，說不定會聽見意想不到的溫柔。上週的雨夜，停電了，家裡一片漆黑，弟弟害怕得想哭。我拉著他的手，輕聲說我們來玩安靜聽一聽。於是兩個人坐在棉被裡，聽雨打在窗戶上的聲音，聽風從縫隙鑽進來的呼呼聲，還有爸爸在客廳裡走動找蠟燭的腳步。弟弟漸漸不哭了，甚至小聲說，原來黑暗裡也有聲音陪著我們。那晚我們靠著聽聲音撐過停電，還比平常更早睡著。我忽然懂了，安靜不是無聊，而是一種能讓心定下來的神奇遊戲，隨時隨地都能玩。',
    q:[
    {q:'我們玩的遊戲叫做什麼？',a:['安靜聽一聽','捉迷藏','大聲喊'],c:0},
    {q:'文中「安靜」讓我們能？',a:['聽見細微的聲音','什麼都聽不到','睡著'],c:0},
    {q:'弟弟可能還會聽到什麼？',a:['更多家裡的聲音','外星人','沒聲音'],c:0}
    ] },
  { title:'搬新家', text:'這個月，我們家要搬到城市的另一頭。聽到消息時，我的心裡又期待又緊張，期待的是新家有一間屬於自己的房間，緊張的是要離開住了十年的老社區。打包的那幾天，我看著書桌、玩具和窗簾一件件被裝進紙箱，忽然發現，原來這些舊東西裡，藏著好多回憶。紙箱上寫著房間的名字，媽媽說這是給新家最好的地圖。搬家當天，搬家公司的叔叔搬得滿頭大汗，爸爸在旁邊指路，還一直說輕一點、慢一點。到了新家，我發現房間比我想像的還大，窗戶外面能看到遠遠的山，傍晚的時候，山會被夕陽染成橘紅色，像一幅會變色的畫。雖然還不認識新鄰居，也不熟悉附近的路，但我已經在書桌上貼了最喜歡的海報，把舊棉被鋪好，房間慢慢有了熟悉的味道。我想，家不是房子本身，而是我們把回憶和愛放進去的地方；只要一家人在一起，不管搬到哪裡，都會慢慢變成溫暖的家。說不定過幾天，我就會在樓下遇見跟我一樣愛踢球的新朋友，一起把新社區的每個角落都走一遍。媽媽還在新的廚房烤了第一盤餅乾，香味飄滿客廳，我們一邊吃一邊在日曆上圈出開學的日子。我發現，其實離開舊家沒有我想的那麼可怕，因為真正重要的東西，我們都帶在身邊了。晚上我和新鄰居的小孩在樓下踢球，他笑著說以後我們就是好朋友了，那一刻，老社區的回憶忽然有了接棒的人，未來的故事才正要開始。',
    q:[
    {q:'搬家時我的心情主要是？',a:['期待又緊張','只有開心','非常生氣'],c:0},
    {q:'文中「回憶」指的是什麼？',a:['舊東西裡藏的故事','金錢','食物'],c:0},
    {q:'你覺得我搬到新家以後，會發生什麼？',a:['認識新朋友','一直孤單','馬上搬走'],c:0},
    ] },
  { title:'校園的老樹', text:'我們學校操場旁邊，有一棵很老很老的榕樹，聽說比校長的年紀還大。它的樹幹粗粗的，要好幾個小朋友手拉手才抱得完，綠色的葉子一年四季都不掉，像撐開的一把大傘。下課的時候，我們最喜歡跑到樹下乘涼，有的看書，有的玩棋子，還有人把秘密寫在小紙條上，偷偷塞進樹洞裡。有一次，颱風把一根大樹枝吹斷了，掉在跑道上，大家以為老樹要撐不住了。沒想到幾個星期後，斷掉的地方竟然冒出嫩嫩的新芽，綠得讓人眼睛一亮。自然老師說，榕樹的生命力很強，只要根還在土裡，它就會一直長。後來我們班發起認養老樹的活動，輪流幫它澆水、撿落葉，還在樹幹上掛了一塊小木牌，寫著我們對它的祝福。我看著那塊木牌在風裡輕輕晃動，忽然覺得，這棵樹不只是植物，更像一位安靜的老人，看著一批批學生長大又離開。我想，等我畢業以後，老樹還會站在那裡，繼續守護下一個在樹下許願的小孩，把大家的秘密和笑聲，一年一年收藏起來。春天來的時候，老樹結的小果子被小鳥吃下，種子被帶到操場另一頭，竟也冒出了小苗。我們小心地把小苗移到花圃邊，像照顧弟弟妹妹一樣看著它長大。老樹看著新一代的生命從自己身邊展開，彷彿在笑著說，沒關係，我已經把故事交給你們了。下課時我們依舊跑到樹下，只是現在多了一群一年級的小鬼頭，跟我們當年一樣，把願望藏進同一個樹洞裡，讓老樹繼續聽著一茬又一茬孩子的秘密。',
    q:[
    {q:'這棵老樹是什麼樹？',a:['榕樹','松樹','櫻花樹'],c:0},
    {q:'文中「生命力」指的是？',a:['斷枝後仍長出新芽','樹長很高','葉子很多'],c:0},
    {q:'你覺得這棵老樹未來會怎樣？',a:['繼續守護學生','很快枯死','被砍掉'],c:0},
    ] },
  { title:'第一次煮晚餐', text:'週六晚上，爸媽臨時有事出門，留我一人在家。我看冰箱裡有雞蛋、青菜和麵條，就鼓起勇氣，決定自己煮一餐簡單的晚餐。我先洗好青菜，水龍頭沖在葉子上，把泥巴一點點沖掉，綠油油的看起來很新鮮。接著我學媽媽的樣子，在鍋裡加水煮開，把麵條放下去，再用另一個鍋煎蛋。第一次拿鍋鏟，手有點抖，蛋黃差點破掉，我趕快把火關小，總算煎出一個圓圓的太陽蛋。最難的是調味道，我怕太鹹又怕沒味，試著加一點醬油，再嚐一口，來回加了三次才覺得剛好。端上桌的時候，雖然賣相沒有媽媽煮的好看，麵條也有點黏在一起，但我吃得很滿足，因為這是第一次靠自己做出來的飯。吃完我還把碗盤洗乾淨，擺回原位，想像媽媽回來驚訝的表情。那晚我學到一件事：嘗試不一定完美，但每一次動手，都會讓自己更獨立一點。下次爸媽再不在，我想挑戰煎魚，雖然可能會手忙腳亂，但至少我已經不怕走進廚房了。那晚爸媽回來，看見洗乾淨的碗盤和桌上的空碗，驚訝得合不攏嘴，還拍照傳給阿公看。阿公回傳語音說，會煮飯的孩子，走到哪裡都不會餓著，這比考一百分還讓他放心。聽完我才懂，原來走進廚房不只是做飯，也是在學習怎麼照顧自己和在乎的人。現在每週六我都主動進廚房幫忙，媽媽說我切菜的樣子，已經有點大廚師的架勢了，聽得我心裡甜滋滋的，也更懂了家人之間互相照顧的滋味。',
    q:[
    {q:'我第一次煮晚餐做了什麼麵？',a:['雞蛋青菜麵','牛肉麵','義大利麵'],c:0},
    {q:'文中「嘗試」的意思是？',a:['自己動手試做','放棄不做','等別人做'],c:0},
    {q:'下次我想挑戰什麼？',a:['煎魚','煮飯糰','烤蛋糕'],c:0},
    ] },
  { title:'圖書館的午後', text:'放學後，我常去家裡附近的圖書館。那裡很安靜，只有翻書的沙沙聲和偶爾的腳步聲，走進去就會不自覺放輕腳步。二樓的兒童區，書架排得像一座座小迷宮，我總是先跑到科普那排，抽出一本關於星星的書，找個靠窗的位置坐下。窗戶外面是學校的操場，我邊讀邊看陽光在書頁上跳動，好像連知識也變得暖暖的。圖書館的阿姨很溫柔，有一次我找不到恐龍的書，她帶我繞了半圈，還教我怎麼看分類號，說只要記住數字，下次就能自己找到。後來我辦了一張借書證，每週都借兩本回家，床頭堆起小書堆，睡前讀幾頁，夢裡都會出現書裡的畫面。我發現，圖書館像一個不用錢的魔法屋，只要願意翻開書，就能去任何地方旅行，當太空人、當探險家、當古代的小書僮。安靜的午後，因為有書，變得既充實又自由。我想，等我識字更多，一定會把整排科普書都讀完，再走向更厚的故事書，讓心裡的世界一天比一天大。上週圖書館辦了說故事比賽，我鼓起勇氣報名，把那本星星的書講給低年級的同學聽。看著他們睜大眼睛的樣子，我忽然懂了借書證不只是借書，還能把喜歡的東西分享出去。回家的路上，書包裡多了一本新借的恐龍百科，我想，明天的午後，又會是一場新的旅行。圖書館的燈，把每個午後都照得溫溫的，而我也在那一頁頁書裡，慢慢長出了一雙能飛向遠方的翅膀，知道世界比想像中更大、也更值得去讀。',
    q:[
    {q:'我常去圖書館的哪裡看書？',a:['兒童區靠窗','廚房','操場'],c:0},
    {q:'文中「魔法屋」比喻的是？',a:['圖書館能帶人去各處','真正的城堡','遊樂場'],c:0},
    {q:'我以後想讀什麼書？',a:['更厚的故事書','漫畫','課本'],c:0},
    ] }],
  high: [
  { title:'端午節的由來', text:'每年端午節，家家戶戶吃著粽子、看著河面上的龍舟競賽，空氣裡飄著粽葉的香味，孩子們手上繫著五彩的絲線，笑聲傳遍河岸。這項古老的傳統，背後藏著一段動人的故事。很久以前，有一位名叫屈原的愛國詩人，眼看國家將要被敵人打敗，心裡非常悲痛，最後抱著石頭投入汨羅江中，結束了自己的生命。百姓聽到消息，非常難過，紛紛划著船去江裡尋找他，還把米糰丟進河裡，希望魚兒吃米、不要去咬傷詩人的身體，讓他能夠安息。後來，這個舉動慢慢演變成包粽子的習俗，划船找人也變成了熱鬧的龍舟比賽，一年一年傳了下來。直到今天，這些活動仍讓我們記得祖先的智慧與情感，也把家人團聚的溫暖一代代傳下去。除了吃粽子、看龍舟，有些地方還會在門口掛艾草、佩香包，用各種方式祈求平安，驅走不好的運氣。節慶不只是放假，更提醒我們從哪裡來、哪些價值值得珍惜。那天的分享會上，阿公說起小時候端午要去河邊看龍舟，奶奶會在門口掛菖蒲驅邪，還會煮一鍋香香的草藥水給孩子洗澡。聽著聽著，我發現節日不只是吃喝，更是一代一代把祝福傳下去的方式，是長輩把記憶交給孩子的儀式。而我們這一代，也有責任把這份記憶繼續說給下一代聽，不然再熱鬧的習俗也會慢慢被忘記。原來一條龍舟劃過的不只是水，還是大家齊心協力的精神；守護這些傳統，就是守護我們自己的根，也守護下一代的記憶。當我們包粽子的時候，包的也不只是糯米和肉，而是把思念和感謝一層一層捲進葉子裡，再用繩子綁得緊緊的。我想，這就是端午節留給我們最珍貴的功課：記得來時路，也把愛傳下去。不同地方還有不同口味的粽子，北部粽和南部粽做法不一樣，甜的鹹的各有擁護者，卻都承載著同樣的祝福。傳統從來不是僵硬的規矩，而是活著的故事，只要我們還願意動手包、開口講，它就不會消失。今年端午，我第一次跟著奶奶學包粽子。糯米要先泡一個晚上，粽葉得一張張洗乾淨、煮軟，才不會在綁的時候破掉。奶奶的手很巧，三兩下就包出一個尖尖的三角粽，我卻怎麼都學不會，米一直從縫裡漏出來，惹得全家哈哈大笑。包好以後，我們把粽子放進大鍋裡煮，整間屋子都飄著葉子的清香，那味道讓人想起小時候的過節。奶奶一邊煮一邊說，以前物資少，粽子是難得的美味，孩子們總盼著過節能多吃一個；現在雖然隨時買得到，但自己包的才有團圓的味道。我終於明白，傳統不是博物館裡的舊東西，而是可以走進廚房、走進生活、走進我們手裡的溫度。當我們把這些手藝一代代傳下去，節日就有了靈魂，而不只是日曆上的一個紅字。或許將來我也會像奶奶一樣，教我的孩子包粽子、說屈原的故事，讓這份記憶在他們心裡發芽。那時候我會告訴他們，端午真正的意義，是記得我們從哪裡來，也願意把溫暖送給下一代。',
    q:[
    {q:'端午節包粽子、划龍舟，是為了紀念誰？',a:['愛國詩人屈原','一位將軍','一個漁夫'],c:0},
    {q:'這篇文章主要在說什麼？',a:['端午節的由來與傳承的意義','怎麼做粽子最好吃','龍舟比賽的規則'],c:0},
    {q:'從文中可以推論，掛艾草、佩香包的目的是？',a:['祈求平安、驅邪','裝飾好看','賣錢'],c:0},
    {q:'作者認為守護傳統等於什麼？',a:['守護自己的根與下一代記憶','只是放假休息','沒什麼意義'],c:0}
    ] },
  { title:'失敗的價值', text:'許多人害怕失敗，遇到挫折就想放棄，但其實失敗往往是學習的最好機會，是我們偷偷進步的時候。發明家愛迪生為了做出耐用的燈泡，前後嘗試了幾千種材料，屢屢碰壁，實驗室裡堆滿了失敗的樣品。有人笑他浪費時間，他卻回答：我沒有失敗，只是找到幾千種行不通的方法。正是這份堅持，讓他最後成功，把光亮帶進了千家萬戶。當我們遇到困難，與其馬上放棄，不如先靜下來思考哪裡出錯，調整方法再試一次，常常會發現上次的差錯正好是這次的地圖。每一次跌倒，其實都是靠近成功的一步；重點不是不摔跤，而是摔了之後願意再站起來，拍掉灰塵繼續走。失敗像一面鏡子，照出我們還沒練好的地方，也教我們更謙虛地看待自己的能力，不再以為自己什麼都會。後來我在自然課做實驗，第一次點燃酒精燈手還發抖，失敗了好幾次才成功；體育課學騎單車，也是摔了幾次才終於平衡。我想起愛迪生的話，便不再慌張，原來課本上那句失敗為成功之母，不是口號，而是真的要一次次練習，才會把手變穩、把心變定。把每一次不順利都當成練習的機會，時間久了，原本覺得困難的事，也會慢慢變得容易。真正厲害的人，不是從不失敗，而是失敗以後，比昨天多懂一點點，比上次更有方法。我們班的合唱團第一次比賽名次墊底，大家很難過，卻沒有解散，反而更認真練聲音和默契，第二年就拿了獎。失敗沒有擊倒他們，反而讓他們更團結。所以當你下次考砸、做錯、被退回的時候，別急著討厭自己，先問問這次學到了什麼。失敗不是終點，而是一張寫滿筆記的練習紙，等你把上面的功課都學會，成功就會在下一個轉角等你。這學期我參加演講比賽，初賽就被刷下來，站在台下看著別人領獎，心裡酸酸的。回家以後，我把稿子重新寫了三遍，還錄下自己的聲音反覆聽，找出哪裡卡頓、哪裡太急。媽媽陪我練到喉嚨沙啞，卻從來沒說放棄。下學期再比，我居然進了決賽，雖然沒拿第一，但評審說我的進步最明顯。那一刻我懂了，真正的獎勵不是名次，而是那幾個禮拜裡，我把怕的事練成了熟的事。後來我把這段經驗寫進週記，老師給我批了一句：跌倒的地方，往往長出最結實的肌肉。我把這句話抄在書桌前，每次想偷懶就抬頭看看。失敗不再是我躲著走的影子，而成了我願意面對的老朋友，因為我知道，它每次出現，都是在提醒我：你還可以更好，只是需要再多試一次。我們班的黑板旁，後來多了一欄叫做「今天我失敗了什麼」的小格子，每個人輪流寫下自己這週搞砸的事，以及從中學到的東西。一開始大家都不好意思寫，後來發現，原來每個人都在跌跤，寫出來反而覺得輕鬆，也更敢去挑戰沒做過的事。期末時，那欄貼得滿滿的，老師說這才是我們班真正的成績單——不是從不失誤，而是每一次失誤都變成了往前走的墊腳石。我想，這就是失敗留給我們最珍貴的禮物：它教會我們，人生不是直線通往成功，而是一圈一圈，在錯誤裡慢慢磨出更好的自己。',
    q:[
    {q:'愛迪生為了燈泡嘗試了多少次？',a:['幾千次','一次','兩次'],c:0},
    {q:'這篇文章想告訴我們什麼？',a:['失敗是學習的機會','失敗很丟臉不要提','不要嘗試'],c:0},
    {q:'從文中可以推論，面對困難最好的做法是？',a:['思考再試一次','馬上放棄','不管它'],c:0},

    ] },
  { title:'網路安全小學堂', text:'現在許多同學用手機或電腦上網路，方便又好玩，手指點一點就能查資料、看影片、和朋友聊天。媽媽卻提醒我：網路雖好，也要小心，因為螢幕後面的世界不全是友善的。首先，不要把個人的照片或住址隨便給陌生人，哪怕對方說自己是同年紀的朋友，也要先和朋友或大人確認；其次，看到免費領禮物、抽大獎之類太誘人的訊息，千萬別輕易相信，那很可能是詐騙，目的是騙走你的帳號或金錢。遇到奇怪的內容，或者有人傳奇怪的連結給你，一定要告訴信任的大人，不要自己偷偷點開。學會保護自己，網路才會是陪伴我們學習、探索的好工具，而不是藏著危險的陷阱。記住：方便不代表安全，多一分警覺，就少一分危險。真正的自由，是建立在懂得保護自己之上的；當我們知道怎麼安全地使用網路，世界才會為我們打開更多學習的大門。例如，設定不容易猜到的密碼、不在公共電腦留下帳號，都是守護自己的小小習慣。媽媽還說，遇到不舒服的內容要馬上關掉並告訴大人，而不是自己憋著，因為憋著只會讓害怕變大。網路像一座大圖書館，裡面有寶藏也有陷阱，會保護自己的人，才能安心地在裡面找知識。懂得保護自己，網路才會是幫我們長知識的好朋友。除了防詐騙，我們也要注意網路禮貌，不在留言區霸凌別人，也不隨便轉傳沒有根據的謠言，因為一句話在網上傳得比在教室裡快太多了。還有，滑手機的時間要懂得停下來，保護眼睛也保護睡眠，才不會變成低頭族。網路是工具，不是主人，我們要當它的主人。這份警覺與分寸，會陪著我們平安長大，也讓科技真正成為幫助我們的好幫手，而不是綁住我們的繩子。前陣子，班上的小美差點受騙。有人在遊戲裡私訊她，說只要填寫家長的信用卡號，就能免費升級裝備。小美覺得可疑，先來問我，我們一起去告訴老師，老師立刻請家長封鎖那個帳號。事後小美說，還好當時多問了一句，不然家裡可能損失一大筆錢。這件事讓全班都警覺起來，我們甚至辦了一場小型的網路安全分享，把常見的詐騙手法一條條列出來，貼在教室牆上提醒大家。我也學會了一個好習慣：任何要我輸入密碼或個資的頁面，都先停下來想一想，必要時找大人確認。網路世界變化很快，新的陷阱層出不窮，但我們手裡有一把最穩的傘，那就是冷靜與懷疑。願意多想一下、多問一句，就能把危險擋在門外，讓網路真正成為幫我們長知識的好朋友，而不是偷走我們安全的黑手。放學後，我和幾個同學組了一個小小宣導隊，每週輪流在班級群組分享一則辨識詐騙的小知識，例如假投資、假中獎、假冒親友借錢這些常見套路。一開始只有幾個人看，後來大家發現真的有用，連家長都轉發給親戚。媽媽說，你們這群孩子比廣告還有效，因為你們講的是同齡人聽得懂的話。我也從中學到，保護自己不只要會躲，還要把知道的教給別人，讓更多人都撐起同一把傘。網路會一直變，但我們學會的判斷力不會過期；只要願意保持清醒、互相提醒，再新的陷阱也騙不倒一顆有準備的心。',
    q:[
    {q:'文中說不要把什麼給陌生人？',a:['個人照片和住址','玩具','課本'],c:0},
    {q:'這篇文章主要在提醒什麼？',a:['上網要保護自己、提高警覺','網路都不安全不要用','密碼越簡單越好'],c:0},
    {q:'看到免費領禮物這類訊息，應該？',a:['提高警覺可能是詐騙','立刻相信','轉給所有人'],c:0},
    {q:'作者認為真正的自由建立在什麼上？',a:['懂得保護自己','不管別人','隨便分享'],c:0}
    ] },
  { title:'教室裡的多元文化', text:'我們的班上有來自不同背景的同學：有人和家人過聖誕節，有人在除夕夜圍爐吃年夜飯，還有人慶祝開齋節，在那之前整整一個月，他們白天都不吃東西，直到太陽下山才吃飯。剛開始，大家對彼此的習慣感到好奇又有點陌生，有人甚至誤會對方的食物奇怪。老師說，這就是多元文化：雖然我們的語言、食物和節日不同，但都生活在同樣的城市、讀同一所學校，擁有同樣的夢想。只要彼此尊重、互相了解，差異不但不可怕，反而讓我們的班級更豐富，像一盒有各種顏色的蠟筆。學會接納不同，我們才能在多元的社會中和諧相處，將來長大也才不會因為不了解而害怕陌生人。當我們願意聽懂別人的故事，世界就會從和我一樣變成和我不同但都珍貴。那天的分享會上，我們嚐了彼此帶來的點心，才發現原來不一樣的滋味，拼起來竟是一桌最熱鬧的風景，有人帶聖誕薑餅，有人帶湯圓，有人帶開齋節的甜點。下課後，我和過開齋節的同學學了句祝福的話，他也跟我學寫春聯，我們還約好明年交換節日的小禮物。當我們願意跨出一步認識彼此，教室就不再是單一顏色，而成了繽紛的調色盤，每個人都找到自己的一格。接納不同，世界才會更大、更溫柔；而我們的教室，也因為每個人不一樣，才變得格外精彩、豐富、溫暖又熱鬧。多元不是混亂，而是讓每個人都能被看見、被尊重。後來學校辦國際文化日，我們班負責介紹三個節慶，每個人輪流上台，本來害羞的同學也因為講自己家的傳統而眼睛發亮。我終於懂了，認識不同不是要誰改變誰，而是讓我們在看見別人的同時，也更珍惜自己的根。當許多不同的故事並排放在一起，我們讀到的不是衝突，而是一首更豐富的合唱。畢業前的同樂會，我們班做了一本「我們的故事」小書，每個人寫下自己家最特別的節日與食物，還畫上插圖。翻開那本書，就像走進一座小小的世界村：有人寫除夕夜的圍爐，有人寫開齋節的星空早餐，有人寫聖誕節交換禮物的驚喜。老師把我們的小書送給下一屆學弟妹，希望他們也能早點看見班級的多彩。我自己也因為這學期的相處，學會了用不同的眼睛看人：不再先問他哪裡不一樣，而是先想他帶來了什麼。家裡的餐桌也變熱鬧了，媽媽跟著同學媽媽學做異國料理，我們一邊吃一邊聽故事，笑聲比平常多了一倍。我越來越相信，世界很大，差異很多，但溫柔和尊重是大家都能聽懂的語言。當我們願意張開雙手接住不同，世界就會回送我們一座更寬廣的花園，裡面的每一朵，都因為不一樣而更美。畢業那天，我們把教室佈置成一條小小的世界街，每個角落代表一種文化，大家穿著代表性的服飾、擺出家常點心，連一向安靜的圖書館阿姨都來逛了一圈，說從沒見過教室這麼熱鬧又溫柔。我忽然覺得，多元不是課本裡的名詞，而是我們親手搭起的一座橋，讓不一樣的人，能從橋的兩頭走到中間相遇。長大以後，不管我走到哪裡，都會記得這間教室教我的事：看見不同時，先微笑，再傾聽，最後珍惜。因為正是這些不同，把原本平淡的日子，釀成了值得一輩子回味的風景。',
    q:[
    {q:'班上同學來自哪裡？',a:['不同家庭與背景','同一個家庭','外太空'],c:0},
    {q:'這篇文章的主旨是？',a:['尊重差異、和諧相處','排斥外來','只信自己'],c:0},
    {q:'文中「多元文化」指的是？',a:['大家習慣不同但共同生活','大家都一樣','只有一種文化'],c:0},
    {q:'從文中可以推論，願意認識彼此會帶來？',a:['更豐富溫暖的班級','吵架變多','大家不說話'],c:0}
    ] },
  { title:'螢火蟲回家的路', text:'山裡的夏夜，曾經到處閃著小小的綠光，那是螢火蟲提著燈籠在飛。小凡的阿公說，小時候整條溪邊都是螢火蟲，像天上的星星掉下來散步。可是後來，村子蓋了更多房子，路燈和招牌的亮光蓋過了螢火蟲微弱的光，水泥也鋪滿了溪岸，水邊的草叢越來越少。不只如此，農田用的藥劑順著雨水流進溪裡，讓水裡的小蟲變少，螢火蟲找不到食物，數量一年比一年稀少，最後幾乎看不到了。小凡讀到這段故事，心裡很難過，便和同學組了一個護螢小隊。他們先請村長把溪邊的路燈改成感應式，晚上沒人經過就自動變暗；再和農友商量，在溪岸留一條不噴藥的緩衝帶，讓草和昆蟲回來。每隔一段時間，他們就熬夜去數螢火蟲，把數字畫成曲線圖貼在活動中心。第一年只看到三隻，第二年十一隻，第三年已經三十幾隻，綠光慢慢回到了溪邊。村裡的大人也跟著動起來，有人把自家庭院的燈調暗，有人自願巡守不讓人電魚。小凡在心得裡寫：螢火蟲不是消失了，只是我們曾經忘了怎麼替牠們留一條回家的路；當我們願意關掉一點光、多留一點草，那小小的燈火就會一盞一盞重新亮起。這件事讓我明白，環境保護不是口號，而是具體的選擇，藏在每一盞燈、每一條水溝、每一次不忍心破壞的瞬間裡。去年夏天，村裡辦了第一場賞螢活動，小凡站在路口當小小解說員，告訴遊客為什麼不能開手電筒直照。看著孩子們屏住呼吸、看綠光在草叢裡飄動的眼神，他忽然懂了阿公當年的感動。或許我們這一代能做的有限，但只要每個人都願意從身邊小事開始，那些曾經離開的光，總有一天會沿著我們重鋪的路，安安靜靜地飛回來。保護自然，說到底，就是在保護我們自己童年的那片星空。有研究說，螢火蟲長成會飛的成蟲後，只能活短短幾週，卻用盡全力發光，彷彿想在被看見的時間裡，把世界點亮一次。我想，我們對環境做的每一件小事，也像那樣微弱卻認真的光。或許一個村子、一條溪的改變很小，算不上一百分的成績，但當三十幾隻綠光重新連成一片，那種希望是騙不了人的。願每個孩子長大後，都還記得山裡曾有螢火蟲，並願意為後面的孩子，留一盞燈、一條路、一片可以呼吸的草叢。小凡現在讀高中了，每逢暑假仍會回到山裡，帶著更小的孩子認識螢火蟲。他說，守護不是一次性的熱情，而是年年夏天都不缺席的約定。當年那三隻微弱的綠光，如今已經變成整條溪的星光，證明只要有人願意開始，自然的傷口是可以被溫柔癒合的。我們每一代人，都該為下一代留一點可以仰望的黑暗，好讓光有地方落腳。',
    q:[
    {q:'螢火蟲後來為什麼越來越少？',a:['光害、水泥與農藥破壞棲地','被鳥吃光','天氣太熱'],c:0},
    {q:'這篇文章主要在說什麼？',a:['人為改變環境讓螢火蟲減少，也能靠行動找回','怎麼抓螢火蟲','螢火蟲的種類'],c:0},
    {q:'從文中可推論，護螢小隊成功的原因是？',a:['具體改變光與棲地','只寫文章','等牠自己回來'],c:0},

  { title:'一封遲到的信', text:'國中開學那天，導師發下一疊舊信件，說是以前畢業生寄錯地址、被退回來堆在櫃子裡的。其中一封，收件人是「給十年後的自己」，寄件人寫著阿哲，日期是十年前。阿哲現在已經是個大人，收到這封遲到的信，又驚又笑。信裡寫著：那年的他，因為一場誤會和最好的朋友吵架，兩人賭氣互不說話，後來對方轉學，從此斷了聯絡。少年阿哲在信裡寫，如果十年後的自己還記得這件事，請一定要主動說聲對不起，不要把遺憾留一輩子。讀著讀著，成年的阿哲紅了眼眶，原來那個結他一直沒解開。他想起那個朋友小宇，小時候總把午餐的布丁分他一半，吵架只是因為一張被弄髒的畫，如今想起竟覺得幼稚又可笑。阿哲開始四處打聽小宇的下落，透過國中同學群組、社群網站，花了將近一個月，才終於聯絡上遠在外地的小宇。兩人在語音通話裡，先尷尬地笑，然後同時說出當年的對不起，彷彿十年的冰一下子融化。他們約好下個假期見面，要把那張弄髒的畫重新畫一張。阿哲把這段經過寫在回信裡，寄給十年前的自己，雖然永遠寄不到，卻讓他徹底放下。我從這個故事想到，人與人之間的傷口，往往不是大仇大恨，而是小小誤會被時間放大；而修補它，也不需要什麼大本事，只要一句主動的對不起，和一份不計較的心。可惜的是，很多人像當年的阿哲，總等著對方先開口，結果把最好的朋友，等成了通訊錄裡一個不敢點開的名字。所以若心裡還惦記誰，別讓面子擋住了真心，早一點說，就少一點遺憾。真正的長大，也許不是學會贏，而是學會在該低頭的時候，溫柔地彎下腰。那封遲到的信提醒我們：原諒別人，其實也是在放過自己，讓心裡那個少年，終於能夠安心長大。後來小宇把那張重新畫好的畫送給阿哲，畫裡兩個小男孩並肩坐在校門口，旁邊寫著「和好」兩個字。阿哲把它框起來，放在辦公桌上，每次和同事有意見不合，就抬頭看一眼，提醒自己先聽再說。他常對年輕同事說，職場或生活裡的誤會，往往撐不過一句真心的對不起；拖得越久，心裡的結就綁得越緊。那封十年前的信，像一顆遲到的種子，終於在成年後的土壤裡，長成了一棵會體諒的樹。這件事後來被阿哲寫成一篇短文，刊登在公司的內部刊物上，許多同事看了都默默想起自己生命裡那個還沒說對不起的人。他收到好多私訊，說謝謝你提醒我，我今晚就要打那通拖延已久的電話。原來一封遲到的信，不只修補了他自己的遺憾，還像一顆小石子，在別人心裡也漾開了勇氣的漣漪。原諒，果然是會傳染的。',
    q:[
    {q:'阿哲當年和誰吵架？',a:['最好的朋友小宇','老師','陌生人'],c:0},
    {q:'這篇文章的主旨是？',a:['主動道歉能化解多年遺憾','不要交朋友','轉學比較好'],c:0},
    {q:'從文中可推論，阿哲花多久才聯絡上小宇？',a:['將近一個月','一天','十年'],c:0},

    ] },
  { title:'山上的郵差', text:'在偏遠的山區，有一條郵路要翻過三座山頭，冬天還會積雪結冰。老郵差林伯在這條路上走了三十年，風雨不改，連除夕夜都曾踩著雪送信。他背著沉甸甸的郵包，手裡拿著一根木棍當柺杖，一步一步往山上的部落走。部落裡多是老人家，孩子大多到平地讀書或工作，家書和藥品幾乎都靠林伯帶上去。有一次，一位阿嬤高燒不退，家裡又沒人，是林伯發現異常，趕緊幫她聯絡山下的醫生，還在路滑的夜裡陪著撐到救援到來。阿嬤後來常說，林伯送來的不只是信，還有命。年紀大了以後，林伯的腳力不如從前，單位想把他調到平地的輕鬆崗位，他卻搖頭，說山上的老人等信等到望眼欲穿，換了生面孔他們會不安。他帶了一個年輕徒弟小鄭，一邊走一邊教，怎麼認路、怎麼和長輩說話、哪戶人家行動不便要多停留。小鄭起初抱怨路遠又無聊，直到看見一位失明阿公聽到林伯腳步聲，就笑著喊「信來囉」，那種被等待的溫度，讓他忽然懂了這份工作的重量。幾年後，林伯退休，小鄭正式接下郵包，繼續翻山越嶺。有村民問，現在都有手機和網路，還需要郵差嗎。林伯笑著說，螢幕裡的訊息很快，但手寫的信有手溫，老人家摸著信封，知道有人惦記，那種安心，是訊息取代不了的。我從林伯身上看見，所謂的責任，不是轟轟烈烈的大事，而是把一件平凡的事，日復一日認真做好；所謂的傳承，也不是把工作丟給別人，而是把心裡的那份溫柔，也一併交了出去。山還在，路還長，那個揹著郵包的背影，會一代一代，走進更多等待的心裡。有回下大雨，山路塌方，小鄭揹著郵包繞了兩小時的遠路，只為了把一位阿公的藥準時送到。阿公握著他的手直說傻孩子，小鄭卻說，當年林伯也是這樣走過來的。村裡的孩子現在看到郵差，不再只想到信件，而會想到那個風雨裡撐傘的身影。我想，所謂的榜樣，不是站在台上說教，而是把責任默默走成一段路，讓後來的人，自然而然跟著踩上同一個腳印。責任的重量，原來就藏在這樣一步一步的腳印裡。林伯偶爾會回山上看一眼，看見小鄭熟門熟路地揹著郵包，和長輩們說笑的模樣，簡直就像當年的自己。他悄悄退出人群，沒打擾，只是嘴角帶著笑。他明白，真正的傳承從來不需要隆重的交接，而是在日常的一步一腳印裡，自然完成了。那條翻過三座山的郵路，因為有了一代又一代不願鬆手的人，會一直亮著燈，安靜地等著每一個期盼信件的人回家。而這，或許就是林伯走了一輩子，最想留下的風景。那燈光，會一直亮在每一個等待的人的心裡，成為山裡最溫柔的座標。',
    q:[
    {q:'林伯在山上送信送了多少年？',a:['三十年','三年','一年'],c:0},
    {q:'這篇文章主要在表現什麼？',a:['平凡堅持中的責任與溫柔','郵差很好賺','網路比較快'],c:0},
    {q:'從文中可推論，年輕徒弟小鄭後來？',a:['接下郵包繼續送信','辭職離開','討厭山區'],c:0},
    {q:'林伯認為手寫信比訊息珍貴的原因是？',a:['有手溫、讓老人安心','比較便宜','比較快'],c:0},
    ] },
  { title:'會說話的垃圾桶', text:'學校的走廊角落，擺著一個特別的垃圾桶，桶身貼著一張笑臉貼紙，旁邊還立了個小牌子寫著：丟對垃圾，我會跟你說謝謝。這是五年級的姿姿和幾個同學做的環保企劃。他們發現，午餐後的走廊總是散落紙巾、果皮和塑膠袋，大家隨手亂丟，清潔阿姨要彎腰撿很久。於是他們先用紙板做了一個會發聲的裝置，只要有人把資源垃圾丟進正確的格子，感應器就會播出錄好的童聲：謝謝你，地球更健康囉。一開始，同學們覺得好玩，都搶著分類丟，走廊明顯乾淨了。但幾天後新鮮感過去，又有人開始亂丟。姿姿沒有放棄，她們把牌子換成漫畫，畫出垃圾進錯桶會讓小魚誤食塑膠；又辦了一場分類闖關遊戲，答對的人可以幫笑臉貼紙塗顏色。漸漸地，正確丟垃圾變成一種默契，連一年級的小弟弟都會指著桶子說這是給寶特瓶的。學期末，清潔阿姨說她的工作輕鬆了一半，還送給她們一張手寫卡片。姿姿在報告裡寫：改變一個習慣，靠的不是罵人，而是讓人看見自己的行動有意義；當感謝被說出口，更多人就願意把手舉起來做對的事。我從這件事體會到，許多看起來難解的問題，未必需要龐大的力量，有時只是一個小裝置、一句溫柔的提醒，就能把冷漠的角落點亮。更重要的是，姿姿沒有等別人來解決，而是自己成為那個開始改變的人。環境也好，生活也好，與其抱怨亂糟糟，不如動手做一個會說謝謝的垃圾桶，把善意具體地擺在別人面前。當越多人因為被感謝而微笑，那個原本不起眼的角落，就會慢慢長出一群願意守護的人，而改變，也就從這裡悄悄發生了。學期末的分享會上，姿姿把那張清潔阿姨寫的卡片投影出來，上面畫著一個笑瞇瞇的垃圾桶。台下的同學這才發現，自己隨手的一個動作，真的能減輕別人的辛苦。後來別的班級也開始做類似的小裝置，有人做了會提醒關燈的貼紙，有人做了分類海報。改變像一圈水波，從一個角落散開，慢慢碰到了更多人。我想，這就是姿姿想說的：你不需等到長大才有力量，現在動手做一個小小的善意，就足以讓世界溫柔一點點。如今那個會說謝謝的垃圾桶，被學校留作永久展示，旁邊多了好幾個由不同班級認養的「環保小幫手」。姿姿升上六年級後，把企劃交給了學妹，就像當年清潔阿姨把溫暖傳給她一樣。她說，改變最動人的地方，不在於一開始有多熱鬧，而在於有沒有人願意接手，讓善意不要斷電。當感謝成了校園的習慣，那個不起眼的角落，也就真的成了所有人一起守護的家。而家，原本就是從一個被看見的善意開始的。',
    q:[
    {q:'會說話的垃圾桶是誰做的？',a:['姿姿和同學','清潔阿姨','老師'],c:0},
    {q:'這篇文章主要在說什麼？',a:['用小巧思和感謝帶動習慣改變','怎麼罵人','垃圾桶會走路'],c:0},
    {q:'從文中可推論，為什麼後來大家願意正確丟垃圾？',a:['看見行動有意義、被感謝','被處罰','怕扣分'],c:0},
    {q:'作者認為改變習慣靠的是什麼？',a:['讓人看見意義的溫柔提醒','大聲責罵','等別人解決'],c:0},
    ] }
  ],
  jr: [
  { title:'「被看見」的焦慮', text:'「這張照片發出去，會不會沒人按讚？」小雅盯著手機螢幕，反覆刪掉又重寫那句話，已經超過半個小時。她不是不知道自己寫了什麼，而是害怕發出之後，得到的不是關心，而是一片安靜。在社群媒體發達的今天，許多青少年像小雅一樣，把被看見、被喜歡，當成衡量自己值不值得被肯定的證明。每當貼文得到的回應少，就會悄悄懷疑自己是不是不夠好；每當滑到別人精緻的生活照，又忍不住拿來和自己的日常比較，結果愈比愈焦慮，甚至不敢再發任何東西。然而，心理學家提醒我們，社群媒體上呈現的，多半是別人精心挑選過的片段，不是完整真實的人生。別人曬出的旅行、禮物和新衣服，背後同樣有疲憊、爭吵和煩惱，只是很少人會把這些放上網。也就是說，我們拿自己的全部，去比別人的高光時刻，本來就不公平。更值得思考的是：按讚的數字，真的能代表一個人的價值嗎？如果一則溫柔鼓勵的留言只有兩個人看見，而一張炫目的自拍有一千個讚，前者就一定比較沒有價值嗎？當我們習慣用數字衡量自己，就容易忘了真實的友誼，往往藏在那些不被看見的陪伴裡：考不好時陪你走路回家的人、生病時幫你抄筆記的人。研究也發現，過度依賴社群回饋的人，情緒更容易隨著讚數起伏；而那些把社群當成聯絡工具、而不是成績單的人，反而過得比較輕鬆。這不是要我們完全不用社群媒體，而是提醒自己：它是工具，不該變成評價自己的尺。我的同學小傑曾經為了拍一張看起來很認真讀書的照片，花了半小時排書、調燈光，卻一個字也沒讀進去；後來他關掉按讚數的顯示，反而第一次靜下心把作業寫完。他的經驗說明，當我們不再盯著那個數字，注意力才會回到事情本身。還有一種常見的循環是：滑得愈久，愈怕錯過別人在做的事，這種錯失恐懼讓人更離不開手機，卻也愈覺得空虛。我的朋友阿芸曾經消失在社群一整個月，去參加山上的營隊，回來後她說，少了每天刷動態，她反而記住了營火的味道、記住了和朋友聊到半夜的話，那些真實的片段比任何貼文都清晰。這讓她明白，快樂不一定需要被看見才成立。說到底，一個人的價值，藏在他怎麼對待他人、怎麼面對困難，而不是藏在一個會跳動的數字裡。社群媒體可以幫我們記錄生活，卻不該替我們定義生活。下一次，當你為了一張照片反覆猶豫，不妨把手機放下三分鐘，問問自己：如果這則動態永遠沒人按讚，它對我來說還有意義嗎？如果答案依然是肯定的，那就發出去——為自己，而不是為那顆愛心。長期下來，試著關閉按讚數的顯示、把焦點放回真實相處，會發現少了那個數字，生活並沒有變差，反而多了一點自在。其實，社群媒體本身沒有善惡，它像一面鏡子，照出我們有多在意別人的眼光。與其責怪平台，不如練習當自己的主人：該看的時候看，該關掉的時候關掉。當我們能把價值的尺拿回自己手裡，那些愛心圖案就只是點綴，而不再是衡量自己的秤。心理學上把這種現象稱為社會比較，本來是人之常情，但無限滑動的動態牆把它放大成每天都要面對的壓力。承認自己會在意，並不可恥；重要的是，在意之後，仍然選擇相信真實的自己比那個數字更豐富。如果你願意，今晚就試一次：發一張照片，然後立刻把手機放進書包，去做一件你喜歡的事。一小時後再打開，你會發現，世界沒有因為少了幾個讚而改變，而你已經多讀了幾頁書、多走了幾步路。最後，別忘了感謝那些不會出現在動態牆上的人——他們的陪伴，比一千個讚都真實。社群媒體是時代的禮物，懂得使用它的人，會讓禮物為自己加分，而不是被禮物牽著走；從今天起，做自己螢幕的主人。', q:[
    {q:'根據本文，許多青少年把「被看見、被喜歡」當成什麼？',a:['自己值不值得被肯定的證明','成績單的分數','父母的期望'],c:0},
    {q:'作者認為拿自己的全部去比別人社群媒體上的高光時刻，有什麼問題？',a:['不公平，因為那只是別人挑選過的片段','很準確，能反映誰比較成功','沒有問題，比較才會進步'],c:0},
    {q:'文中提到，情緒較不受讚數影響的人，通常怎麼對待社群媒體？',a:['當成聯絡工具，而非成績單','完全不使用','只發受歡迎的內容'],c:0},
    {q:'根據本文，面對社群媒體較健康的做法是？',a:['提醒自己是工具，並反思發文動機','完全刪除帳號','只發受歡迎的內容'],c:0}

  { title:'把作業交給 AI，我們學到什麼？', text:'「作業交給 AI 寫，算是學會了嗎？」這個問題，最近在許多學校裡被認真討論。人工智慧可以在幾秒鐘內寫出一篇流利的作文、解出一道數學難題，甚至幫你翻譯一整本外文小說。對學生來說，它像一個永遠不累的家庭教師，隨叫隨到，難怪愈來愈多人碰到作業就先打開它。然而，便利的另一面，是一個不容易回答的問題：當我們把作業交給人工智慧，我們到底學到了什麼？支持使用的人認為，AI 能示範好的寫作結構，幫我們快速查資料，讓學習更有效率；就像計算機發明以後，我們不再花時間練繁複的筆算，而是把力氣用在理解觀念上。反對的人則擔心，如果連思考的過程都交給機器，大腦就會慢慢退化——就像一直坐電梯的人，腿會愈來愈沒力，有一天要爬樓梯就會喊累。其實，關鍵不在用不用 AI，而在怎麼用。我們班的美玲和志明給了兩種對比：志明直接把題目貼進去、複製答案交差，考試時同樣的題型他卻一題也答不出來；美玲則先自己寫完，再請 AI 幫她找出論證鬆動的地方，最後親手改寫。期末時，美玲的表達明顯進步，志明卻停留在原地。有老師做過一個實驗：一組學生直接抄 AI 的答案，另一組學生先寫再請 AI 批改。一週後測驗，後者的成績明顯更好，因為他們的大腦真正經歷了犯錯、修正、理解的過程。這告訴我們，學習真正的收穫，往往不在那份交出去的作業，而在你為它絞盡腦汁的那段時間。工具會愈來愈聰明，但願意自己想清楚的能力，是任何機器都替不了的。未來的世界需要的，不是會按按鈕的人，而是知道該問什麼問題、能判斷答案對錯的人。更重要的是，當答案來得太容易，我們可能失去提出好問題的習慣——而會問問題，往往比會背答案更重要。懂得把 AI 當助手而不是當替身，才是這一代孩子最該練起來的本事：用它來列大綱、查資料、改錯字都很好，但親手把句子寫好、把論點想透，才是真正長在身上的能力；否則考卷上沒有 AI 的那一天，我們會發現自己什麼也沒帶走。學校其實不必全面禁止 AI，反而可以教學生怎麼負責任地使用它：在作業上註明哪些地方參考了 AI、哪些是自己想的，讓誠實變成習慣。當我們能清楚區分我的想法和工具的建議，AI 才真正成了幫手，而不是遮住雙眼的布。回到一開始的問題：作業交給 AI 寫，算不算學會？答案很清楚——交出去的是作業，學到的卻是空洞。真正的學習，永遠發生在你願意動腦、願意犯錯、也願意從錯誤裡站起來的那段路上。有些同學擔心：別人都用 AI，我不用會吃虧。但真正的吃虧，是讓機器替你思考，結果考場上、生活上要自己面對時，腦子裡空空蕩蕩。短期看，抄答案最省力；長期看，自己想最保值。所以，別把 AI 當成作弊的捷徑，而把它當成會提問的同伴。它給你一百個答案，你負責選出對的那一個，並說得出為什麼——這份判斷力，才是誰也搶不走的本事。老師也提醒，AI 偶爾會給出錯誤或編造的資料，如果連查證都不做就抄，反而比不用的風險更大；這更說明了，會用工具的人，首先要會懷疑工具。從小練習這樣的判斷，長大以後面對假新聞、面對廣告話術，你才不會輕易被帶著走。所以，下次打開 AI 之前，先問自己：這一次，我要它幫我動手，還是幫我動腦？想清楚這一點，工具才真正為你所用。真正的聰明，不是會用最厲害的工具，而是知道工具該停在哪裡；把思考留給自己，把繁瑣交給機器，這才是人與 AI 最好的距離。', q:[

  { title:'一條捷運線，與一棵三百年的老樹', text:'為了讓通勤更方便，市政府計畫在老社區旁興建一條新的捷運線，預計能讓十萬名居民每天少花四十分鐘通勤。消息一出，多數人拍手叫好，畢竟塞車和長時間通勤，是這座城市長久以來的痛，能準時回家吃飯、陪孩子寫功課，對許多家庭都很重要。然而，工程圖公佈後，卻引發另一場爭論：路線必須經過社區公園，而公園裡有一棵被列為珍貴老樹、樹齡超過三百年的榕樹。支持開發的居民說，捷運能改善大家的日常生活，創造的效益是多數人的利益，為了少數一棵樹犧牲大眾便利，並不划算；而且政府承諾會在別處補植更多樹苗，彌補綠地的損失。反對的人則認為，三百年的老樹不是種下去就有的，它見證了這塊土地幾代人的記憶，是無法用數量衡量的文化資產；今天能為捷運砍老樹，明天就可能為停車場砍下一棵，界線一旦退讓就很難收回。這場爭論沒有簡單的對錯。發展帶來效率，保存守護記憶，兩者都是城市需要的價值。有些城市確實做到了兩全：在規劃捷運時保留百年老樹，讓車站與綠地融為一體，既方便通勤，也留下乘涼的樹蔭，證明開發與保存未必只能二選一。真正該問的，不是選哪一邊，而是有沒有第三種可能：能不能微調路線、把車站移到離老樹更遠的位置？能不能把車站蓋在地下、地面留給樹和行人？當我們習慣把問題看成二選一的對立，往往就失去了尋找更好解方的機會。一個成熟的社會，不是誰聲音大誰就贏，而是懂得在效率與記憶、多數與少數之間，反覆衡量、小心取捨，為下一代留下既能前進、也有根的城市。這堂課不只發生在捷運與老樹之間，也發生在我們日常的每一個選擇裡：能不能慢一點下結論，先聽聽不一樣的聲音。課堂上，當同學意見不同，我們也可以練習不急著分輸贏，而是問自己：有沒有兩全其美的方法？能這樣思考的人，長大以後更能面對複雜的真實世界，而不是只會要麼全有、要麼全無。有人說，一棵樹哪有十萬人的通勤重要。但城市的美，常常就在那些說不出價格的事物裡：夏天的樹蔭、老人家乘涼的板凳、孩子認識自然的窗口。把這些都算成沒用，城市就只剩速度和水泥。反過來，也有人擔心，什麼都要保留，是不是就什麼都不能蓋。關鍵在於：我們是不是認真想過每一個替代方案，而不是還沒討論就急著動工，或還沒權衡就斷然拒絕。老樹不會說話，但它用年輪記錄了這座城市的四季；捷運也不會說話，但它用速度承載了人們的日常。兩者都需要被看見、被珍惜，而不是只能留下一個、犧牲另一個。下次遇到意見不同的事，不妨先別急著選邊站。多問幾個如果：如果路線再彎一點呢？如果樹留著、車站蓋地下呢？往往多問幾個如果，答案就從黑白變成彩色。這座城市是我們的家，它的樣子，是無數個像這樣的選擇疊出來的；今天我們怎麼對待一棵老樹，明天孩子就怎麼對待這座城市——守護，從願意多想一種可能開始。有人怕麻煩，覺得繞路、蓋地下站太花錢。但有些花費，買的是幾十年後還在的綠蔭與記憶，算長遠一點，未必真的貴。說到底，城市不是為了贏得某一場開發競賽，而是要讓住在裡面的人，既走得快，也走得安心。一座城市的文明，往往不在它蓋了多少高樓，而在它願不願意為一棵老樹、為一種聲音，多留一點空間；願我們都能成為那種，既會向前走、也會回頭看的人——因為根還在，路才走得遠。守護老樹，守護的其實是我們自己對這座城市的愛與記憶，這筆帳，怎麼算都不虧。', q:[
    {q:'反對砍老樹的人，最主要的理由是什麼？',a:['老樹是無法用數量衡量的記憶與文化資產','老樹能賣錢','老樹擋住資金'],c:0},

  ] }

        q:[ {q:'社區附近有什麼？',a:['公園郵局圖書館醫院','沙漠','火山'],c:0}, {q:'媽媽去哪買菜？',a:['市場','郵局','醫院'],c:0}, {q:'大家怎麼讓社區溫暖？',a:['互相幫忙','吵架','不理會'],c:0} ] },
      { title:'臺灣這塊土地', text:'臺灣是一個美麗的<b>島嶼</b>，四周被<b>海</b>包圍。正中央有一道高高的<b>山脈</b>，其中<b>玉山</b>海拔將近四千公尺，是全臺最高的山。西部有大片的<b>平原</b>，農夫在田裡種植<b>稻米</b>，秋天時一片金黃。許多<b>河流</b>從山上流下來，不但灌溉田地，也給我們乾淨的<b>飲水</b>。多樣的地形，讓臺灣擁有豐富的自然風景。',
        q:[ {q:'臺灣四面環什麼？',a:['海','沙漠','草原'],c:0}, {q:'最高的山？',a:['玉山','富士山','阿爾卑斯'],c:0}, {q:'河流給我們什麼？',a:['飲水','石油','黃金'],c:0} ] },
      { title:'學校的一天', text:'早上八點，<b>校門</b>一打開，同學們就蹦蹦跳跳走進<b>教室</b>。第一節是<b>國語</b>課，老師教我們練習寫生字，大家握筆寫得認真。下課鐘聲一響，所有人衝到<b>操場</b>跑步、玩球，笑聲傳遍校園。中午的<b>午餐</b>時間，營養師準備了均衡的便當，我們邊吃邊聊天。放學前，老師總會提醒我們：回家的功課要記得寫，才不會拖到太晚。',
        q:[ {q:'第一節是什麼課？',a:['國語','體育','音樂'],c:0}, {q:'下課時同學在哪玩？',a:['操場','圖書館','廚房'],c:0}, {q:'中午吃什麼？',a:['營養便當','零食','泡麵'],c:0} ] }
    ],
    nature: [
      { title:'天氣的變化', text:'<b>天氣</b>每天都會改變。出太陽時是<b>晴天</b>，很適合到<b>戶外</b>散步或運動；下雨時是<b>雨天</b>，出門要記得帶<b>雨傘</b>。到了夏天，有時候會出現強烈的<b>颱風</b>，那時風又大、雨又急，我們要乖乖待在<b>安全</b>的屋子裡，不可以靠近窗戶或出門亂跑。不同的天氣，提醒我們要穿對衣服、做好準備，才能舒服又平安地過每一天。',
        q:[ {q:'出太陽是什麼天氣？',a:['晴天','雨天','雪天'],c:0}, {q:'颱風來時要怎樣？',a:['待在安全屋子','去海邊','爬山'],c:0}, {q:'下雨要帶什麼？',a:['雨傘','帽子','鞋子'],c:0} ] },
      { title:'植物的生長', text:'想要種出一株健康的植物，要先在<b>土</b>裡埋下<b>種子</b>，然後每天澆<b>水</b>、讓它曬<b>陽光</b>。過幾天，種子會先長出<b>根</b>，像小管子一樣抓住泥土、吸收水分；接著冒出<b>莖</b>和綠綠的<b>葉子</b>。葉子利用陽光，把水和空氣變成植物需要的<b>養分</b>。最後，植物會長出花苞，綻放美麗的<b>花</b>。原來，植物的長大需要耐心照顧，就像我們長大一樣。',
        q:[ {q:'種子需要什麼才長大？',a:['水和陽光','只有石頭','只有風'],c:0}, {q:'先長出什麼抓土？',a:['根','葉子','花'],c:0}, {q:'葉子利用什麼，把水和空氣變成養分？',a:['陽光','沙子','鹽'],c:0} ] },
      { title:'夜裡的動物', text:'太陽下山、夜幕降臨後，有些動物才慢慢醒來開始活動。<b>貓頭鷹</b>睜開大眼睛，安靜地停在樹枝上，尋找地上的<b>老鼠</b>；<b>蝙蝠</b>則展開翅膀，在空中靈活地捉<b>蚊子</b>。牠們都喜歡<b>黑夜</b>，因為晚上比較安靜，也更容易躲開白天活動的敵人。這些夜行動物，讓夜晚的世界同樣熱鬧又有趣。',
        q:[ {q:'貓頭鷹找什麼吃？',a:['老鼠','魚','草'],c:0}, {q:'蝙蝠在空中捉什麼？',a:['蚊子','蝴蝶','蜜蜂'],c:0}, {q:'這些動物喜歡什麼時候活動？',a:['黑夜','白天','中午'],c:0} ] }
    ]

  advanced: {
    chinese: [
      { title:'我們的環境', text:'六年級的同學們開完班會後，決定一起行動，保護學校旁那條曾被忽略的小溪。那個星期天，大家帶著手套和垃圾袋來到河邊，彎下腰把瓶罐、塑膠袋一一撿起，還在空地上種下幾棵小樹苗。班導師說：「每個人都有責任，讓文化與自然在這塊土地上好好共存。」有人紀錄、有人拍照，所有人用合作和溝通完成這件有意義的事。看著乾淨的河岸，每個人湧起榮譽感，也對未來充滿希望。後來我們把過程做成海報，在全校朝會分享，希望更多班級加入。這次行動讓我們明白：環境不是別人的事，而是每天生活的一部分；從撿起腳邊的垃圾開始，每個人都能成為改變的起點。兩個月後，水面的垃圾不見了，甚至有小朋友看見小魚在水草間穿梭。我們終於相信，哪怕是年紀還小的學生，也能用雙手為這塊土地帶來真實的改變；而這份改變，會像種下的樹苗一樣，一年比一年更茂盛。看著溪水變清，連路過的蜻蜓都來點水，我們才真正體會，守護環境不是口號，而是每天彎腰撿起的那一個垃圾。',
        q:[ {q:'同學們去哪裡清理環境？',a:['河邊','山頂','海邊'],c:0}, {q:'這篇文章認為環境是誰的事？',a:['只有政府','每個人每天生活的一部分','外太空'],c:1}, {q:'他們種下什麼來美化河岸？',a:['石頭','旗子','小樹苗'],c:2}, {q:'「共存」最接近的意思是？',a:['人與自然一起好好生活','人征服自然','不用理自然'],c:0} ] },
      { title:'端午節的由來', text:'每年端午節，家家戶戶吃著粽子、看著河面上的龍舟競賽。這項古老的傳統，背後藏著一段動人的故事：很久以前，一位愛國詩人眼看國家將要危亡，悲痛之下投入江中。百姓為了紀念他，把米糰丟進河裡，希望魚兒吃米、不要傷害詩人；後來這個舉動慢慢演變成包粽子的習俗。直到今天，這些文化活動仍讓我們記得祖先的智慧與情感，也把家人團聚的溫暖一代代傳下去。除了吃粽子、看龍舟，有些地方還會掛艾草、佩香包，用各種方式祈求平安。節慶不只是放假，更提醒我們從哪裡來、哪些價值值得珍惜。那天的分享會上，阿公說起小時候端午要去河邊看龍舟，奶奶會在門口掛菖蒲驅邪。聽著聽著，我發現節日不只是吃喝，更是一代一代把祝福傳下去的方式；而我們這一代，也有責任把這份記憶繼續說給下一代聽。原來一條龍舟劃過的不只是水，還是大家齊心協力的精神。守護這些傳統，就是守護我們自己的根，也守護下一代的記憶。',
        q:[ {q:'端午節吃什麼？',a:['月餅','粽子','湯圓'],c:1}, {q:'百姓把米糰丟進河裡是為了什麼？',a:['覺得好玩','慶祝生日','紀念愛國詩人'],c:2}, {q:'掛艾草、佩香包的目的是？',a:['祈求平安','驅趕蚊蟲賣錢','裝飾好看'],c:0}, {q:'這篇文章認為傳統節日的用處是？',a:['只是放假浪費時間','連結文化與記憶','沒有用途'],c:1} ] },
      { title:'失敗的價值', text:'許多人害怕失敗，遇到挫折就想放棄，但其實失敗往往是學習的最好機會。發明家愛迪生為了做出耐用的燈泡，前後嘗試了幾千種材料，屢屢碰壁。有人笑他浪費時間，他卻回答：「我沒有失敗，只是找到幾千種行不通的方法。」正是這份堅持，讓他最後成功。當我們遇到困難，與其馬上放棄，不如先靜下來思考哪裡出錯，調整方法再試一次。每一次跌倒，其實都是靠近成功的一步；重點不是不摔跤，而是摔了之後願意再站起來。失敗像一面鏡子，照出我們還沒練好的地方，也教我們更謙虛地看待自己的能力。後來我在自然課做實驗，第一次點燃酒精燈手還發抖，失敗了好幾次才成功。我想起愛迪生的話，便不再慌張，原來課本上那句「失敗為成功之母」，不是口號，而是真的要一次次練習，才會把手變穩、把心變定。把每一次不順利都當成練習的機會，時間久了，原本覺得困難的事，也會慢慢變得容易。',
        q:[ {q:'愛迪生發明了什麼？',a:['電腦','電話','燈泡'],c:2}, {q:'他嘗試幾次才成功？',a:['幾千次','一次','兩次'],c:0}, {q:'遇到困難，文章建議我們怎樣？',a:['馬上放棄','思考再試一次','不管它'],c:1}, {q:'這篇文章想告訴我們什麼？',a:['失敗很丟臉不要提','不要嘗試','失敗是學習的機會'],c:2} ] },
      { title:'網路小提醒', text:'現在許多同學用手機或電腦上網路，方便又好玩。媽媽卻提醒我：網路雖好，也要小心。首先，不要把個人的照片或住址隨便給陌生人；其次，看到「免費領禮物」之類太誘人的訊息，千萬別輕易相信，那很可能是詐騙。遇到奇怪的內容，一定要告訴信任的大人。學會保護自己，網路才會是陪伴我們學習、探索的好工具。記住：方便不代表安全，多一分警覺，就少一分危險。真正的自由，是建立在懂得保護自己之上的；當我們知道怎麼安全地使用網路，世界才會為我們打開更多學習的大門。例如，設定不容易猜到的密碼、不在公共電腦留下帳號，都是守護自己的小小習慣。媽媽還說，遇到不舒服的內容要馬上關掉並告訴大人，而不是自己憋著。網路像一座大圖書館，裡面有寶藏也有陷阱，會保護自己的人，才能安心地在裡面找知識。懂得保護自己，網路才會是幫我們長知識的好朋友，而不是藏著危險的陷阱；這份警覺，會陪著我們平安長大。',
        q:[ {q:'不要隨便把什麼給陌生人？',a:['照片','玩具','書'],c:0}, {q:'「免費領禮物」的訊息很可能是什麼？',a:['朋友留言','詐騙','天氣預報'],c:1}, {q:'遇到奇怪內容要告訴誰？',a:['陌生人','同學','信任的大人'],c:2}, {q:'文章認為真正的自由建立在什麼上？',a:['懂得保護自己','不管別人','隨便分享'],c:0} ] }
    ],
    social: [
      { title:'重要的選舉', text:'這週，班上舉辦了一場班長選舉。每個人都有資格投票，選出自己信任的同學。想當候選人的同學，要上台發表自己的想法和計畫，說明如果當選要做什麼。聽完之後，大家慎重考慮，再投下神聖的一票。這整個過程，就是民主的縮影：每個人的意見都重要，即使是少數人的聲音，也應該被尊重。透過這場小小的選舉，我們學會了：表達、傾聽與負責任，都是公民不可缺少的能力。當我們長大，這樣的經驗會幫助我們在更大的社會裡，做出更成熟的選擇。投票前，我們先了解每位候選人的主張，而不是只看誰和我最好，這才是對自己那一票真正的負責。事後，當選的同學也把承諾一一列出，定期向我們報告進度。這讓我明白，投票不是結束，而是監督與參與的開始。投票不只是選人，更是練習負責任；當每個人都認真對待自己的一票，班級和社會就會朝更好的方向前進，而我們現在學的，正是未來當好公民的第一步。',
        q:[ {q:'班長怎麼產生？',a:['老師指定','投票選舉','抽籤'],c:1}, {q:'民主的意思是？',a:['只有老師說了算','不用選','每個人意見都重要'],c:2}, {q:'候選人要做什麼？',a:['發表想法','睡覺','直接離開'],c:0}, {q:'這篇文章認為投票的意義是？',a:['浪費時間','讓大家決定','沒用'],c:1} ] },
      { title:'認識貨幣', text:'媽媽送我一個可愛的撲滿，鼓勵我存零用錢。於是每天省下一點點，撲滿一天比一天重。某個假日，我打開撲滿，拿著存到的錢去商店，買了一本嚮往已久的筆記本。那一刻我懂了：金錢要珍惜，不能亂花，更要為想要的東西提前計畫。存錢不是不花，而是把錢花在真正需要、真正喜歡的地方。學會管理自己的零用錢，是長大後很重要的本事。當我們能夠延遲滿足、先規劃再消費，就不容易被一時的慾望牽著走。後來我還學著把錢分成「花用」「儲蓄」「捐給需要的人」三份，才發現原來金錢也能用來傳遞關心。看著撲滿裡的錢一點點變多，我不再急著買零食，反而更期待存夠了去完成那個真正想做的事。金錢的價值，不在數字，而在怎麼運用。學會和金錢做朋友，不亂花、懂得存，長大後才不會被一時的慾望牽著走；也才能在重要時刻，大方地幫助需要的人，讓有限的花費發揮更大的價值與意義，讓有限的生命也更有厚度。',
        q:[ {q:'媽媽叫我用什麼存錢？',a:['書包','鞋盒','撲滿'],c:2}, {q:'金錢要怎麼對待？',a:['珍惜不亂花','隨便花','不管'],c:0}, {q:'我用存到的錢買了什麼？',a:['玩具車','筆記本','球'],c:1}, {q:'這篇文章教我們什麼？',a:['隨便花','不存錢','提前計畫與珍惜'],c:2} ] },
      { title:'志工的精神', text:'週末早晨，我和家人來到老人院擔任志工。我們陪爺爺奶奶聊天、唱歌，還幫忙摺疊衣服、整理環境。院長告訴我，比起送禮物，長輩們更渴望的是有人陪伴、有人聽他們說話。看著他們露出滿足的笑容，我心裡也暖暖的。原來，付出不一定只為了別人——在幫助別人的同時，我們自己也得到了快樂與滿足。那一天，我比平常更懂了「施比受更有福」這句話的意思。志工服務讓我看見，一句問候、一點時間，往往比昂貴的禮物更能溫暖人心。回家的路上，我默默答應自己，以後要常常回來，因為這裡的笑容，已經成了我每週最期待的風景。院長送我們到門口時說，你們今天來，比任何禮物都珍貴。那句話我一直記著，也終於懂了，被需要的感覺，會讓給的人比收的人更快樂。付出不一定求回報，但溫暖總會回到自己身上；這堂關於愛的課，比任何課本都更讓人難忘，也讓我看見自己也能成為別人的光與力量。',
        q:[ {q:'我們去哪裡當志工？',a:['老人院','醫院','學校'],c:0}, {q:'院長說什麼更重要？',a:['送禮物','陪伴','吃飯'],c:1}, {q:'看到爺爺奶奶的笑容「我」感覺如何？',a:['好累','無聊','心裡暖暖的'],c:2}, {q:'這篇文章想表達什麼？',a:['付出讓自己也快樂','付出很辛苦不要做','不要當志工'],c:0} ] },
      { title:'多元文化', text:'我們的班上有來自不同背景的同學：有人和家人過聖誕節，有人過傳統的過年，還有人慶祝開齋節。剛開始，大家對彼此的習慣感到好奇又有點陌生。老師說，這就是多元文化：雖然我們的語言、食物和節日不同，但都生活在同樣的城市、讀同一所學校。只要彼此尊重、互相了解，差異不但不可怕，反而讓我們的班級更豐富。學會接納不同，我們才能在多元的社會中和諧相處。當我們願意聽懂別人的故事，世界就會從「和我一樣」變成「和我不同但都珍貴」。那天的分享會上，我們嚐了彼此帶來的點心，才發現原來不一樣的滋味，拼起來竟是一桌最熱鬧的風景。下課後，我和過開齋節的同學學了句祝福的話，他也跟我學寫春聯。當我們願意跨出一步認識彼此，教室就不再是單一顏色，而成了繽紛的調色盤。接納不同，世界才會更大、更溫柔；而我們的教室，也因為每個人不一樣，才變得格外精彩、豐富、溫暖又熱鬧。',

    nature: [
      { title:'四季的變化', text:'春天來臨，百花競相綻放，燕子從南方飛回，在屋簷下築起溫暖的巢；夏天氣溫升高，我們跳進泳池游泳消暑，知了在樹上叫個不停；秋天涼風吹起，葉子由綠轉黃、轉紅，是農人豐收的季節，稻田裡一片金黃；冬天寒流報到，大家穿上厚厚外套，圍著火爐說故事。四季輪流上演，每一季都有獨特的景色與活動，讓大自然充滿變化與驚喜。觀察身邊的季節，會發現世界比想像中更精彩。正因為有四季的輪替，動物才能按時遷徙、植物才能按時萌芽，整個生態才得以維持平衡。農夫跟著季節播種與收成，候鳥循著冷暖南來北往，就連我們的衣服與心情，也悄悄隨著四季換了顏色。如果沒有四季的輪替，世界會變得很單調；正因為有變化，我們才學會等待與珍惜，懂得在對的季節做對的事，生活也跟著有了節奏。順著四季生活，我們學會等待，也學會在對的時間做對的事，讓日常有了自然而優美的節奏與韻律，也讓平凡的日子變得有期待。',

      { title:'夜晚的星空', text:'當夜幕低垂，抬頭仰望天空，會看見數不清的星星，以及一彎溫柔的月亮。那些星星離我們非常遙遠，它們發出的光要旅行好幾年、甚至好幾百年，才抵達地球。偶爾，還能看見一道流星劃過天際，一閃即逝。看著浩瀚的星空，我忍不住覺得宇宙既神秘又壯闊，也對遙遠的未來充滿好奇。人類從未停止探索，因為我們總想弄清楚：在那深邃的黑暗裡，究竟還藏著多少秘密。也許有一天，我們真的能搭上太空船，親自去看看那些星星究竟長什麼樣子。望著星空，我忽然覺得自己很渺小，卻也更珍惜此刻能夠抬頭看見這片光芒的幸運，以及和身邊人一起許願的溫暖。天文老師說，我們看到的星光，可能是星星幾百年前送出的訊息；想到這裡，我更覺得宇宙像一本永遠翻不完的書，每一頁都等著我們去讀。仰望星空，我們學會謙卑，也對這廣闊的世界多了一份溫柔的好奇；那份好奇，會帶我們走得更遠、看得更深、想得更廣。',

      { title:'水的旅行', text:'地球上的水從不停止旅行。海洋裡的水被太陽曬熱，變成看不見的水蒸氣，輕飄飄地升上天空，遇冷後凝結成雲。當雲裡的水滴越積越多、越變越重，便以雨的形式落回地面，匯入河流、滲入土壤，最後又流回海洋。這個不停循環的過程，叫做水循環。多虧了它，地球上的水才能不斷被淨化、重複使用，讓森林、農田與城市都有水可用。水，是生命不可或缺的朋友。如果我們浪費水，等於切斷了這條循環的命脈；珍惜每一滴水，就是在守護自己與未來世代的生存根基。下次洗手時，看著水流走，不妨想想它接下來還要旅行到哪裡，才會再次回到我們的杯裡。人可以好幾天不吃東西，卻不能沒有水；正因為水如此珍貴，我們更要節約每一滴。守護水循環，就是守護所有依賴水活著的生命的未來。珍惜水，就是珍惜所有生命；從今天起，我願意從關緊水龍頭、不浪費一滴水開始，守護這場永不停歇的旅行，也守住我們與下一代的未來。',
        q:[ {q:'水被太陽曬熱後變成什麼？',a:['冰塊','水蒸氣','石頭'],c:1}, {q:'雲太重時變成什麼落下？',a:['雪','冰雹','雨'],c:2}, {q:'這個循環叫什麼名字？',a:['水循環','火循環','風循環'],c:0}, {q:'這篇文章提醒我們什麼？',a:['水不重要','可以隨便浪費','珍惜水守護生存根基'],c:2} ] },
      { title:'地震怎麼辦', text:'臺灣坐落在板塊交界處，地殼活動頻繁，因此常常發生地震。當地震突然來襲，第一時間要冷靜，趕快躲到堅固的桌子底下，雙手保護頭部，遠離窗戶和可能掉落的物品，並且絕對不可以使用電梯。等到搖晃停止，再依照指示有序疏散到空曠的操場或空地。平時家裡準備好防災包，裝著水、手電筒和急救用品，關鍵時刻就能沉著應對。防災，其實是從日常的準備開始。與其慌張，不如平時就練習避難動作，讓身體記住正確的反應。學校每學期辦的防震演習，看似重複，卻能在真正的災難來時，把慌亂化成一連串早已練熟的安全動作。回家後，我也和爸媽一起檢查家裡的逃生路線，把防災包放在容易拿到的地方。準備得越充分，遇到狀況時，我們就越能冷靜地保護自己與家人。平時多一分準備，災難來時就多一分安全；認真防災，是送給家人最好的禮物，也是對自己生命最大的負責、守護與安心，值得我們每個人都認真對待。',
        q:[ {q:'臺灣為什麼常地震？',a:['靠近北極','在海底','位於板塊交界'],c:2}, {q:'地震時要躲到哪裡？',a:['堅固桌子下','窗戶邊','電梯裡'],c:0}, {q:'地震時不能使用什麼？',a:['椅子','電梯','書包'],c:1}, {q:'平時要準備什麼來應對？',a:['玩具','零食','防災包'],c:2} ] }

        "text": "月考成績出來那天，小嵐盯著國文科的分數發呆。她明明背熟了每課的生字，作文卻只拿到一半分。老師在旁邊寫了一句話：『會背，不等於讀懂。』小嵐回家問媽媽：『讀書到底是為了分數，還是為了什麼？』媽媽想了想，說：『分數像體重計，能告訴你今天重不重，卻說不出你健不健康。』這句話讓小嵐愣住。她想起自己讀課外書時，明明考試沒考，卻被某個故事感動了好久；那種感動，分數表上找不到。後來她慢慢明白，讀書有兩種收穫：一種寫在考卷上，一種長在心裡。背生字、練句型，是為了把工具磨利；而讀一本好書、想一個好問題，是為了讓自己成為更有厚度的人。書本像一扇窗，透過它，我們能看見從沒去過的地方、沒經歷過的人生。讀詩，學會把感受說得漂亮；讀歷史，看見同樣的難題在不同時代怎麼被回答；讀科普，知道這世界還有多少未知等著被解開。這些都不是分數能衡量的，卻會悄悄長成我們看世界的眼光。有些同學把讀書和考試畫上等號，還沒翻開書就覺得累。其實，當我們願意為一個故事笑、為一個觀點想很久，那種主動的喜歡，才是讀書真正的起點。分數會過去，但一顆願意思考、願意感受的心，會陪我們走更遠的路。多年後，小嵐可能忘了某個生字怎麼寫，卻會記得曾有一本書，讓她第一次看見：原來世界比課本大得多。讀書的意義，或許就在這裡——它不只用來通過考試，更用來打開我們的眼睛，看見自己與這個世界更多的連結，也更懂得怎麼安放自己的心。當我們把讀書從『任務』變回『探索』，分數會自然跟著變好，因為真正讀懂的人，考什麼都不怕。願你也能在課本之外，為自己留一扇因為好奇而打開的窗，讓讀書成為一輩子的習慣，而不只是應付考試的手段。",

      {
        "title": "語言的溫度",
        "text": "下課後，阿哲滑著手機，看見有人在班級群組裡貼了一張同學的醜照，還寫了難聽的綽號。大家跟著笑了，留言一則比一則尖酸。阿哲本來也想按個笑臉，手指卻停在空中——那個被嘲笑的同學，昨天才因為家裡的事偷偷掉眼淚。一句話，說出口只要一秒，卻可能在別人心上留下好久的痕跡。我們常以為『只是開玩笑』『又沒真的動手』就沒有傷害；但語言的刀子看不見，卻一樣會痛。網路上的留言更如此：按一個讚、轉一句話，都以為自己只是跟風，卻不知道那頭的人正盯著螢幕發抖。後來阿哲把那張圖截下來，私訊告訴張貼的人：『這樣他會很難過，我們刪掉好嗎？』對方想了想，把圖刪了，也跟大家說對不起。沒有人被處罰，但氣氛悄悄變好了。語言可以用來取暖，也可以用來傷人，差別往往只在多想一秒、多站在對方立場一秒。很多校園問題，不是從拳頭開始，而是從一句『開玩笑』開始。當我們願意為一句話負責，願意在鍵盤前多停三秒，那些無形的傷害就會少一點。語言的力量，比我們以為的大：一句適時的鼓勵，能把一個想放棄的人拉回來；一句隨口的評價，也可能把一個人推得更遠。說話是天性，好好說話是修養。我們無法控制別人說什麼，但可以控制自己說出口的每一句；把這份修養帶在身上，走到哪裡，哪裡就多一分溫暖，也多一分讓人安心的力量。下一次，在留言前先想一秒：這句話，是我想被別人對我說的嗎？當愈多人這樣問自己，言語就不再是一把無心的刀，而是一雙溫暖的手。好好說話，是我們送給彼此最樸素、也最珍貴的禮物。",

      {

function isHolidayToday(){ return isHolidayOn(dateKey()); }

/* ---------- 每週作息 / 拖延怪計時逼近 ---------- */
function todayWeekdayIndex(){ return (new Date().getDay()+6)%7; }
function todayRoutine(){ const wr=state.weekRoutine||defaultWeekRoutine(); return wr[todayWeekdayIndex()]; }
function zombieBounds(){
  const r=todayRoutine();
  return {startMin:toMin(r.wake), endMin:toMin(r.sleep)};
}
function zombieProgress(){
  const {startMin,endMin}=zombieBounds();
  const now=new Date();
  const nowMin=nowFrameMin();
  if(endMin<=startMin) return 1;
  let p=(nowMin-startMin)/(endMin-startMin);
  if(p<0)p=0; if(p>1)p=1;
  return p;
}
function fmtRemain(min){

function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+' 分 '+(s<10?'0':'')+s+' 秒'; }
function fmtDT(ts){ if(!ts) return ''; const d=new Date(ts); return d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }

/* ---------- 今日行程（排程系統）：自動產生 + 準時打卡 + 時間內完成獎勵 + 拖延怪跟時間軸走 ---------- */
/* 2026-09-28 稽核 B4：時間一律換算成「以起床前 3 小時為一天開頭」的分鐘數。
   原本一天從 0 點算，睡覺時間設 00:30 會被當成一大早：國中生整天被睡覺鎖、拖延怪整天貼門口；
   睡覺 21:00 的話，半夜 0 點到起床之間反而不鎖 */
function dayFrameStart(){ try{ const r=todayRoutine(); const [h,m]=String(r.wake||'07:00').split(':').map(Number); return Math.max(0,(h||0)*60+(m||0)-180); }catch(e){ return 240; } }
function frameMin(m){ return m < dayFrameStart() ? m+1440 : m; }
function nowFrameMin(){ const d=new Date(); return frameMin(d.getHours()*60+d.getMinutes()); }
/* 「今晚」屬於哪一天：半夜過後、還沒到一天開頭，都算前一天 */
function frameDateKey(){ const d=new Date(); return (d.getHours()*60+d.getMinutes()) < dayFrameStart() ? dateKey(-1) : dateKey(); }
function toMin(t){ const a=(t||'0:0').split(':'); const h=parseInt(a[0])||0, m=parseInt(a[1])||0; return frameMin(h*60+m); }
function defaultSchedule(){
  const r=todayRoutine(); const lim=state.routineLimit||{eat:40,bath:30};
  const items=[
    {id:'sc_wake', label:'起床', time:r.wake, dur:20, emoji:'🌞', kind:'routine', routineKey:'wake'},
    {id:'sc_eat', label:'吃飯', time:r.eat, dur:(lim.eat||40), emoji:'🍚', kind:'routine', routineKey:'eat'},
    {id:'sc_bath', label:'洗澡', time:r.bath, dur:(lim.bath||30), emoji:'🛁', kind:'routine', routineKey:'bath'},
    {id:'sc_sleep', label:'睡覺', time:r.sleep, dur:0, emoji:'💤', kind:'routine', routineKey:'sleep'}
  ];
  let t=19*60;
  visibleHW().forEach(it=>{
    const hh=String(Math.floor(t/60)).padStart(2,'0'), mm=String(t%60).padStart(2,'0');
    items.push({id:'sc_hw_'+it.id, label:displayHWName(it), time:hh+':'+mm, dur:30, emoji:subjectIcon(it.type), kind:'homework', hwId:it.id});
    t+=35;
  });
  return items;
}
/* 2026-09-28 稽核 B5：今日行程改成每個孩子各一份（c.schedule）。原本全家共用 state.schedule，
   功課那幾列取自「當天第一個打開的孩子」，妹妹的行程會出現哥哥的功課，被算成逾期、拖延怪一直逼近。
   state.schedule 留著給舊版本讀 */
function mySchedule(){ const c=C(); if(!Array.isArray(c.schedule)) c.schedule=[]; return c.schedule; }
function ensureSchedule(){
  const c=C(); let changed=false;
  if(c.scheduleDate!==dateKey() || !Array.isArray(c.schedule)){
    c.schedule=defaultSchedule(); c.scheduleDate=dateKey(); c.sched={}; c.bonusSun=0; changed=true;
  } else {
    /* 功課清單中途改了（加、刪、藏科目），功課那幾列跟著對齊；時間被調過的保留 */
    const want=visibleHW(); const wantIds=new Set(want.map(it=>it.id));
    const before=c.schedule.length;
    c.schedule=c.schedule.filter(x=>x.kind!=='homework' || wantIds.has(x.hwId));
    const have=new Set(c.schedule.filter(x=>x.kind==='homework').map(x=>x.hwId));
    let t=Math.max(19*60-35, ...c.schedule.filter(x=>x.kind==='homework').map(x=>toMin(x.time)%1440));
    want.forEach(it=>{ if(have.has(it.id)) return; t+=35;
      c.schedule.push({id:'sc_hw_'+it.id, label:displayHWName(it), time:String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'), dur:30, emoji:subjectIcon(it.type), kind:'homework', hwId:it.id}); });
    changed = changed || c.schedule.length!==before || want.some(it=>!have.has(it.id));
  }
  if(changed) save();
}
function scheduleWindow(){
  const sc=mySchedule(); if(!sc||!sc.length) return null;
  let mn=1e9, mx=-1;
  sc.forEach(it=>{ const s=toMin(it.time); if(s<mn)mn=s; const e=s+(it.dur||0); if(e>mx)mx=e; });
  if(mx<=mn) mx=mn+30;
  return {start:mn, end:mx, total:mx-mn};
}
function timePressure(){
  const sw=scheduleWindow();
  const now=new Date(); const nowMin=nowFrameMin();
  if(sw){ let p=(nowMin-sw.start)/sw.total; if(p<0)p=0; if(p>1)p=1; return p; }
  return zombieProgress();
}
function scheduleOverdue(){
  if(isHolidayToday()) return 0;
  const c=C(); const now=new Date(); const nowMin=nowFrameMin();
  let n=0;
  mySchedule().forEach(it=>{
    const st=(c.sched&&c.sched[it.id])||{};
    if(st.status==='done') return;
    if(nowMin > toMin(it.time)+(it.dur||0)) n++;
  });
  return n;
}
/* ===== 位置模型：時鐘 vs 進度 的賽跑 =====
   拖延怪 x = 「現在時間」在作戰窗口中的比例（誠實可讀，走到哪 = 現在該做哪件事）
   防線 x = 「今日完成度」的比例（完成一項，防線就往右推一格，把拖延怪實體推退）
   拖延怪被防線擋住不會穿過；一旦時間超前於進度（落後），拖延怪就抵在防線上啃食扣血。 */
const LANE_R = 92, LANE_L = 6;                       // 戰場左右邊界（%）
function laneX(ratio){ return LANE_R - Math.max(0,Math.min(1,ratio))*(LANE_R-LANE_L); }
/* 作戰窗口：從「第一個還沒完成的行程」到「睡覺」。隨著一天推進自動收窄，拖延怪相對移動才看得出來。 */
function activeWindow(){
  const sw=scheduleWindow(); if(!sw) return null;
  const c=C(); const now=new Date(); const nowMin=nowFrameMin();
  let first=null;
  mySchedule().forEach(it=>{
    const st=(c.sched&&c.sched[it.id])||{};
    if(st.status!=='done'){ const m=toMin(it.time); if(first===null||m<first) first=m; }
  });
  let start = (first===null? sw.start : first);
  if(nowMin < start) start = nowMin - 5;             // 還沒開跑：拖延怪待在最右邊
  let end = sw.end;
  if(end - start < 45) start = end - 45;             // 窗口至少 45 分，避免比例暴衝
  return {start, end, total:Math.max(1,end-start)};
}
/* 今日完成度：行程項目（已含功課）已完成=1、已打卡=0.45 */
function doneRatio(){
  const c=C(); const sc=mySchedule();
  if(!sc.length) return unfinishedCount()===0 ? 1 : 0;
  let d=0;
  sc.forEach(it=>{ const st=(c.sched&&c.sched[it.id])||{};
    if(st.status==='done') d+=1; else if(st.status==='checked') d+=0.45; });
  return Math.max(0, Math.min(1, d/sc.length));
}
/* 一次算出戰場幾何
   threat = 時間進度 − 完成進度：0 = 完全跟上（拖延怪被推到最遠），1 = 時間用光卻沒做（拖延怪到家門口）
   → 完成一項行程，doneR 跳升，拖延怪就「被實體推退」一大段，回饋非常直接。 */
function laneGeom(){
  const c=C(); const aw=activeWindow();
  const now=new Date(); const nowMin=nowFrameMin();
  const timeR = aw ? Math.max(0, Math.min(1,(nowMin-aw.start)/aw.total)) : zombieProgress();
  const push = Math.min(0.25, (c.zombiePush||0)*0.18);           // 答題打退＝額外進度加成
  const overdue = Math.min(0.20, scheduleOverdue()*0.055);       // 逾期未做＝額外威脅
  const doneR = Math.max(0, Math.min(1, doneRatio() + push));
  const threat = Math.max(0, Math.min(1, timeR - doneR + overdue));
  const gapR = doneR - timeR;                                    // >0 領先進度、<0 落後
  const gapMin = Math.round(gapR * (aw ? aw.total : 60));
  const fPct = 30 + doneR*22;                                    // 防線（植物陣線）右緣，完成越多推越外
  const zPct = Math.max(LANE_L, laneX(threat));
  return { timeR, doneR, threat, gapR, gapMin, zPct, fPct, aw, nowMin };
}
/* 時間軸尺專用：把「時刻」換算成尺上的百分比（右＝窗口開始，左＝睡覺） */
function tlX(min){ const aw=activeWindow(); if(!aw) return 50; return laneX((min-aw.start)/aw.total); }

/* 2026-09-28 稽核 A7：原本任何時間按「完成」都算準時（早上一口氣按完就拿滿獎勵），

/* ---------- 行程時間軸尺（與戰場共用一套右→左的時間座標） ---------- */
function renderTimeline(g){
  const el=document.getElementById('homeTimeline'); if(!el) return;
  g = g || laneGeom();
  const aw=g.aw; if(!aw){ el.innerHTML=''; return; }
  const c=C();
  const hhmm=(m)=>{ m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
  let marks='';
  mySchedule().forEach(it=>{
    const m=toMin(it.time);
    if(m < aw.start-5 || m > aw.end+5) return;
    const st=(c.sched&&c.sched[it.id])||{};
    const status=st.status||'todo';
    const late = status!=='done' && g.nowMin > m+(it.dur||0);
    const cls = status==='done'?'done':status==='checked'?'checked':(late?'overdue todo':'todo');
    marks += `<div class="tl-mk ${cls}" style="left:${tlX(m)}%;" title="${escapeHtml(it.label)} ${escapeHtml(it.time)}">
      <span class="tl-ic">${status==='done'?'✅':(it.emoji||'📌')}</span>
      <span class="tl-t">${it.time}</span><span class="tl-dot"></span></div>`;
  });
  const nowPct=tlX(g.nowMin);
  const frontPct=laneX(g.doneR);
  const safeW = Math.abs(nowPct-frontPct);
  const safeHTML = g.gapR>=0
    ? `<div class="tl-safe" style="left:${frontPct}%;width:${safeW}%;"></div>`
    : `<div class="tl-safe" style="left:${nowPct}%;width:${safeW}%;background:linear-gradient(90deg,#c0392b,#e08e0b);"></div>`;
  el.innerHTML = `<div class="tl-track"></div>
    ${safeHTML}
    ${marks}
    <div class="tl-now" style="left:${nowPct}%;"><b>現在 ${hhmm(g.nowMin)}</b></div>
    <div class="tl-end" style="left:6px;">💤 ${hhmm(aw.end)} 睡覺</div>
    <div class="tl-end" style="right:6px;">▶ ${hhmm(aw.start)}</div>`;
  const tag=document.getElementById('leadTag');
  if(tag){
    if(g.gapMin>=5){ tag.className='lead-tag good'; tag.textContent='😎 進度超前 '+g.gapMin+' 分鐘'; }
    else if(g.gapMin>=-5){ tag.className='lead-tag warn'; tag.textContent='⏱ 剛好跟上進度'; }
    else { tag.className='lead-tag bad'; tag.textContent='⚠️ 落後 '+Math.abs(g.gapMin)+' 分鐘，拖延怪逼近中'; }
  }
}

function speak(text){
  if(!state.tts) return;
  try{
    if(!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=.9;
    const vs=speechSynthesis.getVoices();
    const tw=vs.find(v=>/zh|cmn|Taiwan|TW/i.test(v.lang+' '+v.name));
    if(tw) u.voice=tw;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function idbKV(mode, fn){ return idbOpen().then(db=>new Promise((res,rej)=>{

/* 超過 8 個字的詞整個略過（原本切成半個詞直接出現在孩子卡上）；超過 30 個的不存。回傳 {words, long, over} 讓家長知道 */
function scParseWords(s){
  const out=[], long=[]; let over=0;
  String(s||'').split(/[\s,，、;；。]+/).forEach(w=>{ w=w.trim(); if(!w || out.includes(w)) return;
    if([...w].length>8){ long.push(w); return; } if(out.length>=30){ over++; return; } out.push(w); });
  return {words:out, long, over};
}
function scPickWords(c, n){
  const passed=new Set((c.sentLog||[]).flatMap(e=>e.words||[]));
  const out=[];
  (c.sentWords||[]).forEach(w=>{ if(out.length<n && !passed.has(w) && !out.includes(w)) out.push(w); });
  let pool=WORDS.filter(w=>!passed.has(w.ch) && !out.includes(w.ch));
  if(pool.length<n-out.length) pool=WORDS.filter(w=>!out.includes(w.ch));   /* 詞卡都用過了就重新來 */
  pool=pool.slice();
  while(out.length<n && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].ch);
  return out;
}

function scCard(c){

  if(k && (k.status==='pending'||k.status==='redo')) return k;
  if(k && k.date===today) return k;
  const n=SC_WORDS_BY_LEVEL[childLevel(c)]||2;
  k=c.sentCard={id:'sc'+Date.now()+Math.floor(Math.random()*1000), date:today, words:scPickWords(c,n), status:'todo', photo:false, note:'', grade:'', sun:0, sentAt:0, decidedAt:0};
  save(); return k;

function scCompress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      try{
        const MAX=1280, s=Math.min(1, MAX/Math.max(img.naturalWidth, img.naturalHeight));
        const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.naturalWidth*s)); cv.height=Math.max(1,Math.round(img.naturalHeight*s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.72));
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src=url;
  });
}

/* 家長批改：great／ok 給陽光並記錄；redo 退回（可留言），不扣陽光 */
function scGrade(grade, note){
  const c=C(); const k=c.sentCard; if(!k || k.status!=='pending') return;
  k.decidedAt=Date.now();
  if(grade==='redo'){ k.status='redo'; k.note=String(note||'').slice(0,40); save(); toast('↩ 已請孩子再改一次'); return; }
  const want = grade==='great' ? SC_SUN_GREAT : SC_SUN_OK;
  const got=addSun(want, true) || 0;
  k.status='done'; k.grade=grade; k.sun=got;
  k.words.forEach(w=>{ if(scWordInfo(w)) markWord(w, true); });   /* 詞卡上的詞：通過一次＝答對一次 */
  c.sentLog=Array.isArray(c.sentLog)?c.sentLog:[];
  c.sentLog.push({id:k.id, date:k.date, words:k.words.slice(), grade, sun:got, photo:k.photo, at:k.decidedAt, typed:k.viaType?(k.typed||[]).slice(0,5):[]});
  while(c.sentLog.length>SC_LOG_MAX){ const e=c.sentLog.shift(); if(e && e.photo) scPhotoDel(e.id); }
  goodSound(); save();
  toast(got>=want ? (grade==='great'?'🌟 寫得很棒，+':'✅ 批改通過，+')+got+' 陽光！'
    : got>0 ? '✅ 已批改，+'+got+' 陽光（今天已到上限 '+SUN_DAILY_CAP+'）' : '✅ 已批改（今天陽光已到上限 '+SUN_DAILY_CAP+'，這張卡沒有加陽光）');
}
/* 照片清理：批改超過 7 天的刪掉；沒有任何紀錄指到的照片（刪掉的孩子、還原備份後留下的）也刪掉 */
function scCleanPhotos(){
  const cut=Date.now()-SC_PHOTO_KEEP_DAYS*864e5; const keep=new Set(); let changed=false;
  (state.children||[]).forEach(c=>{
    (c.sentLog||[]).forEach(e=>{ if(e.photo && e.at<cut){ e.photo=false; changed=true; } if(e.photo) keep.add(scPhotoKey(e.id)); });
    const k=c.sentCard; if(k && k.photo) keep.add(scPhotoKey(k.id));
  });
  if(changed) save();
  idbKV('readonly', st=>st.getAllKeys ? st.getAllKeys() : null).then(keys=>{
    (keys||[]).forEach(key=>{ if(typeof key==='string' && key.indexOf('sc_photo_')===0 && !keep.has(key)) idbKV('readwrite', st=>st.delete(key)).catch(()=>{}); });
  }).catch(()=>{});
}

  if(_ec && _ec>Date.now() && isEyeTab(tab)){ showEyeLock(_ec-Date.now()); return; }
  if(PRACTICE_TABS.includes(tab) && practiceLocked()){ renderLock(tab); return; }
  currentTab=tab;
  eyeTimerOn=isEyeTab(tab);
  if(hwId){ currentHWId=hwId; }
  else {
    const cur = currentHWId && hwItem(currentHWId);
    if(!cur || !(HW_TYPES[cur.type] && HW_TYPES[cur.type].tab===tab)) currentHWId = firstHWIdForTab(tab);
  }
  const g=tabToGroup(tab);
  $$('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===g));
  if(tab==='home') renderHome();
  else if(tab==='practice') renderPracticeHub();
  else if(tab==='collection') renderCollection();
  else if(tab==='plan') renderStudyPlan();
  else if(tab==='readtest') renderReadTest();
  else if(tab==='math') renderMath();
  else if(tab==='social') renderReadTab('social', subjectIcon('social')+' '+subjectName('social'), READING[readLevelKey()].social);
  else if(tab==='nature') renderReadTab('nature', subjectIcon('nature')+' '+subjectName('nature'), READING[readLevelKey()].nature);
  else if(tab==='english') renderEnglish();
  else if(tab==='enword') renderEnglish('word');
  else if(tab==='engrammar') renderEnglish('grammar');
  else if(tab==='enreading') renderEnglish('reading');
  else if(tab==='exam') renderExam();
  else if(tab==='custom') renderCustom();
  else if(tab==='num') renderKnowledge('num');
  else if(tab==='logic') renderKnowledge('logic');
  else if(tab==='life') renderKnowledge('life');
  else if(tab==='facts') renderKnowledge('facts');
  else if(tab==='zhuyin') renderKnowledge('zhuyin');
  else if(tab==='science') renderKnowledge('science');
  else if(tab==='coding') renderKnowledge('coding');
  else if(tab==='dailyquiz') renderDailyQuiz();
  else if(tab==='review') renderReview();
  else if(tab==='shop') renderShop();
  else if(tab==='parent') renderParent();
}

/* ---------- 讀書計劃工作台 ----------

   考試設定也在這裡（不放家長後台，因為設定考試→排進度→看進度是同一件事）。 */

let planWeekOffset=0;
function renderStudyPlan(){
  const c=C();

  if(planSubjectId && !subs.some(s=>s.id===planSubjectId)){ planSubjectId=null; planMaterial=null; }
  const mine=studyItemsOf(c.id);

  /* 2026-09-28 UI 改版：上半是孩子看的（考試倒數、本週打勾、今天清單），下半是爸媽的考試與科目設定 */
  const today=dateKey();
  const ne=examsOf(c.id).find(e=>examCountdown(e)>=0);
  const dow=(new Date().getDay()+6)%7;

    const key=dateKey(i-dow); const items=mine.filter(it=>it.due===key); const done=items.filter(it=>it.done).length;
    return {key, n:'一二三四五六日'[i], total:items.length, left:items.length-done};

  const cram=examCramInfo(c);

    <div class="greet"><h1>讀書計劃</h1><p>${ne?escapeHtml(ne.name)+'・'+(examCountdown(ne)===0?'就是今天':'還有 '+examCountdown(ne)+' 天'):'還沒設定考試。爸媽可以在下方新增考試，系統會排好每天要讀的進度。'}</p></div>
    <section class="card2 quest">

      <div class="wk2">${week.map(d=>`<div class="wd${d.key===today?' today':''}${d.total&&!d.left?' done':''}"><span class="wd-n">${d.n}</span><span class="wd-c">${!d.total?'<span class="wd-none">·</span>':!d.left?ico('checkCircle'):d.left}</span></div>`).join('')}</div>
      <h3 class="today-h">今天・${td.getMonth()+1} 月 ${td.getDate()} 日</h3>
      ${cram?`<button class="cram-row" id="cramGo" type="button"><span><b>🎯 ${escapeHtml(cram.exam.name)}還有 ${cram.days} 天：把錯題再練一遍</b><small>這次考試範圍的錯題 ${cram.pool.length} 題${cram.pool.length>15?'，一次練 15 題':''}</small></span>${ico('chevron','chev')}</button>`:''}
      ${due.length?due.map(it=>`<label class="plan-row2${it.due<today?' late':''}"><input type="checkbox" data-hsid="${it.id}"><span class="pr2-t">${escapeHtml(studyItemLabel(it))}</span><small>${it.due<today?'逾期・':''}+${studyNextSun()} 陽光</small></label>`).join(''):'<p class="muted2">今天沒有要讀的項目。</p>'}

  <div class="page2 plan2">

    <p class="hint">學校功課以外的自修／測驗卷／評量進度。設定考試日期與範圍，系統會自動幫你往回推該哪天讀哪一課。做完一項 +${STUDY_ITEM_SUN} 陽光（每天前 ${STUDY_FULL_COUNT} 項全額，之後每項 ${STUDY_ITEM_SUN_LOW} 陽光）。</p>

      <div class="plan-tabs">
        <button class="plan-tab${planView==='subject'?' on':''}" data-pv="subject">📚 科目</button>
        <button class="plan-tab${planView==='week'?' on':''}" data-pv="week">🗓 本週</button>
      </div>
      <div class="plan-stats">
        <span class="stat">✅ ${doneCount}/${mine.length}</span>
        ${overdue?`<span class="stat" style="color:#c0392b;">⚠️ ${overdue} 逾期</span>`:''}
        ${unsched?`<span class="stat" style="color:#916615;">🕗 ${unsched} 未排</span>`:''}
      </div>
    </div>
    <div id="planBody"></div>

  paintExamZone();

  const cg=$('#cramGo'); if(cg) cg.onclick=renderExamCram;
  $$('.plan-tab').forEach(b=> b.onclick=()=>{ planView=b.dataset.pv; renderStudyPlan(); });
  if(planView==='week') paintPlanWeek(); else paintPlanSubject();
}
/* 考試區：列出考試與倒數，可新增／重排／刪除 */
function paintExamZone(){
  const c=C(); const box=$('#examZone'); if(!box) return;
  const list=examsOf(c.id);
  box.innerHTML=`<div class="exam-zone">
    <div class="module-heading"><div><p class="hint" style="margin:0;">EXAM COUNTDOWN</p><h2 style="font-size:16px;margin:2px 0 0;">🎯 考試</h2></div>
      <button class="reset-btn" id="examAdd">＋ 新增考試</button></div>
    ${list.length? list.map(e=>{
      const d=examCountdown(e);
      const cnt=(e.scopes||[]).reduce((n,s)=>n+studyItemsOfMaterial(s.subjectId,s.material).length,0);
      const left=(e.scopes||[]).reduce((n,s)=>n+studyItemsOfMaterial(s.subjectId,s.material).filter(i=>!i.done).length,0);
      /* 逾期：進度落後或排程是舊版排的，都會堆在今天。要讓家長看得到、也知道怎麼處理 */
      const od=(e.scopes||[]).reduce((n,s)=>n+studyItemsOfMaterial(s.subjectId,s.material)
        .filter(i=>!i.done && i.due && i.due<dateKey()).length,0);
      /* 顯示各科節奏：這一科的未完成課次，平均幾天要做一項 */
      const usableDays=Math.max(1, countUsableDays(dateKey(), addDaysKey(e.date,-1), e));
      /* 有限制星期時，「每 N 天」會誤導（那是可寫日不是日曆天），用詞要跟著換 */
      const everyUnit = examDays(e).length===7 ? '天' : '個可寫日';
      const pace=(e.scopes||[]).map(sc=>{
        const items=studyItemsOfMaterial(sc.subjectId,sc.material).filter(i=>!i.done);
        if(!items.length) return null;
        const sub=studySubjectById(sc.subjectId);
        return { name:(sub?sub.name:'')+' · '+sc.material,
                 unit:(items[0].extra?'項':(/數學|社會|自然/.test(sub?sub.name:'')?'單元':'課')),
                 everyDays: Math.max(1, Math.round(usableDays/items.length)) };
      }).filter(Boolean);
      return `<div class="exam-card${d<0?' past':''}">
        <div class="ex-main">
          <div class="ex-name">${escapeHtml(e.name)}</div>
          <div class="ex-meta">${e.date.replace(/-/g,'/')} · 範圍 ${(e.scopes||[]).length} 項 · 共 ${cnt} 課，還剩 ${left} 課沒讀</div>
        </div>
        <div class="ex-count ${d<=3?'urgent':''}">${d<0?'已結束':d===0?'就是今天':'還有 '+d+' 天'}</div>
        ${pace.length?`<div class="ex-pace"><span class="ex-days">🗓 ${examDaysLabel(e)} · ${SCHED_MODES[examMode(e)]}</span>${pace.map(x=>`<span>${x.name}：每 ${x.everyDays} ${everyUnit} 1 ${x.unit}</span>`).join('')}</div>`:''}
        ${od?`<div class="ex-late">⚠️ 有 ${od} 項已經過了預定日期，全部堆在今天。按「重新安排進度」可以把還沒做的重新平均分配到考試前。</div>`:''}
        <div class="ex-btns">
          <button class="${od?'next-btn':'reset-btn'}" data-exre="${e.id}" style="${od?'padding:8px 12px;font-size:14px;':''}">🔄 重新安排進度</button>
          <button class="reset-btn" data-exedit="${e.id}">✏️ 編輯</button>
          <button class="reset-btn" data-exdel="${e.id}">🗑</button>
        </div>
      </div>`;
    }).join('') : '<p class="hint" style="margin:8px 0 0;">還沒設定考試。設定後系統會自動把範圍內的課次往回推、排進每一天。</p>'}
  </div>`;
  $('#examAdd').onclick=()=>openExamModal(null);
  box.querySelectorAll('[data-exre]').forEach(b=> b.onclick=()=>{
    const e=studyPlan().exams.find(x=>x.id===b.dataset.exre); if(!e) return;
    const r=scheduleForExam(e, e.skipHolidays!==false);
    if(r.past){ badSound(); toast('這個考試的日期（'+e.date.replace(/-/g,'/')+'）已經過了，先按「編輯」改日期再重新安排'); return; }
    if(!r.count){ toast('這個考試範圍裡沒有還沒讀完的課次'); return; }
    goodSound();
    toast('📅 已把還沒做的 '+r.count+' 項從今天重新分配到考試前'
      +(r.tight?'（時間很緊，最多一天 '+r.perDay+' 項）':'，各科交錯排開'));
    renderStudyPlan();
  });
  box.querySelectorAll('[data-exedit]').forEach(b=> b.onclick=()=>openExamModal(b.dataset.exedit));
  box.querySelectorAll('[data-exdel]').forEach(b=> b.onclick=()=>{
    const e=studyPlan().exams.find(x=>x.id===b.dataset.exdel); if(!e) return;
    askConfirm('刪除考試「'+escapeHtml(e.name)+'」？<br><span class="hint">已排好的課次日期會保留，不會被清掉。</span>', ()=>{
      studyPlan().exams=studyPlan().exams.filter(x=>x.id!==e.id); save();
      toast('🗑 已刪除考試「'+e.name+'」'); renderStudyPlan();
    });
  });
}

      const sp=studyPlan();

    b.onclick=(ev)=>{ ev.preventDefault(); ev.stopPropagation();

/* 視圖二：本週（一天一列，看得出哪天塞太多） */
function paintPlanWeek(){
  const c=C(); const box=$('#planBody'); if(!box) return;
  const today=dateKey();
  const monday=addDaysKey(today, -todayWeekdayIndex() + planWeekOffset*7);

        </label>`).join('')+'</div>'):''}

  box.innerHTML=html;
  $('#pwPrev').onclick=()=>{ planWeekOffset--; renderStudyPlan(); };
