/* 遊戲內建確認視窗：取代原生 confirm()。
   有些情境（嵌入式預覽面板、部分 webview）會直接擋掉原生 confirm 並回傳 false，
   造成刪除按鈕按了沒反應，所以刪除類動作一律走這個。 */
function askConfirm(msg, onYes, yesLabel){
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal">
    <h3>請確認</h3>
    <p style="line-height:1.8;margin:10px 0 0;">${msg}</p>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="${/刪除|清空|清除|歸零/.test(yesLabel||'確定刪除')?'btn-danger':'next-btn'}" id="acYes" style="flex:1;">${yesLabel||'確定刪除'}</button>
      <button class="reset-btn" id="acNo" style="flex:1;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#acNo').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  ov.querySelector('#acYes').onclick=()=>{ close(); onYes&&onYes(); };
}
/* 拍照出題：遊戲本身不串任何 AI 服務（靜態網頁放金鑰會被任何人拿走），
   改成給家長一段固定指令，搭配自己平常用的 AI 把照片轉成題庫格式再貼回來。 */
const PHOTO_BANK_PROMPT=`請把照片裡的題目整理成練習題，規則：
1. 每行一題，格式：題目 | 正確答案 | 錯誤選項1 | 錯誤選項2 | 錯誤選項3
2. 原本不是選擇題的（填空、問答），請改寫成選擇題，並補 3 個看起來合理但錯誤的選項
3. 錯誤選項要跟正確答案同類型、長度差不多，不要一看就知道是錯的
4. 看不清楚或不確定答案的題目直接跳過，不要猜
5. 只輸出題目本身，不要編號、不要標題、不要任何說明
6. 題目和選項裡都不要出現「|」這個符號`;
function showPhotoBankGuide(){
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal">
    <h3>📷 拍照出題</h3>
    <ol style="line-height:1.9;margin:10px 0 0;padding-left:20px;font-size:14px;">
      <li>把考卷、講義或評量拍照</li>
      <li>按下面「複製指令」，打開你平常用的 AI（ChatGPT、Gemini 都可以），<b>貼上指令＋附上照片</b>送出</li>
      <li>把 AI 回給你的整段文字，貼到後台「題目」輸入框，填好題庫名稱後按「新增題庫」</li>
    </ol>
    <textarea id="pbPrompt" class="in" readonly style="width:100%;max-width:none;height:170px;margin-top:10px;font-size:13px;line-height:1.6;">${PHOTO_BANK_PROMPT}</textarea>
    <p class="hint" style="margin:6px 0 0;">貼回來之前請大致看一下答案對不對，AI 偶爾會看錯字或算錯。</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="next-btn" id="pbCopy" style="flex:1;">📋 複製指令</button>
      <button class="reset-btn" id="pbClose" style="flex:1;">關閉</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#pbClose').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  ov.querySelector('#pbCopy').onclick=async()=>{
    const ta=ov.querySelector('#pbPrompt');
    let ok=false;
    try{ await navigator.clipboard.writeText(PHOTO_BANK_PROMPT); ok=true; }catch(e){}
    if(!ok){ try{ ta.focus(); ta.select(); ok=document.execCommand('copy'); }catch(e){} }
    if(ok){ goodSound(); toast('📋 已複製，貼到 AI 對話框、附上照片就可以了'); }
    else { ta.focus(); ta.select(); toast('這個畫面不能自動複製，文字已選取，請長按或按 Ctrl/⌘+C 複製'); }
  };
}
/* 遊戲內建輸入視窗：取代原生 prompt()。
   prompt() 在嵌入式預覽面板／部分 webview 會直接拋出「not supported」，
   整個 handler 當場中斷，按下去完全沒反應（修改密碼就是這樣壞掉的）。
   fields: [{id,label,type,placeholder,value,maxlength}]
   onOk(values) 回傳字串則視為錯誤訊息、不關閉視窗。 */
function askInput(opts, onOk){
  const fields=opts.fields||[];
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal">
    <h3>${opts.title||'請輸入'}</h3>
    ${opts.hint?`<p class="hint" style="margin:8px 0 0;">${opts.hint}</p>`:''}
    ${fields.map(f=>`<div class="mod-row"><label>${f.label}</label><br>
      <input id="ai_${f.id}" class="in" type="${f.type||'text'}"
        ${f.maxlength?`maxlength="${f.maxlength}"`:''}
        ${f.inputmode?`inputmode="${f.inputmode}"`:''}
        placeholder="${f.placeholder||''}" value="${String(f.value==null?'':f.value).replace(/"/g,'&quot;')}"
        style="width:100%;max-width:none;"></div>`).join('')}
    <div class="feedback" id="aiErr" style="margin-top:4px;"></div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="next-btn" id="aiOk" style="flex:1;">${opts.okLabel||'確定'}</button>
      <button class="reset-btn" id="aiNo" style="flex:1;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const first=ov.querySelector('input'); if(first) setTimeout(()=>first.focus(),50);
  const close=()=>ov.remove();
  ov.querySelector('#aiNo').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  const submit=()=>{
    const vals={};
    fields.forEach(f=>{ vals[f.id]=(ov.querySelector('#ai_'+f.id).value||'').trim(); });
    const err=onOk(vals);
    if(typeof err==='string' && err){
      const box=ov.querySelector('#aiErr'); box.textContent=err; box.className='feedback bad'; badSound();
      return;
    }
    close();
  };
  ov.querySelector('#aiOk').onclick=submit;
  ov.querySelectorAll('input').forEach(inp=> inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); }));
}
/* 一鍵複製：把某教材的整份課次（課號＋課名）複製到另一個教材。
   只複製課次結構，不複製日期與完成狀態（新的教材要重新排程）。 */
function copyMaterialLessons(subjectId, fromMaterial, toMaterial){
  const src=studyItemsOfMaterial(subjectId, fromMaterial);
  const exist=new Set(studyItemsOfMaterial(subjectId, toMaterial).map(i=>i.lesson));
  const made=src.filter(i=>!exist.has(i.lesson)).map((i,idx)=>({
    id:'sp_'+Date.now().toString(36)+'_c'+idx+Math.floor(Math.random()*100),
    childId:i.childId, subjectId, material:toMaterial,
    lesson:i.lesson, lessonName:i.lessonName,
    part:i.part, extra:i.extra, seq:i.seq,   /* 2026-09-28 稽核 B13：原本沒複製，第二張、複習考會變成一般課次 */
    due:'', done:false, doneAt:null
  }));
  studyPlan().items.push(...made); save();
  return made;
}
/* 複製到其他教材的視窗 */
function openCopyModal(subjectId, fromMaterial){
  const sub=studySubjectById(subjectId); if(!sub) return;
  const src=studyItemsOfMaterial(subjectId, fromMaterial);
  const others=studyMaterialsOf(subjectId).filter(m=>m!==fromMaterial);
  const presets=['自修','講義','測驗卷','評量','習作'].filter(m=>m!==fromMaterial);
  const ov=document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML=`<div class="modal">
    <h3>📋 複製課次到其他教材</h3>
    <p class="hint" style="margin:8px 0 0;">把「${escapeHtml(sub.name)} · ${escapeHtml(fromMaterial)}」的 ${src.length} 課（含課名）整份複製過去，日期與完成狀態不會跟著複製，複製完可以重新排程。</p>
    <div class="mod-row" style="margin-top:12px;"><label>複製到哪個教材</label><br>
      <input id="cpTo" class="in" style="width:100%;max-width:none;" placeholder="例如：測驗卷"></div>
    <div class="mod-row"><label>快速選擇</label><br>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
        ${[...new Set(presets.concat(others))].map(m=>`<button class="reset-btn" data-cp="${m}" style="padding:6px 12px;font-size:13px;">${m}${others.includes(m)?'（已有）':''}</button>`).join('')}
      </div></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="next-btn" id="cpGo" style="flex:1;">📋 複製 ${src.length} 課</button>
      <button class="reset-btn" id="cpCancel" style="flex:1;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-cp]').forEach(b=> b.onclick=()=>{ ov.querySelector('#cpTo').value=b.dataset.cp; });
  ov.querySelector('#cpCancel').onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#cpGo').onclick=()=>{
    const to=(ov.querySelector('#cpTo').value||'').trim();
    if(!to){ badSound(); toast('請輸入或選擇要複製到哪個教材'); return; }
    if(to===fromMaterial){ badSound(); toast('不能複製到同一個教材'); return; }
    const made=copyMaterialLessons(subjectId, fromMaterial, to);
    ov.remove();
    if(!made.length){ badSound(); toast('「'+to+'」已經有這些課次了'); return; }
    goodSound(); toast('📋 已複製 '+made.length+' 課到「'+to+'」');
    planMaterial=to; renderStudyPlan();
  };

/* ---------- 課次單字本（英文拼寫） ----------
   單字掛在讀書計劃的課次上：it.words=[{en,zh}]。
   家長一次貼一課的單字，孩子用打字拼寫測驗。 */
function itemWords(it){ return Array.isArray(it && it.words) ? it.words : []; }
/* 單字拼寫只對英文科目有意義，社會/自然/數學顯示只會變雜訊。
   依科目名稱判斷；已經存過單字的課次一律顯示，免得舊資料被藏起來讀不到。 */
function subjectWantsWords(sub){ return !!sub && /英|english|美語|eng/i.test(sub.name||''); }
function showWordsFor(it){ return subjectWantsWords(studySubjectById(it.subjectId)) || itemWords(it).length>0; }
/* 支援多種貼上格式。切分規則（依序）：
   1) 有明確分隔符（逗號/等號/tab/ - ）就用它切
   2) 否則從「第一個中文字」切開——英文片語本身含空白，不能用第一個空白切，
      否則 "go to school 上學" 會被切成 en="go"
   3) 整行都是英文就當成沒有中文釋義 */
function parseWordLines(text){
  const out=[];
  (text||'').split('\n').forEach(line=>{
    let t=line.trim(); if(!t) return;
    let en='', zh='';
    const sep=t.match(/^(.+?)\s*(?:[,，=＝\t]|\s+[-–—]\s+)\s*(.+)$/);
    if(sep){ en=sep[1]; zh=sep[2]; }
    else {
      const cjk=t.search(/[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff01-\uff60]/);
      if(cjk>0){ en=t.slice(0,cjk); zh=t.slice(cjk); }
      else if(cjk===0){ return; }          /* 整行中文，沒有英文可考 */
      else { en=t; zh=''; }
    }
    en=en.trim().replace(/\s+/g,' ');
    zh=zh.trim();
    if(!en || !/[A-Za-z]/.test(en)) return;
    out.push({en, zh});
  });
  return out;
}

  const it=studyItems().find(x=>x.id===itemId); if(!it) return 0;
  it.words=words; save(); return words.length;
}

/* 孩子：拼寫測驗（看中文打英文） */
function renderWordTest(itemId){
  const it=studyItems().find(x=>x.id===itemId); if(!it) return;
  const sub=studySubjectById(it.subjectId);
  const all=itemWords(it);
  if(!all.length){ toast('這一課還沒有單字'); return; }
  const queue=all.slice().sort(()=>Math.random()-0.5);
  let i=0, right=0, wrongList=[], answered=false;
  const title=(sub?sub.name:'')+' '+(it.extra?(it.lessonName||''):('第'+it.lesson+'課'));
  const paint=()=>{
    if(i>=queue.length) return done();
    const w=queue[i];
    const hint=w.en.length>1 ? (w.en[0]+'＿'.repeat(Math.max(0,w.en.length-1))) : '＿';
    app.innerHTML=`
    <div class="panel">
      <h2 class="title-sticker">📝 單字拼寫</h2>
      <p class="hint">${title}　第 ${i+1} / ${queue.length} 題　✅ ${right}</p>
      <div class="word-card">
        <div class="wd-zh">${escapeHtml(w.zh|| '（沒有中文提示）')}</div>
        <div class="wd-hint" id="wdMask">${hint}</div>
        <input id="wdIn" class="in wd-input" type="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="輸入英文單字">
        <div class="feedback" id="wdFb"></div>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="next-btn" id="wdGo">✅ 檢查</button>
        <button class="reset-btn" id="wdSkip">跳過</button>
      </div>
      <div style="text-align:center;margin-top:14px;"><button class="reset-btn" id="wdQuit">⬅ 回讀書計劃</button></div>
    </div>`;
    const inp=$('#wdIn'); inp.focus();
    answered=false;
    const check=()=>{
      if(answered) return;
      const val=(inp.value||'').trim().toLowerCase().replace(/\s+/g,' ');
      const ans=w.en.trim().toLowerCase();
      const fb=$('#wdFb');
      answered=true;
      if(val===ans){
        right++; fb.textContent='🎉 答對了！'; fb.className='feedback good';
        inp.classList.add('ok');
        const ps=practiceSun(3,'enword'); addSun(ps); goodSound(); onCorrect(ps);
      } else {
        wrongList.push(w);
        fb.innerHTML='💡 正確拼法：<b>'+escapeHtml(w.en)+'</b>'; fb.className='feedback bad';
        inp.classList.add('ng'); badSound();
        /* logWrong 的第 5 個參數是「選項陣列」，而且它內部已經會呼叫 onWrong()，
           不要再自己呼叫一次，也不要傳物件進去（會在 .slice() 拋錯） */
        logWrong('enword', (w.zh||w.en)+' 的英文', val||'（空白）', w.en, [w.en], {type:'fill', accept:[String(w.en)]});
      }
      $('#wdGo').textContent='下一題 ▶';
      $('#wdGo').onclick=()=>{ i++; paint(); };
    };
    $('#wdGo').onclick=check;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ answered? (i++,paint()) : check(); } });
    $('#wdSkip').onclick=()=>{ if(!answered){ wrongList.push(w); } i++; paint(); };
    $('#wdQuit').onclick=()=>{ showTab('plan'); };
  };
  const done=()=>{
    const pct=Math.round(right/queue.length*100);
    app.innerHTML=`
    <div class="panel" style="text-align:center;">
      <h2 class="title-sticker">${pct>=80?'🎉 太棒了！':pct>=60?'👍 不錯！':'💪 再練一次'}</h2>
      <p style="font-size:20px;font-weight:800;margin:12px 0;">${queue.length} 題答對 ${right} 題（${pct}%）</p>
      ${wrongList.length?`<div class="wd-review"><div style="font-weight:800;margin-bottom:6px;">要再記一下的單字</div>
        ${wrongList.map(w=>`<div class="wd-row"><b>${escapeHtml(w.en)}</b><span>${escapeHtml(w.zh||'')}</span></div>`).join('')}</div>`:''}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
        <button class="next-btn" id="wdAgain">🔁 再考一次</button>
        <button class="reset-btn" id="wdBack">⬅ 回讀書計劃</button>
      </div>
    </div>`;
    $('#wdAgain').onclick=()=>renderWordTest(itemId);
    $('#wdBack').onclick=()=>showTab('plan');
  };
  paint();
}

    if(!names.length){ badSound(); toast('請貼上課名，或填「共幾課」'); return; }
    const startNo=parseInt(ov.querySelector('#lsStart').value)||1;
    const made=addStudyLessons(C().id, subjectId, material, names, startNo);
    ov.remove();
    const skipped=names.length-made.length;
    if(!made.length){ badSound(); toast('第'+startNo+'課起的課號都已經存在了，請改「從第幾課開始」'); return; }
    goodSound();
    toast('📖 已新增 '+made.length+' 課到「'+material+'」'+(skipped?'（'+skipped+' 課因課號重複略過）':''));
    planMaterial=material; renderStudyPlan();
  };
}
/* 新增考試：日期 + 範圍（勾選科目底下的教材） */

    return `<div class="scope-sub"><div class="scope-nm">${escapeHtml(s.icon||'📚')} ${escapeHtml(s.name)}</div>

    <h3>${editing?'✏️ 編輯考試':'🎯 新增考試'}</h3>
    <div class="mod-row"><label>考試名稱</label><br>
      <input id="exNm" class="in" style="width:100%;max-width:none;" placeholder="例如：第一次段考" value="${escapeHtml(editing?editing.name:'段考')}"></div>
    <div class="mod-row"><label>考試日期</label><br>
      <input id="exDate" class="in" type="date" min="${dateKey()}" value="${editing?editing.date:addDaysKey(dateKey(),21)}"></div>
    <div class="mod-row"><label>考試範圍（勾選要讀完的教材）</label>
      <div class="scope-box">${scopeRows||'<p class="hint">還沒有任何教材可以勾選。</p>'}</div></div>
    <div class="mod-row"><label>哪幾天要寫？<small style="font-weight:400;color:var(--muted);">（含週六日，這裡決定每週的固定節奏）</small></label>
      <div class="day-presets">
        <button class="reset-btn" data-dpre="all" type="button">每天</button>
        <button class="reset-btn" data-dpre="weekday" type="button">只有平日</button>

      </div>
      <div class="day-pick" id="exDays">
        ${WEEKDAY_NAMES.map((n,i)=>{const on=examDays(editing||{}).includes(i);return `<label class="day-chip${on?' on':''}"><input type="checkbox" value="${i}" ${on?'checked':''}><span>${n}</span></label>`;}).join('')}
      </div>
      <div class="hint" id="exDaysHint" style="margin:6px 0 0;"></div></div>
    <div class="mod-row"><label>每天的份量怎麼分？</label>
      <div class="mode-pick" id="exMode">
        ${Object.entries(SCHED_MODES).map(([v,n])=>{const on=examMode(editing)===v;return `<label class="mode-chip${on?' on':''}"><input type="radio" name="exMode" value="${v}" ${on?'checked':''}><span>${n}</span></label>`;}).join('')}
      </div>
      <div class="hint" style="margin:6px 0 0;"><b>平均分配</b>：每個可寫的日子份量差不多。<b>優先假日</b>：週六日大約排平日的兩倍，平日比較輕鬆（上面要有勾週六或週日才有差別）。</div></div>
    <label style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:14px;">
      <input type="checkbox" id="exSkipHol" ${(editing ? editing.skipHolidays!==false : true)?'checked':''} style="margin-top:3px;">
      <span>排程時跳過<b>國定假日</b>
        <small style="display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:2px;">
          指中秋、國慶這類放假日，以及家長後台手動標記的「今天放假」。<b>不含週六日</b>——週末要不要寫，請用上面的星期設定。</small></span>
    </label>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="next-btn" id="exSave" style="flex:1;">${editing?'💾 儲存並重新安排':'🎯 建立並自動排程'}</button>
      <button class="reset-btn" id="exCancel" style="flex:1;">取消</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const dayBoxes=[...ov.querySelectorAll('#exDays input')];
  const pickedDays=()=>dayBoxes.filter(b=>b.checked).map(b=>Number(b.value));
  const syncDays=()=>{
    dayBoxes.forEach(b=>b.closest('.day-chip').classList.toggle('on', b.checked));
    const d=pickedDays();
    const dateEl=ov.querySelector('#exDate');
    const days=d.length? countUsableDays(dateKey(), addDaysKey(dateEl.value||dateKey(),-1), {days:d}) : 0;
    const h=ov.querySelector('#exDaysHint');
    h.textContent = !d.length ? '⚠️ 至少要選一天，否則沒有日子可以排。'
      : ('考試前總共有 '+days+' 個可寫的日子（已扣掉國定假日）'+(days<3?'，很少，排程會很擠':''));
  };
  dayBoxes.forEach(b=> b.onchange=syncDays);
  ov.querySelector('#exDate').addEventListener('change', syncDays);
  ov.querySelectorAll('[data-dpre]').forEach(b=> b.onclick=()=>{
    const m={all:[0,1,2,3,4,5,6], weekday:[0,1,2,3,4], weekend:[5,6]}[b.dataset.dpre];
    dayBoxes.forEach(x=>{ x.checked=m.includes(Number(x.value)); });
    syncDays();
  });
  syncDays();
  const modeBoxes=[...ov.querySelectorAll('#exMode input')];
  modeBoxes.forEach(b=> b.onchange=()=> modeBoxes.forEach(x=>x.closest('.mode-chip').classList.toggle('on', x.checked)));
  ov.querySelector('#exCancel').onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#exSave').onclick=()=>{
    const name=(ov.querySelector('#exNm').value||'').trim()||'段考';
    const date=ov.querySelector('#exDate').value;
    if(!date){ badSound(); toast('請選擇考試日期'); return; }
    if(date < dateKey() && !(editing && editing.date===date)){ badSound(); toast('考試日期已經過了，請確認日期'); return; }
    const scopes=[...ov.querySelectorAll('[data-sc]:checked')].map(b=>{
      const [subjectId, m]=b.dataset.sc.split('|');
      return {subjectId, material:decodeURIComponent(m)};
    });
    if(!scopes.length){ badSound(); toast('請至少勾選一個考試範圍'); return; }
    const days=pickedDays();
    if(!days.length){ badSound(); toast('請至少選一天可以寫的日子'); return; }
    let exam;
    const mode=(modeBoxes.find(b=>b.checked)||{}).value==='weekend' ? 'weekend' : 'even';
    const skipHolidays=ov.querySelector('#exSkipHol').checked;
    if(editing){ exam=editing; exam.name=name; exam.date=date; exam.scopes=scopes; exam.days=days; exam.mode=mode; exam.skipHolidays=skipHolidays; }
    else { exam={id:'ex_'+Date.now().toString(36), childId:c.id, name, date, scopes, days, mode, skipHolidays};
           studyPlan().exams.push(exam); }
    const r=scheduleForExam(exam, skipHolidays);
    ov.remove(); goodSound();
    if(r.past){ toast('💾 已儲存「'+name+'」（考試日期已經過了，沒有重新排程）'); renderStudyPlan(); return; }
    if(r.tight) toast('🎯 已排 '+r.count+' 項，但時間很緊：最多一天要做 '+r.perDay+' 項');
    else {
      const u = days.length===7 ? '天' : '個可寫日';
      const pace=(r.perSubject||[]).map(x=>x.name+' 每'+x.everyDays+u).join('、');
      toast((editing?'💾 已更新「':'🎯 已建立「')+name+'」，'+r.count+' 項依各科交錯排開'+(pace?'：'+pace:''));
    }
    renderStudyPlan();
  };
}

function gardenPlantClick(p){
  if(!p) return;
  const c=C();
  if(c.garden[p.id]){ toggleDeck(p.id); return; }
  if(c.sun>=p.need){
    addSun(-p.need); c.garden[p.id]=true;
    if(!Array.isArray(c.deck)) c.deck=[];
    if(deckIds(c).length<MAX_PLANTS) c.deck=deckIds(c).concat([p.id]);   // 有空位就直接上場
    save(); goodSound(); sunBurstAt(window.innerWidth/2, window.innerHeight*0.4);
    toast('🌻 用 '+p.need+' 陽光解鎖了 '+p.nm+'！'); rerenderGardenView();
  }
  else { badSound(); toast('還需要 '+(p.need-c.sun)+' 陽光才能解鎖 '+p.nm); }
}

    } else { wt.style.display='none'; btn.textContent='📅 看整週作息表'; }
  };
  const nd=$('#newDay');
  if(nd) nd.onclick=newDayReset;   /* 目前畫面上沒有這顆按鈕（改版後拿掉）；留著的話也要走家長密碼（稽核 E6） */
}

/* 練習頁被鎖定 */
function renderLock(tab){
  const g=tabToGroup(tab);
  $$('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===g));
  const r=todayRoutine();
  app.innerHTML=`<div class="panel"><div class="lock-ovl">
    <div class="big">🌙😴</div>
    <h2 style="color:#fff;">已經過了睡覺時間（${r.sleep}）</h2>
    <p style="color:#dcd6ff;">今天還有 ${unfinishedCount()} 項功課沒寫完，為了保護眼睛和睡眠，練習頁先休息囉！<br>明天再戰，植物會復原的。</p>
    <button class="next-btn" id="overrideBtn">🔐 家長解除今天鎖定（需密碼）</button>
  </div></div>`;
  /* 原本這顆按鈕不用密碼，孩子自己按一下就能繼續玩，鎖定等於沒鎖。改成跟護眼鎖同一套 */
  $('#overrideBtn').onclick=()=>{
    askInput({ title:'🔓 家長解除睡覺鎖定', okLabel:'解除',
      hint:'只解除今天，明天過了睡覺時間還是會鎖。',
      fields:[{id:'pin', label:'家長密碼', type:'password', inputmode:'numeric', maxlength:6}]
    }, v=>{
      const err=checkPIN(v.pin); if(err) return err;
      state.sleepOverrideTonight=frameDateKey(); save(); toast('🔓 已家長解鎖，今晚不再鎖定'); showTab(tab);
    });

function algebraQ(){
  const T=[
    ()=>{ let a=rInt(2,9), x=rInt(-9,12); if(x===0) x=3; const b=rInt(-20,20)||7, c=a*x+b;
      return {q:'解方程式：'+a+'x '+(b<0?'－ '+(-b):'＋ '+b)+' ＝ '+c+'，x ＝ ?', ans:x, steps:a+'x ＝ '+c+' '+(b<0?'＋ '+(-b):'－ '+b)+' ＝ '+(c-b)+'，x ＝ '+(c-b)+' ÷ '+a+' ＝ '+x}; },
    ()=>{ const x=rInt(-6,10); let a=rInt(3,9), c=rInt(1,a-1); const b=rInt(-10,10)||4; const d=a*x+b-c*x;
      const term=v=> v===0 ? '' : ' '+(v<0?'－ '+(-v):'＋ '+v);
      return {q:'解方程式：'+cx(a)+term(b)+' ＝ '+cx(c)+term(d)+'，x ＝ ?', ans:x, steps:'把 x 移到左邊、數字移到右邊：('+a+' － '+c+')x ＝ '+d+' － '+signed(b)+' → '+(a-c===1?'x':(a-c)+'x')+' ＝ '+(d-b)+(a-c===1?'':' → x ＝ '+x)}; },
    ()=>{ const a=rInt(2,15), b=rInt(2,9), c=rInt(-20,20)||6;
      return {q:'(－'+a+') × '+b+' '+(c<0?'－ '+(-c):'＋ '+c)+' ＝ ?', ans:-a*b+c, steps:'先乘：(－'+a+') × '+b+' ＝ '+(-a*b)+'；再'+(c<0?'減 '+(-c):'加 '+c)+'：'+(-a*b+c)}; },
    ()=>{ const a=rInt(3,30), b=rInt(3,30);
      return {q:a+' － (－'+b+') ＝ ?', ans:a+b, steps:'減一個負數＝加上它的相反數：'+a+' ＋ '+b+' ＝ '+(a+b)}; },
    ()=>{ const x=rInt(-4,4)||2, a=rInt(1,4), b=rInt(-6,6)||3, c=rInt(-9,9)||5;
      return {q:'當 x ＝ '+x+' 時，'+(a===1?'':a)+'x² '+(b<0?'－ '+cx(-b):'＋ '+cx(b))+' '+(c<0?'－ '+(-c):'＋ '+c)+' 的值是多少？', ans:a*x*x+b*x+c, steps:a+' × '+signed(x)+'² ＝ '+(a*x*x)+'；'+b+' × '+signed(x)+' ＝ '+(b*x)+'；'+(a*x*x)+' ＋ '+signed(b*x)+' ＋ '+signed(c)+' ＝ '+(a*x*x+b*x+c)}; },
    ()=>{ const base=kPick([-3,-2,2,3]), e=kPick(base<0?[2,3]:[2,3,4]); const v=Math.pow(base,e);

    ()=>{ const a=rInt(2,9), b=rInt(2,9), k=rInt(2,8);
      return {q:'比例式 '+a+' : '+b+' ＝ '+(a*k)+' : x，x ＝ ?', ans:b*k, steps:(a*k)+' ÷ '+a+' ＝ '+k+'（前項放大 '+k+' 倍），x ＝ '+b+' × '+k+' ＝ '+(b*k)}; },
    ()=>{ const x=rInt(-5,12)||2, y=rInt(-5,12)||3;

function mathRound(){

  // 依句號/驚嘆/問號切句，再依年齡檔每 N 句併成一段（不標段落編號，純分段落）

  for(let i=0;i<sentences.length;i+=per){ paras.push(sentences.slice(i,i+per).join('')); }

  $('#spkStory').onclick=()=>speak(plainText(s.text));

  s.q.forEach((item,qi)=>{

    wrap.innerHTML=`<div style="font-weight:800;font-size:17px;">Q${qi+1}. ${escapeHtml(item.q)}</div>`;
    const ch=document.createElement('div'); ch.className='choices';
    // 隨機打散選項順序，避免正解永遠出現在第一個
    const order = item.a.map((_,i)=>i);

/* ---------- 英文單字：教育部國中小基本 1,200 字（2026-09-28 稽核 D8） ----------

/* 假日測驗卷（混合測驗） */
function uniqOpts(correctStr, others){
  const set=new Set([correctStr]); const pool=others.filter(x=>x!==correctStr);
  while(set.size<4 && pool.length){ set.add(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  return [...set].sort(()=>Math.random()-.5);
}

/* 自訂題庫：解析題目文字（支援 | / 逗號CSV / Tab 三種分隔） */
function splitCsvLine(line, delim){
  if(delim===','){ // 處理引號括住的欄位
    const out=[]; let cur='', q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===',') out.push(cur), cur=''; else cur+=ch; }
    }
    out.push(cur); return out.map(s=>s.trim());
  }
  return line.split(delim).map(s=>s.trim());
}
function parseQuestions(text){
  /* 貼上來的內容常是 AI 產的：會有「1. 」「- 」這類開頭、全形「｜」、``` 程式碼框，
     第一行也可能是「以下是題目：」這種說明句。分隔符改成看「最多行用哪一種」決定，
     不再只看第一行，避免被開頭那句說明帶偏。 */
  const lines=text.replace(/｜/g,'|').split(/\r?\n/)
    .map(l=>l.trim())
    .filter(l=>l && !/^```/.test(l))
    .map(l=>l.replace(/^(?:[-*•]\s+|\(?\d{1,3}[.、)）]\s*)/,''));
  if(!lines.length) return [];
  const hits=d=>lines.filter(l=>l.indexOf(d)>=0).length;
  let delim='|';
  const best=['\t','|',','].map(d=>[d,hits(d)]).sort((a,b)=>b[1]-a[1])[0];
  if(best[1]>0) delim=best[0];
  const qs=[];
  lines.forEach(line=>{
    const parts=splitCsvLine(line, delim);
    if(parts.length<2) return;
    const q=parts[0], a=parts[1];
    if(!q || !a) return;
    const opts=parts.slice(2).filter(Boolean);
    qs.push({q,a,opts});
  });
  return qs;
}

/* 錯誤選項不夠時自動補：從同一份題庫其他題的答案挑「同類型、長度相近」的，
   數字答案還可以用相鄰數字補。原本只有提示寫「會自動補」，程式其實沒補，
   沒寫選項的題目畫面上只剩正確答案一顆按鈕，閉著眼睛都能答對。 */
const CUSTOM_WANT_WRONG=3;
function customWrongOptions(item, bank){
  const correct=String(item.a).trim();
  const own=[...new Set((item.opts||[]).map(x=>String(x).trim()).filter(x=>x && x!==correct))];
  if(own.length>=2) return own;
  const isNum=v=>/^[-+]?\d+(?:\.\d+)?$/.test(v);
  const cand=[...new Set(bank.questions.map(q=>String(q.a).trim()))]
    .filter(a=>a && a!==correct && !own.includes(a))
    .map(a=>({a, k:Math.abs(a.length-correct.length)+Math.random()*2}))
    .sort((x,y)=>x.k-y.k);
  /* 數字題混進文字選項（或反過來）孩子一眼就看穿，所以同類型的先用完、
     數字題再用相鄰數字補，不同類型的只在最後真的沒東西時才用 */
  const same=cand.filter(x=>isNum(x.a)===isNum(correct)).map(x=>x.a);
  const other=cand.filter(x=>isNum(x.a)!==isNum(correct)).map(x=>x.a);
  const out=own.concat(same).slice(0, CUSTOM_WANT_WRONG);
  if(out.length<CUSTOM_WANT_WRONG && /^[-+]?\d+$/.test(correct)){
    const n=Number(correct);
    for(const d of [1,-1,2,10,-2,-10]){
      if(out.length>=CUSTOM_WANT_WRONG) break;
      const v=String(n+d); if(v!==correct && !out.includes(v)) out.push(v);
    }
  }
  if(!out.length) return other.slice(0, CUSTOM_WANT_WRONG);
  return out;
}
/* 匯入後的提醒：多少題是自動補選項、有沒有題目根本補不出錯誤選項 */
function customBankNote(questions){
  const bank={questions};
  const auto=questions.filter(q=>(q.opts||[]).filter(o=>String(o).trim()!==String(q.a).trim()).length<2).length;
  const stuck=questions.filter(q=>!customWrongOptions(q,bank).length).length;
  if(stuck) return '⚠️ 有 '+stuck+' 題補不出錯誤選項（同份題庫的答案都一樣），練習時會只剩一個按鈕，請幫這幾題手動寫選項';
  if(auto) return auto+' 題沒寫錯誤選項，練習時會從同份題庫其他答案自動補';
  return '';
}

/* 題庫去重：按題面（忽略大小寫／前後空白）去重，保留第一次出現的，順序不變 */
function dedupQuestions(qs){
  if(!Array.isArray(qs)) return [];
  const seen=new Set(), out=[];
  qs.forEach(it=>{ if(!it||it.q==null) return; const k=String(it.q).trim().toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push(it); });
  return out;
}

/* 小型出題輔助 */
function kPick(a){ return a[Math.floor(Math.random()*a.length)]; }
function kShuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* 產生 n 個選項（含正解），其餘從 pool 抽，最後用 ±k 兜底 */
function kOpts(correct, pool, n){
  n=n||4; const set=new Set([String(correct)]);
  const p=(pool||[]).map(String).filter(x=>x!==String(correct));
  while(set.size<n && p.length){ set.add(p.splice(Math.floor(Math.random()*p.length),1)[0]); }
  let k=1; while(set.size<n){ const v=String(Number(correct)+k); if(v!==String(correct)) set.add(v); k++; }
  return kShuf([...set]);
}

let _zyListenOK=false;   /* 只有練習頁有 🔊 按鈕，聽聲音的題目只在那裡出（每日小考、測驗卷不出） */
const ZY_TONE_NAMES=['輕聲','第一聲','第二聲','第三聲','第四聲'];
function zyAnno(p){ return [...p.w].map((ch,i)=>ch+'('+p.z[i]+')').join(''); }
function zyOthers(p, n){ const same=kShuf(ZY_BANK.pics.filter(x=>x.c===p.c && x.w!==p.w)); const other=kShuf(ZY_BANK.pics.filter(x=>x.c!==p.c));
  return same.concat(other).slice(0,n); }
function zyPicQ(){ const p=kPick(ZY_BANK.pics); const opts=[p].concat(zyOthers(p,3));
  return {type:'choice', q:p.e+' 這是什麼？', opts:kShuf(opts.map(zyAnno)), ans:zyAnno(p), zyPic:true, hint:'看圖想一想，再看注音唸唸看。', why:p.e+'＝'+zyAnno(p)}; }
function zyListenQ(){ const p=kPick(ZY_BANK.pics); const opts=[p].concat(zyOthers(p,3));
  return {type:'choice', q:'🔊 聽聽看，是哪一個？', opts:kShuf(opts.map(x=>x.e)), ans:p.e, listen:true, say:p.w, hint:'按 🔊 可以再聽一次。', why:p.e+'＝'+zyAnno(p)}; }
function zyBlendQ(){ const b=kPick(ZY_BANK.blends);
  const near=kShuf(ZY_BANK.blends.filter(x=>x.ch!==b.ch && x.zy!==b.zy && ((b.ini && x.ini===b.ini) || x.fin===b.fin)));
  const far=kShuf(ZY_BANK.blends.filter(x=>x.ch!==b.ch && x.zy!==b.zy && !near.includes(x)));
  const opts=[b.ch].concat(near.concat(far).slice(0,3).map(x=>x.ch));
  return {type:'choice', q:b.parts+' 拼起來是哪個字？', opts:kShuf(opts), ans:b.ch, hint:'一個一個符號慢慢拼起來唸。', why:b.ch+'＝'+b.zy}; }
function zyToneQ(){ const g=kPick(ZY_BANK.tones); const it=kPick(g);
  if(Math.random()<0.5) return {type:'choice', q:'「'+it.ch+'」唸第幾聲？', opts:kShuf(['第一聲','第二聲','第三聲','第四聲']), ans:ZY_TONE_NAMES[it.t], speak:it.ch, hint:'唸唸看，聲音是平的、往上、先下再上，還是往下？', why:it.ch+'＝'+it.zy};
  return {type:'choice', q:'下面哪一個字唸'+ZY_TONE_NAMES[it.t]+'？', opts:kShuf(g.map(x=>x.ch)), ans:it.ch, hint:'這幾個字聲音一樣，只有聲調不同。', why:g.map(x=>x.ch+x.zy).join('、')}; }
function zhuyinL2(){ const r=Math.random();
  if(typeof ZY_BANK!=='undefined'){
    if(r<0.3) return zyBlendQ();
    if(r<0.5) return zyToneQ();
    if(r<0.58) return (_zyListenOK && ('speechSynthesis' in window)) ? zyListenQ() : zyPicQ();

  return zhuyinL2Old(r); }
function zhuyinL2Old(r){

  return {type:'choice', q:'下面哪一個是由兩個以上韻符合起來的「結合韻」？', opts:kShuf([comp,...simple]), ans:comp, hint:'結合韻是好幾個韻符黏在一起，不是單一個符號。'};

    {"type":"choice","q":"「聽」的部首是？","opts":["耳","目","心","王"],"ans":"耳","hint":"聽聲音要用到臉上哪個器官","why":"「聽」的部首是耳，聽聲音要用耳朵；右邊雖然有心和像目的部分，但部首是左邊的耳。","k":"radical"},

    {"type":"choice","q":"「賽」的部首是？","opts":["貝","宀","八","大"],"ans":"貝","hint":"古人比賽得勝常能獲得財物獎賞","why":"「賽」的部首是貝，在最下面，貝在古代代表錢財；上面的寶蓋頭不是部首。","k":"radical"},

const KNOW_GEN={
  num:[numL1,numL2,numL3,numL4,numL5],
  logic:[logicL1,logicL2,logicL3,logicL4,logicL5],
  life:[lifeL1,lifeL2,lifeL3,lifeL4,lifeL5],
  facts:[factsL1,factsL2,factsL3,factsL4,factsL5],
  zhuyin:[zhuyinL1,zhuyinL2,zhuyinL3,zhuyinL4,zhuyinL5],
  science:[scienceL1,scienceL2,scienceL3,scienceL4,scienceL5],
  coding:[codingL1,codingL2,codingL3,codingL4,codingL5]
};
const KNOW_BANK_RATE=0.75;
const ZH_BANK_RATE=0.3;
function kbPick(bank){ const b=kPick(bank); const q=Object.assign({}, b); if(b.opts) q.opts=kShuf(b.opts.slice()); return q; }
function genKnowledgeQ(subject, li){
  if(li===undefined||li===null) li=levelIdx();
  const arr=KNOW_GEN[subject]||KNOW_GEN.num;
  const fn=arr[Math.min(li, arr.length-1)];
  /* 2026-09-28 稽核 D7：有題庫表的科目，約 3/4 從題庫表抽（選項重新洗牌），其餘照原本的產生器 */
  /* 國語（zhuyin）另有 D9 的造句排序、部首、量詞、標點，只占約 3 成，不擠掉原本的注音、詞語、成語題 */
  const bank = subject==='zhuyin' ? ZH_BANK[Math.min(li,4)] : (KNOW_BANK[subject]||[])[Math.min(li,4)];
  const rate = subject==='zhuyin' ? ZH_BANK_RATE : KNOW_BANK_RATE;
  const q=(bank && bank.length && Math.random()<rate) ? kbPick(bank) : fn();
  const g=KNOW_GRADE[subject];
  if(g) q.grade = g.book+' '+g.g[Math.min(li, g.g.length-1)];
  return q;
}

function renderDailyQuiz(){
  const li=levelIdx(); const total=Math.min(15, liveDiff().quiz + 4);

  for(let i=0;i<total;i++){
    let q=null;
    for(let t=0;t<6;t++){
      if(Math.random()<0.6){ const subj=kPick(KNOW_SUBJECTS); q=genKnowledgeQ(subj, subjectIdx(subj)); q._sm=subj; }
      else if(typeof examQuestion==='function'){ const e=examQuestion(); q={type:'choice', q:e.q, opts:e.opts, ans:e.ans, word:e.word, _sm:'exam'}; }
      else { q=genKnowledgeQ('num', li); q._sm='num'; }

  const renderOne=()=>{

    $('#dqq').textContent=q.q;

        if(ok) right++; $('#dqprog').textContent='第 '+(idx+1)+' / '+total+' 題　✅ '+right; const dm=$('#dqmon'); if(dm) dm.innerHTML=monsterTrack(idx+1,total); $('#dqnext').style.display='inline-block'; } });

function customRound(bank){

  const idx = (bank._idx=(bank._idx||0));

function checkPIN(pin){
  const now=Date.now();
  if((state.pinLockUntil||0)>now) return '錯太多次，請 '+Math.ceil((state.pinLockUntil-now)/1000)+' 秒後再試';
  if(String(pin)===String(state.parentPIN)){ if(state.pinFails||state.pinLockUntil){ state.pinFails=0; state.pinLockUntil=0; save(); } return ''; }
  state.pinFails=(state.pinFails||0)+1;
  let msg='密碼不對';
  if(state.pinFails>=5){ const sec=Math.min(1800, 30*Math.pow(2,state.pinFails-5)); state.pinLockUntil=now+sec*1000; msg='錯太多次，請 '+sec+' 秒後再試'; }
  save(); return msg;
}

      const wake=$('#w'+i+'_wake').value, eat=$('#w'+i+'_eat').value, bath=$('#w'+i+'_bath').value, sleep=$('#w'+i+'_sleep').value;
      if(!wake||!eat||!bath||!sleep){ toast('請把星期'+(i+1)+'的四個時間都填好'); return; }
      wr[i]={wake,eat,bath,sleep};
    }
    state.weekRoutine=wr; save(); goodSound(); toast('📅 整週作息已儲存'); renderParent();
  };
  const srs=$('#saveRoutineSet'); if(srs) srs.onclick=()=>{
    const clampIn=(v,lo,hi,def)=>{ const n=parseInt(v); return isFinite(n) ? Math.min(hi,Math.max(lo,n)) : def; };   /* 稽核 E7：原本可以填負數 */
    const eat=clampIn($('#limEat').value,1,600,40), bath=clampIn($('#limBath').value,1,600,30);
    const step=clampIn($('#rStep').value,1,600,5), pen=clampIn($('#rPen').value,1,350,5);
    state.routineLimit={eat,bath}; state.routineStep=step; state.routinePenalty=pen; save();
    goodSound(); toast('⏱ 作息扣分設定已儲存'); renderParent();
  };

  /* ---- 自訂扣分項 ---- */
  $$('.pnDo').forEach(b=>b.onclick=()=>{
    const p=penaltyList().find(x=>x.id===b.dataset.id); if(!p) return;
    const c=C();
    const willLose = p.kind==='zero' ? c.sun : Math.min(c.sun, Number(p.amount)||0);
    askConfirm('要對「'+escapeHtml(c.name||'孩子')+'」執行<br><b>'+escapeHtml((p.emoji||'⚠️')+' '+p.name+'（'+penaltyDesc(p)+'）')+'</b>嗎？'
      +'<br><span class="hint">目前有 '+c.sun+' 陽光，會扣掉 '+willLose+'，剩下 '+(c.sun-willLose)+'。</span>'
      +(p.kind==='zero'?'<br><span class="hint">歸零會清掉存很久的陽光，按錯可以在扣分紀錄撤銷。</span>':''),
      ()=>{ const actual=runPenalty(p); toast((p.emoji||'⚠️')+' '+p.name+' －'+actual+' 陽光'); renderParent(); }, '確定扣分');
  });
  $$('.pnEdit').forEach(b=>b.onclick=()=>{
    const p=penaltyList().find(x=>x.id===b.dataset.id); if(!p) return;
    askInput({title:'修改扣分項', fields:[
      {id:'nm', label:'扣分原因', value:p.name},
      {id:'am', label:'扣多少陽光（填 0 代表全部歸零）', type:'number', value:p.kind==='zero'?0:p.amount}
    ]}, v=>{
      const nm=(v.nm||'').trim(); if(!nm) return '請填扣分原因';
      const am=parseInt(v.am); if(isNaN(am)||am<0) return '陽光數要是 0 或正整數';
      p.name=nm; p.kind = am===0?'zero':'sun'; p.amount = am===0?0:am;
      save(); toast('✏️ 已更新'); renderParent();
    });
  });
  $$('.pnDel').forEach(b=>b.onclick=()=>{
    const p=penaltyList().find(x=>x.id===b.dataset.id); if(!p) return;
    askConfirm('刪除扣分項「'+escapeHtml(p.name)+'」？<br><span class="hint">已經扣過的紀錄不會被刪掉。</span>', ()=>{
      state.penalties=penaltyList().filter(x=>x.id!==p.id);
      save(); toast('🗑 已刪除'); renderParent();
    });
  });
  const ap=$('#addPen'); if(ap) ap.onclick=()=>{
    const nm=($('#pnName').value||'').trim();
    if(!nm){ toast('請先填扣分原因'); return; }
    const kind=$('#pnKind').value;
    const amt=parseInt($('#pnAmt').value)||0;
    if(kind==='sun' && amt<1){ toast('扣的陽光要大於 0'); return; }
    penaltyList().push({id:'pn'+Date.now(), emoji:'⚠️', name:nm, kind, amount:kind==='zero'?0:amt});
    save(); goodSound(); toast('➕ 已新增「'+nm+'」'); renderParent();
  };
  $$('.pnUndo').forEach(b=>b.onclick=()=>{
    const rec=(state.penaltyLog||[]).find(x=>x.id===b.dataset.id); if(!rec) return;
    askConfirm('把「'+escapeHtml(rec.name)+'」扣掉的 '+escapeHtml(rec.actual)+' 陽光還給「'+escapeHtml(rec.childName||'孩子')+'」？', ()=>{
      if(undoPenalty(rec.id)){ toast('↩ 已還回 '+rec.actual+' 陽光'); renderParent(); }
      else toast('這筆撤銷不了（孩子檔案可能已刪除）');
    }, '確定撤銷');
  });
  const cpl=$('#clearPenLog'); if(cpl) cpl.onclick=()=>{
    askConfirm('清空扣分紀錄？<br><span class="hint">清空後就不能再撤銷了，陽光不會退回。</span>', ()=>{
      state.penaltyLog=[]; save(); toast('🗑 已清空扣分紀錄'); renderParent();
    });
  };
  const th=$('#toggleHol'); if(th) th.onclick=()=>{
    const k=dateKey(); const arr=state.manualHolidays||(state.manualHolidays=[]);
    if(arr.includes(k)){ state.manualHolidays=arr.filter(x=>x!==k); toast('↩ 今天改為要上課'); }
    else { arr.push(k); toast('🎉 今天標記為放假'); }
    save(); renderParent();
  };
  $('#copyBtn').onclick=()=>{ const ta=$('#export'); ta.select(); try{ navigator.clipboard.writeText(ta.value); toast('已複製！'); }catch(e){ document.execCommand('copy'); toast('已複製！'); } };
  $('#lockBtn').onclick=()=>{ parentUnlocked=false; parentCat=null; renderParent(); };
}

/* 近 7 天練習時間 SVG 圖表 */
/* ---------- 學習雷達：資料整理與畫面 ---------- */
function radarLevelName(mod, li){
  if(mod==='english'){ const k=(C().subjectDiff||{}).english; const o=EN_CERT.find(x=>x.k===k && x.k); if(o) return o.t; }
  const key=LEVEL_ORDER[li]; return key+' '+((DIFF_MAP[key]||{}).name||'');
}
function radarData(c){
  const lv=c.radarLv||{}; const rows=[];
  Object.keys(lv).forEach(mod=>{
    const cur=subjectIdx(mod, c); const a=lv[mod][cur]||[0,0]; const n=a[0]+a[1]; const rate=n?Math.round(a[0]/n*100):0;
    let st='few'; if(n>=10){ st = rate>=85 && n>=20 ? 'good' : rate>=70 ? 'ok' : 'weak'; }
    const others=Object.keys(lv[mod]).map(Number).filter(i=>i!==cur).sort().map(i=>{ const b=lv[mod][i]; const m=b[0]+b[1]; return {li:i, n:m, rate:m?Math.round(b[0]/m*100):0}; }).filter(o=>o.n);
    rows.push({mod, cur, n, rate, st, others});
  });
  const ORD={weak:0, ok:1, good:2, few:3};
  rows.sort((x,y)=>ORD[x.st]-ORD[y.st] || y.n-x.n);
  /* 近 4 週（週一到週日），本週算到今天 */
  const day=c.radarDay||{}; const t=new Date(); const mon=new Date(t.getFullYear(), t.getMonth(), t.getDate()-((t.getDay()+6)%7));
  const weeks=[];
  for(let w=3; w>=0; w--){
    const st=new Date(mon); st.setDate(mon.getDate()-7*w); let r=0, wr=0, days=0;
    for(let i=0;i<7;i++){ const d=new Date(st); d.setDate(st.getDate()+i); const e=day[dateKeyOf(d)]; if(!e) continue; let any=0; Object.keys(e).forEach(m=>{ r+=e[m][0]; wr+=e[m][1]; any+=e[m][0]+e[m][1]; }); if(any) days++; }
    const en=new Date(st); en.setDate(st.getDate()+6);
    weeks.push({label:(st.getMonth()+1)+'/'+st.getDate()+'–'+(en.getMonth()+1)+'/'+en.getDate(), n:r+wr, rate:(r+wr)?Math.round(r/(r+wr)*100):null, days, now:w===0});
  }
  const miss=Object.values(c.missLog||{}).filter(e=>e.n>=2).sort((a,b)=>b.n-a.n || b.t-a.t).slice(0,10);
  return {rows, weak:rows.filter(r=>r.st==='weak'), weeks, miss};
}
function radarHTML(c, R){
  R=R||radarData(c);
  const ST={weak:['需要加強','rd-weak'], ok:['穩定','rd-ok'], good:['很熟了，可以試下一級','rd-good'], few:['題數還不夠判斷','rd-few']};
  const since=c.radarSince? ('從 '+c.radarSince.slice(5).replace('-','/')+' 開始記錄') : '孩子開始練習後就會有資料';
  const rowsH = R.rows.length ? R.rows.map(r=>`<div class="rd-row">
      <div class="rd-name"><b>${escapeHtml(reviewModName(r.mod))}</b><small>${escapeHtml(radarLevelName(r.mod, r.cur))}</small></div>
      <div class="rd-bar ${ST[r.st][1]}"><i style="width:${r.n?r.rate:0}%"></i></div>
      <div class="rd-val"><b>${r.n?r.rate+'%':'—'}</b><small>${r.n} 題</small></div>
      <span class="rd-st ${ST[r.st][1]}">${ST[r.st][0]}</span>
      ${r.others.length?`<div class="rd-oth">其他程度：${r.others.map(o=>escapeHtml(radarLevelName(r.mod,o.li))+' '+o.rate+'%（'+o.n+' 題）').join('・')}</div>`:''}
    </div>`).join('') : '<p class="hint">還沒有練習紀錄。</p>';
  const maxN=Math.max(1, ...R.weeks.map(w=>w.n));
  const weeksH = R.weeks.map((w,i)=>{ const prev=i?R.weeks[i-1]:null; let tr='';
      if(prev && prev.rate!=null && w.rate!=null){ const d=w.rate-prev.rate; tr = d>=3?`<span class="rd-up">↑${d}</span>`:d<=-3?`<span class="rd-down">↓${-d}</span>`:'<span class="rd-flat">持平</span>'; }
      return `<div class="rd-wk${w.now?' now':''}"><div class="rd-wkbar"><i style="height:${Math.round(w.n/maxN*100)}%"></i></div>
        <b>${w.n} 題</b><span>${w.rate==null?'—':'正確率 '+w.rate+'%'} ${tr}</span><small>練 ${w.days} 天</small><small>${w.now?'本週':w.label}</small></div>`; }).join('');
  const missH = R.miss.length ? R.miss.map(e=>{ const inBook=(c.wrongQuestions||[]).find(w=>w.q===e.q);
      return `<div class="rv-row"><span class="q-grade">${escapeHtml(reviewModName(e.m))}</span><span class="rv-q">${escapeHtml(e.q.length>46?e.q.slice(0,46)+'…':e.q)}</span><span class="rv-st"><b class="rd-n">錯 ${e.n} 次</b><small>${inBook?streakDots(inBook):'已不在錯題本'}</small></span></div>`; }).join('')
    : '<p class="hint">還沒有答錯 2 次以上的題目。</p>';
  return `<div class="radar">
    <h2 style="font-size:17px;margin:14px 0 2px;">🎯 學習雷達</h2>
    <p class="hint">${since}。看的是孩子<b>目前這個程度</b>的答對率：答對 85% 以上（至少 20 題）＝很熟了，70～84%＝穩定，70% 以下＝需要加強；不到 10 題先不判斷。</p>
    <div class="rd-list">${rowsH}</div>
    <h3 class="rd-h">📈 近 4 週</h3>
    <div class="rd-weeks">${weeksH}</div>
    <h3 class="rd-h">🔁 最常錯的題目</h3>
    <p class="hint">答錯 2 次以上的題目，最多 10 題。圓點是錯題複習的進度（連對 3 次畢業）。</p>
    <div class="rv-list">${missH}</div>
  </div>`;
}
function weekChartSVG(c){
  const days=[]; let max=1;
  for(let i=6;i>=0;i--){ const k=dateKey(-i); const sec=c.timeByDate[k]||0; const min=Math.round(sec/60); days.push({k:k.slice(5),min}); if(min>max) max=min; }
  const w=560, h=160, bw=w/7*0.6, gap=w/7;
  let bars='';
  days.forEach((d,i)=>{
    const bh=Math.max(4, d.min/max*(h-30));
    const x=i*gap+gap/2-bw/2, y=h-20-bh;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="#4caf50"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-4}" font-size="11" text-anchor="middle" fill="#3a2f1b">${d.min}分</text>`;
    bars+=`<text x="${x+bw/2}" y="${h-4}" font-size="11" text-anchor="middle" fill="#7a6a45">${d.k}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:560px;background:#fffaf0;border-radius:10px;padding:6px;">${bars}</svg>`;
}
